features3_what_we_build:
  title: Apa yang kita bina
  subtitle: Barisan produk tertumpu yang kami tahu luar dalam — kolam renang kembung Drop Stitch tekanan tinggi.
  columns: 3
  isBeforeContent: true
  items:
    - title: Kolam segi empat tepat
      description: Kolam Drop Stitch segi empat tepat bersaiz keluarga yang memaksimumkan kawasan renang untuk ruang anda.
      icon: tabler:rectangle
    - title: Kolam biru bulat
      description: Kolam belakang rumah klasik — dinding Drop Stitch berwarna biru cerah, tegar, persediaan pantas.
      icon: tabler:circle
    - title: Kolam bulat kelabu
      description: Barisan premium kami dengan kemasan kelabu moden dan penutup dipasang pilihan.
      icon: tabler:circle-dot
    - title: Kolam SPA tab mandi panas
      description: 'Model tab mandi panas berpenebat dengan tempat duduk terbina dalam dan bahagian bawah berpenebat 5 mm — untuk digunakan dengan pemanas luaran (tidak termasuk pemanas).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Pakej lengkap
      description: Setiap set kolam renang dihantar dengan pam udara elektrik, kit pembaikan dan beg penyimpanan.
      icon: tabler:package
    - title: Saiz tersuai
      description: Saiz, warna dan penutup OEM untuk jenama, pengedar dan projek hospitaliti.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Pembuatan label peribadi dengan percetakan logo dan pembungkusan sedia runcit.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Kolam renang kembung Felizbay segi empat tepat Drop Stitch
steps2_values:
