production_section:
  tagline: Kecemerlangan Pengeluaran
  title: Memastikan Ketukangan Yang Indah
  description: Barisan pengeluaran Felizbay didedikasikan untuk kolam renang kembung berkualiti tinggi, tahan lama, bertekanan tinggi.
  cards:
    - title: Pasukan Juruteknik Berpengalaman
      items:
        - Pengetahuan profesional tentang jahitan jatuh dan bahan PVC
        - Ketukangan yang tepat dalam memotong, mengimpal dan memasang
        - Latihan berterusan untuk menguasai teknologi pengeluaran terkini
    - title: Peralatan Pengeluaran Termaju
      items:
        - Peralatan pemotongan ketepatan untuk panel fabrik yang tepat
        - Kimpalan haba berketepatan tinggi untuk jahitan kedap udara dan tahan lama
        - Peralatan ujian tekanan dan kedap udara profesional
    - title: Sistem Pengurusan Matang
      items:
        - Proses pengeluaran standard dengan standard kualiti yang jelas
        - Falsafah pengeluaran tanpa lemak mengurangkan pembaziran dan meningkatkan kecekapan
        - Pengurusan rantaian bekalan yang cekap dengan pembekal yang boleh dipercayai
    - title: Kawalan Kualiti yang Ketat
      items:
        - 'Pemeriksaan berbilang peringkat: bahan mentah, dalam proses, keluar akhir'
        - Ujian tekanan di bahagian atas julat kerja 4-6 PSI yang dinilai
        - Ujian kedap udara dan ketahanan yang ketat sebelum penghantaran
