hero:
  tagline: Tentang kami
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Kolam renang kembung Felizbay
  title: |
    Menjadikan berenang mudah, <br />
    gaya <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay ialah jenama kolam inflatable drop stitch premium yang direka dan dikendalikan oleh Aquafarer LLC (USA). Kami percaya setiap keluarga berhak mendapat kolam sebenar di belakang rumah — pemasangan atas tanah tanpa pembinaan kolam kekal. Kolam renang kami mengembang tegar dalam beberapa minit, bertahan sepanjang musim panas dengan keseronokan keluarga, dan berkemas kecil pada akhir musim. Keperluan permit, penghadang dan pemasangan berbeza mengikut lokasi.
