faqs:
  title: Soalan Lazim Kolam Kembung
  subtitle: Soalan lazim tentang kolam renang kembung Felizbay.
  columns: 2
  items:
    - title: Berapa lama masa persediaan?
      description: 'Mengembung mengambil masa 5-15 minit dengan pam udara elektrik yang disertakan bergantung pada model. Masa pengisian berbeza mengikut kapasiti kolam dan bekalan air anda.'
      icon: tabler:clock
      category: all
    - title: Seberapa tegar kolam Drop Stitch?
      description: Sangat tegar. Dinding Drop Stitch mengembang kuat pada 4-5 PSI — serupa dengan papan dayung kembung — jadi kolam mengekalkan bentuknya apabila diisi dengan air.
      icon: tabler:hexagon
      category: all
    - title: Bolehkah kanak-kanak menggunakan kolam renang?
      description: Ya, dengan pengawasan orang dewasa yang aktif pada setiap masa. Kanak-kanak tidak boleh ditinggalkan tanpa pengawasan di dalam atau berhampiran kolam renang — ikut peraturan keselamatan manual dan tempatan.
      icon: tabler:users
      category: all
    - title: Bagaimanakah saya menyimpan kolam pada musim sejuk?
      description: Toskan air, kempiskan kolam, biarkan ia kering sepenuhnya, kemudian gulung dan simpan di dalam beg simpanan yang disertakan di tempat bebas fros.
      icon: tabler:package
      category: all
    - title: Apa yang disertakan dengan kolam renang?
      description: Setiap kolam Felizbay termasuk pam udara elektrik, kit pembaikan dan beg penyimpanan. Model bulat mempunyai penutup dipasang pilihan.
      icon: tabler:box
      category: all
    - title: Apakah saiz yang ada?
      description: 48 SKU standard merentas empat koleksi — kolam bulat sehingga 10 m melintang, kolam segi empat tepat sehingga 6 × 5 m, dan tab SPA dengan tempat duduk terbina dalam. Saiz tersuai tersedia untuk rakan kongsi perniagaan.
      icon: tabler:ruler-2
      category: all
    - title: Apakah permukaan kolam boleh berdiri?
      description: 'Mana-mana permukaan rata dan rata tanpa objek tajam - rumput, teres atau geladak. Lembaran tanah disyorkan pada permukaan kasar. Kolam yang diisi adalah berat: pasang hanya pada permukaan yang menyokong berat penuh dan mempunyai geladak tinggi, balkoni dan bumbung yang dinilai secara strukturnya terlebih dahulu.'
      icon: tabler:layout-grid
      category: all
    - title: Bagaimanakah saya memastikan air bersih?
      description: Gunakan pam penapis di tempat yang dipasang, bersihkan serpihan, periksa pH, dan tutup kolam apabila tidak digunakan. Tempoh air bertahan bergantung pada saiz kolam, penggunaan dan penapisan — uji secara kerap dan bukannya bergantung pada jadual tetap.
      icon: tabler:droplet
      category: all
