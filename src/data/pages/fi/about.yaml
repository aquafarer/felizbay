hero:
  tagline: Tietoja meistä
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbayn puhallettava uima-allas
  title: |
    Uinti on helppoa, <br />
     <span class="text-accent dark:text-white">Felizbay</span>-tyyliin
  subtitle: Felizbay on Aquafarer LLC:n (USA) suunnittelema ja ylläpitämä korkealuokkainen Drop Stitch puhallettava uima-allasbrändi. Uskomme, että jokainen perhe ansaitsee todellisen uima-altaan takapihalle maan päälle asennettuna ilman pysyvää allasrakentamista. Altaamme täyttyvät jäykäksi muutamassa minuutissa, selviytyvät koko perheen kesistä ja pakataan pieniksi kauden lopussa. Lupa-, aita- ja asennusvaatimukset vaihtelevat sijainnin mukaan.
