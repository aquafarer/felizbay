production_section:
  tagline: Tuotannon erinomaisuutta
  title: Laadukkaan käsityötaidon varmistaminen
  description: Felizbayn tuotantolinja on omistettu korkealaatuisille, kestäville, korkeapaineisille puhallettaville uima-altaille.
  cards:
    - title: Kokenut teknikkotiimi
      items:
        - Ammattituntemus pudotusompeleista ja PVC-materiaaleista
        - Tarkkaa ammattitaitoa leikkauksessa, hitsauksessa ja kokoonpanossa
        - Jatkuva koulutus uusimpien tuotantotekniikoiden hallitsemiseksi
    - title: Edistyneet tuotantolaitteet
      items:
        - Tarkkuusleikkauslaitteet tarkkoihin kangaspaneeleihin
        - Erittäin tarkka lämpöhitsaus ilmatiiviille, kestäville saumoille
        - Ammattimainen paine- ja ilmatiiviystestauslaitteet
    - title: Aikuinen hallintajärjestelmä
      items:
        - Standardoidut tuotantoprosessit ja selkeät laatustandardit
        - Lean tuotantofilosofia vähentää hukkaa ja parantaa tehokkuutta
        - Tehokas toimitusketjun hallinta luotettavien toimittajien kanssa
    - title: Tiukka laadunvalvonta
      items:
        - 'Monivaiheinen tarkastus: raaka-aine, keskeneräinen, lopullinen lähtö'
        - Painetestaus nimellisarvoisen 4-6 PSI-työalueen yläosassa
        - Tiukka ilmatiiviys ja kestävyystestaus ennen toimitusta
