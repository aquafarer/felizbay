      description: 'Eristetyt kylpytynnyrimallit, joissa on sisäänrakennetut istuimet ja 5 mm eristetyt pohjat — käytettäväksi ulkoisten lämmittimien kanssa (lämmitin ei sisälly toimitukseen).'
