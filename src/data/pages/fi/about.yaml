features3_what_we_build:
  title: Mitä rakennamme
  subtitle: Keskittynyt tuotesarja, jonka tunnemme läpikotaisin – korkeapaineiset Drop Stitch puhallettavat uima-altaat.
  columns: 3
  isBeforeContent: true
  items:
    - title: Suorakaiteen muotoiset altaat
      description: Perhekokoiset suorakaiteen muotoiset Drop Stitch-altaat, jotka maksimoivat tilasi uima-alueen.
      icon: tabler:rectangle
    - title: Pyöreät siniset altaat
      description: Klassinen takapihan allas – kirkkaan sininen, jäykät Drop Stitch-seinät, nopea asennus.
      icon: tabler:circle
    - title: Pyöreät harmaat altaat
      description: Premium-sarjamme moderni harmaa viimeistely ja valinnainen asennettu kansi.
