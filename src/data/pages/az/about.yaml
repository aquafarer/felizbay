      icon: tabler:settings
    - title: Mövsümü geridə qoyan dəstək
      description: Suallar, ehtiyat hissələri və ya zəmanət — info@felizbay.com vasitəsilə istənilən vaxt bizimlə əlaqə saxlayın.
