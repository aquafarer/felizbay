hero:
  tagline: Haqqımızda
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay şişmə hovuzu
  title: |
    Üzgüçülüyün sadələşdirilməsi, <br />
     <span class="text-accent dark:text-white">Felizbay</span> üslubunda
  subtitle: Felizbay, Aquafarer MMC (ABŞ) tərəfindən dizayn edilmiş və idarə olunan premium Drop Stitch şişmə hovuz markasıdır. Biz inanırıq ki, hər bir ailə həyətdə əsl hovuza layiqdir - daimi hovuz tikintisi olmadan yerüstü quraşdırma. Hovuzlarımız bir neçə dəqiqə ərzində sərt şəkildə şişirilir, ailə əyləncəsinin tam yaylarından sağ çıxır və mövsümün sonunda kiçik həcmdə yığışır. İcazə, maneə və quraşdırma tələbləri ərazidən asılı olaraq dəyişir.
