features3_what_we_build:
  title: Biz nə qururuq
  subtitle: İçəridən bildiyimiz diqqət mərkəzində olan məhsul xətti - yüksək təzyiqli Drop Stitch şişmə hovuzları.
  columns: 3
  isBeforeContent: true
  items:
    - title: Düzbucaqlı hovuzlar
      description: Məkanınız üçün üzgüçülük sahəsini maksimuma çatdıran ailə ölçülü düzbucaqlı Drop Stitch hovuzları.
      icon: tabler:rectangle
    - title: Dairəvi mavi hovuzlar
      description: Klassik həyət hovuzu - canlı mavi, sərt Drop Stitch divarları, sürətli quraşdırma.
      icon: tabler:circle
    - title: Dəyirmi boz hovuzlar
      description: Müasir boz rəngə və isteğe bağlı quraşdırılmış örtüyə malik premium xəttimiz.
      icon: tabler:circle-dot
    - title: İsti vanna SPA hovuzları
      description: 'Daxili oturacaqları və 5 mm izolyasiyalı dibləri olan izolyasiya edilmiş isti vanna modelləri - xarici qızdırıcılarla istifadə üçün (qızdırıcı daxil deyil).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Tam paketlər
      description: Hər hovuzda elektrik hava nasosu, təmir dəsti və saxlama çantası olan gəmilər quraşdırılıb.
      icon: tabler:package
    - title: Xüsusi ölçülər
      description: Brendlər, distribyutorlar və qonaqpərvərlik layihələri üçün OEM ölçüləri, rəngləri və örtükləri.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Loqo çapı və pərakəndə satışa hazır qablaşdırma ilə özəl etiketli istehsal.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Felizbay düzbucaqlı Drop Stitch şişmə hovuzu
