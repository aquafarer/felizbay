production_section:
  tagline: İstehsal Mükəmməlliyi
  title: Nəfis sənətkarlığın təmin edilməsi
  description: Felizbay istehsal xətti yüksək keyfiyyətli, davamlı, yüksək təzyiqli şişmə hovuzlara həsr edilmişdir.
  cards:
    - title: Təcrübəli Texniki Komanda
      items:
        - Açılan tikiş və PVC materialları haqqında peşəkar biliklər
        - Kəsmə, qaynaq və montaj işlərində dəqiq ustalıq
        - Ən son istehsal texnologiyalarına yiyələnmək üçün davamlı təlim
    - title: Qabaqcıl İstehsal Avadanlıqları
      items:
        - Dəqiq parça panelləri üçün dəqiq kəsmə avadanlığı
        - Tırtıllı, dayanıqlı tikişlər üçün yüksək dəqiqlikli istilik qaynağı
        - Peşəkar təzyiq və təhlükəsizlik testi avadanlığı
    - title: Yetkin İdarəetmə Sistemi
      items:
        - Aydın keyfiyyət standartları ilə standartlaşdırılmış istehsal prosesləri
        - Arıq istehsal fəlsəfəsi tullantıların azaldılması və səmərəliliyinin artırılması
        - Etibarlı təchizatçılarla təchizat zəncirinin səmərəli idarə edilməsi
    - title: Ciddi keyfiyyətə nəzarət
      items:
        - 'Çox mərhələli yoxlama: xammal, davamsız, son çıxan'
        - Qiymətləndirilmiş 4-6 PSI iş diapazonunun yuxarısında təzyiq testi
        - Göndərmədən əvvəl ciddi hava keçiriciliyi və davamlılıq testi
