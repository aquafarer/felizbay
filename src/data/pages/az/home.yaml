content_compliance:
  tagline: Qulluq və Təhlükəsizlik
  title: Sahibi olmaq asan,<br />Sevmək asan
  subtitle: Çatdırılmadan ilk üzməyə, mövsümün sonunda saxlanmaya qədər Felizbay hovuzuna sahib olmaq sadədir.
  items:
    - title: Dəqiqədə quraşdırma
      description: 'Qutudan çıxarın və daxil olan nasosla 5-15 dəqiqə ərzində doldurun, sonra bağ şlanqı ilə doldurun — doldurma vaxtı hovuzun ölçüsünə və su təchizatına görə dəyişir.'
      icon: tabler:rocket
    - title: Sadə Su Qulluğu
      description: Standart 32/38 mm filtr-nasos portları, müntəzəm pH yoxlamaları və yuvarlaq modellərdə quraşdırılmış qapaq suyu təmiz saxlayır.
      icon: tabler:droplet
    - title: Təmizləyin, Sökün və Saxlayın
      description: Hovuzu boşaltın, qurutun, yuvarlayın və qış üçün saxlama çantasına yığın. Saxlamaq üçün daimi quraşdırma yoxdur.
      icon: tabler:package
    - title: Birinci Təhlükəsizlik
      description: Uşaqlara hər zaman böyüklər tərəfindən fəal nəzarət edilməlidir. Təlimata, yerli qaydalara və təhlükəsiz istifadə təlimatına əməl edin.
      icon: tabler:shield-check
steps:
  title: Qutudan Həyətə
  items:
    - title: 'Addım 1: <span class="font-medium">Hovuzunuzu Seçin</span>'
      description: Məkanınıza, evinizə və sudan necə istifadə etməyi planlaşdırdığınıza uyğun olaraq forma və ölçüləri müqayisə edin.
      icon: tabler:pool
    - title: 'Addım 2: <span class="font-medium">Quraşdırın</span>'
      description: Möhkəm, düz bir yerə qoyun, daxil olan elektrik nasosu ilə şişirdin və bağ şlanqı ilə doldurun.
      icon: tabler:rocket
    - title: 'Addım 3: <span class="font-medium">Bütün Yayı Üzmək</span>'
      description: Sadə qayğı ilə suyu təzə saxlayın - hər hansı kiçik hovuz kimi yağdan təmizləyin, örtün və pH-ı yoxlayın.
      icon: tabler:ripple
    - title: 'Addım 4: <span class="font-medium">Uzaqda Saxlayın</span>'
      description: Mövsüm başa çatdıqda, hovuzu süzün, qurutun, yuvarlayın və gələn yaya qədər çantasında saxlayın.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay dəyirmi Drop Stitch şişmə hovuzu
blog_latest:
  title: Hovuz Bələdçiləri və İnsights
  information: |
    Quraşdırma təlimatları, qulluq tövsiyələri və şişmə hovuzlar üçün satın alma məsləhətləri
    Felizbay komandasından.
faqs:
  title: Şişmə hovuzu haqqında tez-tez verilən suallar
  subtitle: Felizbay şişmə hovuzları haqqında ümumi suallar.
  columns: 2
  items:
    - title: Quraşdırma nə qədər vaxt aparır?
      description: 'Modeldən asılı olaraq daxil olan elektrik hava nasosu ilə şişirmə 5-15 dəqiqə çəkir. Doldurma vaxtı hovuzun tutumu və su təchizatınıza görə dəyişir.'
      icon: tabler:clock
      category: all
    - title: Drop Stitch hovuzu nə qədər sərtdir?
      description: Çox sərt. Drop Stitch divarları 4-5 PSI-da güclü şəkildə şişirilir - şişmə avar taxtasına bənzər - buna görə də hovuz su ilə doldurulduqda öz formasını saxlayır.
      icon: tabler:hexagon
      category: all
    - title: Uşaqlar hovuzdan istifadə edə bilərmi?
      description: Bəli, hər zaman böyüklərin aktiv nəzarəti ilə. Uşaqlar heç vaxt hovuzda və ya yaxınlığında nəzarətsiz buraxılmamalıdır - təlimata və yerli təhlükəsizlik qaydalarına əməl edin.
      icon: tabler:users
      category: all
    - title: Qışda hovuzu necə saxlamaq olar?
      description: Suyu boşaltın, hovuzu söndürün, tam qurumasına icazə verin, sonra yuvarlayın və daxil olan saxlama çantasında şaxtasız yerdə saxlayın.
      icon: tabler:package
      category: all
    - title: Hovuza nə daxildir?
      description: Hər Felizbay hovuzuna elektrik hava nasosu, təmir dəsti və saxlama çantası daxildir. Dəyirmi modellərdə əlavə olaraq quraşdırılmış örtük var.
      icon: tabler:box
      category: all
    - title: Hansı ölçülər mövcuddur?
      description: Dörd kolleksiya üzrə 48 standart SKU - eni 10 m-ə qədər yuvarlaq hovuzlar, 6 × 5 m-ə qədər düzbucaqlı hovuzlar və quraşdırılmış oturacaqları olan SPA vannaları. Biznes tərəfdaşları üçün xüsusi ölçülər mövcuddur.
      icon: tabler:ruler-2
      category: all
    - title: Hovuz hansı səthlərdə dayana bilər?
      description: 'Kəskin əşyalar olmayan hər hansı düz, səviyyəli səth - qazon, veranda və ya göyərtə. Kobud səthlərdə torpaq təbəqəsi tövsiyə olunur. Doldurulmuş hovuz ağırdır: yalnız tam çəkiyə tab gətirən səthə quraşdırın və ilk növbədə yüksək göyərtələr, eyvanlar və dam örtükləri struktur olaraq qiymətləndirilməlidir.'
      icon: tabler:layout-grid
      category: all
    - title: Suyu necə təmiz saxlaya bilərəm?
      description: Quraşdırılmış yerdə filtr nasosundan istifadə edin, zibilləri təmizləyin, pH-ı yoxlayın və istifadə edilmədikdə hovuzu örtün. Suyun nə qədər davam etməsi hovuzun ölçüsündən, istifadəsindən və filtrasiyasından asılıdır - sabit cədvələ etibar etməkdənsə, müntəzəm olaraq sınaqdan keçirin.
      icon: tabler:droplet
      category: all
