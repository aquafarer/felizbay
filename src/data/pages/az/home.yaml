hero:
  tagline: Premium Drop Stitch Şişmə Hovuzları
  title: Xarici məkanınızdan daha çox<br />Istifadə edin.
  subtitle: |
    Bir neçə dəqiqə ərzində şişən və qışa yığılan sərt drop-stitch divarları olan premium hovuzlar həyətdə istirahət və ailəvi əyləncə üçün nəzərdə tutulub.<br />
    Hovuz ölçülərini araşdırın, xüsusiyyətləri müqayisə edin və məkanınıza uyğun olanı tapın.<br />
    Aquafarer MMC, ABŞ tərəfindən dizayn edilmiş və idarə edilmişdir.
  actions:
    - variant: primary
      text: Mağaza hovuzları
      href: /products/
      icon: tabler:pool
    - text: Hovuzunuzu tapın
      href: /find-your-pool/
      icon: tabler:compass
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Həyətdə Felizbay düzbucaqlı Drop Stitch şişmə hovuzu
features:
  id: features
  tagline: Drop Stitch Texnologiyası
  title: Niyə Felizbay Hovuzu<br />Fərqlidir
  subtitle: Yüksək təzyiqli Drop Stitch konstruksiyası hovuzlarımızı möhkəm, dayanıqlı və saxlanmasını asanlaşdırır.
  columns: 2
  items:
    - title: Sərt Drop Stitch Divarları
      description: 'Minlərlə daxili iplər divar təbəqələrini bir-birinə bağlayır, beləliklə hovuz 4-5 PSI nominalında sərt şəkildə şişirilir və doldurulduqda formasını saxlayır.'
      icon: tabler:hexagon
    - title: Sürətli, Alətsiz Quraşdırma
      description: Daxil olan elektrik nasosu ilə bir neçə dəqiqə ərzində şişirdin, sonra bağ şlanqı ilə doldurun. Alət yoxdur, tikinti yoxdur, peşəkar quraşdırma yoxdur.
      icon: tabler:rocket
    - title: Paketlər Kiçik
      description: 'Hovuzu boşaltın, söndürün, yuvarlayın və qışda çantasında saxlayın - qapalı saxlama üçün kiçik bir yerə yığılan tam ölçülü hovuz.'
      icon: tabler:package
    - title: Davamlı və UV-Davamlıdır
      description: 'İki qatlı PVC drop stitch parça, ailənin tam mövsümü boyunca deşilmələrə və UV məruz qalmasına müqavimət göstərmək üçün hazırlanmışdır.'
      icon: tabler:shield
    - title: Tam Paket
      description: Hər hovuz elektrik hava nasosu, təmir dəsti və saxlama çantası ilə təchiz olunur. Dəyirmi modellər üçün quraşdırılmış örtüklər mövcuddur.
      icon: tabler:box
    - title: Təhlükəsizlik şüurlu dizayn
      description: 'EN 16582-1 və ASTM F2666 standartlarına istinad edən yaşayış hovuzunun dizaynı — modelə aid təhlükəsizlik məlumatı məhsul sənədlərində verilmişdir. Daimi böyüklərin nəzarəti həmişə tələb olunur.'
      icon: tabler:shield-check
