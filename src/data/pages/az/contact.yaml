hero_text:
  tagline: Əlaqə
  title: ƏLAQƏ EDİN
contact_form:
  id: form
  title: Bizə mesaj göndərin
  subtitle: Kotirovkalar, texniki suallar və ya tərəfdaşlıq sorğuları üçün bizə bir xətt buraxın. Bir iş günü ərzində cavab veririk.
  email_to: info@felizbay.com
  submit_button: Sorğu göndər → Təklif alın
  success_message: Təşəkkürlər! Mesajınız inboxumuza düşdü. Biz bir iş günü ərzində cavab verəcəyik.
  error_message: Mesajınızı göndərərkən xəta baş verdi. Lütfən, yenidən cəhd edin və ya birbaşa bizə e-poçt göndərin.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: lütfən, aşağıdakıları həll edin"
  fields:
    - name: firstName
      label: Ad
      row: 1
    - name: lastName
      label: Soyadı
      row: 1
    - name: inquiryType
      label: Sorğunun növü
      row: 2
      type: select
      options:
        - value: ""
          label: Sorğunuz nə ilə bağlıdır?
        - value: retail
          label: Bir hovuz üçün onlayn sifariş (pərakəndə)
        - value: wholesale
          label: Topdan / külli miqdarda sifariş (B2B)
        - value: oem
          label: OEM/ODM fərdiləşdirməsi
        - value: support
          label: Satışdan sonrakı dəstək və zəmanət
    - name: companyName
      label: Şirkət Adı
      row: 3
    - name: address
      label: Ünvan
      row: 4
    - name: zip
      label: Poçt / Poçt Kodu
      row: 5
    - name: country
      label: ölkə
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-poçt
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Təxmini Sifariş Həcmi
      row: 7
      type: select
      options:
        - value: ""
          label: Təxmini həcminizi seçin...
        - value: 1-unit
          label: 1 ədəd — bir hovuz (onlayn pərakəndə sifariş)
        - value: sample
          label: Yalnız nümunələr / Prototiplər
        - value: 5-10
          label: 5–10 ədəd (Standart MOQ)
        - value: 100-500
          label: 100-500 ədəd
        - value: 500-plus
          label: 500+ kontur (həcmi qiymət)
    - name: customization
      label: Fərdiləşdirmə tələb olunur?
      row: 8
      type: select
      options:
        - value: ""
          label: Fərdiləşdirmə növünü seçin...
        - value: none
          label: Standart məhsul (fərdiləşdirmə yoxdur)
        - value: logo
          label: Yalnız Fərdi Loqo / Brendinq
        - value: full
          label: Tam OEM (ölçü, rəng, qrafika, qablaşdırma)
        - value: consultation
          label: Əmin deyiləm - məsləhət lazımdır
    - name: productInterest
      label: Maraq Hovuzu
      row: 9
      type: select
      options:
        - value: ""
          label: Hovuz növünü seçin...
        - value: all
          label: Bütün hovuzlar / Tam kataloq
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Daşınan jakuzi — Dəyirmi
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Jakuzi / Swim Spa — Kvadrat
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Mövzu
      row: 10
    - name: message
      label: Mesaj
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Bizə çatmağın başqa yolları
  columns: 3
  items:
    - title: Satış sorğuları
      description: Hovuz qiymətləri, topdansatış qiymətləri və toplu sifarişlər.
      icon: tabler:shopping-bag
    - title: Texniki dəstək
      description: Quraşdırma yardımı, təmir, ehtiyat hissələri və qayğı sualları.
      icon: tabler:tool
    - title: OEM / ODM
      description: Xüsusi ölçülər, rənglər, örtüklər, marka və qablaşdırma.
      icon: tabler:palette
    - title: E-poçt
      description: info@felizbay.com
      icon: tabler:mail
    - title: Veb sayt
      description: felizbay.com
      icon: tabler:world
    - title: Cavab vaxtı
      description: Bir iş günü ərzində cavab veririk.
      icon: tabler:clock
map:
  title: Əlaqə saxlayın
  subtitle: Felizbayla əlaqə saxlayın
  address: felizbay.com
  zoom: 15
