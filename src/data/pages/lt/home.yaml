hero:
  tagline: Aukščiausios kokybės „Drop Stitch“ pripučiami baseinai
  title: Išnaudokite daugiau savo<br />Lauko erdvės.
  subtitle: |
    Aukščiausios klasės baseinai su tvirtomis drop-stitch sienomis, kurios pripučiamos per kelias minutes ir supakuojamos žiemai – sukurti poilsiui kieme ir šeimos pramogoms.<br />
    Ištirkite baseinų dydžius, palyginkite funkcijas ir raskite tinkamą jūsų erdvei.<br />
    Sukūrė ir eksploatuoja Aquafarer LLC, JAV.
  actions:
    - variant: primary
      text: Parduotuvė baseinai
      href: /products/
      icon: tabler:pool
    - text: Raskite savo baseiną
      href: /find-your-pool/
      icon: tabler:compass
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Felizbay stačiakampis Drop Stitch pripučiamas baseinas kieme
features:
  id: features
  tagline: Drop Stitch technologija
  title: Kodėl Felizbay baseinas<br />Yra Skirtingas
  subtitle: Dėl aukšto slėgio Drop Stitch konstrukcijos mūsų baseinai yra standūs, patvarūs ir lengvai laikomi.
  columns: 2
  items:
    - title: Standžiosios Drop Stitch sienos
      description: 'Tūkstančiai vidinių sriegių sukabina sienos sluoksnius, todėl baseinas standžiai išsipučia esant vardiniam 4-5 PSI ir išlaiko formą pripildytas.'
      icon: tabler:hexagon
    - title: Greita sąranka be įrankių
      description: Pripūskite naudodami pridedamą elektrinį siurblį per kelias minutes, tada užpildykite sodo žarna. Jokių įrankių, jokių konstrukcijų, jokio profesionalaus montavimo.
      icon: tabler:rocket
    - title: Pakuotės mažos
      description: 'Ištuštinkite, išleiskite orą, susukite ir žiemą laikykite baseiną maišelyje – viso dydžio baseiną, kuris yra mažas, kad būtų galima laikyti viduje.'
      icon: tabler:package
    - title: Patvarus ir atsparus UV spinduliams
      description: 'Dvisluoksnis PVC drop stitch audinys, sukurtas taip, kad būtų atsparus pradūrimams ir UV poveikiui per visą šeimos naudojimo sezoną.'
      icon: tabler:shield
    - title: Pilnas paketas
      description: Kiekviename baseine yra elektrinis oro siurblys, remonto rinkinys ir laikymo krepšys. Apvaliems modeliams yra sumontuoti užvalkalai.
      icon: tabler:box
    - title: Saugumo požiūriu sąmoningas dizainas
      description: 'Gyvenamojo baseino projektas, atitinkantis EN 16582-1 ir ASTM F2666 – konkrečiam modeliui būdinga saugos informacija pateikiama gaminio dokumentacijoje. Visada reikalinga nuolatinė suaugusiųjų priežiūra.'
      icon: tabler:shield-check
