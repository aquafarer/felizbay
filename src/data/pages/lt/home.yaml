faqs:
  title: Pripučiamo baseino DUK
  subtitle: Dažniausiai užduodami klausimai apie Felizbay pripučiamus baseinus.
  columns: 2
  items:
    - title: Kiek laiko trunka sąranka?
      description: 'Pripūtimas trunka 5-15 minučių su pridedamu elektriniu oro siurbliu, priklausomai nuo modelio. Pildymo laikas priklauso nuo baseino talpos ir vandens tiekimo.'
      icon: tabler:clock
      category: all
    - title: Kiek standus yra „Drop Stitch“ baseinas?
      description: Labai kietas. Drop Stitch sienos sunkiai pripučiamos 4–6 PSI (panašiai kaip pripučiamos irklentės), todėl pripildytas vandens baseinas išlaiko savo formą.
      icon: tabler:hexagon
      category: all
    - title: Ar vaikai gali naudotis baseinu?
      description: Taip, visą laiką aktyviai prižiūrint suaugusiems. Vaikų niekada negalima palikti be priežiūros baseine ar šalia jo – laikykitės vadovo ir vietinių saugos taisyklių.
      icon: tabler:users
      category: all
    - title: Kaip laikyti baseiną žiemą?
      description: Išleiskite vandenį, išleiskite vandenį iš baseino, leiskite jam visiškai išdžiūti, tada susukite ir laikykite pridedamame laikymo maišelyje, kuriame neužšąla.
      icon: tabler:package
      category: all
    - title: Kas įskaičiuota į baseiną?
      description: Kiekviename Felizbay baseino rinkinyje yra elektrinis oro siurblys, remonto rinkinys ir laikymo krepšys. Dangteliai ir filtrų siurbliai parduodami atskirai.
      icon: tabler:box
      category: all
    - title: Kokie dydžiai galimi?
      description: Internetu prekiaujame fiksuoto dydžio mažmeninės prekybos rinkiniais iš apvalių ir SPA kolekcijų. Visas gamyklos asortimentas – apvalūs baseinai iki 10 m skersmens, stačiakampiai baseinai iki 6 × 5 m ir SPA kubilai – yra mūsų didmeninės prekybos programoje.
      icon: tabler:ruler-2
      category: all
    - title: Ant kokių paviršių gali stovėti baseinas?
      description: 'Bet koks plokščias, lygus paviršius be aštrių daiktų – veja, terasa ar denis. Ant šiurkščių paviršių rekomenduojamas šlifavimo sluoksnis. Užpildytas baseinas yra sunkus: montuokite tik ant paviršiaus, kuris atlaiko visą svorį, ir pirmiausia įvertinkite paaukštintus denius, balkonus ir stogus.'
      icon: tabler:layout-grid
      category: all
    - title: Kaip išlaikyti švarų vandenį?
      description: Jei yra, naudokite filtro siurblį, nugriebkite šiukšles, patikrinkite pH ir uždenkite baseiną, kai nenaudojate. Kiek laiko užteks vandens, priklauso nuo baseino dydžio, naudojimo ir filtravimo – reguliariai tikrinkite, o ne pasikliaukite fiksuotu grafiku.
      icon: tabler:droplet
      category: all
