      cta: Gaukite idėjų
      cta_href: /pool-ideas/pools-for-glamping-and-hospitality
content_categories:
  tagline: Parduotuvė baseinai
  title: Naršykite mūsų baseinus
  subtitle: Palyginkite formas, dydžius ir funkcijas, kad rastumėte tinkamą baseiną savo kieme ar lauko erdvei.
content_workshop:
  isReversed: true
  tagline: Įmonėms
  title: Baseinai verslui,<br />Taip pat
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Felizbay verslo partneriams</h3>
  items:
    - title: Nuoma atostogoms ir svetingumas
      description: Sezoniniai svečių patogumai, skirti išsinuomoti atostogas, lankytinas vietas ir butiko patalpas – greitai įdiegti, lengvai prižiūrėti, paprasta laikyti.
    - title: Mažmeninės prekybos ir prekės ženklo partneriai
      description: Didmeninės programos ir mažmeninei prekybai paruošti „Drop Stitch“ baseinai sodo centrams, baseinų parduotuvėms ir internetinėms parduotuvėms.
    - title: Individuali ir privati ​​etiketė
      description: Individualūs dydžiai, spalvos, viršeliai, logotipų spausdinimas ir prekinių ženklų pakuotės – sukūrė mūsų gamybos partneriai.
content_compliance:
  tagline: Priežiūra ir sauga
  title: Lengva turėti,<br />Lengva mylėti
  subtitle: Nuo pristatymo iki pirmojo plaukimo iki saugojimo sezono pabaigoje – turėti Felizbay baseiną yra paprasta.
  items:
    - title: Nustatymas per minutes
      description: Išimkite dėžę, pripūskite naudodami pridedamą pompą ir užpildykite – pilnas nustatymas paprastai trunka 15–30 minučių ant tvirtos, lygios žemės.
      icon: tabler:rocket
    - title: Paprasta vandens priežiūra
      description: Standartiniai 32/38 mm filtro siurblio prievadai, reguliarus pH patikrinimas ir apvaliuose modeliuose sumontuotas dangtelis palaiko švarų vandenį.
      icon: tabler:droplet
    - title: Išvalykite, nusausinkite ir laikykite
      description: Nusausinkite, išdžiovinkite, susukite ir supakuokite baseiną į laikymo maišelį žiemai. Nereikia nuolatinės priežiūros.
      icon: tabler:package
    - title: Saugumas pirmiausia
      description: Vaikai visą laiką turi būti aktyviai prižiūrimi suaugusiojo. Laikykitės vadovo, vietinių taisyklių ir saugaus naudojimo nurodymų.
      icon: tabler:shield-check
steps:
  title: Nuo dėžės iki kiemo
  items:
    - title: '1 veiksmas: <span class="font-medium">Pasirinkite savo baseiną</span>'
      description: Palyginkite formas ir dydžius, kad atitiktų jūsų erdvę, namų ūkį ir tai, kaip planuojate naudoti vandenį.
      icon: tabler:pool
    - title: '2 veiksmas: <span class="font-medium">Nustatyti</span>'
      description: Padėkite ant tvirtos, lygios žemės, pripūskite naudodami pridedamą elektrinį siurblį ir užpildykite sodo žarna.
      icon: tabler:rocket
    - title: '3 veiksmas: <span class="font-medium">Plaukti visą vasarą</span>'
      description: Pasirūpinkite, kad vanduo būtų šviežias – nugriebkite, uždenkite ir patikrinkite pH, kaip ir bet kuriame mažame baseine.
      icon: tabler:ripple
    - title: '4 veiksmas: <span class="font-medium">Išsaugokite</span>'
      description: Pasibaigus sezonui, nusausinkite, išdžiovinkite, susukite ir laikykite baseiną maiše iki kitos vasaros.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.png
    alt: Felizbay apvalus Drop Stitch pripučiamas baseinas
blog_latest:
  title: Baseino vadovai ir įžvalgos
  information: |
    Pripučiamų baseinų sąrankos vadovai, priežiūros patarimai ir pirkimo patarimai
    iš Felizbay komandos.
faqs:
  title: Pripučiamo baseino DUK
  subtitle: Dažniausiai užduodami klausimai apie Felizbay pripučiamus baseinus.
  columns: 2
  items:
    - title: Kiek laiko trunka sąranka?
      description: Pripūtimas trunka apie 10 minučių su komplekte esančiu elektriniu oro siurbliu; pilnas nustatymas, įskaitant įdėjimą ir užpildymą, paprastai trunka 15–30 minučių.
      icon: tabler:clock
      category: all
    - title: Kiek standus yra „Drop Stitch“ baseinas?
      description: Labai kietas. Drop Stitch sienos sunkiai pripučiamos 4–5 PSI (panašiai kaip pripučiamos irklentės), todėl pripildytas vandens baseinas išlaiko savo formą.
      icon: tabler:hexagon
      category: all
    - title: Ar vaikai gali naudotis baseinu?
      description: Taip, visą laiką aktyviai prižiūrint suaugusiems. Vaikų niekada negalima palikti be priežiūros baseine ar šalia jo – laikykitės vadovo ir vietinių saugos taisyklių.
      icon: tabler:users
      category: all
    - title: Kaip laikyti baseiną žiemą?
      description: Išleiskite vandenį, išleiskite vandenį iš baseino, leiskite jam visiškai išdžiūti, tada susukite ir laikykite pridedamame laikymo maišelyje, kuriame neužšąla.
      icon: tabler:package
      category: all
    - title: Kas įskaičiuota į baseiną?
      description: Kiekviename Felizbay baseine yra elektrinis oro siurblys, remonto rinkinys ir laikymo krepšys. Apvalūs modeliai turi papildomą dangtelį.
      icon: tabler:box
      category: all
    - title: Kokie dydžiai galimi?
      description: 48 standartiniai SKU keturiose kolekcijose – apvalūs baseinai iki 10 m skersmens, stačiakampiai baseinai iki 6 × 5 m ir SPA kubilai su įmontuotomis sėdynėmis. Galimi individualūs dydžiai verslo partneriams.
      icon: tabler:ruler-2
      category: all
    - title: Ant kokių paviršių gali stovėti baseinas?
      description: Bet koks plokščias, lygus paviršius be aštrių daiktų – veja, terasa ar denis. Ant šiurkščių paviršių rekomenduojamas šlifavimo sluoksnis. Patikrinkite, ar paviršius gali atlaikyti užpildyto baseino svorį.
      icon: tabler:layout-grid
      category: all
    - title: Kaip išlaikyti švarų vandenį?
      description: Jei yra, naudokite filtro siurblį, nugriebkite šiukšles, patikrinkite pH ir uždenkite baseiną, kai nenaudojate. Kiek laiko užteks vandens, priklauso nuo baseino dydžio, naudojimo ir filtravimo – reguliariai tikrinkite, o ne pasikliaukite fiksuotu grafiku.
      icon: tabler:droplet
      category: all
