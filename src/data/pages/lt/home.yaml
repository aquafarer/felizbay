features:
  id: features
  tagline: Drop Stitch technologija
  title: Kodėl Felizbay baseinas<br />Yra Skirtingas
  subtitle: Dėl aukšto slėgio Drop Stitch konstrukcijos mūsų baseinai yra standūs, patvarūs ir lengvai laikomi.
  columns: 2
  items:
    - title: Standžiosios Drop Stitch sienos
      description: Tūkstančiai vidinių sriegių sukabina sienos sluoksnius, todėl baseinas stipriai išsipučia 4–5 PSI slėgiu ir išlaiko formą pripildytas.
      icon: tabler:hexagon
    - title: Greita sąranka be įrankių
      description: Pripūskite naudodami pridedamą elektrinį siurblį per kelias minutes, tada užpildykite sodo žarna. Jokių įrankių, jokių konstrukcijų, jokio profesionalaus montavimo.
      icon: tabler:rocket
    - title: Pakuotės mažos
      description: Nusausinkite, išleiskite orą, susukite ir žiemą laikykite baseiną maiše. Viso dydžio baseinas, telpantis į spintą.
      icon: tabler:package
    - title: Patvarus ir atsparus UV spinduliams
      description: Dviejų sluoksnių PVC Drop Stitch audinys atsparus pradūrimams, UV spinduliams ir visam šeimos naudojimui.
      icon: tabler:shield
    - title: Pilnas paketas
      description: Kiekviename baseine yra elektrinis oro siurblys, remonto rinkinys ir laikymo krepšys. Apvaliems modeliams yra sumontuoti užvalkalai.
      icon: tabler:box
    - title: Saugumo požiūriu sąmoningas dizainas
      description: Gyvenamojo baseino dizainas, atitinkantis EN 16582-1 ir ASTM F2666, su slėgio mažinimo vožtuvais ir stabiliomis standžiomis sienomis. Visada reikalinga nuolatinė suaugusiųjų priežiūra.
      icon: tabler:shield-check
