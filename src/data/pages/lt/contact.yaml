hero_text:
  tagline: Susisiekite
  title: SUSISIEKITE
contact_form:
  id: form
  title: Atsiųskite mums žinutę
  subtitle: Jei turite pasiūlymų, techninių klausimų ar užklausų dėl partnerystės, susisiekite su mumis. Atsakome per vieną darbo dieną.
  email_to: info@felizbay.com
  submit_button: Siųsti užklausą → Gaukite pasiūlymą
  success_message: Ačiū! Jūsų žinutė pateko į mūsų pašto dėžutę. Atsakysime per vieną darbo dieną.
  error_message: Siunčiant pranešimą įvyko klaida. Bandykite dar kartą arba parašykite mums tiesiogiai el. paštu.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: išspręskite šiuos klausimus"
  fields:
    - name: firstName
      label: Vardas
      row: 1
    - name: lastName
      label: Pavardė
      row: 1
    - name: inquiryType
      label: Užklausos tipas
      row: 2
      type: select
      options:
        - value: ""
          label: Apie ką jūsų užklausa?
        - value: retail
          label: Vieno baseino užsakymas internetu (mažmeninė prekyba)
        - value: wholesale
          label: Didmeninis / didelis užsakymas (B2B)
        - value: oem
          label: OEM/ODM pritaikymas
        - value: support
          label: Pagalba po pardavimo ir garantija
    - name: companyName
      label: Įmonės pavadinimas
      row: 3
    - name: address
      label: Adresas
      row: 4
    - name: zip
      label: Pašto kodas
      row: 5
    - name: country
      label: Šalis
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: paštas
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Numatomas užsakymų kiekis
      row: 7
      type: select
      options:
        - value: ""
          label: Pasirinkite numatomą garsumą...
        - value: 1-unit
          label: 1 vnt. — vienas baseinas (internetinis mažmeninis užsakymas)
        - value: sample
          label: Tik pavyzdžiai / prototipai
        - value: 5-10
          label: 5–10 vienetų (standartinis MOQ)
        - value: 100-500
          label: 100–500 vienetų
        - value: 500-plus
          label: Daugiau nei 500 vienetų (tūrinė kainodara)
    - name: customization
      label: Reikia pritaikymo?
      row: 8
      type: select
      options:
        - value: ""
          label: Pasirinkite tinkinimo tipą...
        - value: none
          label: Standartinis produktas (be pritaikymo)
        - value: logo
          label: Tik tinkintas logotipas / prekės ženklas
        - value: full
          label: Visas OEM (dydis, spalva, grafika, pakuotė)
        - value: consultation
          label: Nežinau - reikia konsultacijos
    - name: productInterest
      label: Interesų baseinas
      row: 9
      type: select
      options:
        - value: ""
          label: Pasirinkite baseino tipą...
        - value: all
          label: Visi baseinai / Visas katalogas
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Kilnojamas hidromasažinis baseinas — Apvalus
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Hidromasažinė vonia / Swim Spa — Kvadratinis
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Tema
      row: 10
    - name: message
      label: Pranešimas
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Kiti būdai mus pasiekti
  columns: 3
  items:
    - title: Pardavimų užklausos
      description: Baseinas, didmeninės kainos ir masiniai užsakymai.
      icon: tabler:shopping-bag
    - title: Techninė pagalba
      description: Sąrankos pagalba, remontas, atsarginės dalys ir priežiūros klausimai.
      icon: tabler:tool
    - title: OEM / ODM
      description: Individualūs dydžiai, spalvos, viršeliai, prekės ženklas ir pakuotė.
      icon: tabler:palette
    - title: El. paštas
      description: info@felizbay.com
      icon: tabler:mail
    - title: Svetainė
      description: felizbay.com
      icon: tabler:world
    - title: Reagavimo laikas
      description: Atsakome per vieną darbo dieną.
      icon: tabler:clock
map:
  title: Susisiekite
  subtitle: Susisiekite su Felizbay
  address: felizbay.com
  zoom: 15
