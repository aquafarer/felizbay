features3_what_we_build:
  title: Ką statome
  subtitle: Tikslinga produktų linija, kurią žinome iš vidaus – aukšto slėgio „Drop Stitch“ pripučiami baseinai.
  columns: 3
  isBeforeContent: true
  items:
    - title: Stačiakampiai baseinai
      description: Šeimos dydžio stačiakampiai „Drop Stitch“ baseinai, kurie maksimaliai padidina jūsų erdvės plaukimo zoną.
      icon: tabler:rectangle
    - title: Apvalūs mėlyni baseinai
      description: Klasikinis kiemo baseinas – ryškiai mėlyna, standžios Drop Stitch sienos, greitas montavimas.
      icon: tabler:circle
    - title: Apvalūs pilki baseinai
      description: Mūsų aukščiausios kokybės linija su modernia pilka apdaila ir pasirenkamu uždėtu dangteliu.
      icon: tabler:circle-dot
    - title: Sūkurinės vonios SPA baseinai
      description: 'Izoliuotų kubilų modeliai su įmontuotomis sėdynėmis ir 5 mm izoliuotu dugnu – skirti naudoti su išoriniais šildytuvais (šildytuvas neįeina).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Sukomplektuotos pakuotės
      description: Kiekviename baseino komplekte yra elektrinis oro siurblys, remonto rinkinys ir laikymo krepšys.
      icon: tabler:package
    - title: Individualūs dydžiai
      description: OEM dydžiai, spalvos ir dangteliai prekės ženklams, platintojams ir svetingumo projektams.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Privačių etikečių gamyba su logotipo spausdinimu ir mažmeninei prekybai paruošta pakuotė.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Felizbay stačiakampis Drop Stitch pripučiamas baseinas
