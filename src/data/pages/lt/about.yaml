production_section:
  tagline: Gamybos meistriškumas
  title: Išskirtinio meistriškumo užtikrinimas
  description: Felizbay gamybos linija skirta aukštos kokybės, patvariems, aukšto slėgio pripučiamiems baseinams.
  cards:
    - title: Patyrusi technikų komanda
      items:
        - Profesionalios žinios apie dygsnio ir PVC medžiagas
        - Tikslus pjovimo, suvirinimo ir surinkimo meistriškumas
        - Nuolatiniai mokymai įsisavinti naujausias gamybos technologijas
    - title: Pažangi gamybos įranga
      items:
        - Tiksli pjovimo įranga tikslioms audinių plokštėms
        - Didelio tikslumo šiluminis suvirinimas hermetiškoms, patvarioms siūlėms
        - Profesionali slėgio ir sandarumo tikrinimo įranga
    - title: Brandi valdymo sistema
      items:
        - Standartizuoti gamybos procesai su aiškiais kokybės standartais
        - Tausojančios gamybos filosofija, mažinanti atliekų kiekį ir didinanti efektyvumą
        - Efektyvus tiekimo grandinės valdymas su patikimais tiekėjais
    - title: Griežta kokybės kontrolė
      items:
        - 'Daugiapakopis patikrinimas: žaliava, procese, galutinis išvežimas'
        - Slėgio bandymas 4–6 PSI darbinio diapazono viršuje
        - Griežtas sandarumo ir patvarumo bandymas prieš išsiunčiant
