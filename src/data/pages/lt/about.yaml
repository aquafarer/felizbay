hero:
  tagline: Apie mus
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay pripučiamas baseinas
  title: |
    Kad plaukimas būtų paprastas, <br />
    pagal <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay yra aukščiausios kokybės „Drop Stitch“ pripučiamų baseinų prekės ženklas, kurį sukūrė ir valdo „Aquafarer LLC“ (JAV). Manome, kad kiekviena šeima nusipelno tikro baseino kieme – antžeminis įrengimas be nuolatinio baseino statybos. Mūsų baseinai išsipučia per kelias minutes, išgyvena visas šeimos linksmybių vasaras, o sezono pabaigoje supakuoja nedidelius. Leidimų, aptvarų ir įrengimo reikalavimai skiriasi priklausomai nuo vietovės.
