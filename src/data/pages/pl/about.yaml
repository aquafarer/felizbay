hero:
  tagline: O nas
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Nadmuchiwany basen Felizbay
  title: |
    Ułatwienie pływania, <br />
    w stylu <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay to marka premium nadmuchiwanych basenów Drop Stitch, zaprojektowana i obsługiwana przez Aquafarer LLC (USA). Wierzymy, że każda rodzina zasługuje na prawdziwy basen na podwórku – instalacja naziemna bez trwałej budowy basenu. Nasze baseny napompowują się do sztywności w ciągu kilku minut, przetrwają pełne rodzinnej zabawy lato i pakują się do niewielkich rozmiarów pod koniec sezonu. Wymogi dotyczące pozwoleń, ogrodzeń i instalacji różnią się w zależności od lokalizacji.
