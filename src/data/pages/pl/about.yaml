production_section:
  tagline: Doskonałość produkcji
  title: Zapewnienie wyśmienitego kunsztu
  description: Linia produkcyjna Felizbay dedykowana jest wysokiej jakości, trwałym, wysokociśnieniowym basenom dmuchanym.
  cards:
    - title: Doświadczony zespół techników
      items:
        - Profesjonalna wiedza na temat ściegu kropelkowego i materiałów PVC
        - Precyzja wykonania w zakresie cięcia, spawania i montażu
        - Ciągłe szkolenia w celu opanowania najnowszych technologii produkcji
    - title: Zaawansowany sprzęt produkcyjny
      items:
        - Precyzyjny sprzęt do cięcia dokładnych paneli tkaninowych
        - Precyzyjne zgrzewanie na gorąco zapewnia hermetyczne i trwałe szwy
        - Profesjonalny sprzęt do badania ciśnienia i szczelności
    - title: Dojrzały system zarządzania
      items:
        - Standaryzowane procesy produkcyjne z jasnymi standardami jakości
        - Filozofia Lean Production ograniczająca ilość odpadów i poprawiająca wydajność
        - Efektywne zarządzanie łańcuchem dostaw dzięki niezawodnym dostawcom
    - title: Ścisła kontrola jakości
      items:
        - 'Kontrola wieloetapowa: surowiec, w trakcie, wyjście końcowe'
        - Próba ciśnieniowa w górnej części znamionowego zakresu roboczego 4-6 PSI
        - Ścisłe testy szczelności i trwałości przed wysyłką
