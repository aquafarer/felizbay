content_compliance:
  tagline: Opieka i bezpieczeństwo
  title: Łatwy w posiadaniu,<br />Łatwo kochać
  subtitle: Od dostawy, przez pierwsze pływanie, aż po przechowywanie na koniec sezonu, posiadanie basenu Felizbay pozostaje proste.
  items:
    - title: Konfiguracja w kilka minut
      description: 'Rozpakuj i napompuj za pomocą dołączonej pompy w ciągu 5–15 minut, a następnie napełnij wężem ogrodowym — czas napełniania różni się w zależności od wielkości basenu i zaopatrzenia w wodę.'
      icon: tabler:rocket
    - title: Prosta pielęgnacja wody
      description: Standardowe porty pompy filtrującej 32/38 mm, regularne kontrole pH i dopasowana pokrywa w modelach okrągłych utrzymują wodę w czystości.
      icon: tabler:droplet
    - title: Wyczyść, osusz i przechowuj
      description: Odcedź, osusz, zwiń i zapakuj basen do torby do przechowywania na zimę. Brak stałej instalacji wymagającej konserwacji.
      icon: tabler:package
    - title: Bezpieczeństwo przede wszystkim
      description: Dzieci muszą być przez cały czas aktywnie nadzorowane przez osobę dorosłą. Postępuj zgodnie z instrukcją, lokalnymi przepisami i wskazówkami dotyczącymi bezpiecznego użytkowania.
      icon: tabler:shield-check
steps:
  title: Od pudełka do podwórka
  items:
    - title: 'Krok 1: <span class="font-medium">Wybierz swój basen</span>'
      description: Porównaj kształty i rozmiary, aby dopasować je do swojej przestrzeni, gospodarstwa domowego i sposobu, w jaki planujesz korzystać z wody.
      icon: tabler:pool
    - title: 'Krok 2: <span class="font-medium">Skonfiguruj to</span>'
      description: Umieść na twardym, równym podłożu, napompuj za pomocą dołączonej pompy elektrycznej i napełnij wężem ogrodowym.
      icon: tabler:rocket
    - title: 'Krok 3: <span class="font-medium">Pływaj całe lato</span>'
      description: Utrzymuj świeżość wody dzięki prostej pielęgnacji — przeglądaj, przykrywaj i sprawdzaj pH jak w każdym małym basenie.
      icon: tabler:ripple
    - title: 'Krok 4: <span class="font-medium">Przechowuj to</span>'
      description: Po zakończeniu sezonu odcedź, osusz, zwiń i przechowuj basen w torbie do następnego lata.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Okrągły nadmuchiwany basen Felizbay Drop Stitch
