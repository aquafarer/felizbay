features:
  id: features
  tagline: Technologia Drop Stitch
  title: Dlaczego basen Felizbay<br />Jest inny
  subtitle: Wysokociśnieniowa konstrukcja Drop Stitch sprawia, że ​​nasze baseny są sztywne, trwałe i łatwe w przechowywaniu.
  columns: 2
  items:
    - title: Sztywne ściany Drop Stitch
      description: 'Tysiące wewnętrznych gwintów łączy ze sobą warstwy ścian, dzięki czemu basen napełnia się sztywno przy znamionowym ciśnieniu 4-5 PSI i zachowuje swój kształt po napełnieniu.'
      icon: tabler:hexagon
    - title: Szybka konfiguracja bez użycia narzędzi
      description: Napompuj za pomocą dołączonej pompy elektrycznej w ciągu kilku minut, a następnie napełnij wężem ogrodowym. Bez narzędzi, bez konstrukcji, bez profesjonalnego montażu.
      icon: tabler:rocket
    - title: Pakuje się w małych rozmiarach
      description: 'Odcedź, wypuść powietrze, zwiń i przechowuj basen w torbie przez zimę — pełnowymiarowy basen, który po złożeniu jest niewielki i można go przechowywać w pomieszczeniu.'
      icon: tabler:package
    - title: Trwałe i odporne na promieniowanie UV
      description: 'Dwuwarstwowy materiał PVC drop stitch, zaprojektowany tak, aby był odporny na przebicia i narażenie na działanie UV przez cały sezon rodzinnego użytkowania.'
      icon: tabler:shield
    - title: Kompletny pakiet
      description: Każdy basen jest dostarczany z elektryczną pompą powietrza, zestawem naprawczym i torbą do przechowywania. Do modeli okrągłych dostępne są dopasowane pokrowce.
      icon: tabler:box
    - title: Projekt uwzględniający bezpieczeństwo
      description: 'Projekt basenu mieszkalnego zgodny z normami EN 16582-1 i ASTM F2666 — informacje dotyczące bezpieczeństwa dotyczące konkretnego modelu znajdują się w dokumentacji produktu. Zawsze wymagany jest stały nadzór osoby dorosłej.'
      icon: tabler:shield-check
