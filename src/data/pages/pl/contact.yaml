hero_text:
  tagline: Kontakt
  title: SKONTAKTUJ SIĘ
contact_form:
  id: form
  title: Wyślij nam wiadomość
  subtitle: W przypadku wycen, pytań technicznych lub zapytań dotyczących partnerstwa, napisz do nas. Odpowiadamy w ciągu jednego dnia roboczego.
  email_to: info@felizbay.com
  submit_button: Wyślij zapytanie → Uzyskaj wycenę
  success_message: Dzięki! Twoja wiadomość wylądowała w naszej skrzynce odbiorczej. Odpowiemy w ciągu jednego dnia roboczego.
  error_message: Coś poszło nie tak podczas wysyłania Twojej wiadomości. Spróbuj ponownie lub napisz do nas bezpośrednio.
  default_country_code: "+1"
  captcha:
    label: "Ochrona przed spamem: proszę rozwiązać następujące problemy"
  fields:
    - name: firstName
      label: Imię
      row: 1
    - name: lastName
      label: Nazwisko
      row: 1
    - name: inquiryType
      label: Typ zapytania
      row: 2
      type: select
      options:
        - value: ""
          label: Czego dotyczy Twoje zapytanie?
        - value: retail
          label: Zamówienie online jednego basenu (detal)
        - value: wholesale
          label: Zamówienie hurtowe / w dużych ilościach (B2B)
        - value: oem
          label: Dostosowanie OEM/ODM
        - value: support
          label: Obsługa posprzedażowa i gwarancja
    - name: companyName
      label: Nazwa firmy
      row: 3
    - name: address
      label: Adres
      row: 4
    - name: zip
      label: Kod pocztowy
      row: 5
    - name: country
      label: Kraj
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Szacowana wielkość zamówienia
      row: 7
      type: select
      options:
        - value: ""
          label: Wybierz szacunkową objętość...
        - value: 1-unit
          label: 1 szt. — jeden basen (zamówienie detaliczne online)
        - value: sample
          label: Tylko próbki/prototypy
        - value: 5-10
          label: 5–10 jednostek (standardowe MOQ)
        - value: 100-500
          label: 100–500 jednostek
        - value: 500-plus
          label: Ponad 500 jednostek (ceny zbiorcze)
    - name: customization
      label: Potrzebne dostosowanie?
      row: 8
      type: select
      options:
        - value: ""
          label: Wybierz typ dostosowania...
        - value: none
          label: Produkt standardowy (bez personalizacji)
        - value: logo
          label: Tylko niestandardowe logo/branding
        - value: full
          label: Pełny OEM (rozmiar, kolor, grafika, opakowanie)
        - value: consultation
          label: Nie jestem pewien – potrzebna konsultacja
    - name: productInterest
      label: Pula zainteresowań
      row: 9
      type: select
      options:
        - value: ""
          label: Wybierz typ basenu...
        - value: all
          label: Wszystkie baseny / Pełny katalog
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Przenośne jacuzzi — Okrągłe
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Jacuzzi / Swim Spa — Kwadratowe
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Temat
      row: 10
    - name: message
      label: Wiadomość
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Inne sposoby dotarcia do nas
  columns: 3
  items:
    - title: Zapytania sprzedażowe
      description: Wyceny puli, ceny hurtowe i zamówienia masowe.
      icon: tabler:shopping-bag
    - title: Wsparcie techniczne
      description: Pomoc w konfiguracji, naprawy, części zamienne i pytania dotyczące konserwacji.
      icon: tabler:tool
    - title: OEM/ODM
      description: Niestandardowe rozmiary, kolory, okładki, branding i opakowanie.
      icon: tabler:palette
    - title: E-mail
      description: info@felizbay.com
      icon: tabler:mail
    - title: Strona internetowa
      description: felizbay.com
      icon: tabler:world
    - title: Czas reakcji
      description: Odpowiadamy w ciągu jednego dnia roboczego.
      icon: tabler:clock
map:
  title: Skontaktuj się
  subtitle: Skontaktuj się z Felizbayem
  address: felizbay.com
  zoom: 15
