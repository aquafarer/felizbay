content_compliance:
  tagline: Pflege und Sicherheit
  title: Einfach zu besitzen,<br />Leicht zu lieben
  subtitle: Von der Lieferung über das erste Schwimmen bis zur Lagerung am Ende der Saison bleibt der Besitz eines Felizbay-Pools einfach.
  items:
    - title: Einrichtung in wenigen Minuten
      description: 'Auspacken und mit der mitgelieferten Pumpe in 5–15 Minuten aufpumpen, dann mit einem Gartenschlauch füllen – die Füllzeit variiert je nach Poolgröße und Wasserversorgung.'
      icon: tabler:rocket
    - title: Einfache Wasserpflege
      description: Standardmäßige 32/38-mm-Filterpumpenanschlüsse, regelmäßige pH-Kontrollen und eine passende Abdeckung bei runden Modellen halten das Wasser sauber.
      icon: tabler:droplet
    - title: Reinigen, abtropfen lassen und aufbewahren
      description: Lassen Sie den Pool abtropfen, trocknen Sie ihn, rollen Sie ihn auf und packen Sie ihn für den Winter in die Aufbewahrungstasche. Keine permanente Installation erforderlich.
      icon: tabler:package
    - title: Sicherheit geht vor
      description: Kinder müssen jederzeit aktiv von einem Erwachsenen beaufsichtigt werden. Befolgen Sie das Handbuch, die örtlichen Vorschriften und die Hinweise zur sicheren Verwendung.
      icon: tabler:shield-check
steps:
  title: Von der Kiste in den Hinterhof
  items:
    - title: 'Schritt 1: <span class="font-medium">Wählen Sie Ihren Pool</span>'
      description: Vergleichen Sie Formen und Größen, um sie an Ihren Raum, Ihren Haushalt und Ihre geplante Wassernutzung anzupassen.
      icon: tabler:pool
    - title: 'Schritt 2: <span class="font-medium">Richten Sie es ein</span>'
      description: Auf festen, ebenen Boden stellen, mit der mitgelieferten Elektropumpe aufpumpen und mit einem Gartenschlauch befüllen.
      icon: tabler:rocket
    - title: 'Schritt 3: <span class="font-medium">Den ganzen Sommer über schwimmen</span>'
      description: Halten Sie das Wasser mit einfacher Pflege frisch – entleeren Sie es, decken Sie es ab und prüfen Sie den pH-Wert wie in jedem kleinen Pool.
      icon: tabler:ripple
    - title: 'Schritt 4: <span class="font-medium">Bewahren Sie es auf</span>'
      description: Wenn die Saison zu Ende ist, lassen Sie den Pool abtropfen, trocknen ihn, rollen ihn auf und bewahren ihn bis zum nächsten Sommer in seiner Tasche auf.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay runder, aufblasbarer Drop-Stitch-Pool
