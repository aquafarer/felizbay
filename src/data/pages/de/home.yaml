features:
  id: features
  tagline: Drop-Stitch-Technologie
  title: Warum ein Felizbay-Pool<br />Ist anders
  subtitle: Die Hochdruck-Drop-Stitch-Konstruktion macht unsere Pools steif, langlebig und mühelos zu lagern.
  columns: 2
  items:
    - title: Starre Drop-Stitch-Wände
      description: 'Tausende Innengewinde verbinden die Wandschichten miteinander, sodass sich der Pool bei einem Nenndruck von 4–5 PSI stabil aufbläst und seine Form behält, wenn er gefüllt ist.'
      icon: tabler:hexagon
    - title: Schnelle, werkzeuglose Einrichtung
      description: Mit der mitgelieferten Elektropumpe in wenigen Minuten aufpumpen und dann mit einem Gartenschlauch befüllen. Keine Werkzeuge, keine Konstruktion, keine professionelle Installation.
      icon: tabler:rocket
    - title: Klein verpackbar
      description: 'Entleeren Sie den Pool, lassen Sie die Luft ab, rollen Sie ihn auf und lagern Sie ihn über den Winter in der Tasche – ein vollwertiger Pool, der sich für die Innenaufbewahrung klein zusammenpacken lässt.'
      icon: tabler:package
    - title: Langlebig und UV-beständig
      description: 'Doppellagiges PVC-Drop-Stitch-Gewebe, das so konstruiert ist, dass es eine ganze Saison lang im Familienbereich stichfest und UV-Strahlung ausgesetzt ist.'
      icon: tabler:shield
    - title: Komplettpaket
      description: Jeder Pool wird mit einer elektrischen Luftpumpe, einem Reparaturset und einer Aufbewahrungstasche geliefert. Passende Abdeckungen für runde Modelle erhältlich.
      icon: tabler:box
    - title: Sicherheitsbewusstes Design
      description: 'Design von Wohnpools unter Bezugnahme auf EN 16582-1 und ASTM F2666 – modellspezifische Sicherheitsinformationen finden Sie in der Produktdokumentation. Ständige Aufsicht durch Erwachsene ist immer erforderlich.'
      icon: tabler:shield-check
