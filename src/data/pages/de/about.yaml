features3_what_we_build:
  title: Was wir bauen
  subtitle: Eine fokussierte Produktlinie, die wir in- und auswendig kennen – aufblasbare Hochdruck-Drop-Stitch-Schwimmbecken.
  columns: 3
  isBeforeContent: true
  items:
    - title: Rechteckige Pools
      description: Rechteckige Drop-Stitch-Pools in Familiengröße, die den Schwimmbereich für Ihren Raum maximieren.
      icon: tabler:rectangle
    - title: Runde blaue Pools
      description: Der klassische Hinterhofpool – leuchtendes Blau, starre Drop-Stitch-Wände, schneller Aufbau.
      icon: tabler:circle
    - title: Runde graue Pools
      description: Unsere Premium-Linie mit moderner grauer Oberfläche und optionalem Spannbezug.
      icon: tabler:circle-dot
    - title: Whirlpool-SPA-Pools
      description: 'Isolierte Whirlpool-Modelle mit eingebauten Sitzen und 5 mm isoliertem Boden – zur Verwendung mit externen Heizgeräten (Heizgerät nicht im Lieferumfang enthalten).'
      icon: tabler:ripple
