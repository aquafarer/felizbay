production_section:
  tagline: Produktionsexzellenz
  title: Gewährleistung exquisiter Handwerkskunst
  description: Die Felizbay-Produktionslinie ist auf hochwertige, langlebige, aufblasbare Hochdruck-Schwimmbecken spezialisiert.
  cards:
    - title: Erfahrenes Technikerteam
      items:
        - Fachliche Kenntnisse von Dropstitch- und PVC-Materialien
        - Präzise Handwerkskunst beim Schneiden, Schweißen und Zusammenbauen
        - Kontinuierliche Weiterbildung zur Beherrschung der neuesten Produktionstechnologien
    - title: Fortschrittliche Produktionsausrüstung
      items:
        - Präzisionsschneidegeräte für präzise Stoffbahnen
        - Hochpräzises Heißschweißen für luftdichte, langlebige Nähte
        - Professionelle Druck- und Luftdichtheitsprüfgeräte
    - title: Ausgereiftes Managementsystem
      items:
        - Standardisierte Produktionsprozesse mit klaren Qualitätsstandards
        - Lean-Production-Philosophie reduziert Verschwendung und verbessert die Effizienz
        - Effizientes Supply Chain Management mit zuverlässigen Lieferanten
    - title: Strenge Qualitätskontrolle
      items:
        - 'Mehrstufige Inspektion: Rohmaterial, In-Prozess, Endausgang'
        - Druckprüfung im oberen Bereich des Nennarbeitsbereichs von 4–6 PSI
        - Vor dem Versand werden strenge Luftdichtheits- und Haltbarkeitstests durchgeführt
