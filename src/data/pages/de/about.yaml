      description: Jedes Schwimmbecken-Set wird mit einer elektrischen Luftpumpe, einem Reparaturset und einer Aufbewahrungstasche geliefert.
      icon: tabler:package
    - title: Sondergrößen
      description: OEM-Größen, -Farben und -Bezüge für Marken, Händler und Gastronomieprojekte.
      icon: tabler:adjustments
