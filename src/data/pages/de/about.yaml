hero:
  tagline: Über uns
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Aufblasbares Felizbay-Schwimmbecken
  title: |
    Schwimmen einfach machen, <br />
    auf <span class="text-accent dark:text-white">Felizbay</span>-Art
  subtitle: Felizbay ist eine Premium-Marke für aufblasbare Drop-Stitch-Pools, die von Aquafarer LLC (USA) entwickelt und betrieben wird. Wir glauben, dass jede Familie einen echten Pool im Hinterhof verdient – ​​aufstellbarer Pool ohne dauerhafte Beckenbauarbeiten. Unsere Pools sind in wenigen Minuten fest aufgeblasen, überstehen ganze Sommer voller Familienspaß und lassen sich am Ende der Saison klein zusammenpacken. Genehmigungs-, Absperr- und Installationsanforderungen variieren je nach Standort.
