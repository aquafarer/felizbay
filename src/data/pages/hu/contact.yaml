hero_text:
  tagline: Érintkezés
  title: KAPCSOLATOT
contact_form:
  id: form
  title: Küldj nekünk üzenetet
  subtitle: Árajánlatok, műszaki kérdések vagy partnerségi kérdések esetén írjon nekünk. Egy munkanapon belül válaszolunk.
  email_to: info@felizbay.com
  submit_button: Kérdés küldése → Kérjen árajánlatot
  success_message: Köszönöm! Üzenete beérkezett a postafiókunkba. Egy munkanapon belül válaszolunk.
  error_message: Hiba történt az üzenet elküldésekor. Kérjük, próbálja újra, vagy írjon nekünk közvetlenül.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: kérjük, oldja meg a következőt"
  fields:
    - name: firstName
      label: Keresztnév
      row: 1
    - name: lastName
      label: Vezetéknév
      row: 1
    - name: inquiryType
      label: Kérés típusa
      row: 2
      type: select
      options:
        - value: ""
          label: Mivel kapcsolatos a kérése?
        - value: retail
          label: Egy medence online megrendelése (kiskereskedelem)
        - value: wholesale
          label: Nagykereskedelmi / tömeges rendelés (B2B)
        - value: oem
          label: OEM/ODM testreszabás
        - value: support
          label: Értékesítés utáni támogatás és garancia
    - name: companyName
      label: Cégnév
      row: 3
    - name: address
      label: Cím
      row: 4
    - name: zip
      label: Irányítószám
      row: 5
    - name: country
      label: Ország
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: Email
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Becsült rendelési mennyiség
      row: 7
      type: select
      options:
        - value: ""
          label: Válassza ki a becsült mennyiséget...
        - value: 1-unit
          label: 1 db — egy medence (online kiskereskedelmi rendelés)
        - value: sample
          label: Csak minták / prototípusok
        - value: 5-10
          label: 5–10 egység (standard MOQ)
        - value: 100-500
          label: 100-500 egység
        - value: 500-plus
          label: 500+ egység (mennyiségárak)
    - name: customization
      label: Testreszabás szükséges?
      row: 8
      type: select
      options:
        - value: ""
          label: Válassza ki a testreszabási típust...
        - value: none
          label: Standard termék (nincs testreszabás)
        - value: logo
          label: Csak egyéni logó / márkajelzés
        - value: full
          label: Teljes OEM (méret, szín, grafika, csomagolás)
        - value: consultation
          label: Nem biztos – konzultációra van szükség
    - name: productInterest
      label: Érdeklődési kör
      row: 9
      type: select
      options:
        - value: ""
          label: Válassza ki a medence típusát...
        - value: all
          label: Minden medence / Teljes katalógus
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Hordozható jakuzzi — Kerek
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Jakuzzi / Swim Spa — Négyzetes
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Téma
      row: 10
    - name: message
      label: Üzenet
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Más módok eléréséhez
  columns: 3
  items:
    - title: Értékesítési megkeresések
      description: Pool árajánlatok, nagykereskedelmi árak és tömeges megrendelések.
      icon: tabler:shopping-bag
    - title: Technikai támogatás
      description: Beállítási segítség, javítás, pótalkatrészek és gondozási kérdések.
      icon: tabler:tool
    - title: OEM / ODM
      description: Egyedi méretek, színek, borítók, márkajelzések és csomagolás.
      icon: tabler:palette
    - title: Email
      description: info@felizbay.com
      icon: tabler:mail
    - title: Weboldal
      description: felizbay.com
      icon: tabler:world
    - title: Válaszidő
      description: Egy munkanapon belül válaszolunk.
      icon: tabler:clock
map:
  title: Vegye fel a kapcsolatot
  subtitle: Forduljon Felizbayhoz
  address: felizbay.com
  zoom: 15
