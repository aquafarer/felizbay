features:
  id: features
  tagline: Drop Stitch technológia
  title: Miért egy Felizbay medence?<br />Különböző
  subtitle: A nagynyomású Drop Stitch konstrukció merevvé, tartóssá és könnyedén tárolhatóvá teszi medencéinket.
  columns: 2
  items:
    - title: Merev Drop Stitch falak
      description: Több ezer belső szál rögzíti egymáshoz a falrétegeket, így a medence 4-5 PSI-vel kőkeményen felfújódik, és megtöltéskor megtartja alakját.
      icon: tabler:hexagon
    - title: Gyors, szerszámmentes beállítás
      description: Fújja fel a mellékelt elektromos szivattyúval percek alatt, majd töltse fel kerti tömlővel. Nincsenek szerszámok, nincs építés, nincs szakszerű telepítés.
      icon: tabler:rocket
    - title: Kicsit csomagolva
      description: Engedje le, eressze le, tekerje fel és tárolja a medencét zacskóban télen. Szekrényben elférő teljes méretű medence.
      icon: tabler:package
    - title: Tartós és UV-álló
      description: A kétrétegű PVC Drop Stitch anyag ellenáll a szúrásnak, az UV-sugárzásnak és a teljes családi használatra.
      icon: tabler:shield
    - title: Komplett csomag
      description: Minden medencét elektromos légszivattyúval, javítókészlettel és tárolótáskával szállítunk. Kerek modellekhez felszerelt burkolatok kaphatók.
      icon: tabler:box
    - title: Biztonságtudatos tervezés
      description: Lakossági medence kialakítása EN 16582-1 és ASTM F2666 szabvány szerint, nyomáscsökkentő szelepekkel és stabil merev falakkal. Állandó felnőtt felügyelet szükséges.
      icon: tabler:shield-check
