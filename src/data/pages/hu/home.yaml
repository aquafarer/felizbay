content_compliance:
  tagline: Gondozás és biztonság
  title: Könnyen birtokolható,<br />Könnyű Szeretni
  subtitle: A szállítástól az első úszáson át a szezon végi tárolásig a Felizbay medence birtoklása egyszerű marad.
  items:
    - title: Beállítás percekben
      description: 'Bontsa ki és fújja fel a mellékelt szivattyúval 5-15 perc alatt, majd töltse fel kerti tömlővel – a feltöltési idő a medence méretétől és a vízellátástól függően változik.'
      icon: tabler:rocket
    - title: Egyszerű vízkezelés
      description: A szabványos 32/38 mm-es szűrőszivattyú-csatlakozók, a rendszeres pH-ellenőrzés és a kerek modellek felszerelt burkolata tisztán tartják a vizet.
      icon: tabler:droplet
    - title: Tisztítás, leeresztés és tárolás
      description: Csavarja le, szárítsa meg, tekerje fel, és csomagolja be a medencét a tárolótáskájába télre. Nincs karbantartásra való állandó telepítés.
      icon: tabler:package
    - title: Első a biztonság
      description: A gyermekeket mindig egy felnőtt aktív felügyelete alatt kell tartani. Kövesse a kézikönyvet, a helyi szabályokat és a biztonságos használat útmutatásait.
      icon: tabler:shield-check
steps:
  title: Boxtól a hátsó udvarig
  items:
    - title: '1. lépés: <span class="font-medium">Válassza ki a medencéjét</span>'
      description: Hasonlítsa össze a formákat és a méreteket, hogy illeszkedjen a helyéhez, a háztartásához és a vízhasználathoz.
      icon: tabler:pool
    - title: '2. lépés: <span class="font-medium">Állítsa be</span>'
      description: Helyezze szilárd, vízszintes talajra, fújja fel a mellékelt elektromos szivattyúval, és töltse fel kerti tömlővel.
      icon: tabler:rocket
    - title: '3. lépés: <span class="font-medium">Ússz egész nyáron</span>'
      description: Egyszerű gondozással tartsa frissen a vizet – simítsa le, fedje le és ellenőrizze a pH-t, mint minden kis medencében.
      icon: tabler:ripple
    - title: '4. lépés: <span class="font-medium">Tárolja el</span>'
      description: Amikor a szezon véget ér, ürítse ki, szárítsa meg, tekerje fel, és tárolja a medencét a zsákjában a következő nyárig.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay kerek Drop Stitch felfújható medence
