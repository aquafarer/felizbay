  items:
    - title: Nyaralás és vendéglátás
      description: Szezonális vendégszolgáltatások nyaralókhoz, kilátóhelyekhez és butik ingatlanokhoz – gyorsan telepíthető, könnyen karbantartható, egyszerűen tárolható.
