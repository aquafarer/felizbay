faqs:
  title: Felfújható medence GYIK
  subtitle: Gyakori kérdések a Felizbay felfújható medencékkel kapcsolatban.
  columns: 2
  items:
    - title: Mennyi ideig tart a beállítás?
      description: 'A felfújás 5-15 percet vesz igénybe a mellékelt elektromos légszivattyúval típustól függően. A feltöltési idő a medence kapacitásától és a vízellátástól függően változik.'
      icon: tabler:clock
      category: all
    - title: Mennyire merev a Drop Stitch medence?
      description: Nagyon merev. A Drop Stitch falai 4-5 PSI-vel keményen felfújódnak – hasonlóan egy felfújható eveződeszkához –, így a medence megtartja formáját, ha vízzel van feltöltve.
      icon: tabler:hexagon
      category: all
    - title: Gyermekek használhatják a medencét?
      description: Igen, mindenkor aktív felnőtt felügyelet mellett. A gyermekeket soha nem szabad felügyelet nélkül hagyni a medencében vagy annak közelében – kövesse a kézikönyvet és a helyi biztonsági szabályokat.
      icon: tabler:users
      category: all
    - title: Hogyan tároljam a medencét télen?
      description: Engedje le a vizet, engedje le a medencét, hagyja teljesen megszáradni, majd tekerje fel és tárolja a mellékelt tárolózsákban, fagymentes helyen.
      icon: tabler:package
      category: all
    - title: Mit tartalmaz a medence?
      description: Minden Felizbay medence tartalmaz egy elektromos légszivattyút, egy javítókészletet és egy tárolótáskát. A kerek modellek opcionálisan felszerelt burkolattal rendelkeznek.
      icon: tabler:box
      category: all
    - title: Milyen méretek kaphatók?
      description: 48 szabványos SKU négy kollekcióban – kerek medencék 10 m-ig, téglalap alakú medencék 6 × 5 m-ig és SPA kádak beépített ülésekkel. Üzleti partnerek számára egyedi méretek állnak rendelkezésre.
      icon: tabler:ruler-2
      category: all
    - title: Milyen felületeken állhat a medence?
      description: 'Bármilyen sík, vízszintes felület, éles tárgyaktól mentes – pázsit, terasz vagy fedélzet. Durva felületeken köszörült lemez használata javasolt. A feltöltött medence nehéz: csak olyan felületre szerelje fel, amely elbírja a teljes súlyt, és először vizsgálja meg a megemelt fedélzeteket, erkélyeket és tetőket.'
      icon: tabler:layout-grid
      category: all
    - title: Hogyan tartsam tisztán a vizet?
      description: Ha van, használjon szűrőszivattyút, távolítsa el a törmeléket, ellenőrizze a pH-t, és fedje le a medencét, ha nem használja. Az, hogy mennyi ideig tart a víz, a medence méretétől, a használattól és a szűréstől függ – rendszeresen tesztelje, ahelyett, hogy rögzített ütemezésre hagyatkozna.
      icon: tabler:droplet
      category: all
