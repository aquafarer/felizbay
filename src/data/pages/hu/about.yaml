hero:
  tagline: Rólunk
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay felfújható medence
  title: |
    Az úszás egyszerűvé tétele, <br />
     <span class="text-accent dark:text-white">Felizbay</span> módra
  subtitle: A Felizbay egy prémium Drop Stitch felfújható medence márka, amelyet az Aquafarer LLC (USA) tervezett és üzemeltet. Hiszünk abban, hogy minden család megérdemel egy igazi medencét a hátsó udvarban – föld feletti felállítás állandó medenceépítés nélkül. Medencéink percek alatt mereven felfújódnak, túlélik a családi szórakozás teljes nyarait, és a szezon végén elpakolnak. Az engedélyre, elkerítésre és telepítésre vonatkozó követelmények helytől függően változnak.
