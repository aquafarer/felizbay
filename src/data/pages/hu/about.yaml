production_section:
  tagline: Termelési Kiválóság
  title: Kiváló kivitelezés biztosítása
  description: A Felizbay gyártósort kiváló minőségű, tartós, nagynyomású felfújható úszómedencék gyártására fejlesztették ki.
  cards:
    - title: Tapasztalt technikus csapat
      items:
        - Cseppöltés és PVC anyagok szakmai ismerete
        - Precíz kivitelezés a vágásban, hegesztésben és összeszerelésben
        - Folyamatos képzés a legújabb gyártási technológiák elsajátítására
    - title: Fejlett gyártóberendezések
      items:
        - Precíziós vágóberendezés pontos szövetpanelekhez
        - Nagy pontosságú hőhegesztés a légmentes, tartós varratokért
        - Professzionális nyomás- és légtömörség-vizsgáló berendezések
    - title: Érett irányítási rendszer
      items:
        - Szabványosított gyártási folyamatok világos minőségi előírásokkal
        - Lean termelési filozófia, amely csökkenti a hulladékot és javítja a hatékonyságot
        - Hatékony ellátásilánc-menedzsment megbízható beszállítókkal
    - title: Szigorú minőség-ellenőrzés
      items:
        - 'Többlépcsős ellenőrzés: nyersanyag, folyamat közben, végső kimenő'
        - Nyomásvizsgálat a névleges 4-6 PSI üzemi tartomány tetején
        - Szállítás előtt szigorú légzárási és tartóssági vizsgálat
