hero:
  tagline: About us
  image:
    src: /images/pools/round-grey-pool-1.png
    alt: Felizbay inflatable swimming pool
  title: |
    Making swimming simple, <br />
    the <span class="text-accent dark:text-white">Felizbay</span> way
  subtitle: 'Felizbay designs and manufactures premium drop stitch inflatable swimming pools. We believe every family deserves a real pool in the backyard — without construction, permits, or a permanent installation. Our pools inflate rigid in minutes, survive full summers of family fun, and pack away small at season''s end.'

