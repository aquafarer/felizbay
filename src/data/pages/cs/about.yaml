hero:
  tagline: O nás
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Nafukovací bazén Felizbay
  title: |
    Aby bylo plavání jednoduché, <br />
    stylem <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay je prémiová značka nafukovacích bazénů Drop Stitch navržená a provozovaná společností Aquafarer LLC (USA). Věříme, že každá rodina si zaslouží skutečný bazén na dvorku – nadzemní instalace bez trvalé stavby bazénu. Naše bazény se nafouknou během několika minut, přežijí celá léta rodinné zábavy a na konci sezóny se sbalí. Požadavky na povolení, bariéry a instalaci se liší podle lokality.
