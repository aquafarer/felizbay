    - title: Obdélníkové bazény
      description: Obdélníkové bazény Drop Stitch rodinné velikosti, které maximalizují plavecký prostor pro váš prostor.
      icon: tabler:rectangle
    - title: Kulaté modré bazény
      description: Klasický zahradní bazén – zářivě modrá, pevné stěny Drop Stitch, rychlé nastavení.
      icon: tabler:circle
