production_section:
  tagline: Výrobní dokonalost
  title: Zajištění vynikajícího řemesla
  description: Výrobní linka Felizbay je určena pro vysoce kvalitní, odolné, vysokotlaké nafukovací bazény.
  cards:
    - title: Tým zkušených techniků
      items:
        - Profesionální znalost drop stitch a PVC materiálů
        - Precizní řemeslné zpracování při řezání, svařování a montáži
        - Průběžné školení pro zvládnutí nejnovějších výrobních technologií
    - title: Pokročilé výrobní zařízení
      items:
        - Přesné řezací zařízení pro přesné látkové panely
        - Vysoce přesné tepelné svařování pro vzduchotěsné a odolné švy
        - Profesionální zařízení na testování tlaku a vzduchotěsnosti
    - title: Vyspělý systém řízení
      items:
        - Standardizované výrobní procesy s jasnými standardy kvality
        - Filozofie štíhlé výroby snižující plýtvání a zvyšování efektivity
        - Efektivní řízení dodavatelského řetězce se spolehlivými dodavateli
    - title: Přísná kontrola kvality
      items:
        - 'Vícestupňová kontrola: surovina, proces, finální výstup'
        - Testování tlaku na vrcholu jmenovitého pracovního rozsahu 4-6 PSI
        - Přísné testy vzduchotěsnosti a trvanlivosti před odesláním
