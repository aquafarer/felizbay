hero_text:
  tagline: Contatto
  title: METTITI IN CONTATTO
contact_form:
  id: form
  title: Mandaci un messaggio
  subtitle: Per preventivi, domande tecniche o richieste di partnership, scriveteci. Rispondiamo entro un giorno lavorativo.
  email_to: info@felizbay.com
  submit_button: Invia richiesta → Richiedi un preventivo
  success_message: Grazie! Il tuo messaggio è arrivato nella nostra casella di posta. Risponderemo entro un giorno lavorativo.
  error_message: Qualcosa è andato storto durante l'invio del tuo messaggio. Riprova o inviaci direttamente un'e-mail.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: risolvere quanto segue"
  fields:
    - name: firstName
      label: Nome di battesimo
      row: 1
    - name: lastName
      label: Cognome
      row: 1
    - name: inquiryType
      label: Tipo di richiesta
      row: 2
      type: select
      options:
        - value: ""
          label: Qual è l'oggetto della tua richiesta?
        - value: retail
          label: Ordine online di una singola piscina (dettaglio)
        - value: wholesale
          label: Ordine all'ingrosso / di grandi quantità (B2B)
        - value: oem
          label: Personalizzazione OEM/ODM
        - value: support
          label: Assistenza post-vendita e garanzia
    - name: companyName
      label: Nome dell'azienda
      row: 3
    - name: address
      label: Indirizzo
      row: 4
    - name: zip
      label: Zip / Codice postale
      row: 5
    - name: country
      label: Paese
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Volume degli ordini stimato
      row: 7
      type: select
      options:
        - value: ""
          label: Seleziona il volume stimato...
        - value: 1-unit
          label: 1 unità — una singola piscina (ordine al dettaglio online)
        - value: sample
          label: Solo campioni/prototipi
        - value: 5-10
          label: 5-10 unità (MOQ standard)
        - value: 100-500
          label: 100-500 unità
        - value: 500-plus
          label: Oltre 500 unità (prezzi a volume)
    - name: customization
      label: Personalizzazione necessaria?
      row: 8
      type: select
      options:
        - value: ""
          label: Seleziona il tipo di personalizzazione...
        - value: none
          label: Prodotto standard (nessuna personalizzazione)
        - value: logo
          label: Solo logo/marchio personalizzato
        - value: full
          label: OEM completo (dimensioni, colore, grafica, confezione)
        - value: consultation
          label: "Non sono sicuro: ho bisogno di una consulenza"
    - name: productInterest
      label: Gruppo di interesse
      row: 9
      type: select
      options:
        - value: ""
          label: Seleziona il tipo di piscina...
        - value: all
          label: Tutte le piscine / Catalogo completo
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Vasca idromassaggio portatile — Rotonda
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Vasca / Swim Spa — Quadrata
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Soggetto
      row: 10
    - name: message
      label: Messaggio
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Altri modi per raggiungerci
  columns: 3
  items:
    - title: Richieste di vendita
      description: Preventivi in ​​pool, prezzi all'ingrosso e ordini all'ingrosso.
      icon: tabler:shopping-bag
    - title: Supporto tecnico
      description: Aiuto per l'installazione, riparazioni, pezzi di ricambio e domande sulla cura.
      icon: tabler:tool
    - title: OEM/ODM
      description: Dimensioni, colori, copertine, marchio e packaging personalizzati.
      icon: tabler:palette
    - title: E-mail
      description: info@felizbay.com
      icon: tabler:mail
    - title: Sito web
      description: felizbay.com
      icon: tabler:world
    - title: Tempo di risposta
      description: Rispondiamo entro un giorno lavorativo.
      icon: tabler:clock
map:
  title: Mettiti in contatto
  subtitle: Contatta Felizbay
  address: felizbay.com
  zoom: 15
