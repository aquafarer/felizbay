faqs:
  title: Domande frequenti sulla piscina gonfiabile
  subtitle: Domande comuni sulle piscine gonfiabili Felizbay.
  columns: 2
  items:
    - title: Quanto tempo richiede la configurazione?
      description: Il gonfiaggio richiede circa 10 minuti con la pompa ad aria elettrica inclusa; la configurazione completa, compreso il posizionamento e il riempimento, richiede in genere 15-30 minuti.
      icon: tabler:clock
      category: all
    - title: Quanto è rigida una piscina Drop Stitch?
      description: Molto rigido. Le pareti Drop Stitch si gonfiano con forza a 4-5 PSI, in modo simile a un paddle board gonfiabile, quindi la piscina mantiene la sua forma quando viene riempita d'acqua.
      icon: tabler:hexagon
      category: all
    - title: I bambini possono utilizzare la piscina?
      description: 'Sì, sempre con la supervisione attiva di un adulto. I bambini non devono mai essere lasciati incustoditi dentro o vicino alla piscina: seguire il manuale e le norme di sicurezza locali.'
      icon: tabler:users
      category: all
    - title: Come posso riporre la piscina in inverno?
      description: Scaricare l'acqua, sgonfiare la piscina, lasciarla asciugare completamente, quindi arrotolarla e riporla nella custodia inclusa in un luogo al riparo dal gelo.
      icon: tabler:package
      category: all
    - title: Cosa è incluso nella piscina?
      description: Ogni piscina Felizbay include una pompa ad aria elettrica, un kit di riparazione e una custodia. I modelli rotondi hanno una copertura montata opzionale.
      icon: tabler:box
      category: all
    - title: Quali taglie sono disponibili?
      description: '48 SKU standard in quattro collezioni: piscine rotonde fino a 10 m di diametro, piscine rettangolari fino a 6 × 5 m e vasche SPA con sedili integrati. Sono disponibili dimensioni personalizzate per i partner commerciali.'
      icon: tabler:ruler-2
      category: all
    - title: Su quali superfici può poggiare la piscina?
      description: 'Qualsiasi superficie piana e livellata priva di oggetti appuntiti: prato, patio o terrazza. Si consiglia un telo di fondo su superfici ruvide. Verificare che la superficie possa sopportare il peso di una piscina piena.'
      icon: tabler:layout-grid
      category: all
    - title: Come mantengo l'acqua pulita?
      description: "Utilizzare una pompa filtro, se installata, rimuovere i detriti, controllare il pH e coprire la piscina quando non viene utilizzata. La durata dell'acqua dipende dalle dimensioni della piscina, dall'utilizzo e dal filtraggio: testare regolarmente anziché fare affidamento su un programma fisso."
      icon: tabler:droplet
      category: all
