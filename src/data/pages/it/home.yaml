features:
  id: features
  tagline: Tecnologia Drop Stitch
  title: Perché una piscina Felizbay<br />È diverso
  subtitle: La struttura Drop Stitch ad alta pressione rende le nostre piscine rigide, durevoli e facili da riporre.
  columns: 2
  items:
    - title: Pareti rigide Drop Stitch
      description: 'Migliaia di filettature interne bloccano insieme gli strati della parete, quindi la piscina si gonfia rigidamente alla velocità nominale di 4-5 PSI e mantiene la sua forma una volta riempita.'
      icon: tabler:hexagon
    - title: Configurazione rapida e senza strumenti
      description: Gonfia in pochi minuti con la pompa elettrica inclusa, quindi riempila con un tubo da giardino. Nessuno strumento, nessuna costruzione, nessuna installazione professionale.
      icon: tabler:rocket
    - title: Si ripiega in piccolo
      description: 'Svuota, sgonfia, arrotola e riponi la piscina nella sua borsa durante l''inverno: una piscina a grandezza naturale che si ripiega in dimensioni ridotte per essere riposta al coperto.'
      icon: tabler:package
    - title: Durevole e resistente ai raggi UV
      description: 'Tessuto Drop Stitch in PVC a doppio strato, progettato per resistere alle forature e all''esposizione ai raggi UV durante un''intera stagione di utilizzo in famiglia.'
      icon: tabler:shield
    - title: Pacchetto completo
      description: Ogni piscina viene fornita con una pompa ad aria elettrica, un kit di riparazione e una custodia. Disponibili coperture su misura per i modelli rotondi.
      icon: tabler:box
    - title: Design attento alla sicurezza
      description: 'Progettazione di piscine residenziali con riferimento a EN 16582-1 e ASTM F2666: le informazioni sulla sicurezza specifiche del modello sono fornite nella documentazione del prodotto. È sempre necessaria la costante supervisione di un adulto.'
      icon: tabler:shield-check
