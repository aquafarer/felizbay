features:
  id: features
  tagline: Tecnologia Drop Stitch
  title: Perché una piscina Felizbay<br />È diverso
  subtitle: La struttura Drop Stitch ad alta pressione rende le nostre piscine rigide, durevoli e facili da riporre.
  columns: 2
  items:
    - title: Pareti rigide Drop Stitch
      description: Migliaia di filettature interne bloccano insieme gli strati della parete, quindi la piscina si gonfia con forza come la roccia a 4-5 PSI e mantiene la sua forma una volta riempita.
      icon: tabler:hexagon
    - title: Configurazione rapida e senza strumenti
      description: Gonfia in pochi minuti con la pompa elettrica inclusa, quindi riempila con un tubo da giardino. Nessuno strumento, nessuna costruzione, nessuna installazione professionale.
      icon: tabler:rocket
    - title: Si ripiega in piccolo
      description: Scolare, sgonfiare, arrotolare e riporre la piscina in una borsa durante l'inverno. Una piscina a grandezza naturale che sta in un armadio.
      icon: tabler:package
    - title: Durevole e resistente ai raggi UV
      description: Il tessuto Drop Stitch in PVC a doppio strato resiste alle forature, all'esposizione ai raggi UV e a un'intera stagione di uso familiare.
      icon: tabler:shield
    - title: Pacchetto completo
      description: Ogni piscina viene fornita con una pompa ad aria elettrica, un kit di riparazione e una custodia. Disponibili coperture su misura per i modelli rotondi.
      icon: tabler:box
    - title: Design attento alla sicurezza
      description: Progettazione di piscine residenziali in riferimento alla norma EN 16582-1 e ASTM F2666, con valvole limitatrici di pressione e pareti rigide stabili. È sempre necessaria la costante supervisione di un adulto.
      icon: tabler:shield-check
