content_compliance:
  tagline: Cura e sicurezza
  title: Facile da possedere,<br />Facile da amare
  subtitle: Dalla consegna alla prima nuotata fino al rimessaggio di fine stagione, possedere una piscina Felizbay rimane semplice.
  items:
    - title: Configurazione in pochi minuti
      description: "Disimballare, gonfiare con la pompa inclusa e riempire: l'installazione completa richiede in genere 15-30 minuti su un terreno solido e pianeggiante."
      icon: tabler:rocket
    - title: Cura semplice dell'acqua
      description: Le porte standard della pompa filtro da 32/38 mm, i controlli regolari del pH e un coperchio montato sui modelli rotondi mantengono l'acqua pulita.
      icon: tabler:droplet
    - title: Pulisci, drena e conserva
      description: Scolare, asciugare, arrotolare e riporre la piscina nella sua custodia per l'inverno. Nessuna installazione permanente da mantenere.
      icon: tabler:package
    - title: La sicurezza prima di tutto
      description: I bambini devono essere sempre supervisionati attivamente da un adulto. Seguire il manuale, le regole locali e le indicazioni per un utilizzo sicuro.
      icon: tabler:shield-check
