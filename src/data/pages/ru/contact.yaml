hero_text:
  tagline: Контакт
  title: СВЯЗАТЬСЯ
contact_form:
  id: form
  title: Отправьте нам сообщение
  subtitle: Для получения предложений, технических вопросов или запросов о партнерстве напишите нам. Мы отвечаем в течение одного рабочего дня.
  email_to: info@felizbay.com
  submit_button: Отправить запрос → Получить предложение
  success_message: Спасибо! Ваше сообщение попало в наш почтовый ящик. Мы ответим в течение одного рабочего дня.
  error_message: Что-то пошло не так при отправке вашего сообщения. Пожалуйста, попробуйте еще раз или напишите нам напрямую.
  default_country_code: "+1"
  captcha:
    label: "Антиспам: пожалуйста, решите следующее"
  fields:
    - name: firstName
      label: Имя
      row: 1
    - name: lastName
      label: Фамилия
      row: 1
    - name: inquiryType
      label: Тип обращения
      row: 2
      type: select
      options:
        - value: ""
          label: Какова тема вашего обращения?
        - value: retail
          label: Заказ одного бассейна онлайн (розница)
        - value: wholesale
          label: Оптовый / крупный заказ (B2B)
        - value: oem
          label: Кастомизация OEM/ODM
        - value: support
          label: Послепродажная поддержка и гарантия
    - name: companyName
      label: Название компании
      row: 3
    - name: address
      label: Адрес
      row: 4
    - name: zip
      label: Почтовый индекс
      row: 5
    - name: country
      label: Страна
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: Электронная почта
      row: 6
      type: email
    - name: tel
      label: ТЕЛ.
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Предполагаемый объем заказа
      row: 7
      type: select
      options:
        - value: ""
          label: Выберите предполагаемый объем...
        - value: 1-unit
          label: 1 шт. — один бассейн (розничный онлайн-заказ)
        - value: sample
          label: Только образцы/прототипы
        - value: 5-10
          label: 5–10 единиц (стандартный минимальный заказ)
        - value: 100-500
          label: 100–500 единиц
        - value: 500-plus
          label: 500+ единиц (оптовые цены)
    - name: customization
      label: Нужна кастомизация?
      row: 8
      type: select
      options:
        - value: ""
          label: Выберите тип настройки...
        - value: none
          label: Стандартный продукт (без настройки)
        - value: logo
          label: Только индивидуальный логотип/брендинг
        - value: full
          label: Полный OEM (размер, цвет, графика, упаковка)
        - value: consultation
          label: Не уверен — нужна консультация
    - name: productInterest
      label: Пул интересов
      row: 9
      type: select
      options:
        - value: ""
          label: Выберите тип бассейна...
        - value: all
          label: Все бассейны / Полный каталог
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Портативный джакузи — Круглый
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Джакузи / Swim Spa — Квадратное
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Предмет
      row: 10
    - name: message
      label: Сообщение
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Другие способы связаться с нами
  columns: 3
  items:
    - title: Запросы на продажу
      description: Котировки пула, оптовые цены и оптовые заказы.
      icon: tabler:shopping-bag
    - title: Техническая поддержка
      description: Помощь в настройке, ремонте, запасных частях и вопросах по уходу.
      icon: tabler:tool
    - title: ОЭМ/ОДМ
      description: Нестандартные размеры, цвета, обложки, брендинг и упаковка.
      icon: tabler:palette
    - title: Электронная почта
      description: info@felizbay.com
      icon: tabler:mail
    - title: Веб-сайт
      description: felizbay.com
      icon: tabler:world
    - title: Время ответа
      description: Мы отвечаем в течение одного рабочего дня.
      icon: tabler:clock
map:
  title: Свяжитесь с нами
  subtitle: Связаться с Felizbay
  address: felizbay.com
  zoom: 15
