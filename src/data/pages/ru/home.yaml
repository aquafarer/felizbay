content_compliance:
  tagline: Уход и безопасность
  title: Легко владеть,<br />Легко любить
  subtitle: От доставки до первого купания и хранения в конце сезона — владение бассейном Felizbay остается простым.
  items:
    - title: Настройка за несколько минут
      description: 'Распакуйте и накачайте насосом, входящим в комплект поставки, в течение 5–15 минут, затем заполните водой из садового шланга — время наполнения зависит от размера бассейна и количества воды.'
      icon: tabler:rocket
    - title: Простой уход за водой
      description: Стандартные порты для фильтра-насоса диаметром 32/38 мм, регулярные проверки pH и встроенная крышка на круглых моделях обеспечивают чистоту воды.
      icon: tabler:droplet
    - title: Очистка, слив и хранение
      description: Слейте воду, высушите, сверните и упакуйте бассейн в сумку для хранения на зиму. Никакой постоянной установки, требующей обслуживания.
      icon: tabler:package
    - title: Безопасность превыше всего
      description: Дети должны постоянно находиться под активным присмотром взрослых. Следуйте руководству, местным правилам и рекомендациям по безопасному использованию.
      icon: tabler:shield-check
steps:
  title: Из коробки на задний двор
  items:
    - title: 'Шаг 1: <span class="font-medium">Выберите свой бассейн</span>'
      description: Сравните формы и размеры, соответствующие вашему пространству, дому и тому, как вы планируете использовать воду.
      icon: tabler:pool
    - title: 'Шаг 2: <span class="font-medium">Настройте это</span>'
      description: Поместите его на твердую, ровную землю, накачайте его с помощью прилагаемого электрического насоса и заполните водой из садового шланга.
      icon: tabler:rocket
    - title: 'Шаг 3: <span class="font-medium">Плавай все лето</span>'
      description: 'Сохраняйте свежесть воды с помощью простого ухода: снимайте пену, накрывайте ее и проверяйте pH, как в любом небольшом бассейне.'
      icon: tabler:ripple
    - title: 'Шаг 4: <span class="font-medium">Храните это подальше</span>'
      description: Когда сезон закончится, слейте воду, высушите, закатайте и храните бассейн в сумке до следующего лета.
      icon: tabler:package
