production_section:
  tagline: Совершенство производства
  title: Обеспечение изысканного мастерства
  description: Производственная линия Felizbay предназначена для производства высококачественных, долговечных надувных бассейнов высокого давления.
  cards:
    - title: Опытная команда технических специалистов
      items:
        - Профессиональные знания стежков и материалов ПВХ.
        - Точное мастерство резки, сварки и сборки.
        - Постоянное обучение для освоения новейших технологий производства.
    - title: Современное производственное оборудование
      items:
        - Прецизионное режущее оборудование для точных тканевых панелей
        - Высокоточная термосварка для герметичных и прочных швов.
        - Профессиональное оборудование для испытаний на давление и герметичность.
    - title: Зрелая система управления
      items:
        - Стандартизированные производственные процессы с четкими стандартами качества.
        - Философия бережливого производства, сокращающая отходы и повышающая эффективность
        - Эффективное управление цепочками поставок с надежными поставщиками
    - title: Строгий контроль качества
      items:
        - 'Многоступенчатый контроль: сырье, в процессе производства, окончательный выход.'
        - Испытание давлением в верхней части номинального рабочего диапазона 4–6 фунтов на квадратный дюйм.
        - Строгие испытания на герметичность и долговечность перед отправкой.
