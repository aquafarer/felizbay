features3_what_we_build:
  title: Что мы строим
  subtitle: Специализированная линейка продуктов, которую мы знаем изнутри — надувные бассейны высокого давления Drop Stitch.
  columns: 3
  isBeforeContent: true
  items:
    - title: Прямоугольные бассейны
      description: Прямоугольные бассейны Drop Stitch семейного размера, которые максимально увеличивают площадь плавания в вашем пространстве.
      icon: tabler:rectangle
    - title: Круглые голубые бассейны
      description: Классический бассейн на заднем дворе — ярко-синий, жесткие стены, прошитые методом Drop Stitch, быстрая установка.
      icon: tabler:circle
    - title: Круглые серые бассейны
      description: Наша линия премиум-класса с современной серой отделкой и дополнительной встроенной крышкой.
      icon: tabler:circle-dot
    - title: СПА-бассейны с гидромассажем
      description: 'Модели изолированных гидромассажных ванн со встроенными сиденьями и изолированным дном 5 mm — для использования с внешними нагревателями (нагреватель не входит в комплект).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Полные пакеты
      description: Каждый комплект для бассейна поставляется с электрическим воздушным насосом, ремонтным комплектом и сумкой для хранения.
      icon: tabler:package
    - title: Нестандартные размеры
      description: OEM-размеры, цвета и чехлы для брендов, дистрибьюторов и проектов в сфере гостеприимства.
      icon: tabler:adjustments
    - title: ОЭМ/ОДМ
      description: Производство под частной торговой маркой с печатью логотипа и упаковкой, готовой к розничной торговле.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Прямоугольный надувной бассейн Felizbay Drop Stitch
steps2_values:
  title: Наши ценности
  subtitle: Три принципа, которые формируют каждый бассейн, который мы строим.
  items:
