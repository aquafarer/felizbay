      description: К каждому шву, стенке и клапану относятся так, как будто в нем будут купаться наши собственные семьи.
      icon: tabler:heart
    - title: Инженер, прежде чем мы продадим
      description: Конструкция Drop Stitch высокого давления, проверенная при верхнем номинальном давлении, перед отправкой в ​​бассейн.
      icon: tabler:settings
    - title: Поддержка, которая переживет сезон
      description: Вопросы, запасные части или гарантия — пишите нам в любое время по адресу info@felizbay.com.
