hero:
  tagline: О нас
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Надувной бассейн Felizbay
  title: |
    Делаем плавание простым, <br />
    в стиле <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay — премиальный бренд надувных бассейнов Drop Stitch, разработанный и управляемый компанией Aquafarer LLC (США). Мы считаем, что каждая семья заслуживает настоящего бассейна на заднем дворе — надземная установка без постоянного строительства бассейна. Наши бассейны надуваются за считанные минуты, выдерживают все летние семейные развлечения и складываются понемногу в конце сезона. Требования к разрешениям, ограждениям и установке различаются в зависимости от региона.
