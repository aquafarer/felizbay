  items:
    - title: Тік бұрышты бассейндер
      description: Кеңістігіңіз үшін жүзу аймағын барынша арттыратын отбасылық өлшемді тікбұрышты Drop Stitch бассейндері.
      icon: tabler:rectangle
    - title: Дөңгелек көк бассейндер
      description: Классикалық аула бассейні - жарқын көк, қатты Drop Stitch қабырғалары, жылдам орнату.
      icon: tabler:circle
    - title: Дөңгелек сұр бассейндер
      description: Заманауи сұр түсті және қосымша жабдықталған қақпағы бар біздің премиум желісі.
      icon: tabler:circle-dot
    - title: Ыстық ванна СПА бассейндері
      description: 'Кіріктірілген отырғыштары және 5 mm оқшауланған түбі бар оқшауланған ванна үлгілері — сыртқы жылытқыштармен (жылытқыш қосылмаған) пайдалануға арналған.'
      icon: tabler:ripple
