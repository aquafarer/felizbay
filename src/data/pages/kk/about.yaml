hero:
  tagline: Біз туралы
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay үрлемелі бассейні
  title: |
    Жүзуді қарапайым ету, <br />
     <span class="text-accent dark:text-white">Felizbay</span> стилінде
  subtitle: Felizbay - Aquafarer LLC (АҚШ) әзірлеген және басқаратын жоғары сапалы Drop Stitch үрлемелі бассейн бренді. Әрбір отбасы тұрақты бассейн құрылысысыз, жер үстіне орнатылатын аулада нағыз бассейнге лайық деп санаймыз. Біздің бассейндер бірнеше минут ішінде қатты толтырылады, отбасылық көңіл көтерудің толық жазынан аман қалады және маусымның соңында шағын жиналады. Рұқсаттар, тосқауылдар мен орнату талаптары аймаққа қарай өзгереді.
