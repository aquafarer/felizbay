production_section:
  tagline: Өндірістің үздігі
  title: Керемет шеберлікті қамтамасыз ету
  description: Felizbay өндірістік желісі жоғары сапалы, берік, жоғары қысымды үрлемелі бассейндерге арналған.
  cards:
    - title: Тәжірибелі техниктер командасы
      items:
        - Тамшылатып тігіс және ПВХ материалдары бойынша кәсіби білім
        - Кесу, дәнекерлеу және құрастырудағы дәл шеберлік
        - Өндірістің соңғы технологияларын меңгеруге үздіксіз оқыту
    - title: Жетілдірілген өндіріс жабдығы
      items:
        - Дәл мата панельдері үшін дәл кесетін жабдық
        - Ауа өткізбейтін, берік тігістер үшін жоғары дәлдіктегі жылумен дәнекерлеу
        - Қысым мен герметикалық сынау үшін кәсіби жабдық
    - title: Жетілген басқару жүйесі
      items:
        - Сапа стандарттары айқын стандартталған өндірістік процестер
        - Қалдықтарды азайтатын және тиімділікті арттыратын үнемді өндіріс философиясы
        - Сенімді жеткізушілермен жеткізу тізбегін тиімді басқару
    - title: Қатаң сапаны бақылау
      items:
        - 'Көп сатылы тексеру: шикізат, технологиялық, соңғы шығыс'
        - 4-6 PSI номиналды жұмыс диапазонының жоғарғы жағында қысымды сынау
        - Жеткізу алдында қатаң герметикалық және беріктік сынағы
