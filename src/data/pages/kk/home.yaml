use_cases:
  tagline: 'Пайдалану жағдайлары'
  title: 'Ауладағы шынайы жүзуге арналған'
  subtitle: 'Иелерінің Felizbay бассейнін пайдаланатын төрт нақты жолы – отбасылық демалыс күндерінен қалпына келтіру ванналарына дейін.'
  scenario_label: 'Сценарий'
  solution_label: 'Шешім'
  cards:
    - title: 'Ауладағы отбасылық жүзу'
      description: 'Жазғы демалысқа, туған күндерге және мектептен кейінгі күнделікті ойынға арналған толық өлшемді бассейн.'
      alt: 'Жазғы аула жиынында үлкен дөңгелек Felizbay Drop-Stitch бассейнінде демалып отырған отбасы.'
      image: /images/pool-ideas/large-pools-for-family-gatherings.webp
      href: /pool-ideas/backyard-pools-for-families/
      scenario: 'Отбасылық кездесулер мен бассейн жиындарына бүкіл отбасы келеді, ал кішкентай бассейн жетпейді – тұрақты бассейн мүмкін емес, рұқсат етілмейді немесе тым қымбат.'
      solution: 'Ø 10 м-ге дейін дөңгелек және 6 × 5 м тіктөртбұрыш үлкен Drop-Stitch бассейндері, қосымша берілген 1000W электр сорғысымен минут ішінде желдіретін 1,5 м-ге дейінгі қатты қабырғаларымен.'
      pills:
        - 'Дөңгелек бассейн'
        - 'Тіктөртбұрыш бассейн'
        - '1000W электр сорғы'
    - title: 'Кіші аулалар мен қатар үйлер'
      description: 'Қатар үйдің террасасына, бүйір аулаға немесе шағын аулаға сыйатын нағыз бассейн.'
      alt: 'Заманауи қатар үйдің кішкентай террасасындағы дөңгелек желділетін Felizbay бассейні.'
      image: /images/pool-ideas/townhome-and-compact-yard-pools.webp
      href: /pool-ideas/townhome-and-compact-yard-pools/
      scenario: 'Кеңістік шамамен 2 × 2 м-ден басталады, қазу немесе салу мүмкін емес – бассейн маусым соңында орынды босатуы керек.'
      solution: 'Ø 2 м дөңгелек және 2 × 2 м тіктөртбұрыштан басталатын ықшам өлшемдер, әлі де нағыз бассейн сияқты көрінетін 4-6 PSI қатты қабырғаларымен және қысқа сақтау сөмкесіне бүктелетін.'
      pills:
        - 'Дөңгелек бассейн'
        - 'Тіктөртбұрыш бассейн'
        - 'Жөндеу жиынтығы'
    - title: 'Су фитнесі және судағы жаттығулар'
      description: 'Кең әрі тұрақты платформада су аэробикасы, кедергіге қарсы жүру және отбасылық ойындар.'
      alt: 'Отбасы кең дөңгелек Felizbay бассейнінде су жаттығулары мен ойындар жасап жүр.'
