      href: /pool-ideas/pools-for-water-fitness-and-recreation/
      scenario: 'Төмен әсерлі қозғалыс пайдалануға жарамды аумақ пен тік қабырғаларды қажет етеді – жұмсақ сақина бассейндері ішкі кеңістікті еңкейтілген қабырғаларға жоғалтады және белсенді ойын кезінде су шетінен асады.'
      solution: 'Тік 90 градустық Drop-Stitch қабырғалары және 4-6 PSI деңгейінде жазық, тұрақты түбі; Ø 3-5 м дөңгелек бассейндер әр шаршы метрге ең көп кедергісіз қозғалыс аумағын береді.'
      pills:
        - 'Дөңгелек бассейн'
        - 'Құм сүзгі сорғысы'
        - '4 сатылы баспалдақ'
    - title: 'Ыстық ванна мен суық шомылдыру'
      description: 'Террасалар мен гараж фитнес-залдарына арналған ықшам жуыну және суық шомылу станциясы.'
      alt: 'Гараж фитнес-залында дөңгелек сұр Felizbay ваннасында суық шомылу жаттығуын жасап жатқан ер адам.'
      image: /images/pool-ideas/cold-plunge-and-recovery-pools.webp
      href: /pool-ideas/cold-plunge-and-recovery-pools/
      scenario: 'Спортшылар мен фитнес әуесқойлары қатты қабырғаларды, жылынуды баяулататын оқшаулауды және шамамен 1,5 × 1,5 м-ден бастап көлеңкелі, тегіс орынды қажет етеді.'
      solution: 'Ø 1,8 м-ден бастап орнықты орындықтары және 5 мм жылуөткізбейтін түбі бар оқшауланған SPA ванналары; жылытқыштар мен суыту жабдықтары сыртқы және жеке сатылады.'
      pills:
        - 'Дөңгелек SPA ванна'
        - 'Төртбұрыш SPA ванна'
        - 'Оқшауланған түбі'

