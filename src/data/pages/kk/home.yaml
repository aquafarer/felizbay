features:
  id: features
  tagline: Drop Stitch технологиясы
  title: Неліктен Felizbay бассейні<br />Басқа
  subtitle: Жоғары қысымды Drop Stitch конструкциясы бассейндерімізді қатты, берік және сақтауға оңай етеді.
  columns: 2
  items:
    - title: Қатты Drop Stitch қабырғалары
      description: Мыңдаған ішкі жіптер қабырға қабаттарын бір-біріне бекітеді, сондықтан бассейн 4-5 PSI деңгейінде тасты қатты үрлейді және толтырылған кезде пішінін сақтайды.
      icon: tabler:hexagon
    - title: Жылдам, құралсыз орнату
      description: Жинақтағы электр сорғымен бірнеше минут ішінде үрлеңіз, содан кейін бақша шлангімен толтырыңыз. Құрал жоқ, құрылыс жоқ, кәсіби орнату жоқ.
      icon: tabler:rocket
    - title: Пакеттер кішкентай
      description: Қыста бассейнді ағызып, дефляциялаңыз, орап, сөмкеде сақтаңыз. Шкафқа сәйкес келетін толық өлшемді бассейн.
      icon: tabler:package
    - title: Төзімді және ультракүлгін сәулелеріне төзімді
      description: Екі қабатты PVC Drop Stitch матасы тесуге, ультракүлгін сәулелеріне және отбасылық пайдаланудың толық маусымына қарсы тұрады.
      icon: tabler:shield
    - title: Толық пакет
      description: Әрбір бассейнде электрлік ауа сорғысы, жөндеу жинағы және сақтауға арналған сөмке бар. Дөңгелек үлгілер үшін орнатылған қақпақтар бар.
      icon: tabler:box
    - title: Қауіпсіздікке негізделген дизайн
      description: EN 16582-1 және ASTM F2666 стандарттарына сәйкес келетін, қысымды түсіретін клапандары және тұрақты қатты қабырғалары бар тұрғын үй бассейнінің дизайны. Әрқашан ересектердің бақылауы қажет.
      icon: tabler:shield-check
content_customer_types:
  tagline: Бассейн идеялары
  title: Дұрыс бассейн<br />Сіздің кеңістігіңіз
  subtitle: Нақты орнатулар, нақты өлшемдер және дұрыс пулды таңдауға арналған шынайы нұсқаулар.
  items:
    - title: Отбасыларға арналған ауладағы бассейндер
      description: Кеңістікті жоспарлау, нақты қолдануға болатын өлшемдер және артқы аулада отбасылық жазда оңай техникалық қызмет көрсету.
      icon: tabler:home
      cta: Идеяларды алыңыз
      cta_href: /pool-ideas/backyard-pools-for-families
    - title: Кішкентай аулаларға арналған бассейндер
      description: Жүзуден бас тартпай, тар ашық кеңістіктерге сай келетін ықшам дөңгелек және шаршы модельдер.
      icon: tabler:layout-grid
      cta: Идеяларды алыңыз
      cta_href: /pool-ideas/pools-for-small-backyards
    - title: Жиналыстарға арналған үлкен бассейндер
      description: Жазғы күндері бүкіл экипаж үшін жүзу кеңістігі бар үлкен төртбұрышты бассейндер.
      icon: tabler:users
      cta: Идеяларды алыңыз
      cta_href: /pool-ideas/large-pools-for-family-gatherings
    - title: Сыртта сулану және релаксация
      description: Кіріктірілген отырғыштары мен оқшауланған түбі бар СПА ванналары үйде күнделікті демалуға арналған.
      icon: tabler:ripple
      cta: Идеяларды алыңыз
      cta_href: /pool-ideas/outdoor-soaking-pools
    - title: Демалыстарды жалға алуға арналған бассейндер
      description: Жылдам орнатылатын және маусымаралық уақытта сақтайтын маусымдық қонақтарға арналған ыңғайлылық.
      icon: tabler:beach
      cta: Идеяларды алыңыз
      cta_href: /pool-ideas/pools-for-vacation-rentals
    - title: Глампинг және қонақжайлылық
      description: Ерекше ашық ауада тұру - глампинг алаңдары, бутик объектілері және іс-шаралар өткізу орындары.
      icon: tabler:tent
      cta: Идеяларды алыңыз
      cta_href: /pool-ideas/pools-for-glamping-and-hospitality
content_categories:
  tagline: Дүкен бассейндері
  title: Біздің бассейндерімізді зерттеңіз
  subtitle: Аулаға немесе сыртқы кеңістікке сәйкес бассейнді табу үшін пішіндерді, өлшемдерді және мүмкіндіктерді салыстырыңыз.
content_workshop:
  isReversed: true
  tagline: Бизнеске арналған
  title: Бизнеске арналған бассейндер,<br />Сондай-ақ
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Іскерлік серіктестерге арналған Felizbay</h3>
  items:
    - title: Демалыстарды жалға беру және қонақжайлылық
      description: Демалыстарды жалға алу, глампинг алаңдары және бутик қасиеттеріне арналған маусымдық ыңғайлылықтар — орналастыру жылдам, техникалық қызмет көрсету оңай, сақтау оңай.
    - title: Бөлшек сауда және бренд серіктестері
      description: Көтерме бағдарламалар және бақша орталықтарына, бассейн дүкендеріне және интернет-дүкендерге арналған бөлшек саудаға дайын Drop Stitch бассейндері.
    - title: Арнаулы және жеке белгі
      description: Таңдамалы өлшемдер, түстер, мұқабалар, логотипті басып шығару және брендтерге арналған бөлшек орам – біздің өндірістік серіктестеріміз жасаған.
content_compliance:
  tagline: Күтім және қауіпсіздік
  title: Меншікке оңай,<br />Сүйу оңай
  subtitle: Жеткізуден бастап бірінші жүзуге дейін маусымның соңына дейін Felizbay бассейніне ие болу оңай.
  items:
    - title: Минуттарда орнату
      description: Қораптан шығарыңыз, жинақтағы сорғымен үрлеңіз және толтырыңыз — толық орнату әдетте қатты, тегіс жерде 15-30 минутты алады.
      icon: tabler:rocket
    - title: Қарапайым су күтімі
      description: Стандартты 32/38 мм сүзгі сорғы порттары, тұрақты рН тексерулері және дөңгелек үлгілерде орнатылған қақпақ суды таза ұстайды.
      icon: tabler:droplet
    - title: Тазалаңыз, ағызыңыз және сақтаңыз
      description: Суды төгіп тастаңыз, құрғатыңыз, орап алыңыз және бассейнді қыста сақтауға арналған сөмкеге салыңыз. Тұрақты орнату қажет емес.
      icon: tabler:package
    - title: Ең алдымен қауіпсіздік
      description: Балалар әрқашан ересектердің белсенді бақылауында болуы керек. Нұсқаулықты, жергілікті ережелерді және қауіпсіз пайдалану нұсқауларын орындаңыз.
      icon: tabler:shield-check
steps:
  title: Қораптан аулаға дейін
  items:
    - title: '1-қадам: <span class="font-medium">Өз бассейніңізді таңдаңыз</span>'
      description: Кеңістігіңізге, үй шаруашылығыңызға және суды қалай пайдалануды жоспарлап отырғаныңызға сәйкес келетін пішіндер мен өлшемдерді салыстырыңыз.
      icon: tabler:pool
    - title: '2-қадам: <span class="font-medium">Оны орнату</span>'
      description: Қатты, тегіс жерге қойыңыз, жинақтағы электр сорғымен үрлеңіз және бақша шлангімен толтырыңыз.
      icon: tabler:rocket
    - title: '3-қадам: <span class="font-medium">Жаз бойы жүзу</span>'
      description: Қарапайым күтіммен суды таза ұстаңыз - майсыздандырыңыз, жабыңыз және кез келген шағын бассейн сияқты рН деңгейін тексеріңіз.
      icon: tabler:ripple
    - title: '4-қадам: <span class="font-medium">Оны сақтаңыз</span>'
      description: Маусым аяқталғаннан кейін бассейнді ағызып, кептіріп, орап, келесі жазға дейін сөмкесінде сақтаңыз.
      icon: tabler:package
