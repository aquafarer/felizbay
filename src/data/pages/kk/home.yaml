hero:
  tagline: Премиум Drop Stitch үрленетін бассейндер
  title: Ашық кеңістігіңізді<br />Көбірек пайдаланыңыз.
  subtitle: |
        Қатты drop-stitch қабырғалары бар премиум бассейндер бірнеше минут ішінде үрленіп, қыста жиналады — аулада демалуға және отбасылық көңіл көтеруге арналған.
  actions:
    - variant: primary
      text: Дүкен бассейндері
      href: /products/
