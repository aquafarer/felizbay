    alt: Ауладағы Felizbay тікбұрышты Drop Stitch үрлемелі бассейні
features:
  id: features
  tagline: Drop Stitch технологиясы
  title: Неліктен Felizbay бассейні<br />Басқа
  subtitle: Жоғары қысымды Drop Stitch конструкциясы бассейндерімізді қатты, берік және сақтауға оңай етеді.
  columns: 2
  items:
    - title: Қатты Drop Stitch қабырғалары
      description: 'Мыңдаған ішкі жіптер қабырға қабаттарын бір-біріне бекітеді, сондықтан бассейн 4-6 PSI номиналды деңгейінде қатты үрленеді және толтырылған кезде пішінін сақтайды.'
      icon: tabler:hexagon
    - title: Жылдам, құралсыз орнату
      description: Жинақтағы электр сорғымен бірнеше минут ішінде үрлеңіз, содан кейін бақша шлангімен толтырыңыз. Құрал жоқ, құрылыс жоқ, кәсіби орнату жоқ.
      icon: tabler:rocket
    - title: Пакеттер кішкентай
      description: 'Суды төгіп тастаңыз, дефляциялаңыз, жинаңыз және қыста бассейнді сөмкесінде сақтаңыз - жабық сақтау үшін шағын жинақталған толық өлшемді бассейн.'
      icon: tabler:package
    - title: Төзімді және ультракүлгін сәулелеріне төзімді
      description: 'Екі қабатты PVC drop stitch мата, отбасылық пайдаланудың толық маусымы арқылы тесілуге ​​және UV әсеріне қарсы тұру үшін жасалған.'
      icon: tabler:shield
    - title: Толық пакет
      description: Әрбір бассейн жиынтығы электрлік ауа сорғымен, жөндеу жинағымен және сақтауға арналған сөмкемен бірге келеді. Дөңгелек сұр үлгіге арналған жабдықталған қақпақ бөлек сатылады.
      icon: tabler:box
    - title: Қауіпсіздікке негізделген дизайн
      description: 'EN 16582-1 және ASTM F2666 стандартына сілтеме жасайтын тұрғын үй бассейнінің дизайны — үлгіге қатысты қауіпсіздік ақпараты өнім құжаттамасында берілген. Әрқашан ересектердің бақылауы қажет.'
      icon: tabler:shield-check
