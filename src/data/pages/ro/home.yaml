features:
  id: features
  tagline: Tehnologia Drop Stitch
  title: De ce o piscină Felizbay<br />Este diferit
  subtitle: Construcția Drop Stitch de înaltă presiune face piscinele noastre rigide, durabile și depozitate fără efort.
  columns: 2
  items:
    - title: Pereți rigizi Drop Stitch
      description: 'Mii de fire interne blochează straturile de perete împreună, astfel încât piscina se umflă rigid la 4-5 PSI și își păstrează forma atunci când este umplută.'
      icon: tabler:hexagon
    - title: Configurare rapidă, fără instrumente
      description: Umflați cu pompa electrică inclusă în câteva minute, apoi umpleți cu un furtun de grădină. Fără unelte, fără construcție, fără instalare profesională.
      icon: tabler:rocket
    - title: Se ambalează mic
      description: 'Scurgeți, dezumflați, rulați și depozitați piscina în geantă pe timpul iernii - o piscină de dimensiuni mari care se împachetează mic pentru depozitare în interior.'
      icon: tabler:package
    - title: Durabil și rezistent la UV
      description: 'Țesătură cu două straturi PVC drop stitch, proiectată pentru a rezista la perforare și la expunerea la UV pe parcursul unui sezon complet de utilizare în familie.'
      icon: tabler:shield
    - title: Pachet complet
      description: Fiecare piscină se livrează cu o pompă de aer electrică, un kit de reparații și o pungă de depozitare. Huse montate disponibile pentru modelele rotunde.
      icon: tabler:box
    - title: Design conștient de siguranță
      description: 'Proiectarea piscinei rezidențiale care face referire la EN 16582-1 și ASTM F2666 — informațiile de siguranță specifice modelului sunt furnizate în documentația produsului. Este întotdeauna necesară supravegherea constantă a unui adult.'
      icon: tabler:shield-check
