production_section:
  tagline: Excelență în producție
  title: Asigurarea măiestriei rafinate
  description: Linia de producție Felizbay este dedicată piscinelor gonflabile de înaltă calitate, durabile și de înaltă presiune.
  cards:
    - title: Echipa de tehnicieni cu experienta
      items:
        - Cunoștințe profesionale despre cusături și materiale PVC
        - Măiestrie precisă în tăiere, sudare și asamblare
        - Formare continuă pentru a stăpâni cele mai noi tehnologii de producție
    - title: Echipamente avansate de producție
      items:
        - Echipament de tăiere de precizie pentru panouri de țesătură precise
        - Sudare termică de înaltă precizie pentru cusături etanșe și durabile
        - Echipamente profesionale de testare a presiunii și etanșeității la aer
    - title: Sistem de management matur
      items:
        - Procese de producție standardizate cu standarde clare de calitate
        - Filozofie de producție Lean reducând risipa și îmbunătățind eficiența
        - Management eficient al lanțului de aprovizionare cu furnizori de încredere
    - title: Control strict al calității
      items:
        - 'Inspecție în mai multe etape: materie primă, în proces, ieșire finală'
        - Testarea presiunii la vârful intervalului de lucru nominal de 4-6 PSI
        - Teste stricte de etanșeitate și durabilitate înainte de expediere
