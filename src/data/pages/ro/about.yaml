hero:
  tagline: Despre noi
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Piscina gonflabila Felizbay
  title: |
    Faceți înotul simplu, <br />
    în stil <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay este o marcă premium pentru piscine gonflabile Drop Stitch, proiectată și operată de Aquafarer LLC (SUA). Credem că fiecare familie merită o piscină adevărată în curtea din spate - instalare la suprafață, fără construcție permanentă a piscinei. Piscinele noastre se umflă rigid în câteva minute, supraviețuiesc verilor pline de distracție în familie și se împachetează puțin la sfârșitul sezonului. Cerințele privind autorizațiile, barierele și instalarea variază în funcție de locație.
