hero_text:
  tagline: Kontakt
  title: TA KONTAKT
contact_form:
  id: form
  title: Send oss ​​en melding
  subtitle: For tilbud, tekniske spørsmål eller spørsmål om partnerskap, send oss ​​en linje. Vi svarer innen én virkedag.
  email_to: info@felizbay.com
  submit_button: Send forespørsel → Få et tilbud
  success_message: Takk! Meldingen din har havnet i innboksen vår. Vi svarer innen én virkedag.
  error_message: Noe gikk galt da meldingen din ble sendt. Vennligst prøv igjen eller send oss ​​en e-post direkte.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: vennligst løs følgende"
  fields:
    - name: firstName
      label: Fornavn
      row: 1
    - name: lastName
      label: Etternavn
      row: 1
    - name: inquiryType
      label: Type henvendelse
      row: 2
      type: select
      options:
        - value: ""
          label: Hva gjelder din henvendelse?
        - value: retail
          label: Bestilling av én pool på nett (detaljhandel)
        - value: wholesale
          label: Grossist- / storskalabestilling (B2B)
        - value: oem
          label: OEM/ODM-tilpasning
        - value: support
          label: Kundestøtte og garanti
    - name: companyName
      label: Firmanavn
      row: 3
    - name: address
      label: Adresse
      row: 4
    - name: zip
      label: Postnummer
      row: 5
    - name: country
      label: Land
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-post
      row: 6
      type: email
    - name: tel
      label: TLF
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Estimert ordrevolum
      row: 7
      type: select
      options:
        - value: ""
          label: Velg estimert volum...
        - value: 1-unit
          label: 1 stk — én pool (detaljhandelsbestilling på nett)
        - value: sample
          label: Kun prøver / prototyper
        - value: 5-10
          label: 5–10 enheter (standard MOQ)
        - value: 100-500
          label: 100–500 enheter
        - value: 500-plus
          label: 500+ enheter (volumpriser)
    - name: customization
      label: Trengs tilpasning?
      row: 8
      type: select
      options:
        - value: ""
          label: Velg tilpasningstype...
        - value: none
          label: Standard produkt (ingen tilpasning)
        - value: logo
          label: Kun tilpasset logo / merkevarebygging
        - value: full
          label: Full OEM (størrelse, farge, grafikk, emballasje)
        - value: consultation
          label: Ikke sikker - trenger konsultasjon
    - name: productInterest
      label: Pool av interesse
      row: 9
      type: select
      options:
        - value: ""
          label: Velg bassengtype...
        - value: all
          label: Alle bassenger / Full katalog
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Portabelt spabad — Rundt
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Spabad / Swim Spa — Firkantet
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Tema
      row: 10
    - name: message
      label: Beskjed
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Andre måter å nå oss på
  columns: 3
  items:
    - title: Salgshenvendelser
      description: Pooltilbud, engrospriser og massebestillinger.
      icon: tabler:shopping-bag
    - title: Teknisk støtte
      description: Konfigurasjonshjelp, reparasjoner, reservedeler og vedlikeholdsspørsmål.
      icon: tabler:tool
    - title: OEM / ODM
      description: Egendefinerte størrelser, farger, omslag, merkevarebygging og emballasje.
      icon: tabler:palette
    - title: E-post
      description: info@felizbay.com
      icon: tabler:mail
    - title: Nettsted
      description: felizbay.com
      icon: tabler:world
    - title: Responstid
      description: Vi svarer innen én virkedag.
      icon: tabler:clock
map:
  title: Ta kontakt
  subtitle: Kontakt Felizbay
  address: felizbay.com
  zoom: 15
