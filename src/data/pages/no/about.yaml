hero:
  tagline: Om oss
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay oppblåsbart svømmebasseng
  title: |
    Gjør svømming enkelt, <br />
    på <span class="text-accent dark:text-white">Felizbay</span>-måten
  subtitle: Felizbay er et premium drop stitch oppblåsbart bassengmerke designet og drevet av Aquafarer LLC (USA). Vi mener at hver familie fortjener et ekte basseng i bakgården - overjordisk oppsett uten permanent bassengbygg. Bassengene våre blåses opp stive på få minutter, overlever hele somre med familiemoro, og pakker sammen små ved sesongslutt. Krav til tillatelser, gjerder og oppsett varierer etter sted.
