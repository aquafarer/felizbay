production_section:
  tagline: Produksjon fortreffelighet
  title: Sikre utsøkt håndverk
  description: Felizbays produksjonslinje er dedikert til høykvalitets, holdbare, høytrykks oppblåsbare svømmebassenger.
  cards:
    - title: Erfarent teknikerteam
      items:
        - Fagkunnskap om dropsting og PVC-materialer
        - Nøyaktig håndverk innen skjæring, sveising og montering
        - Kontinuerlig opplæring for å mestre de nyeste produksjonsteknologiene
    - title: Avansert produksjonsutstyr
      items:
        - Presisjonsskjæreutstyr for nøyaktige stoffpaneler
        - Varmesveising med høy presisjon for lufttette, holdbare sømmer
        - Profesjonelt utstyr for trykk- og lufttetthetstesting
    - title: Modent styringssystem
      items:
        - Standardiserte produksjonsprosesser med klare kvalitetsstandarder
        - Lean produksjonsfilosofi som reduserer avfall og forbedrer effektiviteten
        - Effektiv forsyningskjedestyring med pålitelige leverandører
    - title: Streng kvalitetskontroll
      items:
        - 'Flertrinns inspeksjon: råmateriale, i prosess, endelig utgående'
        - Trykktesting på toppen av det rangerte 4-6 PSI arbeidsområdet
        - Streng lufttetthets- og holdbarhetstesting før forsendelse
