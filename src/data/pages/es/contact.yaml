hero_text:
  tagline: Contacto
  title: PONTE EN CONTACTO
contact_form:
  id: form
  title: Envíanos un mensaje
  subtitle: Para cotizaciones, preguntas técnicas o consultas sobre asociaciones, escríbanos. Respondemos dentro de un día hábil.
  email_to: info@felizbay.com
  submit_button: Enviar consulta → Obtener una cotización
  success_message: ¡Gracias! Tu mensaje ha llegado a nuestra bandeja de entrada. Le responderemos dentro de un día hábil.
  error_message: Algo salió mal al enviar tu mensaje. Inténtelo de nuevo o envíenos un correo electrónico directamente.
  default_country_code: "+1"
  captcha:
    label: "Antispam: por favor solucione lo siguiente"
  fields:
    - name: firstName
      label: Nombre de pila
      row: 1
    - name: lastName
      label: Apellido
      row: 1
    - name: inquiryType
      label: Tipo de consulta
      row: 2
      type: select
      options:
        - value: ""
          label: ¿Sobre qué es su consulta?
        - value: retail
          label: Pedido en línea de una sola piscina (minorista)
        - value: wholesale
          label: Pedido mayorista / a granel (B2B)
        - value: oem
          label: Personalización OEM/ODM
        - value: support
          label: Soporte posventa y garantía
    - name: companyName
      label: nombre de empresa
      row: 3
    - name: address
      label: DIRECCIÓN
      row: 4
    - name: zip
      label: Código postal
      row: 5
    - name: country
      label: País
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: Correo electrónico
      row: 6
      type: email
    - name: tel
      label: TELÉFONO
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Volumen de pedido estimado
      row: 7
      type: select
      options:
        - value: ""
          label: Seleccione su volumen estimado...
        - value: 1-unit
          label: 1 unidad — una sola piscina (pedido minorista en línea)
        - value: sample
          label: Sólo muestras/prototipos
        - value: 5-10
          label: 5 a 10 unidades (MOQ estándar)
        - value: 100-500
          label: 100–500 unidades
        - value: 500-plus
          label: Más de 500 unidades (precio por volumen)
    - name: customization
      label: ¿Se necesita personalización?
      row: 8
      type: select
      options:
        - value: ""
          label: Seleccione el tipo de personalización...
        - value: none
          label: Producto estándar (sin personalización)
        - value: logo
          label: Logotipo personalizado/marca únicamente
        - value: full
          label: OEM completo (tamaño, color, gráficos, embalaje)
        - value: consultation
          label: "No estoy seguro: necesito consulta"
    - name: productInterest
      label: Grupo de interés
      row: 9
      type: select
      options:
        - value: ""
          label: Seleccione tipo de piscina...
        - value: all
          label: Todas las piscinas / Catálogo completo
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Bañera portátil — Redonda
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Bañera / Swim Spa — Cuadrada
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Sujeto
      row: 10
    - name: message
      label: Mensaje
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Otras formas de llegar a nosotros
  columns: 3
  items:
    - title: Consultas de ventas
      description: Cotizaciones conjuntas, precios al por mayor y pedidos al por mayor.
      icon: tabler:shopping-bag
    - title: Apoyo técnico
      description: Ayuda de configuración, reparaciones, repuestos y preguntas sobre cuidados.
      icon: tabler:tool
    - title: OEM/ODM
      description: Tamaños, colores, cubiertas, marcas y empaques personalizados.
      icon: tabler:palette
    - title: Correo electrónico
      description: info@felizbay.com
      icon: tabler:mail
    - title: Sitio web
      description: felizbay.com
      icon: tabler:world
    - title: Tiempo de respuesta
      description: Respondemos dentro de un día hábil.
      icon: tabler:clock
map:
  title: Ponte en contacto
  subtitle: Contactar felizbay
  address: felizbay.com
  zoom: 15
