hero:
  tagline: Biz haqimizda
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay shamollatiladigan suzish havzasi
  title: |
    Suzishni oddiy qilish, <br />
     <span class="text-accent dark:text-white">Felizbay</span> uslubida
  subtitle: Felizbay - bu Aquafarer MChJ (AQSh) tomonidan ishlab chiqilgan va boshqariladigan yuqori sifatli Drop Stitch puflama hovuz brendidir. Biz ishonamizki, har bir oila hovlida haqiqiy hovuzga loyiqdir - doimiy hovuz qurilishisiz, yer usti o'rnatiladigan. Bizning basseynlarimiz bir necha daqiqada qattiq shishiradi, to'liq yozda oilaviy o'yin-kulgidan omon qoladi va mavsum oxirida kichik hajmda yig'iladi. Ruxsatnoma, to'siq va o'rnatish talablari joylashuvga qarab farq qiladi.
