production_section:
  tagline: Ishlab chiqarish a'losi
  title: Nafis hunarmandchilikni ta'minlash
  description: Felizbay ishlab chiqarish liniyasi yuqori sifatli, bardoshli, yuqori bosimli shishiriladigan suzish havzalariga bag'ishlangan.
  cards:
    - title: Tajribali texniklar jamoasi
      items:
        - Tomchi tikuv va PVX materiallari bo'yicha professional bilim
        - Kesish, payvandlash va yig'ishda aniq mahorat
        - Eng yangi ishlab chiqarish texnologiyalarini o'zlashtirish uchun uzluksiz o'qitish
    - title: Ilg'or ishlab chiqarish uskunalari
      items:
        - To'g'ri mato panellari uchun nozik kesish uskunalari
        - Havo o'tkazmaydigan, bardoshli tikuvlar uchun yuqori aniqlikdagi issiqlik bilan payvandlash
        - Professional bosim va havo o'tkazmaydigan sinov uskunalari
    - title: Yetuk boshqaruv tizimi
      items:
        - Aniq sifat standartlari bilan standartlashtirilgan ishlab chiqarish jarayonlari
        - Chiqindilarni kamaytiradigan va samaradorlikni oshiradigan tejamkor ishlab chiqarish falsafasi
        - Ishonchli yetkazib beruvchilar bilan ta'minot zanjirini samarali boshqarish
    - title: Qattiq sifat nazorati
      items:
        - 'Ko''p bosqichli tekshirish: xom ashyo, ishlov berish, yakuniy chiqish'
        - Nominal 4-6 PSI ish diapazonining yuqori qismida bosim sinovi
        - Yuk tashishdan oldin qattiq havo o'tkazmasligi va chidamliligi sinovi
