content_compliance:
  tagline: Xizmat va xavfsizlik
  title: Oson egalik qilish,<br />Sevish oson
  subtitle: Yetkazib berishdan tortib, birinchi suzishgacha, mavsum oxirida saqlashgacha, Felizbay hovuziga ega bo'lish oddiy bo'lib qoladi.
  items:
    - title: Bir necha daqiqada sozlash
      description: '5-15 daqiqada qutidan chiqarib oling va kiritilgan nasos bilan puflang, keyin bog ''shlangi bilan to''ldiring - to''ldirish vaqti hovuz hajmi va suv ta''minotiga qarab farq qiladi.'
      icon: tabler:rocket
    - title: Oddiy suvni parvarish qilish
      description: Standart 32/38 mm filtr-nasos portlari, muntazam pH tekshiruvlari va dumaloq modellarda o'rnatilgan qopqoq suvni toza saqlaydi.
      icon: tabler:droplet
    - title: Tozalash, to'kib tashlash va saqlash
      description: Hovuzni to'kib tashlang, quriting, o'rang va qish uchun saqlash sumkasiga soling. Xizmat uchun doimiy o'rnatish yo'q.
      icon: tabler:package
    - title: Birinchi navbatda xavfsizlik
      description: Bolalar har doim kattalar tomonidan faol nazorat qilinishi kerak. Qo'llanma, mahalliy qoidalar va xavfsiz foydalanish yo'riqnomasiga rioya qiling.
      icon: tabler:shield-check
steps:
  title: Qutidan orqa hovliga
  items:
    - title: '1-qadam: <span class="font-medium">Hovuzingizni tanlang</span>'
      description: Shakl va o'lchamlarni bo'sh joyingiz, uyingiz va suvdan qanday foydalanishni rejalashtirganingizga mos keladigan tarzda solishtiring.
      icon: tabler:pool
    - title: '2-qadam: <span class="font-medium">Uni sozlash</span>'
      description: Qattiq, tekis erga qo'ying, kiritilgan elektr nasos bilan puflang va bog 'shlangi bilan to'ldiring.
      icon: tabler:rocket
    - title: '3-qadam: <span class="font-medium">Butun yoz suzish</span>'
      description: Suvni oddiy parvarish bilan toza tuting - har qanday kichik hovuz kabi tozalang, yoping va pH ni tekshiring.
      icon: tabler:ripple
    - title: '4-qadam: <span class="font-medium">Uni uzoqroqda saqlang</span>'
      description: Mavsum tugagach, suvni to'kib tashlang, quriting, o'rang va keyingi yozgacha hovuzni sumkasida saqlang.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay dumaloq Drop Stitch shishiriladigan suzish havzasi
blog_latest:
  title: Hovuz bo'yicha ko'rsatmalar va tushunchalar
  information: |
    Puflanadigan suzish havzalarini sozlash bo'yicha ko'rsatmalar, parvarish bo'yicha maslahatlar va sotib olish bo'yicha maslahatlar
    Felizbay jamoasidan.
faqs:
  title: Puflanadigan basseyn haqida tez-tez so'raladigan savollar
  subtitle: Felizbay shishiriladigan suzish havzalari haqida umumiy savollar.
  columns: 2
  items:
    - title: O'rnatish qancha vaqt oladi?
      description: 'Shamollatish modelga qarab kiritilgan elektr havo pompasi bilan 5-15 daqiqa davom etadi. To''ldirish vaqti hovuz hajmiga va suv ta''minotiga qarab o''zgaradi.'
      icon: tabler:clock
      category: all
    - title: Drop Stitch hovuzi qanchalik qattiq?
      description: Juda qattiq. Drop Stitch devorlari 4-5 PSI darajasida qattiq shishiradi - xuddi shishiriladigan belkurak taxtasi - shuning uchun hovuz suv bilan to'ldirilganda o'z shaklini saqlab qoladi.
      icon: tabler:hexagon
      category: all
    - title: Bolalar basseyndan foydalanishlari mumkinmi?
      description: Ha, har doim faol kattalar nazorati ostida. Bolalarni hech qachon hovuzda yoki uning yonida qarovsiz qoldirmaslik kerak - qo'llanma va mahalliy xavfsizlik qoidalariga rioya qiling.
      icon: tabler:users
      category: all
    - title: Hovuzni qishda qanday saqlash kerak?
      description: Suvni to'kib tashlang, hovuzni to'kib tashlang, uni to'liq quriting, so'ng uni o'rab oling va qo'shilgan saqlash sumkasida sovuq bo'lmagan joyda saqlang.
      icon: tabler:package
      category: all
    - title: Hovuzga nima kiradi?
      description: Har bir Felizbay hovuzida elektr havo nasosi, ta'mirlash to'plami va saqlash sumkasi mavjud. Dumaloq modellarda ixtiyoriy o'rnatilgan qopqoq mavjud.
      icon: tabler:box
      category: all
    - title: Qanday o'lchamlar mavjud?
      description: To'rtta to'plam bo'yicha 48 ta standart SKU - diametri 10 m gacha bo'lgan yumaloq hovuzlar, 6 × 5 m gacha bo'lgan to'rtburchaklar hovuzlar va o'rnatilgan o'rindiqli SPA vannalari. Biznes hamkorlar uchun maxsus o'lchamlar mavjud.
      icon: tabler:ruler-2
      category: all
    - title: Hovuz qanday sirtlarda turishi mumkin?
      description: 'O''tkir narsalardan xoli har qanday tekis, tekis sirt - maysazor, veranda yoki pastki. Qo''pol sirtlarda tuproqli varaq tavsiya etiladi. To''ldirilgan hovuz og''ir: faqat to''liq og''irlikni qo''llab-quvvatlaydigan yuzaga o''rnating va birinchi navbatda baland qavatlar, balkonlar va tomlar tuzilmaviy baholanadi.'
      icon: tabler:layout-grid
      category: all
    - title: Qanday qilib suvni toza saqlashim mumkin?
      description: O'rnatilgan joyda filtr nasosidan foydalaning, qoldiqlarni tozalang, pH darajasini tekshiring va foydalanilmaganda hovuzni yoping. Suv qancha davom etishi hovuz hajmi, foydalanish va filtratsiyaga bog'liq - belgilangan jadvalga tayanishdan ko'ra muntazam ravishda sinovdan o'tkazing.
      icon: tabler:droplet
      category: all
