  tagline: Магазин Басейни
  title: Разгледайте нашите басейни
  subtitle: Сравнете форми, размери и характеристики, за да намерите правилния басейн за вашия двор или открито пространство.
content_workshop:
  isReversed: true
  tagline: За бизнеса
  title: Пулове за бизнес,<br />също
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Felizbay за бизнес партньори</h3>
  items:
    - title: Ваканционни имоти под наем и хотелиерство
      description: Сезонни удобства за гости за ваканционни наеми, места за глемпинг и бутикови имоти — бързо разгръщане, лесно за поддръжка, лесно за съхранение.
    - title: Партньори за търговия на дребно и марка
      description: Програми за търговия на едро и готови за продажба на дребно Drop Stitch басейни за градински центрове, магазини за басейни и онлайн магазини.
    - title: Персонализиран и частен етикет
      description: Персонализирани размери, цветове, корици, отпечатване на лого и опаковки за търговия на дребно за марки — създадени от нашите партньори производители.
content_compliance:
  tagline: Грижи и безопасност
  title: Лесен за притежаване,<br />Лесен за обичане
  subtitle: От доставката през първото плуване до съхранението в края на сезона, притежаването на басейн Felizbay остава лесно.
  items:
    - title: Настройка за минути
      description: Разопаковайте, напомпайте с включената помпа и напълнете - пълната настройка обикновено отнема 15-30 минути на твърда, равна земя.
      icon: tabler:rocket
    - title: Проста грижа за водата
      description: Стандартните 32/38 mm портове за филтърна помпа, редовните проверки на pH и монтираният капак на кръглите модели поддържат водата чиста.
      icon: tabler:droplet
    - title: Почистете, източете и съхранявайте
      description: Отцедете, изсушете, навийте и опаковайте басейна в торбата за съхранение за зимата. Няма постоянна инсталация за поддръжка.
      icon: tabler:package
    - title: Безопасността на първо място
      description: Децата трябва да бъдат активно наблюдавани от възрастен през цялото време. Следвайте ръководството, местните правила и указанията за безопасна употреба.
      icon: tabler:shield-check
steps:
  title: От кутия до задния двор
  items:
    - title: 'Стъпка 1: <span class="font-medium">Изберете своя басейн</span>'
      description: Сравнете формите и размерите, за да отговарят на вашето пространство, домакинство и начина, по който планирате да използвате водата.
      icon: tabler:pool
    - title: 'Стъпка 2: <span class="font-medium">Настройте го</span>'
      description: Поставете на твърда, равна земя, напомпайте с включената електрическа помпа и напълнете с градински маркуч.
      icon: tabler:rocket
    - title: 'Стъпка 3: <span class="font-medium">Плувайте цяло лято</span>'
      description: Поддържайте водата свежа с лесна грижа - обезмаслете, покрийте и проверете pH като всеки малък басейн.
      icon: tabler:ripple
    - title: 'Стъпка 4: <span class="font-medium">Съхранявайте го</span>'
      description: Когато сезонът свърши, изцедете, изсушете, навийте и приберете басейна в торбата до следващото лято.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.png
    alt: Felizbay кръгъл надуваем басейн Drop Stitch
