use_cases:
  tagline: 'Случаи на употреба'
  title: 'Създаден за истинско плуване в двора'
  subtitle: 'Четири реални начина, по които собствениците използват бассейн Felizbay – от семейни уикенди до възстановителни къпания.'
  scenario_label: 'Сценарий'
  solution_label: 'Решение'
  cards:
    - title: 'Семейно плуване в двора'
      description: 'Басейн в пълен размер за летните празници, рождените дни и ежедневните игри след училище.'
      alt: 'Семейство си почива в голям кръгъл Drop-Stitch бассейн Felizbay по време на лятно събиране в двора.'
      image: /images/pool-ideas/large-pools-for-family-gatherings.webp
      href: /pool-ideas/backyard-pools-for-families/
      scenario: 'Цялото семейство идва за събирания и басейни партита, а малкият детски басейн не стига – постоянният басейн е невъзможен, забранен или твърде скъп.'
      solution: 'Големи Drop-Stitch басейни до Ø 10 м кръгли и 6 × 5 м правоъгълни, с твърди стени до 1,5 м, които се надуват за минути с включената 1000W електрическа помпа.'
      pills:
        - 'Кръгъл басейн'
        - 'Правоъгълен басейн'
        - 'Електрическа помпа 1000W'
    - title: 'Малки дворове и редови къщи'
      description: 'Истински басейн, който се побира на терасата на редова къща, в страничен двор или малко дворче.'
      alt: 'Кръгъл надуваем бассейн Felizbay на малката тераса на модерна редова къща.'
      image: /images/pool-ideas/townhome-and-compact-yard-pools.webp
      href: /pool-ideas/townhome-and-compact-yard-pools/
      scenario: 'Пространството започва от около 2 × 2 м и не може да се копае или строи – басейнът трябва да освободи мястото в края на сезона.'
      solution: 'Компактни размери от Ø 2 м кръгъл и 2 × 2 м правоъгълен, с твърди 4-6 PSI стени, които изглеждат като истински басейн и се сгъват в чанта за съхранение през зимата.'
      pills:
        - 'Кръгъл басейн'
        - 'Правоъгълен басейн'
        - 'Комплект за ремонт'
    - title: 'Аква фитнес и упражнения във водата'
      description: 'Водна аеробика, ходене срещу съпротивление и семейни игри на широка и стабилна платформа.'
      alt: 'Семейство прави водни упражнения и игри в просторен кръгъл бассейн Felizbay.'
      image: /images/pool-ideas/pools-for-water-fitness-and-recreation.webp
      href: /pool-ideas/pools-for-water-fitness-and-recreation/
      scenario: 'Движението с ниско натоварване изисква използваема площ и вертикални стени – меките пръстеновидни басейни губят вътрешно пространство от наклонени стени и преливат при активна игра.'
      solution: 'Прави 90-градусови Drop-Stitch стени и плоско, стабилно дъно при 4-6 PSI; кръглите Ø 3-5 м дават най-много свободно пространство за движение на квадратен метър.'
      pills:
        - 'Кръгъл басейн'
        - 'Помпа с пясъчен филтър'
        - 'Стълба с 4 стъпала'
    - title: 'Горещо къпане и студено възстановяване'
      description: 'Компактна станция за къпане и студени потапяния за тераси и домашни фитнес гарежи.'
      alt: 'Мъж прави възстановително студено потапяне в кръгла сива вана Felizbay в домашен фитнес гараж.'
      image: /images/pool-ideas/cold-plunge-and-recovery-pools.webp
      href: /pool-ideas/cold-plunge-and-recovery-pools/
      scenario: 'Спортистите и фитнес ентусиастите имат нужда от твърди стени, изолация, която забавя затоплянето, и сенчесто равно място от около 1,5 × 1,5 м.'
      solution: 'Изолирани SPA вани от Ø 1,8 м с вградени седалки и 5 мм топлоизолирано дъно; отоплителните и охлаждащите уреди са външни и се продават отделно.'
      pills:
        - 'Кръгла SPA вана'
        - 'Квадратна SPA вана'
        - 'Изолирано дъно'

