faqs:
  title: ЧЗВ за надуваем басейн
  subtitle: Често задавани въпроси относно надуваемите басейни Felizbay.
  columns: 2
  items:
    - title: Колко време отнема настройката?
      description: Напомпването отнема около 10 минути с включената електрическа въздушна помпа; пълната настройка, включително поставянето и пълненето, обикновено отнема 15-30 минути.
      icon: tabler:clock
      category: all
    - title: Колко твърд е Drop Stitch басейн?
      description: Много твърд. Стените Drop Stitch се надуват силно при 4-5 PSI — подобно на надуваема дъска за гребла — така че басейнът запазва формата си, когато се напълни с вода.
      icon: tabler:hexagon
      category: all
    - title: Могат ли деца да използват басейна?
      description: Да, с активно наблюдение от възрастен през цялото време. Децата никога не трябва да се оставят без надзор в или близо до басейна — следвайте ръководството и местните правила за безопасност.
      icon: tabler:users
      category: all
    - title: Как да съхранявам басейна през зимата?
      description: Източете водата, издухайте басейна, оставете го да изсъхне напълно, след това го навийте на руло и го съхранявайте в включената чанта за съхранение на място, защитено от замръзване.
      icon: tabler:package
      category: all
    - title: Какво е включено в басейна?
      description: Всеки басейн Felizbay включва електрическа въздушна помпа, ремонтен комплект и чанта за съхранение. Кръглите модели имат опционален монтиран капак.
      icon: tabler:box
      category: all
    - title: Какви размери са налични?
      description: 48 стандартни SKU в четири колекции — кръгли басейни с диаметър до 10 m, правоъгълни басейни с размери до 6 × 5 m и SPA вани с вградени седалки. Предлагат се персонализирани размери за бизнес партньори.
      icon: tabler:ruler-2
      category: all
    - title: На какви повърхности може да стои басейнът?
      description: Всякаква плоска, равна повърхност без остри предмети - морава, вътрешен двор или палуба. При грапави повърхности се препоръчва шлифован лист. Проверете дали повърхността може да понесе тежестта на напълнен басейн.
      icon: tabler:layout-grid
      category: all
    - title: Как да поддържам водата чиста?
      description: Използвайте филтърна помпа, където е поставена, обезмаслете остатъците, проверете pH и покрийте басейна, когато не се използва. Колко дълго издържа водата зависи от размера на басейна, употребата и филтрацията - тествайте редовно, вместо да разчитате на фиксиран график.
      icon: tabler:droplet
      category: all
