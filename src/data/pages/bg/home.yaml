faqs:
  title: ЧЗВ за надуваем басейн
  subtitle: Често задавани въпроси относно надуваемите басейни Felizbay.
  columns: 2
  items:
    - title: Колко време отнема настройката?
      description: 'Напомпването отнема 5-15 минути с включената електрическа въздушна помпа в зависимост от модела. Времето за пълнене варира в зависимост от капацитета на басейна и вашето водоснабдяване.'
      icon: tabler:clock
      category: all
    - title: Колко твърд е Drop Stitch басейн?
      description: Много твърд. Стените Drop Stitch се надуват силно при 4-6 PSI — подобно на надуваема дъска за гребла — така че басейнът запазва формата си, когато се напълни с вода.
      icon: tabler:hexagon
      category: all
    - title: Могат ли деца да използват басейна?
      description: Да, с активно наблюдение от възрастен през цялото време. Децата никога не трябва да се оставят без надзор в или близо до басейна — следвайте ръководството и местните правила за безопасност.
      icon: tabler:users
      category: all
    - title: Как да съхранявам басейна през зимата?
      description: Източете водата, издухайте басейна, оставете го да изсъхне напълно, след това го навийте на руло и го съхранявайте в включената чанта за съхранение на място, защитено от замръзване.
      icon: tabler:package
      category: all
    - title: Какво е включено в басейна?
      description: Всеки комплект за плувен басейн Felizbay включва електрическа въздушна помпа, ремонтен комплект и чанта за съхранение. Капаците и филтърните помпи се продават отделно.
      icon: tabler:box
      category: all
    - title: Какви размери са налични?
      description: Онлайн продаваме комплекти на дребно с фиксирани размери от кръглата и SPA колекции. Пълната фабрична гама — кръгли басейни с размери до 10 м, правоъгълни басейни с размери до 6 × 5 м и СПА вани — се предлага чрез нашата програма за продажба на едро.
      icon: tabler:ruler-2
      category: all
    - title: На какви повърхности може да стои басейнът?
      description: 'Всякаква плоска, равна повърхност без остри предмети - морава, вътрешен двор или палуба. При грапави повърхности се препоръчва шлифован лист. Напълненият басейн е тежък: монтирайте само върху повърхност, която издържа пълното тегло, и първо оценете структурата на повдигнатите палуби, балкони и покриви.'
      icon: tabler:layout-grid
      category: all
    - title: Как да поддържам водата чиста?
      description: Използвайте филтърна помпа, където е поставена, обезмаслете остатъците, проверете pH и покрийте басейна, когато не се използва. Колко дълго издържа водата зависи от размера на басейна, употребата и филтрацията - тествайте редовно, вместо да разчитате на фиксиран график.
      icon: tabler:droplet
      category: all
