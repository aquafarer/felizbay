features:
  id: features
  tagline: Технология Drop Stitch
  title: Защо басейн Felizbay<br />е различен
  subtitle: Конструкцията Drop Stitch под високо налягане прави нашите басейни твърди, издръжливи и лесни за съхранение.
  columns: 2
  items:
    - title: Твърди стени с Drop Stitch
      description: Хиляди вътрешни нишки заключват стенните слоеве заедно, така че басейнът се надува като скала при 4-5 PSI и запазва формата си, когато се напълни.
      icon: tabler:hexagon
    - title: Бърза настройка без инструменти
      description: Надуйте с включената електрическа помпа за минути, след което напълнете с градински маркуч. Без инструменти, без конструкция, без професионален монтаж.
      icon: tabler:rocket
    - title: Малки опаковки
      description: Източете, обезвъздушете, навийте и съхранявайте басейна в торба през зимата. Плувен басейн в пълен размер, който се побира в килера.
      icon: tabler:package
    - title: Издръжлив и UV-устойчив
      description: Двуслойната PVC Drop Stitch тъкан е устойчива на пробиви, UV излагане и цял сезон на семейна употреба.
      icon: tabler:shield
    - title: Пълен пакет
      description: Всеки басейн се доставя с електрическа въздушна помпа, ремонтен комплект и чанта за съхранение. Предлагат се монтирани капаци за кръгли модели.
      icon: tabler:box
    - title: Дизайн, съобразен с безопасността
      description: Дизайн на жилищен басейн, съобразен с EN 16582-1 и ASTM F2666, с клапани за освобождаване на налягането и стабилни твърди стени. Винаги е необходим постоянен надзор от възрастен.
      icon: tabler:shield-check
