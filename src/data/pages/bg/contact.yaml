hero_text:
  tagline: Контакт
  title: СВЪРЖЕТЕ СЕ
contact_form:
  id: form
  title: Изпратете ни съобщение
  subtitle: За оферти, технически въпроси или запитвания за партньорство, пишете ни. Ние отговаряме в рамките на един работен ден.
  email_to: info@felizbay.com
  submit_button: Изпратете запитване → Получете оферта
  success_message: благодаря Вашето съобщение пристигна в нашата пощенска кутия. Ние ще отговорим в рамките на един работен ден.
  error_message: Нещо се обърка при изпращането на вашето съобщение. Моля, опитайте отново или ни пишете директно.
  default_country_code: "+1"
  captcha:
    label: "Анти-спам: моля, решете следното"
  fields:
    - name: firstName
      label: Първо име
      row: 1
    - name: lastName
      label: Фамилия
      row: 1
    - name: inquiryType
      label: Тип запитване
      row: 2
      type: select
      options:
        - value: ""
          label: За какво е вашето запитване?
        - value: retail
          label: Онлайн поръчка на един басейн (розница)
        - value: wholesale
          label: Едро / партидна поръчка (B2B)
        - value: oem
          label: Персонализация OEM/ODM
        - value: support
          label: Следпродажбена поддръжка и гаранция
    - name: companyName
      label: Име на компанията
      row: 3
    - name: address
      label: Адрес
      row: 4
    - name: zip
      label: Пощенски код
      row: 5
    - name: country
      label: държава
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: Имейл
      row: 6
      type: email
    - name: tel
      label: ТЕЛ
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Очакван обем на поръчката
      row: 7
      type: select
      options:
        - value: ""
          label: Изберете своя прогнозен обем...
        - value: 1-unit
          label: 1 бр. — един басейн (онлайн рознична поръчка)
        - value: sample
          label: Само мостри / прототипи
        - value: 5-10
          label: 5–10 единици (Standard MOQ)
        - value: 100-500
          label: 100–500 единици
        - value: 500-plus
          label: 500+ единици (ценообразуване на обем)
    - name: customization
      label: Необходима ли е персонализация?
      row: 8
      type: select
      options:
        - value: ""
          label: Изберете тип персонализиране...
        - value: none
          label: Стандартен продукт (без персонализиране)
        - value: logo
          label: Само персонализирано лого/брандиране
        - value: full
          label: Пълен OEM (размер, цвят, графика, опаковка)
        - value: consultation
          label: Не съм сигурен — имам нужда от консултация
    - name: productInterest
      label: Пул от интереси
      row: 9
      type: select
      options:
        - value: ""
          label: Изберете тип басейн...
        - value: all
          label: Всички басейни / Пълен каталог
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Преносимо джакузи — Кръгло
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Джакузи / Swim Spa — Квадратно
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Предмет
      row: 10
    - name: message
      label: Съобщение
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Други начини да стигнете до нас
  columns: 3
  items:
    - title: Запитвания за продажби
      description: Обединени котировки, цени на едро и групови поръчки.
      icon: tabler:shopping-bag
    - title: Техническа поддръжка
      description: Помощ за настройка, ремонти, резервни части и въпроси за поддръжка.
      icon: tabler:tool
    - title: OEM / ODM
      description: Персонализирани размери, цветове, корици, марка и опаковки.
      icon: tabler:palette
    - title: Имейл
      description: info@felizbay.com
      icon: tabler:mail
    - title: уебсайт
      description: felizbay.com
      icon: tabler:world
    - title: Време за реакция
      description: Ние отговаряме в рамките на един работен ден.
      icon: tabler:clock
map:
  title: Свържете се с нас
  subtitle: Свържете се с Felizbay
  address: felizbay.com
  zoom: 15
