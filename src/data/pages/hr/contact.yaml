hero_text:
  tagline: Kontakt
  title: JAVITE SE
contact_form:
  id: form
  title: Pošaljite nam poruku
  subtitle: Za ponude, tehnička pitanja ili upite o partnerstvu, javite nam se. Odgovaramo u roku od jednog radnog dana.
  email_to: info@felizbay.com
  submit_button: Pošaljite upit → Zatražite ponudu
  success_message: Hvala! Vaša poruka je stigla u naš inbox. Odgovorit ćemo u roku od jednog radnog dana.
  error_message: Nešto nije u redu prilikom slanja vaše poruke. Pokušajte ponovno ili nam izravno pošaljite e-poruku.
  default_country_code: "+1"
  captcha:
    label: "Zaštita od spama: riješite sljedeće"
  fields:
    - name: firstName
      label: Ime
      row: 1
    - name: lastName
      label: Prezime
      row: 1
    - name: inquiryType
      label: Vrsta upita
      row: 2
      type: select
      options:
        - value: ""
          label: O čemu se radi u vašem upitu?
        - value: retail
          label: Online narudžba jednog bazena (maloprodaja)
        - value: wholesale
          label: Veleprodajna / velika narudžba (B2B)
        - value: oem
          label: OEM/ODM prilagodba
        - value: support
          label: Podrška nakon prodaje i jamstvo
    - name: companyName
      label: Naziv tvrtke
      row: 3
    - name: address
      label: Adresa
      row: 4
    - name: zip
      label: Poštanski broj
      row: 5
    - name: country
      label: Zemlja
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Procijenjeni opseg narudžbe
      row: 7
      type: select
      options:
        - value: ""
          label: Odaberite svoju procijenjenu količinu...
        - value: 1-unit
          label: 1 kom — jedan bazen (online maloprodajna narudžba)
        - value: sample
          label: Samo uzorci / prototipovi
        - value: 5-10
          label: 5–10 jedinica (standardni MOQ)
        - value: 100-500
          label: 100–500 jedinica
        - value: 500-plus
          label: 500+ jedinica (količinska cijena)
    - name: customization
      label: Potrebna prilagodba?
      row: 8
      type: select
      options:
        - value: ""
          label: Odaberite vrstu prilagodbe...
        - value: none
          label: Standardni proizvod (bez prilagodbe)
        - value: logo
          label: Samo prilagođeni logotip / robna marka
        - value: full
          label: Puni OEM (veličina, boja, grafika, pakiranje)
        - value: consultation
          label: Nisam siguran — potrebna je konzultacija
    - name: productInterest
      label: Bazen interesa
      row: 9
      type: select
      options:
        - value: ""
          label: Odaberite vrstu bazena...
        - value: all
          label: Svi bazeni / Cijeli katalog
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Prijenosni jacuzzi — Okrugli
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Jacuzzi / Swim Spa — Kvadratni
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Predmet
      row: 10
    - name: message
      label: Poruka
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Drugi načini da dođete do nas
  columns: 3
  items:
    - title: Prodajni upiti
      description: Skupne ponude, veleprodajne cijene i skupne narudžbe.
      icon: tabler:shopping-bag
    - title: Tehnička podrška
      description: Pomoć pri postavljanju, popravci, rezervni dijelovi i pitanja o održavanju.
      icon: tabler:tool
    - title: OEM / ODM
      description: Prilagođene veličine, boje, omoti, robna marka i pakiranja.
      icon: tabler:palette
    - title: E-mail
      description: info@felizbay.com
      icon: tabler:mail
    - title: Web stranica
      description: felizbay.com
      icon: tabler:world
    - title: Vrijeme odziva
      description: Odgovaramo u roku od jednog radnog dana.
      icon: tabler:clock
map:
  title: Javite nam se
  subtitle: Kontaktirajte Felizbay
  address: felizbay.com
  zoom: 15
