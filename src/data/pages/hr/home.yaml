features:
  id: features
  tagline: Drop Stitch tehnologija
  title: Zašto Felizbay bazen<br />je drugačiji
  subtitle: Visokotlačna Drop Stitch konstrukcija čini naše bazene krutim, izdržljivim i lakim za spremanje.
  columns: 2
  items:
    - title: Čvrsti Drop Stitch zidovi
      description: 'Tisuće unutarnjih navoja spajaju slojeve zidova zajedno, tako da se bazen čvrsto napuhuje pri nazivnom 4-5 PSI i zadržava svoj oblik kada se napuni.'
      icon: tabler:hexagon
    - title: Brzo postavljanje bez alata
      description: Napuhajte uključenom električnom pumpom za nekoliko minuta, a zatim napunite vrtnim crijevom. Bez alata, bez konstrukcije, bez profesionalne instalacije.
      icon: tabler:rocket
    - title: Pakirajte malo
      description: 'Ispraznite, ispuhnite, smotajte i spremite bazen u torbu preko zime — bazen pune veličine koji je malen za unutarnje skladište.'
      icon: tabler:package
    - title: Izdržljiv i otporan na UV zračenje
      description: 'Dvoslojna PVC drop stitch tkanina, dizajnirana da bude otporna na probijanje i izloženost UV tijekom cijele sezone obiteljske upotrebe.'
      icon: tabler:shield
    - title: Kompletan paket
      description: Svaki bazen se isporučuje s električnom pumpom za zrak, kompletom za popravak i torbom za pohranu. Uklopljene navlake dostupne za okrugle modele.
      icon: tabler:box
    - title: Dizajn osviješten o sigurnosti
      description: 'Dizajn stambenog bazena koji se poziva na EN 16582-1 i ASTM F2666 — sigurnosne informacije specifične za model navedene su u dokumentaciji proizvoda. Uvijek je potreban stalni nadzor odrasle osobe.'
      icon: tabler:shield-check
