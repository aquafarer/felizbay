hero:
  tagline: Premium Drop Stitch bazeni na napuhavanje
  title: Iskoristite više svog<br />Vanjskog prostora.
  subtitle: |
        Vrhunski bazeni s krutim drop-stitch stijenkama koji se napuhavaju u nekoliko minuta i spremaju za zimu — dizajnirani za opuštanje u dvorištu i obiteljsku zabavu.
  actions:
