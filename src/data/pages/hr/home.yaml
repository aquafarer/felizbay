faqs:
  title: Inflatable Pool FAQ
  subtitle: 'Common questions about Felizbay inflatable swimming pools.'
  columns: 2
  items:
    - title: How long does setup take?
      description: 'About 10 minutes with the included electric air pump, plus the time to fill the pool with a garden hose.'
      icon: tabler:clock
      category: all
    - title: How rigid is a drop stitch pool?
      description: 'Very rigid. The drop stitch walls inflate hard at 8-10 PSI — similar to an inflatable paddle board — so the pool keeps its shape when filled with water.'
      icon: tabler:hexagon
      category: all
    - title: Can children use the pool?
      description: 'Yes, with constant adult supervision. The stable rigid walls and even depth make our pools a great environment for kids to learn to swim.'
      icon: tabler:users
      category: all
    - title: How do I store the pool in winter?
      description: 'Drain the water, deflate the pool, let it dry completely, then roll it up and store it in the included storage bag in a frost-free place.'
      icon: tabler:package
      category: all
    - title: What is included with the pool?
      description: 'Every Felizbay pool includes an electric air pump, a repair kit, and a storage bag. Round models have an optional fitted cover.'
      icon: tabler:box
      category: all
    - title: Do you offer custom sizes or OEM/ODM?
      description: 'Yes. We manufacture custom sizes, colors, covers, and logo printing for brands, distributors, and hospitality projects. Contact info@felizbay.com.'
      icon: tabler:adjustments
      category: all
    - title: What surfaces can the pool stand on?
      description: 'Any flat, level surface free of sharp objects — lawn, patio, or deck. A ground sheet is recommended on rough surfaces.'
      icon: tabler:layout-grid
      category: all
    - title: How do I keep the water clean?
      description: 'Use the fitted cover (round models) when the pool is not in use, skim debris regularly, and refresh the water as needed. Small filtration systems can also be used.'
      icon: tabler:droplet
      category: all

