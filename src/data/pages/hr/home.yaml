features:
  id: features
  tagline: Drop Stitch Technology
  title: 'Why a Felizbay Pool<br />Is Different'
  subtitle: 'High-pressure drop stitch construction makes our pools rigid, durable, and effortless to store.'
  columns: 2
  items:
    - title: Rigid Drop Stitch Walls
      description: 'Thousands of internal threads lock the wall layers together, so the pool inflates rock-hard at 8-10 PSI and keeps its shape when filled.'
      icon: tabler:hexagon
    - title: Fast, Tool-Free Setup
      description: 'Inflate with the included electric pump in about 10 minutes, then fill with a garden hose. No tools, no construction, no professional installation.'
      icon: tabler:rocket
    - title: Packs Away Small
      description: 'Drain, deflate, roll up, and store the pool in a bag over winter. A full-size swimming pool that fits in a closet.'
      icon: tabler:package
    - title: Durable & UV-Resistant
      description: 'Double-layer PVC drop stitch fabric resists punctures, UV exposure, and a full season of family use.'
      icon: tabler:shield
    - title: Complete Package
      description: 'Every pool ships with an electric air pump, repair kit, and storage bag. Fitted covers available for round models.'
      icon: tabler:box
    - title: OEM/ODM Manufacturing
      description: 'Custom sizes, colors, covers, logo printing, and retail packaging for brands and distributors. Factory-direct pricing.'
      icon: tabler:adjustments

