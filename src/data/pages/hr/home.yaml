content_compliance:
  tagline: Njega i sigurnost
  title: Jednostavan za posjedovanje,<br />Lako za voljeti
  subtitle: Od isporuke preko prvog kupanja do skladištenja na kraju sezone, posjedovanje bazena Felizbay ostaje jednostavno.
  items:
    - title: Postavljanje u nekoliko minuta
      description: 'Raspakirajte i napuhajte priloženom pumpom za 5-15 minuta, zatim napunite vrtnim crijevom — vrijeme punjenja ovisi o veličini bazena i opskrbi vodom.'
      icon: tabler:rocket
    - title: Jednostavna njega vode
      description: Standardni 32/38 mm otvori za filtar-pumpu, redovite pH provjere i postavljeni poklopac na okruglim modelima održavaju vodu čistom.
      icon: tabler:droplet
    - title: Očistite, ocijedite i pohranite
      description: Ocijedite, osušite, smotajte i spakirajte bazen u vreću za zimu. Nema trajne instalacije za održavanje.
      icon: tabler:package
    - title: Sigurnost prije svega
      description: Djeca moraju cijelo vrijeme biti pod aktivnim nadzorom odrasle osobe. Slijedite priručnik, lokalna pravila i smjernice za sigurnu uporabu.
      icon: tabler:shield-check
steps:
  title: Od kutije do dvorišta
  items:
    - title: 'Korak 1: <span class="font-medium">Odaberite svoj bazen</span>'
      description: Usporedite oblike i veličine kako bi odgovarali vašem prostoru, kućanstvu i načinu na koji planirate koristiti vodu.
      icon: tabler:pool
    - title: 'Korak 2: <span class="font-medium">Postavite ga</span>'
      description: Stavite na čvrsto, ravno tlo, napuhajte priloženom električnom pumpom i napunite vrtnim crijevom.
      icon: tabler:rocket
    - title: 'Korak 3: <span class="font-medium">Plivajte cijelo ljeto</span>'
      description: Održavajte vodu svježom uz jednostavnu njegu - prelijte, pokrijte i provjerite pH kao u svakom malom bazenu.
      icon: tabler:ripple
    - title: 'Korak 4: <span class="font-medium">Spremi to daleko</span>'
      description: Kad sezona završi, bazen ocijedite, osušite, smotajte i spremite u vrećicu do sljedećeg ljeta.
      icon: tabler:package
