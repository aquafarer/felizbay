      description: Her dikişe, duvara ve vanaya sanki kendi ailelerimiz yüzecekmiş gibi davranılıyor.
      icon: tabler:heart
    - title: Satmadan önce mühendis
      description: Yüksek basınçlı Drop Stitch yapısı, herhangi bir havuz gemisinden önce nominal basıncının üst sınırında test edilmiştir.
      icon: tabler:settings
    - title: Sezon boyunca sürecek destek
      description: Sorularınız, yedek parçalarınız veya garantiniz için bize istediğiniz zaman info@felizbay.com adresinden ulaşabilirsiniz.
      icon: tabler:headset
