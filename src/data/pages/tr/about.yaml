features3_what_we_build:
  title: Ne inşa ediyoruz
  subtitle: 'İçini dışını bildiğimiz odaklanmış bir ürün grubu: yüksek basınçlı Drop Stitch şişme yüzme havuzları.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Dikdörtgen havuzlar
      description: Alanınız için yüzme alanını en üst düzeye çıkaran aile boyutunda dikdörtgen Drop Stitch havuzları.
      icon: tabler:rectangle
    - title: Yuvarlak mavi havuzlar
      description: Klasik arka bahçe havuzu — canlı mavi, sert Drop Stitch duvarlar, hızlı kurulum.
      icon: tabler:circle
    - title: Yuvarlak gri havuzlar
      description: Modern gri kaplamalı ve isteğe bağlı gömme kapaklı premium serimiz.
      icon: tabler:circle-dot
    - title: Sıcak küvet SPA havuzları
      description: 'Dahili koltuklara ve 5 mm yalıtımlı tabanlara sahip yalıtımlı jakuzi modelleri — harici ısıtıcılarla kullanım için (ısıtıcı dahil değildir).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Komple paketler
      description: Her yüzme havuzu seti elektrikli hava pompası, tamir seti ve saklama çantasıyla birlikte gönderilir.
      icon: tabler:package
    - title: Özel boyutlar
      description: Markalar, distribütörler ve konaklama projeleri için OEM boyutları, renkleri ve kapakları.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Logo baskısı ve perakende satışa hazır ambalajlama ile özel etiketli üretim.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Felizbay dikdörtgen Drop Stitch şişme yüzme havuzu
