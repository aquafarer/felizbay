production_section:
  tagline: Üretim Mükemmelliği
  title: Mükemmel İşçiliğin Sağlanması
  description: Felizbay üretim hattı, yüksek kaliteli, dayanıklı, yüksek basınçlı şişme yüzme havuzlarına adanmıştır.
  cards:
    - title: Deneyimli Teknisyen Ekibi
      items:
        - Damla dikiş ve PVC malzemeler konusunda profesyonel bilgi
        - Kesme, kaynaklama ve montajda hassas işçilik
        - En son üretim teknolojilerine hakim olmak için sürekli eğitim
    - title: Gelişmiş Üretim Ekipmanları
      items:
        - Doğru kumaş panelleri için hassas kesme ekipmanı
        - Hava geçirmez, dayanıklı dikişler için yüksek hassasiyetli ısı kaynağı
        - Profesyonel basınç ve hava sızdırmazlık test ekipmanları
    - title: Olgun Yönetim Sistemi
      items:
        - Net kalite standartlarına sahip standartlaştırılmış üretim süreçleri
        - Yalın üretim felsefesi israfı azaltıp verimliliği artırıyor
        - Güvenilir tedarikçilerle verimli tedarik zinciri yönetimi
    - title: Sıkı Kalite Kontrolü
      items:
        - 'Çok aşamalı denetim: hammadde, süreç içi, son çıkış'
        - Nominal 4-6 PSI çalışma aralığının üstünde basınç testi
        - Sevkiyattan önce sıkı hava geçirmezlik ve dayanıklılık testleri
