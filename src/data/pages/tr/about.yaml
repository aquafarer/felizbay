hero:
  tagline: Hakkımızda
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay şişme yüzme havuzu
  title: |
    Yüzmeyi basitleştirmek, <br />
     <span class="text-accent dark:text-white">Felizbay</span> tarzı
  subtitle: Felizbay, Aquafarer LLC (ABD) tarafından tasarlanan ve işletilen birinci sınıf bir Drop Stitch şişme havuz markasıdır. Her ailenin arka bahçede kalıcı havuz inşası olmadan zemine monte edilen gerçek bir havuzu hak ettiğine inanıyoruz. Havuzlarımız birkaç dakika içinde sert bir şekilde şişer, yazları ailece eğlenerek geçirir ve sezon sonunda küçük küçük toplanıp toplanır. İzin, bariyer ve kurulum gereksinimleri konuma göre değişir.
