faqs:
  title: Şişme Havuz SSS
  subtitle: Felizbay şişme yüzme havuzları hakkında sık sorulan sorular.
  columns: 2
  items:
    - title: Kurulum ne kadar sürer?
      description: 'Modele bağlı olarak birlikte verilen elektrikli hava pompasıyla şişirme işlemi 5-15 dakika sürer. Doldurma süresi havuz kapasitesine ve su kaynağınıza göre değişir.'
      icon: tabler:clock
      category: all
    - title: Drop Stitch havuzu ne kadar serttir?
      description: Çok katı. Drop Stitch duvarları, şişirilebilir kürek tahtasına benzer şekilde 4-6 PSI'da sert bir şekilde şişer, böylece havuz suyla doldurulduğunda şeklini korur.
      icon: tabler:hexagon
      category: all
    - title: Çocuklar havuzu kullanabilir mi?
      description: Evet, her zaman aktif yetişkin gözetiminde. Çocuklar asla havuzun içinde veya yakınında gözetimsiz bırakılmamalıdır; kılavuza ve yerel güvenlik kurallarına uyun.
      icon: tabler:users
      category: all
    - title: Havuzu kışın nasıl saklarım?
      description: Suyu boşaltın, havuzun havasını söndürün, tamamen kurumasını bekleyin, ardından yuvarlayın ve birlikte verilen saklama çantasında donmayacak bir yerde saklayın.
      icon: tabler:package
      category: all
    - title: Havuza neler dahil?
      description: Her Felizbay yüzme havuzu setinde elektrikli hava pompası, tamir seti ve saklama çantası bulunur. Kapaklar ve filtre pompaları ayrı satılır.
      icon: tabler:box
      category: all
    - title: Hangi boyutlar mevcut?
      description: Çevrimiçi olarak yuvarlak ve SPA koleksiyonlarından sabit boyutlu perakende setler satıyoruz. Genişliği 10 m'ye kadar yuvarlak havuzlar, 6 × 5 m'ye kadar dikdörtgen havuzlar ve SPA küvetlerinden oluşan tüm fabrika yelpazesi toptan satış programımız aracılığıyla mevcuttur.
      icon: tabler:ruler-2
      category: all
    - title: Havuz hangi yüzeylerde durabilir?
      description: 'Çimenlik, veranda veya teras gibi keskin nesnelerin bulunmadığı herhangi bir düz, düz yüzey. Pürüzlü yüzeylerde zemin örtüsü tavsiye edilir. Dolu bir havuz ağırdır: yalnızca tam ağırlığı destekleyen bir yüzeye monte edin ve öncelikle yükseltilmiş güverte, balkon ve çatıların yapısal olarak değerlendirilmesini sağlayın.'
      icon: tabler:layout-grid
      category: all
    - title: Suyu nasıl temiz tutabilirim?
      description: Takılı olduğu yerde bir filtre pompası kullanın, kalıntıları temizleyin, pH'ı kontrol edin ve kullanılmadığında havuzun üzerini kapatın. Suyun ne kadar dayanacağı havuz büyüklüğüne, kullanıma ve filtrelemeye bağlıdır; sabit bir programa bağlı kalmak yerine düzenli olarak test yapın.
      icon: tabler:droplet
      category: all
