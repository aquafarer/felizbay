hero:
  tagline: Premium Drop Stitch Şişme Havuzlar
  title: Dış Mekan Alanınızdan Daha<br />Fazla Yararlanın.
  subtitle: |
    Arka bahçede rahatlama ve aile eğlencesi için tasarlanmış, dakikalar içinde şişen ve kış için toplanabilen sert drop-stitch duvarlara sahip birinci sınıf havuzlar.<br />
    Havuz boyutlarını keşfedin, özellikleri karşılaştırın ve alanınıza en uygun olanı bulun.<br />
    Aquafarer LLC, ABD tarafından tasarlanmış ve işletilmektedir.
  actions:
    - variant: primary
      text: Alışveriş Havuzları
      href: /products
      icon: tabler:pool
    - text: Havuzunuzu Bulun
      href: /find-your-pool
      icon: tabler:compass
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Arka bahçede Felizbay dikdörtgen Drop Stitch şişme yüzme havuzu
features:
  id: features
  tagline: Drop Stitch Teknolojisi
  title: Neden Felizbay Havuzu<br />Farklı mı
  subtitle: Yüksek basınçlı Drop Stitch yapısı, havuzlarımızı sağlam, dayanıklı ve saklamayı kolay hale getirir.
  columns: 2
  items:
    - title: Sağlam Drop Stitch Duvarları
      description: 'Binlerce iç diş duvar katmanlarını birbirine kilitler, böylece havuz 4-5 PSI değerinde sert bir şekilde şişer ve doldurulduğunda şeklini korur.'
      icon: tabler:hexagon
    - title: Hızlı, Aletsiz Kurulum
      description: Ürünle birlikte verilen elektrikli pompayla birkaç dakika içinde şişirin, ardından bahçe hortumuyla doldurun. Alet yok, inşaat yok, profesyonel kurulum yok.
      icon: tabler:rocket
    - title: Küçük Paketler
      description: 'Havuzu boşaltın, söndürün, yuvarlayın ve kış boyunca çantasında saklayın - kapalı alanda depolama için küçük bir şekilde toplanabilen tam boyutlu bir havuz.'
      icon: tabler:package
    - title: Dayanıklı ve UV ışınlarına dayanıklı
      description: 'Çift katmanlı PVC drop stitch kumaş, tüm sezon boyunca aile kullanımı boyunca delinmelere ve UV''ye maruz kalmaya karşı dayanıklı olacak şekilde tasarlanmıştır.'
      icon: tabler:shield
    - title: Komple Paket
      description: Her havuz bir elektrikli hava pompası, tamir seti ve saklama çantasıyla birlikte gönderilir. Yuvarlak modeller için gömme kapaklar mevcuttur.
      icon: tabler:box
    - title: Güvenlik Bilincine Sahip Tasarım
      description: 'EN 16582-1 ve ASTM F2666''yı referans alan konut havuzu tasarımı — modele özel güvenlik bilgileri ürün belgelerinde verilmektedir. Sürekli yetişkin gözetimi her zaman gereklidir.'
      icon: tabler:shield-check
