features:
  id: features
  tagline: Drop Stitch Teknolojisi
  title: Neden Felizbay Havuzu<br />Farklı mı
  subtitle: Yüksek basınçlı Drop Stitch yapısı, havuzlarımızı sağlam, dayanıklı ve saklamayı kolay hale getirir.
  columns: 2
  items:
    - title: Sağlam Drop Stitch Duvarları
      description: Binlerce iç iplik duvar katmanlarını birbirine kilitler, böylece havuz 4-5 PSI'da kaya gibi sert bir şekilde şişer ve doldurulduğunda şeklini korur.
      icon: tabler:hexagon
    - title: Hızlı, Aletsiz Kurulum
      description: Ürünle birlikte verilen elektrikli pompayla birkaç dakika içinde şişirin, ardından bahçe hortumuyla doldurun. Alet yok, inşaat yok, profesyonel kurulum yok.
      icon: tabler:rocket
    - title: Küçük Paketler
      description: Havuzu kış boyunca boşaltın, söndürün, toplayın ve bir torbada saklayın. Dolaba sığabilecek tam boy bir yüzme havuzu.
      icon: tabler:package
    - title: Dayanıklı ve UV ışınlarına dayanıklı
      description: Çift katmanlı PVC Drop Stitch kumaş, delinmelere, UV ışınlarına ve tüm sezon boyunca aile kullanımına karşı dayanıklıdır.
      icon: tabler:shield
    - title: Komple Paket
      description: Her havuz bir elektrikli hava pompası, tamir seti ve saklama çantasıyla birlikte gönderilir. Yuvarlak modeller için gömme kapaklar mevcuttur.
      icon: tabler:box
    - title: Güvenlik Bilincine Sahip Tasarım
      description: Basınç tahliye vanaları ve sabit sert duvarlarla EN 16582-1 ve ASTM F2666'yı referans alan konut havuzu tasarımı. Sürekli yetişkin gözetimi her zaman gereklidir.
      icon: tabler:shield-check
content_customer_types:
  tagline: Havuz Fikirleri
  title: İçin Doğru Havuz<br />Sizin Alanınız
  subtitle: Doğru havuzu seçmek için gerçek kurulumlar, gerçek boyutlar ve dürüst rehberlik.
  items:
    - title: Aileler için Arka Bahçe Havuzları
      description: Arka bahçede ailece geçirilecek yazlar için alan planlaması, gerçek kullanılabilir boyutlar ve kolay bakım.
      icon: tabler:home
      cta: Fikir Alın
      cta_href: /pool-ideas/backyard-pools-for-families
    - title: Küçük Arka Bahçeler İçin Havuzlar
      description: Yüzmekten vazgeçmeden dar dış mekanlara uyum sağlayan kompakt yuvarlak ve kare modeller.
      icon: tabler:layout-grid
      cta: Fikir Alın
      cta_href: /pool-ideas/pools-for-small-backyards
    - title: Toplantılar için Büyük Havuzlar
      description: Yaz günlerinde tüm mürettebat için gerçek yüzme alanına sahip büyük dikdörtgen havuzlar.
      icon: tabler:users
      cta: Fikir Alın
      cta_href: /pool-ideas/large-pools-for-family-gatherings
    - title: Açık Havada Islanma ve Rahatlama
      description: Evde günlük dinlenmeler için yerleşik koltuklara ve yalıtımlı tabanlara sahip SPA küvetleri.
      icon: tabler:ripple
      cta: Fikir Alın
      cta_href: /pool-ideas/outdoor-soaking-pools
    - title: Kiralık Tatil Havuzları
      description: Hızlı bir şekilde kurulan ve sezon dışında depolanan sezonluk bir misafir ikramı.
      icon: tabler:beach
      cta: Fikir Alın
      cta_href: /pool-ideas/pools-for-vacation-rentals
    - title: Glamping ve Konaklama
      description: Farklı açık hava konaklamaları - glamping alanları, butik mülkler ve etkinlik mekanları.
      icon: tabler:tent
      cta: Fikir Alın
      cta_href: /pool-ideas/pools-for-glamping-and-hospitality
content_categories:
  tagline: Alışveriş Havuzları
  title: Havuzlarımızı Keşfedin
  subtitle: Arka bahçeniz veya dış mekanınız için doğru havuzu bulmak için şekilleri, boyutları ve özellikleri karşılaştırın.
content_workshop:
  isReversed: true
  tagline: İşletmeler için
  title: İş Havuzları,<br />Fazla
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Felizbay iş ortaklarına</h3>
  items:
    - title: Kiralık Tatil Evleri ve Konaklama
      description: Kiralık tatil evleri, glamping siteleri ve butik mülkler için sezonluk misafir olanakları — kurulumu hızlı, bakımı kolay, saklaması basit.
    - title: Perakende ve Marka Ortakları
      description: Bahçe merkezleri, havuz mağazaları ve çevrimiçi mağazalar için toptan satış programları ve perakende satışa hazır Drop Stitch havuzları.
    - title: Özel ve Özel Etiket
      description: Üretim ortaklarımız tarafından oluşturulan markalar için özel boyutlar, renkler, kapaklar, logo baskısı ve perakende ambalajlar.
content_compliance:
  tagline: Bakım ve Güvenlik
  title: Sahip Olmak Kolay,<br />Sevmek Kolay
  subtitle: Teslimattan ilk yüzmeye ve sezon sonu depolamaya kadar Felizbay havuzuna sahip olmak çok kolay.
  items:
    - title: Dakikalar İçinde Kurulum
      description: Kutuyu açın, birlikte verilen pompayla şişirin ve doldurun; sert ve düz bir zeminde tam kurulum genellikle 15-30 dakika sürer.
      icon: tabler:rocket
    - title: Basit Su Bakımı
      description: Standart 32/38 mm filtre pompası portları, düzenli pH kontrolleri ve yuvarlak modellerdeki takılı kapak suyu temiz tutar.
      icon: tabler:droplet
    - title: Temizleyin, Tahliye Edin ve Saklayın
      description: Havuzu boşaltın, kurutun, yuvarlayın ve kış için saklama çantasına koyun. Bakım yapılması gereken kalıcı kurulum yok.
      icon: tabler:package
    - title: Önce Güvenlik
      description: Çocuklar her zaman bir yetişkin tarafından aktif olarak denetlenmelidir. Kılavuza, yerel kurallara ve güvenli kullanım kılavuzuna uyun.
      icon: tabler:shield-check
steps:
  title: Kutudan Arka Bahçeye
  items:
    - title: '1. Adım: <span class="font-medium">Havuzunuzu Seçin</span>'
      description: Alanınıza, evinize ve suyu nasıl kullanmayı planladığınıza uyacak şekilde şekil ve boyutları karşılaştırın.
      icon: tabler:pool
    - title: 'Adım 2: <span class="font-medium">Ayarla</span>'
      description: Sağlam, düz bir zemine yerleştirin, birlikte verilen elektrikli pompayla şişirin ve bir bahçe hortumuyla doldurun.
      icon: tabler:rocket
    - title: '3. Adım: <span class="font-medium">Bütün Yaz Yüzmek</span>'
      description: Basit bir bakımla suyu taze tutun; herhangi bir küçük havuz gibi süzün, örtün ve pH'ı kontrol edin.
      icon: tabler:ripple
    - title: 'Adım 4: <span class="font-medium">Uzakta Saklayın</span>'
      description: Sezon bitince havuzu süzün, kurulayın, toplayın ve bir sonraki yaza kadar poşetinde saklayın.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.png
    alt: Felizbay yuvarlak Drop Stitch şişme yüzme havuzu
blog_latest:
  title: Havuz Kılavuzları ve Bilgiler
  information: |
    Şişirilebilir yüzme havuzları için kurulum kılavuzları, bakım ipuçları ve satın alma tavsiyeleri
    Felizbay ekibinden.
faqs:
  title: Şişme Havuz SSS
  subtitle: Felizbay şişme yüzme havuzları hakkında sık sorulan sorular.
  columns: 2
  items:
    - title: Kurulum ne kadar sürer?
      description: Birlikte verilen elektrikli hava pompasıyla şişirme işlemi yaklaşık 10 dakika sürer; Yerleştirme ve doldurma dahil tam kurulum genellikle 15-30 dakikadır.
      icon: tabler:clock
      category: all
    - title: Drop Stitch havuzu ne kadar serttir?
      description: Çok katı. Drop Stitch duvarları, şişirilebilir kürek tahtasına benzer şekilde 4-5 PSI'da sert bir şekilde şişer, böylece havuz suyla doldurulduğunda şeklini korur.
      icon: tabler:hexagon
      category: all
    - title: Çocuklar havuzu kullanabilir mi?
      description: Evet, her zaman aktif yetişkin gözetiminde. Çocuklar asla havuzun içinde veya yakınında gözetimsiz bırakılmamalıdır; kılavuza ve yerel güvenlik kurallarına uyun.
      icon: tabler:users
      category: all
    - title: Havuzu kışın nasıl saklarım?
      description: Suyu boşaltın, havuzun havasını söndürün, tamamen kurumasını bekleyin, ardından yuvarlayın ve birlikte verilen saklama çantasında donmayacak bir yerde saklayın.
      icon: tabler:package
      category: all
    - title: Havuza neler dahil?
      description: Her Felizbay havuzunda elektrikli hava pompası, tamir seti ve saklama çantası bulunmaktadır. Yuvarlak modellerde isteğe bağlı olarak takılan bir kapak bulunur.
      icon: tabler:box
      category: all
    - title: Hangi boyutlar mevcut?
      description: Dört koleksiyonda 48 standart SKU - çapı 10 m'ye kadar yuvarlak havuzlar, 6 × 5 m'ye kadar dikdörtgen havuzlar ve yerleşik koltuklu SPA küvetleri. İş ortakları için özel boyutlar mevcuttur.
      icon: tabler:ruler-2
      category: all
    - title: Havuz hangi yüzeylerde durabilir?
      description: Çimenlik, veranda veya teras gibi keskin nesnelerin bulunmadığı herhangi bir düz, düz yüzey. Pürüzlü yüzeylerde zemin örtüsü tavsiye edilir. Yüzeyin dolu havuzun ağırlığını taşıyabildiğini kontrol edin.
      icon: tabler:layout-grid
      category: all
    - title: Suyu nasıl temiz tutabilirim?
      description: Takılı olduğu yerde bir filtre pompası kullanın, kalıntıları temizleyin, pH'ı kontrol edin ve kullanılmadığında havuzun üzerini kapatın. Suyun ne kadar dayanacağı havuz büyüklüğüne, kullanıma ve filtrelemeye bağlıdır; sabit bir programa bağlı kalmak yerine düzenli olarak test yapın.
      icon: tabler:droplet
      category: all
