hero_text:
  tagline: Temas etmek
  title: İLETİŞİME GEÇİN
contact_form:
  id: form
  title: Bize bir mesaj gönderin
  subtitle: Fiyat teklifleri, teknik sorular veya ortaklık sorularınız için bize bir satır bırakın. Bir iş günü içinde cevap veriyoruz.
  email_to: info@felizbay.com
  submit_button: Talep Gönder → Teklif Al
  success_message: Teşekkürler! Mesajınız gelen kutumuza ulaştı. Bir iş günü içinde cevap vereceğiz.
  error_message: Mesajınızı gönderirken bir şeyler ters gitti. Lütfen tekrar deneyin veya doğrudan bize e-posta gönderin.
  default_country_code: "+1"
  captcha:
    label: "Spam önleme: lütfen aşağıdakileri çözün"
  fields:
    - name: firstName
      label: İlk adı
      row: 1
    - name: lastName
      label: Soy isim
      row: 1
    - name: inquiryType
      label: Talep Türü
      row: 2
      type: select
      options:
        - value: ""
          label: Talebiniz ne hakkında?
        - value: retail
          label: Tek havuz online siparişi (perakende)
        - value: wholesale
          label: Toptan / toplu sipariş (B2B)
        - value: oem
          label: OEM/ODM özelleştirmesi
        - value: support
          label: Satış sonrası destek ve garanti
    - name: companyName
      label: Firma Adı
      row: 3
    - name: address
      label: Adres
      row: 4
    - name: zip
      label: Posta Kodu / Posta Kodu
      row: 5
    - name: country
      label: Ülke
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-posta
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Tahmini Sipariş Hacmi
      row: 7
      type: select
      options:
        - value: ""
          label: Tahmini hacminizi seçin...
        - value: 1-unit
          label: 1 adet — tek havuz (online perakende siparişi)
        - value: sample
          label: Yalnızca numuneler / Prototipler
        - value: 5-10
          label: 5–10 adet (Standart Adedi)
        - value: 100-500
          label: 100–500 adet
        - value: 500-plus
          label: 500+ birim (Toplu fiyatlandırma)
    - name: customization
      label: Özelleştirme Gerekli mi?
      row: 8
      type: select
      options:
        - value: ""
          label: Özelleştirme türünü seçin...
        - value: none
          label: Standart ürün (özelleştirme yok)
        - value: logo
          label: Yalnızca Özel Logo / Markalama
        - value: full
          label: Tam OEM (boyut, renk, grafikler, ambalaj)
        - value: consultation
          label: Emin değilim — danışmaya ihtiyacım var
    - name: productInterest
      label: İlgi Havuzu
      row: 9
      type: select
      options:
        - value: ""
          label: Havuz tipini seçin...
        - value: all
          label: Tüm havuzlar / Tam katalog
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Taşınabilir jakuzi — Yuvarlak
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Jakuzi / Swim Spa — Kare
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Ders
      row: 10
    - name: message
      label: Mesaj
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Bize ulaşmanın diğer yolları
  columns: 3
  items:
    - title: Satış soruları
      description: Havuz fiyatları, toptan fiyatlandırma ve toplu siparişler.
      icon: tabler:shopping-bag
    - title: Teknik destek
      description: Kurulum yardımı, onarımlar, yedek parçalar ve bakımla ilgili sorular.
      icon: tabler:tool
    - title: OEM / ODM
      description: Özel boyutlar, renkler, kapaklar, markalama ve paketleme.
      icon: tabler:palette
    - title: E-posta
      description: info@felizbay.com
      icon: tabler:mail
    - title: Web sitesi
      description: felizbay.com
      icon: tabler:world
    - title: Tepki süresi
      description: Bir iş günü içinde cevap veriyoruz.
      icon: tabler:clock
map:
  title: İletişime Geçin
  subtitle: Felizbay ile iletişime geçin
  address: felizbay.com
  zoom: 15
