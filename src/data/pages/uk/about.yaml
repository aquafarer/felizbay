production_section:
  tagline: Досконалість виробництва
  title: Гарантія вишуканої майстерності
  description: Виробнича лінія Felizbay призначена для високоякісних, міцних надувних басейнів високого тиску.
  cards:
    - title: Досвідчена команда техніків
      items:
        - Професійні знання про стібки та ПВХ матеріали
        - Точна майстерність різання, зварювання та складання
        - Постійне навчання для оволодіння новітніми технологіями виробництва
    - title: Сучасне виробниче обладнання
      items:
        - Обладнання для точного різання тканинних панелей
        - Високоточне термозварювання для герметичних, міцних швів
        - Професійне обладнання для перевірки тиску та герметичності
    - title: Зріла система управління
      items:
        - Стандартизовані виробничі процеси з чіткими стандартами якості
        - Філософія економічного виробництва, що зменшує відходи та підвищує ефективність
        - Ефективне управління ланцюгом поставок з надійними постачальниками
    - title: Суворий контроль якості
      items:
        - 'Багатоступенева перевірка: сировина, виробничий, кінцевий вихідний'
        - Випробування тиском у верхній частині номінального робочого діапазону 4-6 PSI
        - Суворе тестування на герметичність і довговічність перед відправкою
