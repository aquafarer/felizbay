hero:
  tagline: Про нас
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Надувний басейн Felizbay
  title: |
    Зробити плавання простим, <br />
    у стилі <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay — бренд надувних басейнів преміум-класу Drop Stitch, розроблений і керований компанією Aquafarer LLC (США). Ми віримо, що кожна родина заслуговує на справжній басейн у дворі — надземна установка без постійного будівництва басейну. Наші басейни накачуються за лічені хвилини, переживають повне літо сімейних розваг і збираються в кінці сезону. Вимоги до дозволів, огорож та установки відрізняються залежно від розташування.
