use_cases:
  tagline: 'Сценарії використання'
  title: 'Створений для справжнього плавання у дворі'
  subtitle: 'Чотири реальні сценарії, у яких власники використовують басейн Felizbay – від сімейних вихідних до відновлювальних ванн.'
  scenario_label: 'Сценарій'
  solution_label: 'Рішення'
  cards:
    - title: 'Сімейне плавання у дворі'
      description: 'Басейн повного розміру для літніх канікул, днів народження та щоденних ігор після школи.'
      alt: 'Сім''я відпочиває у великому круглоому басейні Felizbay зі стінками Drop-Stitch на літній зустрічі у дворі.'
      image: /images/pool-ideas/large-pools-for-family-gatherings.webp
      href: /pool-ideas/backyard-pools-for-families/
      scenario: 'На сімейні зустрічі та басейнові вечірки збирається вся родина, і маленького басейну для ігор замало – тим часом капітальний басейн неможливий, заборонений чи надто дорогий.'
      solution: 'Великі Drop-Stitch басейни до Ø 10 м круглі та 6 × 5 м прямокутні, з жорсткими стінками до 1,5 м, які надуваються за лічені хвилини комплектним 1000W електронасосом.'
      pills:
        - 'Круглий басейн'
        - 'Прямокутний басейн'
        - 'Електронасос 1000W'
    - title: 'Маленькі двори та таунхауси'
      description: 'Справжній басейн, що вміщується на патіо таунхауса, у бічному проході чи компактному внутрішньому дворі.'
      alt: 'Круглий надувний басейн Felizbay на маленькому патіо сучасного таунхауса.'
      image: /images/pool-ideas/townhome-and-compact-yard-pools.webp
      href: /pool-ideas/townhome-and-compact-yard-pools/
      scenario: 'Простір починається приблизно від 2 × 2 м, а копати чи будувати не можна – басейн має звільнити місце в кінці сезону.'
      solution: 'Компактні габарити від Ø 2 м круглий та 2 × 2 м прямокутний, з жорсткими 4-6 PSI стінками, які все одно виглядають як справжній басейн і складаються в сумку для зберігання на зиму.'
      pills:
        - 'Круглий басейн'
        - 'Прямокутний басейн'
        - 'Ремкомплект'
    - title: 'Аквафітнес і вправи у воді'
      description: 'Аквааеробіка, ходьба з опором та сімейні ігри на широкій і стабільній платформі.'
      alt: 'Сім''я робить вправи у воді та грається у просторому круглому басейні Felizbay.'
      image: /images/pool-ideas/pools-for-water-fitness-and-recreation.webp
      href: /pool-ideas/pools-for-water-fitness-and-recreation/
      scenario: 'Низькоударні рухи потребують корисної площі та вертикальних стінок – м''які кільцеві басейни втрачають внутрішній простір через похилі стінки, а вода виливається через край під час активної гри.'
      solution: 'Прямі 90-градусні Drop-Stitch стінки та плоске, стабільне дно при 4-6 PSI; круглі басейни Ø 3-5 м дають найбільше вільного простору для рухів на квадратний метр.'
      pills:
        - 'Круглий басейн'
        - 'Насос з піщаним фільтром'
        - 'Драбина з 4 сходинками'
    - title: 'Гарячі ванни та холодне відновлення'
      description: 'Компактна станція для купання та холодних занурень для патіо та гаражних спортзалів.'
      alt: 'Чоловік робить відновлювальне холодне занурення у круглій сірій ванні Felizbay у гаражному спортзалі.'
      image: /images/pool-ideas/cold-plunge-and-recovery-pools.webp
      href: /pool-ideas/cold-plunge-and-recovery-pools/
      scenario: 'Спортсменам і шанувальникам фітнесу потрібні жорсткі стінки, ізоляція, що сповільнює нагрів, та затінене рівне місце приблизно від 1,5 × 1,5 м.'
      solution: 'Ізольовані SPA ванни від Ø 1,8 м зі вбудованими сидіннями та 5 мм термічним дном; нагрівачі та обладнання для охолодження води зовнішні й продаються окремо.'
      pills:
        - 'Кругла SPA-ванна'
        - 'Квадратна SPA-ванна'
        - 'Ізольоване дно'

