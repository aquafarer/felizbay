hero_text:
  tagline: контакт
  title: ЗВ'ЯЖІТЬСЯ
contact_form:
  id: form
  title: Надішліть нам повідомлення
  subtitle: Щоб отримати пропозиції, отримати технічні запитання чи запити про партнерство, зв’яжіться з нами. Ми відповідаємо протягом одного робочого дня.
  email_to: info@felizbay.com
  submit_button: Надіслати запит → Отримати пропозицію
  success_message: дякую Ваше повідомлення надійшло до нашої поштової скриньки. Ми відповімо протягом одного робочого дня.
  error_message: Під час надсилання повідомлення сталася помилка. Спробуйте ще раз або напишіть нам напряму.
  default_country_code: "+1"
  captcha:
    label: "Антиспам: вирішіть наступне"
  fields:
    - name: firstName
      label: Ім'я
      row: 1
    - name: lastName
      label: Прізвище
      row: 1
    - name: inquiryType
      label: Тип звернення
      row: 2
      type: select
      options:
        - value: ""
          label: Про що ваше звернення?
        - value: retail
          label: Онлайн-замовлення одного басейну (роздріб)
        - value: wholesale
          label: Оптове / масове замовлення (B2B)
        - value: oem
          label: Кастомізація OEM/ODM
        - value: support
          label: Післяпродажна підтримка та гарантія
    - name: companyName
      label: Назва компанії
      row: 3
    - name: address
      label: Адреса
      row: 4
    - name: zip
      label: Поштовий індекс
      row: 5
    - name: country
      label: Країна
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: Електронна пошта
      row: 6
      type: email
    - name: tel
      label: ТЕЛ
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Орієнтовний обсяг замовлення
      row: 7
      type: select
      options:
        - value: ""
          label: Виберіть приблизний обсяг...
        - value: 1-unit
          label: 1 шт. — один басейн (онлайн-роздрібне замовлення)
        - value: sample
          label: Лише зразки/прототипи
        - value: 5-10
          label: 5–10 одиниць (стандарт MOQ)
        - value: 100-500
          label: 100–500 одиниць
        - value: 500-plus
          label: 500+ одиниць (об’ємна ціна)
    - name: customization
      label: Потрібна настройка?
      row: 8
      type: select
      options:
        - value: ""
          label: Виберіть тип налаштування...
        - value: none
          label: Стандартний продукт (без налаштування)
        - value: logo
          label: Лише спеціальний логотип / брендинг
        - value: full
          label: Повний OEM (розмір, колір, графіка, упаковка)
        - value: consultation
          label: Не впевнений — потрібна консультація
    - name: productInterest
      label: Пул інтересів
      row: 9
      type: select
      options:
        - value: ""
          label: Виберіть тип басейну...
        - value: all
          label: Всі басейни / Повний каталог
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Портативне джакузі — Кругле
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Джакузі / Swim Spa — Квадратне
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Тема
      row: 10
    - name: message
      label: повідомлення
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Інші шляхи до нас
  columns: 3
  items:
    - title: Запити щодо продажу
      description: Об’єднання котирувань, оптові ціни та оптові замовлення.
      icon: tabler:shopping-bag
    - title: Технічна підтримка
      description: Допомога з налаштування, ремонт, запасні частини та питання догляду.
      icon: tabler:tool
    - title: OEM / ODM
      description: Нестандартні розміри, кольори, обкладинки, брендування та упаковка.
      icon: tabler:palette
    - title: Електронна пошта
      description: info@felizbay.com
      icon: tabler:mail
    - title: Веб-сайт
      description: felizbay.com
      icon: tabler:world
    - title: Час відгуку
      description: Ми відповідаємо протягом одного робочого дня.
      icon: tabler:clock
map:
  title: Зв'яжіться з нами
  subtitle: Зв'яжіться з Felizbay
  address: felizbay.com
  zoom: 15
