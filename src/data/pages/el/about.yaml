production_section:
  tagline: Αριστεία Παραγωγής
  title: Εξασφάλιση εξαιρετικής χειροτεχνίας
  description: Η γραμμή παραγωγής Felizbay είναι αφιερωμένη σε υψηλής ποιότητας, ανθεκτικές και υψηλής πίεσης φουσκωτές πισίνες.
  cards:
    - title: Ομάδα έμπειρων τεχνικών
      items:
        - Επαγγελματική γνώση σταγονοβελονιάς και υλικών PVC
        - Ακριβής δεξιοτεχνία στην κοπή, τη συγκόλληση και τη συναρμολόγηση
        - Συνεχής εκπαίδευση για τον έλεγχο των πιο πρόσφατων τεχνολογιών παραγωγής
    - title: Προηγμένος Εξοπλισμός Παραγωγής
      items:
        - Εξοπλισμός κοπής ακριβείας για υφασμάτινα πάνελ ακριβείας
        - Συγκόλληση θερμότητας υψηλής ακρίβειας για αεροστεγείς, ανθεκτικές ραφές
        - Επαγγελματικός εξοπλισμός δοκιμών πίεσης και αεροστεγανότητας
    - title: Σύστημα ώριμης διαχείρισης
      items:
        - Τυποποιημένες διαδικασίες παραγωγής με σαφή πρότυπα ποιότητας
        - Φιλοσοφία λιτής παραγωγής που μειώνει τα απόβλητα και βελτιώνει την απόδοση
        - Αποτελεσματική διαχείριση της εφοδιαστικής αλυσίδας με αξιόπιστους προμηθευτές
    - title: Αυστηρός Ποιοτικός Έλεγχος
      items:
        - 'Επιθεώρηση πολλαπλών σταδίων: πρώτη ύλη, εν εξελίξει, τελική εξερχόμενη'
        - Δοκιμή πίεσης στην κορυφή της ονομαστικής περιοχής εργασίας 4-6 PSI
        - Αυστηρός έλεγχος αεροστεγανότητας και ανθεκτικότητας πριν από την αποστολή
global_ops_section:
  tagline: Παγκόσμια Απήχηση
  title_html: Μία μάρκα, <span class="text-white/90">παγκόσμια αποστολή</span>
