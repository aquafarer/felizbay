brand_hub_subtitle: Ανακαλύψτε τις συλλογές μας για φουσκωτές πισίνες κατασκευασμένες με τεχνολογία Drop Stitch υψηλής πίεσης.
brand_hub_cards:
  - title: Ορθογώνιες Πισίνες
    desc: Ορθογώνιες πισίνες Drop Stitch οικογενειακού μεγέθους με άκαμπτους τοίχους και μέγιστη περιοχή κολύμβησης.
