hero:
  tagline: Σχετικά με εμάς
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Φουσκωτή πισίνα Felizbay
  title: |
    Κάνοντας το κολύμπι απλό, <br />
    με το στυλ <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Το Felizbay είναι μια premium μάρκα φουσκωτή πισίνα Drop Stitch που σχεδιάστηκε και λειτουργεί από την Aquafarer LLC (ΗΠΑ). Πιστεύουμε ότι κάθε οικογένεια αξίζει μια πραγματική πισίνα στην πίσω αυλή — επίγειη εγκατάσταση χωρίς μόνιμη κατασκευή πισίνας. Οι πισίνες μας φουσκώνουν άκαμπτες μέσα σε λίγα λεπτά, επιβιώνουν σε ολόκληρα καλοκαίρια οικογενειακής διασκέδασης και μαζεύονται μικρές στο τέλος της σεζόν. Οι απαιτήσεις για άδειες, φράχτες και εγκατάσταση διαφέρουν ανά τοποθεσία.
stats:
  title: Με τους αριθμούς
  columns: 4
  stats:
    - title: Συλλογές πισίνας
      amount: '4'
    - title: 'Χρόνος φουσκώματος'
      amount: '5-15 min'
    - title: Ονομαστική πίεση
      amount: 4-6 PSI
    - title: Επαφή
      amount: info@felizbay.com
features3_what_we_build:
  title: Αυτό που χτίζουμε
  subtitle: Μια εστιασμένη σειρά προϊόντων που γνωρίζουμε από μέσα προς τα έξω — φουσκωτές πισίνες Drop Stitch υψηλής πίεσης.
  columns: 3
  isBeforeContent: true
  items:
    - title: Ορθογώνιες πισίνες
      description: Ορθογώνιες πισίνες Drop Stitch οικογενειακού μεγέθους που μεγιστοποιούν την περιοχή κολύμβησης για τον χώρο σας.
      icon: tabler:rectangle
    - title: Στρογγυλές μπλε πισίνες
      description: Η κλασική πισίνα στην πίσω αυλή — ζωηρό μπλε, άκαμπτοι τοίχοι Drop Stitch, γρήγορη εγκατάσταση.
      icon: tabler:circle
    - title: Στρογγυλές γκρι πισίνες
      description: Η premium σειρά μας με μοντέρνο γκρι φινίρισμα και προαιρετικά τοποθετημένο κάλυμμα.
      icon: tabler:circle-dot
    - title: Υδρομασάζ Πισίνες SPA
      description: 'Μοντέλα υδρομασάζ με μόνωση με ενσωματωμένα καθίσματα και μονωμένο πάτο 5 mm — για χρήση με εξωτερικές θερμάστρες (δεν περιλαμβάνεται θερμάστρα).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Ολοκληρωμένα πακέτα
      description: Κάθε σετ πισίνας συνοδεύεται από ηλεκτρική αντλία αέρα, κιτ επισκευής και τσάντα αποθήκευσης.
      icon: tabler:package
    - title: Προσαρμοσμένα μεγέθη
      description: Μεγέθη, χρώματα και καλύμματα OEM για μάρκες, διανομείς και έργα φιλοξενίας.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Κατασκευή ιδιωτικής ετικέτας με εκτύπωση λογότυπου και έτοιμη συσκευασία λιανικής.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Felizbay ορθογώνια φουσκωτή πισίνα Drop Stitch
steps2_values:
  title: Οι αξίες μας
  subtitle: Τρεις αρχές που διαμορφώνουν κάθε πισίνα που κατασκευάζουμε.
  items:
    - title: Φτιάξτε όπως θα το χρησιμοποιήσει η οικογένειά σας
      description: Κάθε ραφή, τοίχος και βαλβίδα αντιμετωπίζεται σαν να κολυμπούν οι δικές μας οικογένειες.
      icon: tabler:heart
    - title: Μηχανικός πριν πουλήσουμε
      description: Κατασκευή Drop Stitch υψηλής πίεσης, δοκιμασμένη στο ανώτατο όριο της ονομαστικής της πίεσης, πριν από οποιαδήποτε πλοία πισίνας.
      icon: tabler:settings
    - title: Υποστήριξη που διαρκεί περισσότερο από τη σεζόν
      description: Ερωτήσεις, ανταλλακτικά ή εγγύηση — επικοινωνήστε μαζί μας ανά πάσα στιγμή στο info@felizbay.com.
      icon: tabler:headset
steps2_milestones:
  title: Ορόσημα
  subtitle: Μια σύντομη εκδοχή της ιστορίας του Felizbay.
  isReversed: true
  items:
    - title: Επικεντρώθηκε στις φουσκωτές πισίνες
      description: 'Η Felizbay ιδρύθηκε με ένα μόνο επίκεντρο: φουσκωτές πισίνες premium drop stitch.'
      icon: tabler:pool
    - title: Τρεις συλλογές υπογραφών
      description: Ορθογώνιες, στρογγυλές μπλε και στρογγυλές γκρι γραμμές πισίνας, καθεμία με προαιρετικά καλύμματα και προσαρμοσμένα μεγέθη.
      icon: tabler:circle-check
    - title: OEM/ODM για συνεργάτες σε όλο τον κόσμο
      description: Προσαρμοσμένη κατασκευή για μάρκες, διανομείς, ξενοδοχεία και χειριστές glamping.
      icon: tabler:world
features2_locations:
  title: Ελάτε σε επαφή
  tagline: Επαφή
  columns: 3
  items:
    - title: E-mail
      description: info@felizbay.com — απαντάμε εντός μίας εργάσιμης ημέρας.
    - title: Δικτυακός τόπος
      description: felizbay.com — περιηγηθείτε στις πισίνες μας και ζητήστε μια προσφορά.
    - title: OEM / Χονδρική
      description: Προσαρμοσμένα μεγέθη, χρώματα και επωνυμία διαθέσιμα για επιχειρηματικούς συνεργάτες.
