hero_text:
  tagline: Επαφή
  title: ΕΠΙΚΟΙΝΩΝΗΣΤΕ
contact_form:
  id: form
  title: Στείλτε μας ένα μήνυμα
  subtitle: Για προσφορές, τεχνικές ερωτήσεις ή ερωτήσεις συνεργασίας, στείλτε μας μια γραμμή. Απαντάμε εντός μιας εργάσιμης ημέρας.
  email_to: info@felizbay.com
  submit_button: Αποστολή ερωτήματος → Λάβετε προσφορά
  success_message: Ευχαριστώ! Το μήνυμά σας έφτασε στα εισερχόμενά μας. Θα απαντήσουμε εντός μιας εργάσιμης ημέρας.
  error_message: Παρουσιάστηκε κάποιο πρόβλημα κατά την αποστολή του μηνύματός σας. Δοκιμάστε ξανά ή στείλτε μας email απευθείας.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: λύστε τα παρακάτω"
  fields:
    - name: firstName
      label: Ονομα
      row: 1
    - name: lastName
      label: Επώνυμο
      row: 1
    - name: inquiryType
      label: Τύπος αιτήματος
      row: 2
      type: select
      options:
        - value: ""
          label: Σε τι αφορά το αίτημά σας;
        - value: retail
          label: Διαδικτυακή παραγγελία μίας πισίνας (λιανική)
        - value: wholesale
          label: Χονδρική / μαζική παραγγελία (B2B)
        - value: oem
          label: Προσαρμογή OEM/ODM
        - value: support
          label: Μεταπωλητική υποστήριξη και εγγύηση
    - name: companyName
      label: Όνομα εταιρείας
      row: 3
    - name: address
      label: Διεύθυνση
      row: 4
    - name: zip
      label: Ταχυδρομικός Κώδικας
      row: 5
    - name: country
      label: Χώρα
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 6
      type: email
    - name: tel
      label: ΤΗΛ
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Εκτιμώμενος όγκος παραγγελιών
      row: 7
      type: select
      options:
        - value: ""
          label: Επιλέξτε τον εκτιμώμενο όγκο σας...
        - value: 1-unit
          label: 1 τεμ. — μία πισίνα (διαδικτυακή λιανική παραγγελία)
        - value: sample
          label: Δείγματα / Πρωτότυπα μόνο
        - value: 5-10
          label: 5–10 μονάδες (Τυπικό MOQ)
        - value: 100-500
          label: 100–500 μονάδες
        - value: 500-plus
          label: 500+ μονάδες (τιμολόγηση όγκου)
    - name: customization
      label: Απαιτείται προσαρμογή;
      row: 8
      type: select
      options:
        - value: ""
          label: Επιλέξτε τύπο προσαρμογής...
        - value: none
          label: Τυπικό προϊόν (χωρίς προσαρμογή)
        - value: logo
          label: Προσαρμοσμένο λογότυπο / Μόνο επωνυμία
        - value: full
          label: Πλήρης OEM (μέγεθος, χρώμα, γραφικά, συσκευασία)
        - value: consultation
          label: Δεν είμαι σίγουρος - χρειάζεται διαβούλευση
    - name: productInterest
      label: Δεξαμενή Ενδιαφέροντος
      row: 9
      type: select
      options:
        - value: ""
          label: Επιλέξτε τύπο πισίνας...
        - value: all
          label: Όλες οι πισίνες / Πλήρης κατάλογος
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Φορητό τζακούζι — Στρογγυλό
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Τζακούζι / Swim Spa — Τετράγωνο
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Θέμα
      row: 10
    - name: message
      label: Μήνυμα
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Άλλοι τρόποι να επικοινωνήσετε μαζί μας
  columns: 3
  items:
    - title: Ερωτήσεις πωλήσεων
      description: Προσφορές πισίνας, τιμές χονδρικής και μαζικές παραγγελίες.
      icon: tabler:shopping-bag
    - title: Τεχνική υποστήριξη
      description: Βοήθεια εγκατάστασης, επισκευές, ανταλλακτικά και ερωτήσεις φροντίδας.
      icon: tabler:tool
    - title: OEM / ODM
      description: Προσαρμοσμένα μεγέθη, χρώματα, καλύμματα, επωνυμία και συσκευασία.
      icon: tabler:palette
    - title: E-mail
      description: info@felizbay.com
      icon: tabler:mail
    - title: Δικτυακός τόπος
      description: felizbay.com
      icon: tabler:world
    - title: Χρόνος απόκρισης
      description: Απαντάμε εντός μιας εργάσιμης ημέρας.
      icon: tabler:clock
map:
  title: Επικοινωνήστε
  subtitle: Επικοινωνήστε με το Felizbay
  address: felizbay.com
  zoom: 15
