use_cases:
  tagline: 'Περιπτώσεις Χρήσης'
  title: 'Σχεδιασμένο για πραγματική κολύμβηση στον κήπο'
  subtitle: 'Τέσσερις πραγματικοί τρόποι που οι ιδιοκτήτες αξιοποιούν μια πισίνα Felizbay – από οικογενειακά σαββατοκύριακα έως μπάνια αποκατάστασης.'
  scenario_label: 'Σενάριο'
  solution_label: 'Λύση'
  cards:
    - title: 'Οικογενειακή κολύμβηση στον κήπο'
      description: 'Μια πισίνα πλήρους μεγέθους για καλοκαιρινές διακοπές, γενέθλια και καθημερινό παιχνίδι μετά το σχολείο.'
      alt: 'Μια οικογένεια χαλαρώνει σε μια μεγάλη στρογγυλή πισίνα Felizbay με τοίχους Drop-Stitch σε μια καλοκαιρινή συγκέντρωση στον κήπο.'
      image: /images/pool-ideas/large-pools-for-family-gatherings.webp
      href: /pool-ideas/backyard-pools-for-families/
      scenario: 'Στις οικογενειακές συγκεντρώσεις και τα πάρτι πισίνας εμφανίζεται όλη η οικογένεια και μια μικρή παιδική πισίνα δεν επαρκεί – ενώ μια μόνιμη πισίνα είναι αδύνατη, απαγορευμένη ή υπερβολικά ακριβή.'
      solution: 'Μεγάλες πισίνες Drop-Stitch έως Ø 10 m στρογγυλές και 6 × 5 m ορθογώνιες, με άκαμπτους τοίχους έως 1,5 m που φουσκώνουν σε λεπτά με την περιλαμβανόμενη 1000W ηλεκτρική αντλία.'
      pills:
        - 'Στρογγυλή πισίνα'
        - 'Ορθογώνια πισίνα'
        - 'Ηλεκτρική αντλία 1000W'
    - title: 'Μικροί κήποι και σπίτια σε σειρά'
      description: 'Μια πραγματική πισίνα που ταιριάζει σε αυλή σπιτιού σε σειρά, πλευρικό διάδρομο ή συμπαγή αυλή.'
      alt: 'Μια στρογγυλή φουσκωτή πισίνα Felizbay στη μικρή αυλή ενός σύγχρονου σπιτιού σε σειρά.'
      image: /images/pool-ideas/townhome-and-compact-yard-pools.webp
      href: /pool-ideas/townhome-and-compact-yard-pools/
      scenario: 'Ο χώρος ξεκινά από περίπου 2 × 2 m και δεν υπάρχει δυνατότητα εκσκαφής ή δόμησης – η πισίνα πρέπει να απελευθερώνει τον χώρο στο τέλος της σεζόν.'
      solution: 'Συμπαγή μεγέθη από Ø 2 m στρογγυλή και 2 × 2 m ορθογώνια, με άκαμπτους τοίχους 4-6 PSI που εξακολουθούν να μοιάζουν με πραγματική πισίνα και διπλώνονται σε θήκη αποθήκευσης για τον χειμώνα.'
      pills:
        - 'Στρογγυλή πισίνα'
        - 'Ορθογώνια πισίνα'
        - 'Κιτ επισκευής'
    - title: 'Aqua fitness και ασκήσεις στο νερό'
      description: 'Αερόμπικ στο νερό, βάδισμα αντίστασης και οικογενειακά παιχνίδια σε μια ευρεία, σταθερή πλατφόρμα.'
      alt: 'Μια οικογένεια κάνει ασκήσεις στο νερό και παιχνίδια σε μια ευρύχωρη στρογγυλή πισίνα Felizbay.'
      image: /images/pool-ideas/pools-for-water-fitness-and-recreation.webp
      href: /pool-ideas/pools-for-water-fitness-and-recreation/
      scenario: 'Η κίνηση χαμηλής πρόσκρουσης χρειάζεται χρησιμοποιήσιμη επιφάνεια δαπέδου και κάθετους τοίχους – οι μαλακές πισίνες δακτυλίου χάνουν εσωτερικό χώρο σε κεκλιμένες πλευρές και το νερό ξεχειλίζει κατά το ενεργητικό παιχνίδι.'
      solution: 'Ευθείοι τοίχοι Drop-Stitch 90 μοιρών και επίπεδο, σταθερό δάπεδο στα 4-6 PSI· οι στρογγυλές Ø 3-5 m προσφέρουν τον περισσότερο ανεμπόδιστο χώρο κίνησης ανά τετραγωνικό μέτρο.'
      pills:
        - 'Στρογγυλή πισίνα'
        - 'Αντλία φίλτρου άμμου'
        - 'Σκάλα 4 βαθμίδων'
    - title: 'Ζεστό μπάνιο και κρύα αποκατάσταση'
      description: 'Ένας συμπαγής σταθμός μπάνιου και κρύας βουτιάς για αυλές και γκαράζ-γυμναστήρια.'
      alt: 'Ένας άνδρας κάνει συνεδρία κρύας βουτιάς αποκατάστασης σε μια στρογγυλή γκρι μπανιέρα Felizbay σε γκαράζ-γυμναστήριο.'
      image: /images/pool-ideas/cold-plunge-and-recovery-pools.webp
      href: /pool-ideas/cold-plunge-and-recovery-pools/
      scenario: 'Αθλητές και λάτρεις του fitness χρειάζονται άκαμπτους τοίχους, μόνωση που επιβραδύνει τη θέρμανση και ένα σκιερό επίπεδο σημείο από περίπου 1,5 × 1,5 m.'
      solution: 'Μονωμένες μπανιέρες SPA από Ø 1,8 m με ενσωματωμένα καθίσματα και θερμικό πάτο 5 mm· οι θερμάστρες και ο εξοπλισμός ψύξης νερού είναι εξωτερικοί και πωλούνται ξεχωριστά.'
      pills:
        - 'Στρογγυλή μπανιέρα SPA'
        - 'Τετράγωνη μπανιέρα SPA'
        - 'Μονωμένος πυθμένας'

