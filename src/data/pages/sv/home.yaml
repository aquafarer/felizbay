features:
  id: features
  tagline: Drop Stitch-teknik
  title: Varför en Felizbay Pool<br />är annorlunda
  subtitle: Högtrycks-Drop Stitch-konstruktion gör våra pooler styva, hållbara och lätta att lagra.
  columns: 2
  items:
    - title: Styva Drop Stitch-väggar
      description: Tusentals invändiga gängor låser ihop vägglagren, så poolen blåser upp stenhårt vid 4-5 PSI och behåller sin form när den fylls.
      icon: tabler:hexagon
    - title: Snabb, verktygsfri installation
      description: Blås upp med den medföljande elektriska pumpen på några minuter och fyll sedan med en trädgårdsslang. Inga verktyg, ingen konstruktion, ingen professionell installation.
      icon: tabler:rocket
    - title: Packar bort små
      description: Töm, töm ut luften, rulla ihop och förvara poolen i en påse över vintern. En pool i full storlek som får plats i en garderob.
      icon: tabler:package
    - title: Hållbar och UV-beständig
      description: Dubbellager PVC Drop Stitch-tyg motstår punkteringar, UV-exponering och en hel säsong av familjeanvändning.
      icon: tabler:shield
    - title: Komplett paket
      description: Varje pool levereras med en elektrisk luftpump, reparationssats och förvaringsväska. Passade överdrag tillgängliga för runda modeller.
      icon: tabler:box
    - title: Säkerhetsmedveten design
      description: Bostadspooldesign med hänvisning till EN 16582-1 och ASTM F2666, med övertrycksventiler och stabila styva väggar. Ständig vuxenövervakning krävs alltid.
      icon: tabler:shield-check
