hero_text:
  tagline: Kontakta
  title: TA KONTAKT
contact_form:
  id: form
  title: Skicka ett meddelande till oss
  subtitle: För offerter, tekniska frågor eller partnerskapsförfrågningar, kontakta oss. Vi svarar inom en arbetsdag.
  email_to: info@felizbay.com
  submit_button: Skicka förfrågan → Få en offert
  success_message: Tack! Ditt meddelande har hamnat i vår inkorg. Vi kommer att svara inom en arbetsdag.
  error_message: Något gick fel när ditt meddelande skickades. Försök igen eller maila oss direkt.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: lösa följande"
  fields:
    - name: firstName
      label: Förnamn
      row: 1
    - name: lastName
      label: Efternamn
      row: 1
    - name: inquiryType
      label: Typ av förfrågan
      row: 2
      type: select
      options:
        - value: ""
          label: Vad gäller din förfrågan?
        - value: retail
          label: Onlinebeställning av en pool (detaljhandel)
        - value: wholesale
          label: Grossist- / bulkorder (B2B)
        - value: oem
          label: OEM/ODM-anpassning
        - value: support
          label: Kundservice och garanti
    - name: companyName
      label: Företagsnamn
      row: 3
    - name: address
      label: Adress
      row: 4
    - name: zip
      label: Postnummer
      row: 5
    - name: country
      label: Land
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-post
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Beräknad ordervolym
      row: 7
      type: select
      options:
        - value: ""
          label: Välj din beräknade volym...
        - value: 1-unit
          label: 1 st — en pool (online detaljhandelsorder)
        - value: sample
          label: Endast prover/prototyper
        - value: 5-10
          label: 5–10 enheter (standard MOQ)
        - value: 100-500
          label: 100–500 enheter
        - value: 500-plus
          label: 500+ enheter (volymprissättning)
    - name: customization
      label: Behövs anpassning?
      row: 8
      type: select
      options:
        - value: ""
          label: Välj anpassningstyp...
        - value: none
          label: Standardprodukt (ingen anpassning)
        - value: logo
          label: Endast anpassad logotyp/varumärke
        - value: full
          label: Full OEM (storlek, färg, grafik, förpackning)
        - value: consultation
          label: Inte säker - behöver konsultation
    - name: productInterest
      label: Intressepool
      row: 9
      type: select
      options:
        - value: ""
          label: Välj pooltyp...
        - value: all
          label: Alla pooler / Fullständig katalog
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Portabelt spabad — Runt
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Spabad / Swim Spa — Fyrkantigt
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Ämne
      row: 10
    - name: message
      label: Meddelande
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Andra sätt att nå oss
  columns: 3
  items:
    - title: Försäljningsförfrågningar
      description: Poolofferter, grossistpriser och massbeställningar.
      icon: tabler:shopping-bag
    - title: Teknisk support
      description: Installationshjälp, reparationer, reservdelar och skötselfrågor.
      icon: tabler:tool
    - title: OEM / ODM
      description: Anpassade storlekar, färger, omslag, varumärke och förpackning.
      icon: tabler:palette
    - title: E-post
      description: info@felizbay.com
      icon: tabler:mail
    - title: Webbplats
      description: felizbay.com
      icon: tabler:world
    - title: Svarstid
      description: Vi svarar inom en arbetsdag.
      icon: tabler:clock
map:
  title: Hör av dig
  subtitle: Kontakta Felizbay
  address: felizbay.com
  zoom: 15
