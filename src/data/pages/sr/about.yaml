production_section:
  tagline: Production Ekcellence
  title: Obezbeđivanje izuzetne izrade
  description: Proizvodna linija Felizbay je posvećena visokokvalitetnim, izdržljivim bazenima na naduvavanje pod visokim pritiskom.
  cards:
    - title: Tim iskusnih tehničara
      items:
        - Професионално познавање дроп шавова и ПВЦ материјала
        - Прецизно умеће у резању, заваривању и монтажи
        - Континуирана обука за савладавање најновијих производних технологија
    - title: Napredna proizvodna oprema
      items:
        - Опрема за прецизно сечење за прецизне панеле од тканине
        - Високо прецизно топлотно заваривање за херметичке, издржљиве шавове
        - Професионална опрема за испитивање притиска и непропусности
    - title: Sistem zrelog upravljanja
      items:
        - Стандардизовани производни процеси са јасним стандардима квалитета
        - Филозофија витке производње која смањује отпад и побољшава ефикасност
        - Ефикасно управљање ланцем снабдевања са поузданим добављачима
    - title: Stroga kontrola kvaliteta
      items:
        - 'Вишестепена инспекција: сировина, у процесу, коначни излаз'
        - Испитивање притиска на врху номиналног радног опсега од 4-6 ПСИ
        - Строго испитивање непропусности и издржљивости пре испоруке
