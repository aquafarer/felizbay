hero:
  tagline: O nama
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay bazen na naduvavanje
  title: |
    Učinite plivanje jednostavnim, <br />
    na <span class="text-accent dark:text-white">Felizbay</span> način
  subtitle: Felizbay je vrhunski brend bazena na naduvavanje Drop Stitch koji je dizajnirao i kojim upravlja Aquafarer LLC (SAD). Verujemo da svaka porodica zaslužuje pravi bazen u dvorištu - nadzemna montaža bez trajne izgradnje bazena. Naši bazeni se čvrsto naduvaju za nekoliko minuta, preživljavaju puna leta porodične zabave i spakuju se malo na kraju sezone. Zahtevi za dozvole, ograde i montažu razlikuju se u zavisnosti od lokacije.
