faqs:
  title: Veelgestelde vragen over opblaasbaar zwembad
  subtitle: Veelgestelde vragen over Felizbay opblaasbare zwembaden.
  columns: 2
  items:
    - title: Hoe lang duurt het instellen?
      description: 'Het opblazen duurt 5-15 minuten met de meegeleverde elektrische luchtpomp, afhankelijk van het model. De vultijd is afhankelijk van de zwembadcapaciteit en uw watervoorziening.'
      icon: tabler:clock
      category: all
    - title: Hoe stijf is een drop-stitch-zwembad?
      description: Zeer stijf. De drop-stitch-wanden worden hard opgeblazen met 4-5 PSI, zodat het zwembad zijn vorm behoudt wanneer het met water is gevuld.
      icon: tabler:hexagon
      category: all
    - title: Kunnen kinderen het zwembad gebruiken?
      description: Ja, te allen tijde met actief toezicht van volwassenen. Kinderen mogen nooit zonder toezicht in of bij het zwembad worden achtergelaten; volg de handleiding en de plaatselijke veiligheidsregels.
      icon: tabler:users
      category: all
    - title: Hoe berg ik het zwembad op in de winter?
      description: Laat het water weglopen, laat het zwembad leeglopen, laat het volledig drogen, rol het vervolgens op en bewaar het in de meegeleverde opbergtas op een vorstvrije plaats.
      icon: tabler:package
      category: all
    - title: Wat is inbegrepen bij het zwembad?
      description: Bij elk Felizbay-zwembad wordt een elektrische luchtpomp, een reparatieset en een opbergtas geleverd. Ronde modellen hebben optioneel een gemonteerde hoes.
      icon: tabler:box
      category: all
    - title: Welke maten zijn beschikbaar?
      description: "48 standaard SKU's verdeeld over vier collecties: ronde zwembaden tot 10 m breed, rechthoekige zwembaden tot 6 x 5 m en SPA-baden met ingebouwde stoelen. Aangepaste formaten zijn beschikbaar voor zakenpartners."
      icon: tabler:ruler-2
      category: all
    - title: Op welke oppervlakken kan het zwembad staan?
      description: 'Elk vlak, horizontaal oppervlak zonder scherpe voorwerpen – gazon, terras of terras. Op ruwe ondergronden wordt een grondzeil aanbevolen. Een gevuld zwembad is zwaar: installeer het alleen op een oppervlak dat het volledige gewicht kan dragen, en laat verhoogde terrassen, balkons en daken eerst structureel beoordelen.'
      icon: tabler:layout-grid
      category: all
    - title: Hoe houd ik het water schoon?
      description: Gebruik indien aanwezig een filterpomp, verwijder het vuil, controleer de pH en dek het zwembad af wanneer het niet in gebruik is. Hoe lang het water meegaat, hangt af van de grootte, het gebruik en de filtratie van het zwembad. Test regelmatig in plaats van te vertrouwen op een vast schema.
      icon: tabler:droplet
      category: all
