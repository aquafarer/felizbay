production_section:
  tagline: Uitmuntende productie
  title: Zorgen voor uitstekend vakmanschap
  description: De productielijn van Felizbay is gewijd aan hoogwaardige, duurzame, hogedruk opblaasbare zwembaden.
  cards:
    - title: Ervaren techniciteam
      items:
        - Professionele kennis van drop stitch- en PVC-materialen
        - Nauwkeurig vakmanschap bij het snijden, lassen en monteren
        - Continue opleiding om de nieuwste productietechnologieën onder de knie te krijgen
    - title: Geavanceerde productieapparatuur
      items:
        - Precisiesnijapparatuur voor nauwkeurige stoffen panelen
        - Uiterst nauwkeurig hittelassen voor luchtdichte, duurzame naden
        - Professionele druk- en luchtdichtheidstestapparatuur
    - title: Volwassen managementsysteem
      items:
        - Gestandaardiseerde productieprocessen met duidelijke kwaliteitsnormen
        - Lean productiefilosofie, vermindering van verspilling en verbetering van de efficiëntie
        - Efficiënt supply chain management met betrouwbare leveranciers
    - title: Strenge kwaliteitscontrole
      items:
        - 'Meerfasige inspectie: grondstof, in verwerking, definitieve uitgaande'
        - Druktesten aan de bovenkant van het nominale werkbereik van 4-6 PSI
        - Strikte luchtdichtheids- en duurzaamheidstests vóór verzending
