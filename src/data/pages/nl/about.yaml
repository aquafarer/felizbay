hero:
  tagline: Over ons
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay opblaasbaar zwembad
  title: |
    Zwemmen eenvoudig maken, <br />
    op de <span class="text-accent dark:text-white">Felizbay</span>-manier
  subtitle: Felizbay is een premium drop-stitch opblaasbaar zwembadmerk, ontworpen en beheerd door Aquafarer LLC (VS). Wij geloven dat elk gezin een echt zwembad in de achtertuin verdient – ​​plaatsing bovengronds zonder permanente zwembadbouw. Onze zwembaden worden binnen enkele minuten stevig opgeblazen, overleven hele zomers vol familieplezier en kunnen aan het einde van het seizoen klein worden opgeborgen. Vergunnings-, afschermings- en installatie-eisen verschillen per locatie.
