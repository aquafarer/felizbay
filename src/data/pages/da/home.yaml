faqs:
  title: Ofte stillede spørgsmål om oppustelig pool
  subtitle: Almindelige spørgsmål om Felizbay oppustelige svømmebassiner.
  columns: 2
  items:
    - title: Hvor lang tid tager opsætningen?
      description: 'Oppumpning tager 5-15 minutter med den medfølgende elektriske luftpumpe afhængig af model. Påfyldningstiden varierer med poolens kapacitet og din vandforsyning.'
      icon: tabler:clock
      category: all
    - title: Hvor stiv er en drop stitch pool?
      description: Meget stiv. Drop Stitch-væggene puster sig hårdt op ved 4-5 PSI, så poolen holder sin form, når den er fyldt med vand.
      icon: tabler:hexagon
      category: all
    - title: Kan børn bruge poolen?
      description: Ja, med aktivt voksenopsyn hele tiden. Børn må aldrig efterlades uden opsyn i eller i nærheden af ​​poolen - følg manualen og lokale sikkerhedsregler.
      icon: tabler:users
      category: all
    - title: Hvordan opbevarer jeg poolen om vinteren?
      description: Tøm vandet, tøm poolen ud, lad den tørre helt, rul den derefter sammen og opbevar den i den medfølgende opbevaringspose på et frostfrit sted.
      icon: tabler:package
      category: all
    - title: Hvad er inkluderet i poolen?
      description: Hver Felizbay pool inkluderer en elektrisk luftpumpe, et reparationssæt og en opbevaringstaske. Runde modeller har et valgfrit monteret dæksel.
      icon: tabler:box
      category: all
    - title: Hvilke størrelser er tilgængelige?
      description: 48 standard-SKU'er på tværs af fire samlinger — runde bassiner op til 10 m på tværs, rektangulære bassiner op til 6 × 5 m og SPA-bade med indbyggede sæder. Tilpassede størrelser er tilgængelige for forretningspartnere.
      icon: tabler:ruler-2
      category: all
    - title: Hvilke overflader kan poolen stå på?
      description: 'Enhver flad, plan overflade fri for skarpe genstande - græsplæne, terrasse eller dæk. En jordplade anbefales på ru overflader. En fyldt pool er tung: Installer kun på en overflade, der bærer den fulde vægt, og få forhøjede dæk, balkoner og hustage strukturelt vurderet først.'
      icon: tabler:layout-grid
      category: all
    - title: Hvordan holder jeg vandet rent?
      description: Brug en filterpumpe, hvor den er monteret, skum affald, kontroller pH, og dæk poolen til, når den ikke er i brug. Hvor længe vandet varer afhænger af poolens størrelse, brug og filtrering - test regelmæssigt i stedet for at stole på en fast tidsplan.
      icon: tabler:droplet
      category: all
