hero_text:
  tagline: Kontakte
  title: TA KONTAKT
contact_form:
  id: form
  title: Send os en besked
  subtitle: For tilbud, tekniske spørgsmål eller partnerskabsforespørgsler, send os en linje. Vi svarer inden for en hverdag.
  email_to: info@felizbay.com
  submit_button: Send forespørgsel → Få et tilbud
  success_message: Tak! Din besked er landet i vores indbakke. Vi svarer inden for en hverdag.
  error_message: Noget gik galt med at sende din besked. Prøv venligst igen eller send os en e-mail direkte.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: løs venligst følgende"
  fields:
    - name: firstName
      label: Fornavn
      row: 1
    - name: lastName
      label: Efternavn
      row: 1
    - name: inquiryType
      label: Type af henvendelse
      row: 2
      type: select
      options:
        - value: ""
          label: Hvad handler din henvendelse om?
        - value: retail
          label: Onlinebestilling af én pool (detailhandel)
        - value: wholesale
          label: Engros- / stordre (B2B)
        - value: oem
          label: OEM/ODM-tilpasning
        - value: support
          label: Kundeservice og garanti
    - name: companyName
      label: Firmanavn
      row: 3
    - name: address
      label: Adresse
      row: 4
    - name: zip
      label: Postnummer
      row: 5
    - name: country
      label: Land
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 6
      type: email
    - name: tel
      label: TLF
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Estimeret ordrevolumen
      row: 7
      type: select
      options:
        - value: ""
          label: Vælg din estimerede mængde...
        - value: 1-unit
          label: 1 stk. — én pool (online detailhandelsordre)
        - value: sample
          label: Kun prøver/prototyper
        - value: 5-10
          label: 5-10 enheder (Standard MOQ)
        - value: 100-500
          label: 100-500 enheder
        - value: 500-plus
          label: 500+ enheder (volumenpris)
    - name: customization
      label: Brug for tilpasning?
      row: 8
      type: select
      options:
        - value: ""
          label: Vælg tilpasningstype...
        - value: none
          label: Standardprodukt (ingen tilpasning)
        - value: logo
          label: Kun tilpasset logo/branding
        - value: full
          label: Fuld OEM (størrelse, farve, grafik, emballage)
        - value: consultation
          label: Ikke sikker - har brug for konsultation
    - name: productInterest
      label: Interessepulje
      row: 9
      type: select
      options:
        - value: ""
          label: Vælg pooltype...
        - value: all
          label: Alle pools / Fuldt katalog
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Transportabelt spabad — Rundt
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Spabad / Swim Spa — Firkantet
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Emne
      row: 10
    - name: message
      label: Besked
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Andre måder at nå os på
  columns: 3
  items:
    - title: Salgsforespørgsler
      description: Puljetilbud, engrospriser og masseordrer.
      icon: tabler:shopping-bag
    - title: Teknisk support
      description: Opsætningshjælp, reparationer, reservedele og plejespørgsmål.
      icon: tabler:tool
    - title: OEM / ODM
      description: Brugerdefinerede størrelser, farver, covers, branding og emballage.
      icon: tabler:palette
    - title: E-mail
      description: info@felizbay.com
      icon: tabler:mail
    - title: Hjemmeside
      description: felizbay.com
      icon: tabler:world
    - title: Responstid
      description: Vi svarer inden for en hverdag.
      icon: tabler:clock
map:
  title: Tag kontakt
  subtitle: Kontakt Felizbay
  address: felizbay.com
  zoom: 15
