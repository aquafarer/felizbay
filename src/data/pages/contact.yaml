hero_text:
  tagline: Contact
  title: GET IN TOUCH
contact_form:
  id: form
  title: Send us a message
  subtitle: For quotes, technical questions or partnership enquiries, drop us a line. We reply within one business day.
  email_to: info@felizbay.com
  submit_button: Send Inquiry → Get a Quote
  success_message: Thanks! Your message has landed in our inbox. We will reply within one business day.
  error_message: Something went wrong sending your message. Please try again or email us directly.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: please solve the following'
  fields:
    - name: firstName
      label: First Name
      row: 1
    - name: lastName
      label: Last Name
      row: 1
    - name: inquiryType
      label: Inquiry Type
      row: 2
      type: select
      options:
        - value: ''
          label: What is your inquiry about?
        - value: retail
          label: Single-pool online order (retail)
        - value: wholesale
          label: Wholesale / bulk order (B2B)
        - value: oem
          label: OEM / ODM customization
        - value: support
          label: After-sales support & warranty
    - name: companyName
      label: Company Name
      row: 3
    - name: address
      label: Address
      row: 4
    - name: zip
      label: Zip / Postal Code
      row: 5
    - name: country
      label: Country
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Estimated Order Volume
      row: 7
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: 1-unit
          label: 1 unit — single pool (online retail order)
        - value: sample
          label: Samples / Prototypes only
        - value: '5-10'
          label: 5–10 units (Standard MOQ)
        - value: '100-500'
          label: 100–500 units
        - value: '500-plus'
          label: 500+ units (Volume pricing)
    - name: customization
      label: Customization Needed?
      row: 8
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
    - name: productInterest
      label: Pool of Interest
      row: 9
      type: select
      options:
        - value: ''
          label: Select pool type...
        - value: all
          label: All pools / Full catalog
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Portable Hot Tub — Round
        - value: rectangular
          label: Rectangular Drop Stitch Pool (wholesale)
        - value: hot-tub-square-rect
          label: Hot Tub / Swim Spa — Square (wholesale)
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Subject
      row: 10
    - name: message
      label: Message
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Other ways to reach us
  columns: 3
  items:
    - title: Sales enquiries
      description: Pool quotes, wholesale pricing, and bulk orders.
      icon: tabler:shopping-bag
    - title: Technical support
      description: Setup help, repairs, spare parts, and care questions.
      icon: tabler:tool
    - title: OEM / ODM
      description: Custom sizes, colors, covers, branding, and packaging.
      icon: tabler:palette
    - title: Email
      description: info@felizbay.com
      icon: tabler:mail
    - title: Website
      description: felizbay.com
      icon: tabler:world
    - title: Response time
      description: We reply within one business day.
      icon: tabler:clock
map:
  title: Get in Touch
  subtitle: Contact Felizbay
  address: felizbay.com
  zoom: 15
