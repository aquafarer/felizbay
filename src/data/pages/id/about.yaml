      description: Garis kolam persegi panjang, biru bulat, dan abu-abu bulat, masing-masing dengan penutup opsional dan ukuran khusus.
      icon: tabler:circle-check
    - title: OEM/ODM untuk mitra di seluruh dunia
      description: Pembuatan khusus untuk merek, distributor, hotel, dan operator glamping.
      icon: tabler:world
