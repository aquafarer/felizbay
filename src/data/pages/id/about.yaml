hero:
  tagline: Tentang kami
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Kolam renang tiup Felizbay
  title: |
    Membuat berenang menjadi sederhana, <br />
    gaya <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay adalah merek kolam tiup drop stitch premium yang dirancang dan dioperasikan oleh Aquafarer LLC (AS). Kami percaya setiap keluarga berhak mendapatkan kolam nyata di halaman belakang — pemasangan di atas tanah tanpa konstruksi kolam permanen. Kolam renang kami mengembang dalam hitungan menit, bertahan sepanjang musim panas yang penuh kegembiraan keluarga, dan dikemas dalam jumlah kecil di akhir musim. Persyaratan izin, pagar, dan pemasangan bervariasi tergantung lokasi.
stats:
  title: Berdasarkan angka
  columns: 4
  stats:
    - title: Koleksi kolam renang
      amount: '4'
    - title: 'Waktu pengembungan'
      amount: '5-15 min'
    - title: Nilai tekanan
      amount: 4-6 PSI
    - title: Kontak
      amount: info@felizbay.com
features3_what_we_build:
  title: Apa yang kami bangun
  subtitle: Lini produk terfokus yang kami kenal luar dalam — kolam renang tiup Drop Stitch bertekanan tinggi.
  columns: 3
  isBeforeContent: true
  items:
    - title: Kolam berbentuk persegi panjang
      description: Kolam Drop Stitch persegi panjang ukuran keluarga yang memaksimalkan area berenang untuk ruangan Anda.
      icon: tabler:rectangle
    - title: Kolam biru bulat
      description: Kolam halaman belakang klasik — dinding Drop Stitch biru cerah dan kaku, pengaturan cepat.
      icon: tabler:circle
    - title: Kolam abu-abu bulat
      description: Produk premium kami dengan finishing abu-abu modern dan penutup opsional.
      icon: tabler:circle-dot
    - title: Kolam SPA bak mandi air panas
      description: 'Model bak mandi air panas berinsulasi dengan tempat duduk internal dan alas berinsulasi 5 mm — untuk digunakan dengan pemanas eksternal (pemanas tidak termasuk).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Paket lengkap
      description: Setiap set kolam renang dilengkapi dengan pompa udara listrik, peralatan perbaikan, dan tas penyimpanan.
      icon: tabler:package
    - title: Ukuran khusus
      description: Ukuran, warna, dan sampul OEM untuk merek, distributor, dan proyek perhotelan.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Manufaktur label pribadi dengan pencetakan logo dan kemasan siap ritel.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Kolam renang tiup Drop Stitch persegi panjang Felizbay
steps2_values:
  title: Nilai-nilai kita
  subtitle: Tiga prinsip yang membentuk setiap kolam yang kami bangun.
  items:
    - title: Bangunlah seolah-olah keluarga Anda akan menggunakannya
      description: Setiap lapisan, dinding, dan katup diperlakukan seolah-olah keluarga kita sendiri akan berenang di dalamnya.
      icon: tabler:heart
    - title: Insinyur sebelum kami menjual
      description: Konstruksi Drop Stitch bertekanan tinggi, diuji pada batas atas tekanan terukurnya, sebelum kolam apa pun dikirimkan.
      icon: tabler:settings
    - title: Dukungan yang bertahan lebih lama dari musim ini
      description: Pertanyaan, suku cadang, atau garansi — hubungi kami kapan saja di info@felizbay.com.
      icon: tabler:headset
