production_section:
  tagline: Keunggulan Produksi
  title: Memastikan Keahlian Yang Indah
  description: Lini produksi Felizbay didedikasikan untuk kolam renang tiup berkualitas tinggi, tahan lama, dan bertekanan tinggi.
  cards:
    - title: Tim Teknisi Berpengalaman
      items:
        - Pengetahuan profesional tentang jahitan jatuh dan bahan PVC
        - Keahlian yang tepat dalam pemotongan, pengelasan, dan perakitan
        - Pelatihan berkelanjutan untuk menguasai teknologi produksi terkini
    - title: Peralatan Produksi Lanjutan
      items:
        - Peralatan pemotongan presisi untuk panel kain yang akurat
        - Pengelasan panas presisi tinggi untuk jahitan kedap udara dan tahan lama
        - Peralatan pengujian tekanan dan kedap udara profesional
    - title: Sistem Manajemen yang Matang
      items:
        - Proses produksi terstandar dengan standar kualitas yang jelas
        - Filosofi produksi ramping mengurangi pemborosan dan meningkatkan efisiensi
        - Manajemen rantai pasokan yang efisien dengan pemasok yang andal
    - title: Kontrol Kualitas yang Ketat
      items:
        - 'Inspeksi multi-tahap: bahan mentah, dalam proses, keluar akhir'
        - Pengujian tekanan di bagian atas rentang kerja terukur 4-6 PSI
        - Pengujian kedap udara dan daya tahan yang ketat sebelum pengiriman
