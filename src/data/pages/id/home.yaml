      description: Bandingkan bentuk dan ukuran agar sesuai dengan ruangan, rumah tangga, dan cara Anda berencana menggunakan air.
      icon: tabler:pool
    - title: 'Langkah 2: <span class="font-medium">Siapkan</span>'
      description: Letakkan di tanah yang kokoh dan rata, pompa dengan pompa listrik yang disertakan, dan isi dengan selang taman.
