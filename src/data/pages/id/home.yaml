faqs:
  title: FAQ Kolam Tiup
  subtitle: Pertanyaan umum tentang kolam renang tiup Felizbay.
  columns: 2
  items:
    - title: Berapa lama waktu yang dibutuhkan untuk pengaturan?
      description: 'Menggembungkan membutuhkan waktu 5-15 menit dengan pompa udara listrik yang disertakan, tergantung modelnya. Waktu pengisian bervariasi tergantung kapasitas kolam dan persediaan air Anda.'
      icon: tabler:clock
      category: all
    - title: Seberapa kakukah kolam Drop Stitch?
      description: Sangat kaku. Dinding Drop Stitch mengembang dengan kecepatan 4-5 PSI — mirip dengan papan dayung tiup — sehingga kolam tetap bentuknya saat diisi air.
      icon: tabler:hexagon
      category: all
    - title: Bisakah anak-anak menggunakan kolam renang?
      description: Ya, dengan pengawasan aktif orang dewasa setiap saat. Anak-anak tidak boleh ditinggalkan tanpa pengawasan di dalam atau di dekat kolam renang — ikuti panduan dan peraturan keselamatan setempat.
      icon: tabler:users
      category: all
    - title: Bagaimana cara menyimpan kolam di musim dingin?
      description: Tiriskan air, kempiskan kolam, biarkan hingga benar-benar kering, lalu gulung dan simpan dalam kantong penyimpanan yang disertakan di tempat bebas embun beku.
      icon: tabler:package
      category: all
    - title: Apa saja yang termasuk dalam kolam renang?
      description: Setiap kolam Felizbay dilengkapi dengan pompa udara listrik, peralatan perbaikan, dan tas penyimpanan. Model bulat memiliki penutup opsional.
      icon: tabler:box
      category: all
    - title: Ukuran apa yang tersedia?
      description: 48 SKU standar dalam empat koleksi — kolam bundar dengan lebar hingga 10 m, kolam persegi panjang hingga 6 × 5 m, dan bak SPA dengan tempat duduk internal. Ukuran khusus tersedia untuk mitra bisnis.
      icon: tabler:ruler-2
      category: all
    - title: Pada permukaan apa kolam dapat berdiri?
      description: 'Permukaan datar dan rata yang bebas dari benda tajam — halaman rumput, teras, atau dek. Lembaran tanah direkomendasikan pada permukaan kasar. Kolam yang terisi itu berat: pasang hanya pada permukaan yang mampu menopang beban penuh, dan periksa struktur dek, balkon, dan atap yang ditinggikan terlebih dahulu.'
      icon: tabler:layout-grid
      category: all
    - title: Bagaimana cara menjaga air tetap bersih?
      description: Gunakan pompa penyaring jika terpasang, singkirkan kotoran, periksa pH, dan tutupi kolam saat tidak digunakan. Berapa lama air bertahan tergantung pada ukuran kolam, penggunaan, dan penyaringan — ujilah secara teratur daripada mengandalkan jadwal yang tetap.
      icon: tabler:droplet
      category: all
