      icon: tabler:ripple
    - title: 'Langkah 4: <span class="font-medium">Simpanlah</span>'
      description: Saat musim berakhir, tiriskan, keringkan, gulung, dan simpan kolam di dalam tasnya hingga musim panas mendatang.
