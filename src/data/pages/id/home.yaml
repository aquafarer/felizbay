features:
  id: features
  tagline: Teknologi Drop Stitch
  title: Mengapa Kolam Felizbay<br />Berbeda
  subtitle: Konstruksi Drop Stitch bertekanan tinggi membuat kolam kami kaku, tahan lama, dan mudah disimpan.
  columns: 2
  items:
    - title: Dinding Drop Stitch Kaku
      description: 'Ribuan benang internal mengunci lapisan dinding menjadi satu, sehingga kolam mengembang dengan kecepatan 4-5 PSI dan mempertahankan bentuknya saat diisi.'
      icon: tabler:hexagon
    - title: Penyiapan Cepat dan Tanpa Alat
      description: Mengembang dengan pompa listrik yang disertakan dalam hitungan menit, lalu isi dengan selang taman. Tanpa alat, tanpa konstruksi, tanpa instalasi profesional.
      icon: tabler:rocket
    - title: Paket Kecil
      description: 'Tiriskan, kempiskan, gulung, dan simpan kolam di dalam tasnya selama musim dingin — kolam berukuran penuh yang dikemas kecil untuk penyimpanan di dalam ruangan.'
      icon: tabler:package
    - title: Tahan lama & Tahan UV
      description: 'Kain PVC drop stitch lapis ganda, dirancang untuk tahan terhadap tusukan dan paparan UV selama penggunaan keluarga selama satu musim penuh.'
      icon: tabler:shield
    - title: Paket Lengkap
      description: Setiap kolam dilengkapi dengan pompa udara listrik, peralatan perbaikan, dan tas penyimpanan. Penutup terpasang tersedia untuk model bulat.
      icon: tabler:box
    - title: Desain Sadar Keselamatan
      description: 'Referensi desain kolam perumahan EN 16582-1 dan ASTM F2666 — informasi keselamatan khusus model disediakan dalam dokumentasi produk. Pengawasan orang dewasa yang konstan selalu diperlukan.'
      icon: tabler:shield-check
