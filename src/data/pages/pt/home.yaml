faqs:
  title: Perguntas frequentes sobre piscina inflável
  subtitle: Perguntas comuns sobre piscinas infláveis ​​Felizbay.
  columns: 2
  items:
    - title: Quanto tempo leva a configuração?
      description: 'O enchimento leva de 5 a 15 minutos com a bomba de ar elétrica incluída, dependendo do modelo. O tempo de enchimento varia de acordo com a capacidade da piscina e o abastecimento de água.'
      icon: tabler:clock
      category: all
    - title: Quão rígida é uma piscina de drop stitch?
      description: Muito rígido. As paredes Drop Stitch inflam fortemente a 4-5 PSI – semelhante a uma prancha de remo inflável – para que a piscina mantenha sua forma quando cheia de água.
      icon: tabler:hexagon
      category: all
    - title: As crianças podem usar a piscina?
      description: Sim, sempre com supervisão ativa de um adulto. As crianças nunca devem ser deixadas sozinhas dentro ou perto da piscina – siga o manual e as regras de segurança locais.
      icon: tabler:users
      category: all
    - title: Como devo guardar a piscina no inverno?
      description: Escorra a água, esvazie a piscina, deixe-a secar completamente, depois enrole-a e guarde-a no saco de armazenamento incluído num local protegido do gelo.
      icon: tabler:package
      category: all
    - title: O que está incluído na piscina?
      description: Cada piscina Felizbay inclui uma bomba de ar elétrica, um kit de reparo e uma bolsa de armazenamento. Os modelos redondos possuem uma tampa opcional.
      icon: tabler:box
      category: all
    - title: Quais tamanhos estão disponíveis?
      description: 48 SKUs padrão em quatro coleções – piscinas redondas de até 10 m de diâmetro, piscinas retangulares de até 6 × 5 m e banheiras SPA com assentos embutidos. Tamanhos personalizados estão disponíveis para parceiros de negócios.
      icon: tabler:ruler-2
      category: all
    - title: Em quais superfícies a piscina pode ficar?
      description: 'Qualquer superfície plana e nivelada, livre de objetos pontiagudos – gramado, pátio ou deck. Uma folha de chão é recomendada em superfícies ásperas. Uma piscina cheia é pesada: instale apenas em uma superfície que suporte todo o peso e tenha decks elevados, varandas e telhados avaliados estruturalmente primeiro.'
      icon: tabler:layout-grid
      category: all
    - title: Como faço para manter a água limpa?
      description: Use uma bomba de filtro quando instalada, retire os detritos, verifique o pH e cubra a piscina quando não estiver em uso. A duração da água depende do tamanho da piscina, do uso e da filtração – teste regularmente em vez de depender de um cronograma fixo.
      icon: tabler:droplet
      category: all
