features:
  id: features
  tagline: Tecnologia Drop Stitch
  title: Por que uma piscina Felizbay<br />É diferente
  subtitle: A construção Drop Stitch de alta pressão torna nossas piscinas rígidas, duráveis ​​e fáceis de armazenar.
  columns: 2
  items:
    - title: Paredes Rígidas Drop Stitch
      description: 'Milhares de roscas internas prendem as camadas da parede, de modo que a piscina infla de forma rígida a 4-5 PSI e mantém sua forma quando cheia.'
      icon: tabler:hexagon
    - title: Configuração rápida e sem ferramentas
      description: Encha com a bomba elétrica incluída em minutos e depois encha com uma mangueira de jardim. Sem ferramentas, sem construção, sem instalação profissional.
      icon: tabler:rocket
    - title: Pacotes pequenos
      description: 'Drene, esvazie, enrole e guarde a piscina em sua bolsa durante o inverno - uma piscina grande que pode ser compactada em tamanho pequeno para armazenamento interno.'
      icon: tabler:package
    - title: Durável e resistente a UV
      description: 'Tecido PVC drop stitch de camada dupla, projetado para resistir a perfurações e exposição ao UV durante uma temporada completa de uso familiar.'
      icon: tabler:shield
    - title: Pacote Completo
      description: Cada piscina é enviada com uma bomba de ar elétrica, kit de reparo e bolsa de armazenamento. Capas equipadas disponíveis para modelos redondos.
      icon: tabler:box
    - title: Design consciente da segurança
      description: 'Projeto de piscina residencial com referência a EN 16582-1 e ASTM F2666 — informações de segurança específicas do modelo são fornecidas na documentação do produto. A supervisão constante de um adulto é sempre necessária.'
      icon: tabler:shield-check
