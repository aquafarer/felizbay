hero_text:
  tagline: Contato
  title: ENTRE EM CONTATO
contact_form:
  id: form
  title: Envie-nos uma mensagem
  subtitle: Para cotações, dúvidas técnicas ou dúvidas sobre parcerias, entre em contato conosco. Respondemos dentro de um dia útil.
  email_to: info@felizbay.com
  submit_button: Enviar consulta → Obter um orçamento
  success_message: Obrigado! Sua mensagem chegou em nossa caixa de entrada. Responderemos dentro de um dia útil.
  error_message: Algo deu errado ao enviar sua mensagem. Por favor, tente novamente ou envie-nos um e-mail diretamente.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: resolva o seguinte"
  fields:
    - name: firstName
      label: Primeiro nome
      row: 1
    - name: lastName
      label: Sobrenome
      row: 1
    - name: inquiryType
      label: Tipo de consulta
      row: 2
      type: select
      options:
        - value: ""
          label: Qual é o assunto da sua consulta?
        - value: retail
          label: Pedido online de uma única piscina (varejo)
        - value: wholesale
          label: Pedido por atacado / em grande quantidade (B2B)
        - value: oem
          label: Personalização OEM/ODM
        - value: support
          label: Suporte pós-venda e garantia
    - name: companyName
      label: nome da empresa
      row: 3
    - name: address
      label: Endereço
      row: 4
    - name: zip
      label: CEP / Código Postal
      row: 5
    - name: country
      label: País
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 6
      type: email
    - name: tel
      label: TELEFONE
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Volume estimado do pedido
      row: 7
      type: select
      options:
        - value: ""
          label: Selecione seu volume estimado...
        - value: 1-unit
          label: 1 unidade — uma única piscina (pedido de varejo online)
        - value: sample
          label: Apenas amostras/protótipos
        - value: 5-10
          label: 5–10 unidades (MOQ padrão)
        - value: 100-500
          label: 100–500 unidades
        - value: 500-plus
          label: Mais de 500 unidades (preço por volume)
    - name: customization
      label: Personalização necessária?
      row: 8
      type: select
      options:
        - value: ""
          label: Selecione o tipo de personalização...
        - value: none
          label: Produto padrão (sem personalização)
        - value: logo
          label: Apenas logotipo/branding personalizado
        - value: full
          label: OEM completo (tamanho, cor, gráficos, embalagem)
        - value: consultation
          label: Não tenho certeza – preciso de consulta
    - name: productInterest
      label: Conjunto de interesse
      row: 9
      type: select
      options:
        - value: ""
          label: Selecione o tipo de piscina...
        - value: all
          label: Todas as piscinas / Catálogo completo
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Banheira portátil — Redonda
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Banheira / Swim Spa — Quadrada
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Assunto
      row: 10
    - name: message
      label: Mensagem
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Outras maneiras de chegar até nós
  columns: 3
  items:
    - title: Consultas de vendas
      description: Cotações de pool, preços de atacado e pedidos em grandes quantidades.
      icon: tabler:shopping-bag
    - title: Suporte técnico
      description: Ajuda de configuração, reparos, peças de reposição e perguntas sobre cuidados.
      icon: tabler:tool
    - title: OEM/ODM
      description: Tamanhos, cores, capas, marcas e embalagens personalizadas.
      icon: tabler:palette
    - title: E-mail
      description: info@felizbay.com
      icon: tabler:mail
    - title: Site
      description: felizbay. com
      icon: tabler:world
    - title: Tempo de resposta
      description: Respondemos dentro de um dia útil.
      icon: tabler:clock
map:
  title: Entre em contato
  subtitle: Contato Felizbay
  address: felizbay. com
  zoom: 15
