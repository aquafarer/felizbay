features:
  id: features
  tagline: Tehnologija Drop Stitch
  title: Zakaj bazen Felizbay<br />Je drugačen
  subtitle: Zaradi visokotlačne Drop Stitch konstrukcije so naši bazeni togi, vzdržljivi in ​​jih je preprosto shraniti.
  columns: 2
  items:
    - title: Toge stene Drop Stitch
      description: 'Na tisoče notranjih navojev zaklene stenske plasti skupaj, tako da se bazen trdo napihne pri ocenjeni 4-5 PSI in ohrani svojo obliko, ko je napolnjen.'
      icon: tabler:hexagon
    - title: Hitra nastavitev brez orodja
      description: Napihnite s priloženo električno črpalko v nekaj minutah, nato napolnite z vrtno cevjo. Brez orodja, brez konstrukcije, brez profesionalne namestitve.
      icon: tabler:rocket
    - title: Packs Away Small
      description: 'Bazen izpraznite, izpraznite, zvijte in čez zimo pospravite v torbo – bazen polne velikosti, ki je majhen za shranjevanje v zaprtih prostorih.'
      icon: tabler:package
    - title: Vzdržljiv in UV odporen
      description: 'Dvoslojna tkanina PVC drop stitch, zasnovana tako, da je odporna na vbode in izpostavljenost UV skozi celotno sezono družinske uporabe.'
      icon: tabler:shield
    - title: Celoten paket
      description: Vsak bazen ima električno zračno črpalko, komplet za popravilo in torbo za shranjevanje. Pritrjeni pokrovi so na voljo za okrogle modele.
      icon: tabler:box
    - title: Varnostno ozaveščena zasnova
      description: 'Zasnova stanovanjskega bazena, ki se sklicuje na EN 16582-1 in ASTM F2666 — varnostne informacije, specifične za model, so na voljo v dokumentaciji izdelka. Vedno je potreben stalen nadzor odrasle osebe.'
      icon: tabler:shield-check
