features:
  id: features
  tagline: Tehnologija Drop Stitch
  title: Zakaj bazen Felizbay<br />Je drugačen
  subtitle: Zaradi visokotlačne Drop Stitch konstrukcije so naši bazeni togi, vzdržljivi in ​​jih je preprosto shraniti.
  columns: 2
  items:
    - title: Toge stene Drop Stitch
      description: Na tisoče notranjih niti zaklene stenske plasti skupaj, tako da se bazen napihne kot kamen pri 4-5 PSI in ohrani svojo obliko, ko je napolnjen.
      icon: tabler:hexagon
    - title: Hitra nastavitev brez orodja
      description: Napihnite s priloženo električno črpalko v nekaj minutah, nato napolnite z vrtno cevjo. Brez orodja, brez konstrukcije, brez profesionalne namestitve.
      icon: tabler:rocket
    - title: Packs Away Small
      description: Bazen izpraznite, izpraznite, zvijte in čez zimo pospravite v vrečko. Bazen polne velikosti, ki ga pospravite v omaro.
      icon: tabler:package
    - title: Vzdržljiv in UV odporen
      description: Dvoslojna PVC Drop Stitch tkanina je odporna na vbode, izpostavljenost UV žarkom in celotno sezono družinske uporabe.
      icon: tabler:shield
    - title: Celoten paket
      description: Vsak bazen ima električno zračno črpalko, komplet za popravilo in torbo za shranjevanje. Pritrjeni pokrovi so na voljo za okrogle modele.
      icon: tabler:box
    - title: Varnostno ozaveščena zasnova
      description: Zasnova stanovanjskega bazena, ki se nanaša na EN 16582-1 in ASTM F2666, z ventili za razbremenitev tlaka in stabilnimi togimi stenami. Vedno je potreben stalen nadzor odrasle osebe.
      icon: tabler:shield-check
content_customer_types:
