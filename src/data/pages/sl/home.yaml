  tagline: Vrhunski napihljivi bazeni Drop Stitch
  title: Izkoristite več svojega<br />Zunanjega prostora.
  subtitle: |
        Vrhunski bazeni s trdimi stenami drop-stitch, ki se napihnejo v nekaj minutah in so pripravljeni za zimo – zasnovani za sprostitev na dvorišču in družinsko zabavo.
