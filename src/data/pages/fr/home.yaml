content_compliance:
  tagline: Entretien et sécurité
  title: Facile à posséder,<br />Facile à aimer
  subtitle: De la livraison à la première baignade en passant par le stockage de fin de saison, posséder une piscine Felizbay reste simple.
  items:
    - title: Configuration en quelques minutes
      description: "Déballez, gonflez avec la pompe incluse et remplissez : l'installation complète prend généralement 15 à 30 minutes sur un sol ferme et plat."
      icon: tabler:rocket
    - title: Entretien simple de l'eau
      description: Des ports de pompe-filtre standard de 32/38 mm, des contrôles réguliers du pH et un couvercle ajusté sur les modèles ronds maintiennent l'eau propre.
      icon: tabler:droplet
    - title: Nettoyer, égoutter et ranger
      description: Égoutter, sécher, enrouler et ranger la piscine dans son sac de rangement pour l'hiver. Aucune installation permanente à entretenir.
      icon: tabler:package
    - title: La sécurité avant tout
      description: Les enfants doivent être activement surveillés par un adulte à tout moment. Suivez le manuel, les règles locales et les conseils d'utilisation en toute sécurité.
      icon: tabler:shield-check
