features:
  id: features
  tagline: Technologie Drop Stitch
  title: Pourquoi une piscine Felizbay<br />est différent
  subtitle: La construction Drop Stitch à haute pression rend nos piscines rigides, durables et faciles à ranger.
  columns: 2
  items:
    - title: Murs rigides Drop Stitch
      description: Des milliers de fils internes verrouillent les couches de parois ensemble, de sorte que la piscine se gonfle très fort à 4-5 PSI et conserve sa forme une fois remplie.
      icon: tabler:hexagon
    - title: Installation rapide et sans outil
      description: Gonflez avec la pompe électrique incluse en quelques minutes, puis remplissez avec un tuyau d'arrosage. Aucun outil, aucune construction, aucune installation professionnelle.
      icon: tabler:rocket
    - title: Se range petit
      description: Videz, dégonflez, enroulez et rangez la piscine dans un sac pendant l'hiver. Une piscine pleine grandeur qui tient dans un placard.
      icon: tabler:package
    - title: Durable et résistant aux UV
      description: Le tissu PVC Drop Stitch double couche résiste aux perforations, à l'exposition aux UV et à une saison complète d'utilisation familiale.
      icon: tabler:shield
    - title: Forfait complet
      description: Chaque piscine est livrée avec une pompe à air électrique, un kit de réparation et un sac de rangement. Housses ajustées disponibles pour les modèles ronds.
      icon: tabler:box
    - title: Conception soucieuse de la sécurité
      description: Conception de piscine résidentielle faisant référence aux normes EN 16582-1 et ASTM F2666, avec soupapes de surpression et parois rigides stables. La surveillance constante d'un adulte est toujours requise.
      icon: tabler:shield-check
