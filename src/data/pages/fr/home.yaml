faqs:
  title: FAQ sur les piscines gonflables
  subtitle: Questions courantes sur les piscines gonflables Felizbay.
  columns: 2
  items:
    - title: Combien de temps prend l'installation ?
      description: Le gonflage prend environ 10 minutes avec la pompe à air électrique incluse ; la configuration complète, y compris le placement et le remplissage, dure généralement de 15 à 30 minutes.
      icon: tabler:clock
      category: all
    - title: Quelle est la rigidité d’une piscine drop stitch ?
      description: Très rigide. Les parois Drop Stitch se gonflent fortement à 4-5 PSI – comme une planche à pagaie gonflable – de sorte que la piscine conserve sa forme lorsqu'elle est remplie d'eau.
      icon: tabler:hexagon
      category: all
    - title: Les enfants peuvent-ils utiliser la piscine ?
      description: Oui, sous la surveillance active d’un adulte à tout moment. Les enfants ne doivent jamais être laissés sans surveillance dans ou à proximité de la piscine – suivez le manuel et les règles de sécurité locales.
      icon: tabler:users
      category: all
    - title: Comment stocker la piscine en hiver ?
      description: Videz l'eau, dégonflez la piscine, laissez-la sécher complètement, puis enroulez-la et rangez-la dans le sac de rangement fourni à l'abri du gel.
      icon: tabler:package
      category: all
    - title: Qu'est-ce qui est inclus avec la piscine ?
      description: Chaque piscine Felizbay comprend une pompe à air électrique, un kit de réparation et un sac de rangement. Les modèles ronds ont un couvercle ajusté en option.
      icon: tabler:box
      category: all
    - title: Quelles tailles sont disponibles ?
      description: "48 références standards réparties dans quatre collections : piscines rondes jusqu'à 10 m de diamètre, piscines rectangulaires jusqu'à 6 × 5 m et baignoires SPA avec sièges intégrés. Des tailles personnalisées sont disponibles pour les partenaires commerciaux."
      icon: tabler:ruler-2
      category: all
    - title: Sur quelles surfaces la piscine peut-elle reposer ?
      description: "Toute surface plane et nivelée exempte d'objets pointus : pelouse, patio ou terrasse. Un tapis de sol est recommandé sur les surfaces rugueuses. Vérifiez que la surface peut supporter le poids d'une piscine remplie."
      icon: tabler:layout-grid
      category: all
    - title: Comment garder l’eau propre ?
      description: "Utilisez une pompe à filtre là où elle est installée, écumez les débris, vérifiez le pH et couvrez la piscine lorsqu'elle n'est pas utilisée. La durée de vie de l'eau dépend de la taille de la piscine, de son utilisation et de sa filtration : testez-la régulièrement plutôt que de vous fier à un calendrier fixe."
      icon: tabler:droplet
      category: all
