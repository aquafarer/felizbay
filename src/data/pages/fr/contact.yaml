hero_text:
  tagline: Contact
  title: ENTRER EN CONTACT
contact_form:
  id: form
  title: Envoyez-nous un message
  subtitle: Pour des devis, des questions techniques ou des demandes de partenariat, écrivez-nous. Nous répondons dans un délai d'un jour ouvrable.
  email_to: info@felizbay.com
  submit_button: Envoyer une demande → Obtenir un devis
  success_message: Merci! Votre message a atterri dans notre boîte de réception. Nous vous répondrons dans un délai d'un jour ouvrable.
  error_message: Une erreur s'est produite lors de l'envoi de votre message. Veuillez réessayer ou envoyez-nous un e-mail directement.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam : veuillez résoudre les problèmes suivants"
  fields:
    - name: firstName
      label: Prénom
      row: 1
    - name: lastName
      label: Nom de famille
      row: 1
    - name: inquiryType
      label: Type de demande
      row: 2
      type: select
      options:
        - value: ""
          label: Quel est l'objet de votre demande ?
        - value: retail
          label: Commande en ligne d'une piscine unique (détail)
        - value: wholesale
          label: Commande de gros / en vrac (B2B)
        - value: oem
          label: Personnalisation OEM/ODM
        - value: support
          label: Service après-vente et garantie
    - name: companyName
      label: Nom de l'entreprise
      row: 3
    - name: address
      label: Adresse
      row: 4
    - name: zip
      label: Zip / code postal
      row: 5
    - name: country
      label: Pays
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 6
      type: email
    - name: tel
      label: TÉL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Volume de commande estimé
      row: 7
      type: select
      options:
        - value: ""
          label: Sélectionnez votre volume estimé...
        - value: 1-unit
          label: 1 unité — une seule piscine (commande en ligne au détail)
        - value: sample
          label: Échantillons / Prototypes uniquement
        - value: 5-10
          label: 5 à 10 unités (MOQ standard)
        - value: 100-500
          label: 100 à 500 unités
        - value: 500-plus
          label: Plus de 500 unités (tarification au volume)
    - name: customization
      label: Personnalisation nécessaire ?
      row: 8
      type: select
      options:
        - value: ""
          label: Sélectionnez le type de personnalisation...
        - value: none
          label: Produit standard (pas de personnalisation)
        - value: logo
          label: Logo personnalisé/image de marque uniquement
        - value: full
          label: OEM complet (taille, couleur, graphiques, emballage)
        - value: consultation
          label: Je ne suis pas sûr – besoin de consultation
    - name: productInterest
      label: Bassin d’intérêt
      row: 9
      type: select
      options:
        - value: ""
          label: Sélectionnez le type de piscine...
        - value: all
          label: Toutes les piscines / Catalogue complet
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Spa portable — Rond
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Spa / Swim Spa — Carré
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Sujet
      row: 10
    - name: message
      label: Message
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Autres moyens de nous joindre
  columns: 3
  items:
    - title: Demandes de vente
      description: Devis de pool, prix de gros et commandes groupées.
      icon: tabler:shopping-bag
    - title: Assistance technique
      description: Aide à l'installation, réparations, pièces de rechange et questions d'entretien.
      icon: tabler:tool
    - title: OEM/ODM
      description: Tailles, couleurs, couvertures, marque et emballage personnalisés.
      icon: tabler:palette
    - title: E-mail
      description: info@felizbay.com
      icon: tabler:mail
    - title: Site web
      description: felizbay.com
      icon: tabler:world
    - title: Temps de réponse
      description: Nous répondons dans un délai d'un jour ouvrable.
      icon: tabler:clock
map:
  title: Entrer en contact
  subtitle: Contacter Felizbay
  address: felizbay.com
  zoom: 15
