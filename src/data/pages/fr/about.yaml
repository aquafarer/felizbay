hero:
  tagline: À propos de nous
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Piscine gonflable Felizbay
  title: |
    Rendre la natation simple, <br />
    à la <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay est une marque de piscines gonflables Drop Stitch haut de gamme conçue et exploitée par Aquafarer LLC (USA). Nous pensons que chaque famille mérite une vraie piscine dans son jardin, une installation hors sol, sans construction permanente de piscine. Nos piscines se gonflent en quelques minutes, survivent à des étés complets de plaisir en famille et se rangent petites à la fin de la saison. Les exigences en matière de permis, de barrières et d’installation varient selon la localité.
