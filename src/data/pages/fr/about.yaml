production_section:
  tagline: Excellence de la production
  title: Assurer un savoir-faire exquis
  description: La ligne de production Felizbay est dédiée aux piscines gonflables haute pression de haute qualité, durables.
  cards:
    - title: Équipe de techniciens expérimentés
      items:
        - Connaissance professionnelle du point de chute et des matériaux PVC
        - Un savoir-faire précis en matière de découpe, de soudage et d'assemblage
        - Formation continue pour maîtriser les dernières technologies de production
    - title: Équipement de production avancé
      items:
        - Équipement de découpe de précision pour des panneaux de tissu précis
        - Soudage thermique de haute précision pour des coutures étanches et durables
        - Équipement professionnel de test de pression et d'étanchéité à l'air
    - title: Système de gestion mature
      items:
        - Processus de production standardisés avec des normes de qualité claires
        - Philosophie de production Lean réduisant les déchets et améliorant l’efficacité
        - Gestion efficace de la chaîne d’approvisionnement avec des fournisseurs fiables
    - title: Contrôle de qualité strict
      items:
        - 'Inspection en plusieurs étapes : matière première, en cours de fabrication, sortie finale'
        - Test de pression au sommet de la plage de travail nominale de 4 à 6 PSI
        - Tests stricts d’étanchéité à l’air et de durabilité avant expédition
