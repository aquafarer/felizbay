features:
  id: features
  tagline: Drop Stitch tehnoloogia
  title: Miks just Felizbay bassein<br />On Erinev
  subtitle: Kõrgsurve Drop Stitch-konstruktsioon muudab meie basseinid jäigaks, vastupidavaks ja lihtsaks ladustamiseks.
  columns: 2
  items:
    - title: Jäigad Drop Stitch seinad
      description: 'Tuhanded sisekeermed lukustavad seinakihid kokku, nii et bassein pumbatakse jäigaks 4–5 PSI juures ja säilitab täitmisel oma kuju.'
      icon: tabler:hexagon
    - title: Kiire ja tööriistavaba seadistamine
      description: Täitke kaasasoleva elektripumbaga minutitega, seejärel täitke aiavoolikuga. Ei mingeid tööriistu, ehitust ega professionaalset paigaldust.
      icon: tabler:rocket
    - title: Pakid ära väikesed
      description: 'Tühjendage, tühjendage, rullige kokku ja hoidke bassein talvel kotis – täissuuruses bassein, mis on siseruumides hoiustamiseks väike.'
      icon: tabler:package
    - title: Vastupidav ja UV-kindel
      description: 'Kahekihiline PVC drop stitch kangas, mis on konstrueeritud nii, et see talub torke ja UV kokkupuudet terve pere kasutushooaja jooksul.'
      icon: tabler:shield
    - title: Täielik pakett
      description: Iga basseiniga on kaasas elektriline õhupump, remondikomplekt ja hoiukott. Ümmargustele mudelitele on saadaval paigaldatud katted.
      icon: tabler:box
    - title: Ohutustundlik disain
      description: 'Elamu basseini projekt, mis viitab standarditele EN 16582-1 ja ASTM F2666 – mudelispetsiifiline ohutusteave on toodud toote dokumentatsioonis. Alati on vajalik täiskasvanu pidev järelevalve.'
      icon: tabler:shield-check
