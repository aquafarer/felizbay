content_compliance:
  tagline: Hooldus ja ohutus
  title: Lihtne omada,<br />Lihtne armastada
  subtitle: Alates tarnimisest kuni esimese ujumiseni kuni hooaja lõpu hoiustamiseni on Felizbay basseini omamine lihtne.
  items:
    - title: Seadistamine minutitega
      description: 'Eemaldage kast ja täitke 5–15 minutiga kaasasoleva pumbaga, seejärel täitke aiavoolikuga – täitmisaeg sõltub basseini suurusest ja veevarustusest.'
      icon: tabler:rocket
    - title: Lihtne veehooldus
      description: Standardsed 32/38 mm filtripumba pordid, regulaarne pH kontroll ja ümarate mudelite paigaldatud kate hoiavad vee puhtana.
      icon: tabler:droplet
    - title: Puhastage, tühjendage ja hoidke
      description: Nõruta, kuivata, rulli kokku ja paki bassein talveks hoiukotti. Hooldamiseks pole püsivat paigaldust.
      icon: tabler:package
    - title: Ohutus ennekõike
      description: Lapsed peavad olema kogu aeg aktiivse täiskasvanu järelevalve all. Järgige juhendit, kohalikke eeskirju ja ohutu kasutamise juhiseid.
      icon: tabler:shield-check
steps:
  title: Boksist tagahoovi
  items:
    - title: '1. samm: <span class="font-medium">Valige oma bassein</span>'
      description: Võrrelge kuju ja suurusi, et need vastaksid teie ruumile, majapidamisele ja sellele, kuidas kavatsete vett kasutada.
      icon: tabler:pool
    - title: '2. samm: <span class="font-medium">Seadista see üles</span>'
      description: Asetage kindlale tasasele pinnale, täitke kaasasoleva elektripumbaga ja täitke aiavoolikuga.
      icon: tabler:rocket
    - title: '3. samm: <span class="font-medium">Ujuda kogu suve</span>'
      description: Hoidke vett värskena lihtsa hooldusega – koorige, katke ja kontrollige pH-d nagu iga väikese basseini puhul.
      icon: tabler:ripple
    - title: '4. samm: <span class="font-medium">Hoidke see ära</span>'
      description: Kui hooaeg lõpeb, tühjendage, kuivatage, rullige kokku ja hoidke bassein oma kotis kuni järgmise suveni.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay ümmargune Drop Stitch täispuhutav bassein
