faqs:
  title: Täispuhutava basseini KKK
  subtitle: Levinud küsimused Felizbay täispuhutavate basseinide kohta.
  columns: 2
  items:
    - title: Kui kaua seadistamine aega võtab?
      description: 'Täitmine võtab olenevalt mudelist kaasasoleva elektrilise õhupumbaga 5-15 minutit. Täitmisaeg sõltub basseini mahust ja veevarust.'
      icon: tabler:clock
      category: all
    - title: Kui jäik on Drop Stitchi bassein?
      description: Väga jäik. Drop Stitchi seinad paisuvad kõvasti täis 4–5 PSI juures – sarnaselt täispuhutavale aerulauale – nii et bassein säilitab veega täitmisel oma kuju.
      icon: tabler:hexagon
      category: all
    - title: Kas lapsed saavad basseini kasutada?
      description: Jah, kogu aeg aktiivse täiskasvanu järelevalve all. Lapsi ei tohi kunagi jätta basseini ega selle lähedusse järelevalveta – järgige kasutusjuhendit ja kohalikke ohutusreegleid.
      icon: tabler:users
      category: all
    - title: Kuidas basseini talvel hoida?
      description: Tühjendage vesi, laske basseinist tühjaks, laske sellel täielikult kuivada, seejärel rullige see kokku ja hoidke kaasasolevas hoiukotis külmavabas kohas.
      icon: tabler:package
      category: all
    - title: Mis on basseiniga kaasas?
      description: Iga Felizbay bassein sisaldab elektrilist õhupumpa, remondikomplekti ja hoiukotti. Ümaratel mudelitel on valikuline paigaldatud kate.
      icon: tabler:box
      category: all
    - title: Mis suurused on saadaval?
      description: 48 standardset SKU-d neljas kollektsioonis – ümmargused basseinid läbimõõduga kuni 10 m, ristkülikukujulised basseinid kuni 6 × 5 m ja sisseehitatud istmetega SPA vannid. Äripartneritele on saadaval kohandatud suurused.
      icon: tabler:ruler-2
      category: all
    - title: Millistel pindadel võib bassein seista?
      description: 'Iga tasane ja tasane pind, millel pole teravaid esemeid – muru, terrass või terrass. Karedatel pindadel on soovitatav lihvida. Täidetud bassein on raske: paigaldage ainult täismassi kandvale pinnale ning laske esmalt hinnata kõrgendatud tekke, rõdusid ja katusi.'
      icon: tabler:layout-grid
      category: all
    - title: Kuidas ma veen puhtana hoian?
      description: Kasutage filtripumpa, kui see on paigaldatud, koorige praht, kontrollige pH-d ja katke bassein, kui seda ei kasutata. Kui kauaks vett jätkub, sõltub basseini suurusest, kasutusest ja filtreerimisest – testige regulaarselt, mitte ei tugine kindlale ajakavale.
      icon: tabler:droplet
      category: all
