hero:
  tagline: Premium Drop Stitch täispuhutavad basseinid
  title: Kasutage oma<br />Väliruumi rohkem.
  subtitle: |
    Kõrgetasemelised jäikade drop-stitch seintega basseinid, mis täituvad mõne minutiga ja pakitakse talveks kaasa – loodud tagaaias lõõgastumiseks ja pere lõbutsemiseks.<br />
    Uurige basseini suurusi, võrrelge funktsioone ja leidke oma ruumi jaoks sobiv.<br />
    Projekteeris ja haldab Aquafarer LLC, USA.
  actions:
    - variant: primary
      text: Ostke basseinid
      href: /products
      icon: tabler:pool
    - text: Leidke oma bassein
      href: /find-your-pool
      icon: tabler:compass
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Felizbay ristkülikukujuline Drop Stitch täispuhutav bassein tagaaias
features:
  id: features
  tagline: Drop Stitch tehnoloogia
  title: Miks just Felizbay bassein<br />On Erinev
  subtitle: Kõrgsurve Drop Stitch-konstruktsioon muudab meie basseinid jäigaks, vastupidavaks ja lihtsaks ladustamiseks.
  columns: 2
  items:
    - title: Jäigad Drop Stitch seinad
      description: 'Tuhanded sisekeermed lukustavad seinakihid kokku, nii et bassein pumbatakse jäigaks 4–5 PSI juures ja säilitab täitmisel oma kuju.'
      icon: tabler:hexagon
    - title: Kiire ja tööriistavaba seadistamine
      description: Täitke kaasasoleva elektripumbaga minutitega, seejärel täitke aiavoolikuga. Ei mingeid tööriistu, ehitust ega professionaalset paigaldust.
      icon: tabler:rocket
    - title: Pakid ära väikesed
      description: 'Tühjendage, tühjendage, rullige kokku ja hoidke bassein talvel kotis – täissuuruses bassein, mis on siseruumides hoiustamiseks väike.'
      icon: tabler:package
    - title: Vastupidav ja UV-kindel
      description: 'Kahekihiline PVC drop stitch kangas, mis on konstrueeritud nii, et see talub torke ja UV kokkupuudet terve pere kasutushooaja jooksul.'
      icon: tabler:shield
    - title: Täielik pakett
      description: Iga basseiniga on kaasas elektriline õhupump, remondikomplekt ja hoiukott. Ümmargustele mudelitele on saadaval paigaldatud katted.
      icon: tabler:box
    - title: Ohutustundlik disain
      description: 'Elamu basseini projekt, mis viitab standarditele EN 16582-1 ja ASTM F2666 – mudelispetsiifiline ohutusteave on toodud toote dokumentatsioonis. Alati on vajalik täiskasvanu pidev järelevalve.'
      icon: tabler:shield-check
content_customer_types:
  tagline: Basseini ideed
  title: Õige bassein<br />Sinu ruum
  subtitle: Tõelised seadistused, tegelikud suurused ja ausad juhised õige basseini valimiseks.
content_categories:
  tagline: Ostke basseinid
  title: Tutvuge meie basseinidega
  subtitle: Võrrelge kujusid, suurusi ja funktsioone, et leida oma tagahoovi või väliruumi jaoks õige bassein.
content_compliance:
  tagline: Hooldus ja ohutus
  title: Lihtne omada,<br />Lihtne armastada
  subtitle: Alates tarnimisest kuni esimese ujumiseni kuni hooaja lõpu hoiustamiseni on Felizbay basseini omamine lihtne.
  items:
    - title: Seadistamine minutitega
      description: 'Eemaldage kast ja täitke 5–15 minutiga kaasasoleva pumbaga, seejärel täitke aiavoolikuga – täitmisaeg sõltub basseini suurusest ja veevarustusest.'
      icon: tabler:rocket
    - title: Lihtne veehooldus
      description: Standardsed 32/38 mm filtripumba pordid, regulaarne pH kontroll ja ümarate mudelite paigaldatud kate hoiavad vee puhtana.
      icon: tabler:droplet
    - title: Puhastage, tühjendage ja hoidke
      description: Nõruta, kuivata, rulli kokku ja paki bassein talveks hoiukotti. Hooldamiseks pole püsivat paigaldust.
      icon: tabler:package
    - title: Ohutus ennekõike
      description: Lapsed peavad olema kogu aeg aktiivse täiskasvanu järelevalve all. Järgige juhendit, kohalikke eeskirju ja ohutu kasutamise juhiseid.
      icon: tabler:shield-check
steps:
  title: Boksist tagahoovi
  items:
    - title: '1. samm: <span class="font-medium">Valige oma bassein</span>'
      description: Võrrelge kuju ja suurusi, et need vastaksid teie ruumile, majapidamisele ja sellele, kuidas kavatsete vett kasutada.
      icon: tabler:pool
    - title: '2. samm: <span class="font-medium">Seadista see üles</span>'
      description: Asetage kindlale tasasele pinnale, täitke kaasasoleva elektripumbaga ja täitke aiavoolikuga.
      icon: tabler:rocket
    - title: '3. samm: <span class="font-medium">Ujuda kogu suve</span>'
      description: Hoidke vett värskena lihtsa hooldusega – koorige, katke ja kontrollige pH-d nagu iga väikese basseini puhul.
      icon: tabler:ripple
    - title: '4. samm: <span class="font-medium">Hoidke see ära</span>'
      description: Kui hooaeg lõpeb, tühjendage, kuivatage, rullige kokku ja hoidke bassein oma kotis kuni järgmise suveni.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay ümmargune Drop Stitch täispuhutav bassein
