hero:
  tagline: Meie kohta
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay täispuhutav bassein
  title: |
    Ujumise lihtsaks muutmine, <br />
     <span class="text-accent dark:text-white">Felizbay</span>-viisil
  subtitle: Felizbay on esmaklassiline täispuhutav Drop Stitch basseini bränd, mille kujundas ja haldab Aquafarer LLC (USA). Usume, et iga pere väärib tõelist basseini tagahoovis – maapealne paigaldus ilma püsiva basseini ehituseta. Meie basseinid täituvad mõne minutiga jäigaks, elavad üle terve suvi pere lõbusalt ja pakivad hooaja lõpus väikeseks. Lubade, tarade ja paigalduse nõuded varieeruvad asukoha järgi.
