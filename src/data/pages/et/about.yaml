production_section:
  tagline: Tootmise tipptase
  title: Peen käsitöö tagamine
  description: Felizbay tootmisliin on pühendatud kvaliteetsetele, vastupidavatele kõrgsurvega täispuhutavatele basseinidele.
  cards:
    - title: Kogenud tehnikute meeskond
      items:
        - Erialased teadmised tilkpistest ja PVC materjalidest
        - Täpne meisterlikkus lõikamisel, keevitamisel ja monteerimisel
        - Pidev koolitus uusimate tootmistehnoloogiate valdamiseks
    - title: Täiustatud tootmisseadmed
      items:
        - Täppislõikeseadmed täpsete kangapaneelide jaoks
        - Kõrge täpsusega kuumkeevitus õhukindlate, vastupidavate õmbluste jaoks
        - Professionaalsed rõhu- ja õhutiheduse testimisseadmed
    - title: Küps juhtimissüsteem
      items:
        - Standardiseeritud tootmisprotsessid selgete kvaliteedistandarditega
        - Lean tootmisfilosoofia, mis vähendab jäätmeid ja parandab tõhusust
        - Tõhus tarneahela juhtimine usaldusväärsete tarnijatega
    - title: Range kvaliteedikontroll
      items:
        - 'Mitmeastmeline kontroll: tooraine, protsessis, lõplik väljaminek'
        - Rõhu testimine 4–6 PSI töövahemiku tipus
        - Enne saatmist range õhutiheduse ja vastupidavuse testimine
