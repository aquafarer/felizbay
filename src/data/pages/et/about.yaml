features3_what_we_build:
  title: Mida me ehitame
  subtitle: Fokuseeritud tootesari, mida tunneme läbi ja lõhki – kõrgsurvega Drop Stitch täispuhutavad basseinid.
  columns: 3
  isBeforeContent: true
  items:
    - title: Ristkülikukujulised basseinid
      description: Pere suuruses ristkülikukujulised Drop Stitch basseinid, mis suurendavad teie ruumi jaoks sobivat ujumisala.
      icon: tabler:rectangle
    - title: Ümmargused sinised basseinid
      description: Klassikaline tagaaiabassein – särtsakas sinine, jäigad Drop Stitch seinad, kiire seadistamine.
      icon: tabler:circle
    - title: Ümmargused hallid basseinid
      description: Meie esmaklassiline sari moodsa halli viimistluse ja valikulise paigaldatud kattega.
      icon: tabler:circle-dot
    - title: Mullivann SPA basseinid
      description: 'Isoleeritud kümblustünnide mudelid, millel on sisseehitatud istmed ja 5 mm isoleeritud põhjad — kasutamiseks välissoojenditega (soojendi ei kuulu komplekti).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Täielikud paketid
      description: Iga basseinikomplektiga on kaasas elektriline õhupump, remondikomplekt ja hoiukott.
      icon: tabler:package
    - title: Kohandatud suurused
      description: OEM-i suurused, värvid ja kaaned kaubamärkide, turustajate ja hotellindusprojektide jaoks.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Privaatsete etikettide tootmine koos logo trükkimise ja jaemüügivalmis pakendiga.
      icon: tabler:palette
