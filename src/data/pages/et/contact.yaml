hero_text:
  tagline: Võtke ühendust
  title: VÕTA ÜHENDUST
contact_form:
  id: form
  title: Saada meile sõnum
  subtitle: Hinnapakkumiste, tehniliste küsimuste või partnerluspäringute korral kirjutage meile. Vastame ühe tööpäeva jooksul.
  email_to: info@felizbay.com
  submit_button: Saada päring → Küsi pakkumist
  success_message: Aitäh! Teie sõnum jõudis meie postkasti. Vastame ühe tööpäeva jooksul.
  error_message: Midagi läks teie sõnumi saatmisel valesti. Proovige uuesti või saatke meile otse e-kiri.
  default_country_code: "+1"
  captcha:
    label: "Rämpspostitõrje: palun lahendage järgmine"
  fields:
    - name: firstName
      label: Eesnimi
      row: 1
    - name: lastName
      label: Perekonnanimi
      row: 1
    - name: inquiryType
      label: Päringu tüüp
      row: 2
      type: select
      options:
        - value: ""
          label: Millega teie päring seotud on?
        - value: retail
          label: Ühe basseini tellimus veebis (jaemüük)
        - value: wholesale
          label: Hulgi- / suurtellimus (B2B)
        - value: oem
          label: OEM/ODM kohandamine
        - value: support
          label: Müügijärgne tugi ja garantii
    - name: companyName
      label: Ettevõtte nimi
      row: 3
    - name: address
      label: Aadress
      row: 4
    - name: zip
      label: Postiindeks
      row: 5
    - name: country
      label: Riik
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-post
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Hinnanguline tellimuste maht
      row: 7
      type: select
      options:
        - value: ""
          label: Valige oma hinnanguline helitugevus...
        - value: 1-unit
          label: 1 tk — üks bassein (veebijae ost)
        - value: sample
          label: Ainult näidised/prototüübid
        - value: 5-10
          label: 5–10 ühikut (standardne MOQ)
        - value: 100-500
          label: 100-500 ühikut
        - value: 500-plus
          label: 500+ ühikut (mahuhinnakujundus)
    - name: customization
      label: Kas vajate kohandamist?
      row: 8
      type: select
      options:
        - value: ""
          label: Valige kohandamise tüüp...
        - value: none
          label: Standardtoode (ilma kohandamiseta)
        - value: logo
          label: Ainult kohandatud logo/bränding
        - value: full
          label: Täielik originaalseadmete tootja (suurus, värv, graafika, pakend)
        - value: consultation
          label: Pole kindel - vajan konsultatsiooni
    - name: productInterest
      label: Huvikogum
      row: 9
      type: select
      options:
        - value: ""
          label: Valige basseini tüüp...
        - value: all
          label: Kõik basseinid / Täielik kataloog
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Kaasaskantav mullivann — Ümmargune
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Mullivann / Swim Spa — Ruudukujuline
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Teema
      row: 10
    - name: message
      label: Sõnum
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Muud viisid meieni jõudmiseks
  columns: 3
  items:
    - title: Müügipäringud
      description: Basseini hinnapakkumised, hulgihinnad ja hulgitellimused.
      icon: tabler:shopping-bag
    - title: Tehniline tugi
      description: Seadistusabi, remont, varuosad ja hooldusküsimused.
      icon: tabler:tool
    - title: OEM / ODM
      description: Kohandatud suurused, värvid, kaaned, kaubamärk ja pakend.
      icon: tabler:palette
    - title: Meil
      description: info@felizbay.com
      icon: tabler:mail
    - title: Veebisait
      description: felizbay.com
      icon: tabler:world
    - title: Reageerimisaeg
      description: Vastame ühe tööpäeva jooksul.
      icon: tabler:clock
map:
  title: Võtke ühendust
  subtitle: Võtke Felizbayga ühendust
  address: felizbay.com
  zoom: 15
