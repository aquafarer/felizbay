content_compliance:
  tagline: טיפול ובטיחות
  title: קל לבעלות,<br />קל לאהוב
  subtitle: מהמסירה לשחייה הראשונה ועד לאחסון סוף העונה, בעלות על בריכת Felizbay נשארת פשוטה.
  items:
    - title: הגדרה תוך דקות
      description: 'פתח את הארגז ונפח בעזרת המשאבה הכלולה תוך 5-15 דקות, ולאחר מכן מלא בצינור גינה - זמן המילוי משתנה בהתאם לגודל הבריכה ואספקת המים.'
      icon: tabler:rocket
    - title: טיפול פשוט במים
      description: יציאות משאבת מסנן סטנדרטיות בגודל 32/38 מ"מ, בדיקות pH רגילות ומכסה מצויד בדגמים עגולים שומרים על ניקיון המים.
      icon: tabler:droplet
    - title: נקה, ניקוז ואחסן
      description: רוקנו, יבשו, גלגלו וארוז את הבריכה בתיק האחסון שלה לחורף. אין התקנה קבועה לתחזוקה.
      icon: tabler:package
    - title: בטיחות ראשונה
      description: ילדים חייבים להיות בהשגחה פעילה של מבוגר בכל עת. פעל לפי המדריך, הכללים המקומיים וההנחיות לשימוש בטוח.
      icon: tabler:shield-check
steps:
  title: מקופסה לחצר האחורית
  items:
    - title: 'שלב 1: <span class="font-medium">בחר את הבריכה שלך</span>'
      description: השווה צורות וגדלים כדי להתאים לחלל, למשק הבית שלך ולאופן שבו אתה מתכנן להשתמש במים.
      icon: tabler:pool
    - title: 'שלב 2: <span class="font-medium">הגדר את זה</span>'
      description: הניחו על קרקע יציבה וישרה, נפחו בעזרת המשאבה החשמלית המצורפת, ומלאו בצינור גינה.
      icon: tabler:rocket
    - title: 'שלב 3: <span class="font-medium">לשחות כל הקיץ</span>'
      description: שמור את המים טריים עם טיפול פשוט - רפרף, כסה ובדוק את ה-pH כמו כל בריכה קטנה.
      icon: tabler:ripple
    - title: 'שלב 4: <span class="font-medium">אחסן את זה משם</span>'
      description: בסיום העונה יש לנקז, לייבש, לגלגל ולאחסן את הבריכה בתיק עד הקיץ הבא.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay בריכת שחיה מתנפחת Drop Stitch עגולה
blog_latest:
  title: מדריכים ותובנות לבריכה
  information: |
    מדריכי התקנה, טיפים לטיפול ועצות קנייה לבריכות שחייה מתנפחות
    מצוות Felizbay.
faqs:
  title: בריכה מתנפחת שאלות נפוצות
  subtitle: שאלות נפוצות על בריכות שחייה מתנפחות של Felizbay.
  columns: 2
  items:
    - title: כמה זמן לוקחת ההתקנה?
      description: 'הניפוח לוקח 5-15 דקות עם משאבת האוויר החשמלית הכלולה בהתאם לדגם. זמן המילוי משתנה בהתאם לקיבולת הבריכה ואספקת המים שלך.'
      icon: tabler:clock
      category: all
    - title: כמה קשיחה בריכת Drop Stitch?
      description: מאוד נוקשה. קירות Drop Stitch מתנפחים בעוצמה של 4-5 PSI - בדומה ללוח משוטים מתנפח - כך שהבריכה שומרת על צורתה כשהיא מלאה במים.
      icon: tabler:hexagon
      category: all
    - title: האם ילדים יכולים להשתמש בבריכה?
      description: כן, עם השגחת מבוגרים פעילה בכל עת. אסור להשאיר ילדים ללא השגחה בבריכה או ליד הבריכה - פעל לפי המדריך וכללי הבטיחות המקומיים.
      icon: tabler:users
      category: all
    - title: איך אני מאחסן את הבריכה בחורף?
      description: רוקנו את המים, רוקנו את הבריכה, הניחו לה להתייבש לחלוטין, ואז גלגלו אותה ואחסנו אותה בשקית האחסון המצורפת במקום נטול כפור.
      icon: tabler:package
      category: all
    - title: מה כלול בבריכה?
      description: כל בריכת Felizbay כוללת משאבת אוויר חשמלית, ערכת תיקון ושקית אחסון. לדגמים עגולים יש כיסוי אופציונלי.
      icon: tabler:box
      category: all
    - title: אילו גדלים זמינים?
      description: 48 מק"טים סטנדרטיים על פני ארבע אוספים - בריכות עגולות בקוטר של עד 10 מ', בריכות מלבניות עד 6 × 5 מ', ואמבטיות ספא ​​עם מושבים מובנים. גדלים מותאמים אישית זמינים עבור שותפים עסקיים.
      icon: tabler:ruler-2
      category: all
    - title: על אילו משטחים הבריכה יכולה לעמוד?
      description: 'כל משטח שטוח וישר ללא חפצים חדים - מדשאה, פטיו או סיפון. יריעת קרקע מומלצת על משטחים מחוספסים. בריכה מלאה היא כבדה: התקן רק על משטח התומך במלוא המשקל, ותחילה יש להעריך מבני סיפונים מוגבהים, מרפסות וגגות.'
      icon: tabler:layout-grid
      category: all
    - title: איך אני שומרת על ניקיון המים?
      description: השתמש במשאבת סינון במקום שבו היא מותקנת, הסר פסולת, בדוק את ה-pH, וכסה את הבריכה כאשר אינה בשימוש. משך זמן המים תלוי בגודל הבריכה, השימוש והסינון - בדוק באופן קבוע במקום להסתמך על לוח זמנים קבוע.
      icon: tabler:droplet
      category: all
