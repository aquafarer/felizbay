content_evidence:
  tagline: 'למה Felizbay'
  title: 'למה לבחור בבריכת Drop Stitch של Felizbay?'
  subtitle: 'בחרו בריכה לפי השטח שלכם, אופן השימוש המתוכנן והתכונות שהכי חשובות לכם.'
  items:
    - title: 'מעוצב לחיים בחוץ'
      description: 'גלו אפשרויות בריכה לרגיעה בחצר, זמן מים משפחתי, רביצה בחוץ ונכסי נופש עונתיים.'
      icon: tabler:home
      cta: 'עיינו ברעיונות לבריכות'
      cta_href: /pool-ideas/backyard-pools-for-families/
    - title: 'השוו מפרטי מוצר אמיתיים'
      description: 'בדקו ממדים, קיבולת מים, לחץ עבודה מומלץ, אביזרים כלולים ודרישות התקנה לפני שאתם בוחרים.'
      icon: tabler:table
      cta: 'צפו במפרט'
      cta_href: /products/specs/
    - title: 'הבינו את מבנה ה-Drop Stitch'
      description: 'למדו כיצד המבנה הפנימי פועל, מה המשמעות שלו לצורת הבריכה ולאחסון, וכיצד ביצועי המוצר תלויים בניפוח ובהתקנה נכונים.'
      icon: tabler:hexagon
      cta: 'קראו את המדריך'
      cta_href: /guides/what-is-a-drop-stitch-inflatable-pool/
    - title: 'בחרו בביטחון'
      description: 'גשו למדריכי מוצר, הוראות טיפול, פרטי אחריות ותמיכה שיעזרו לכם להחליט אם בריכת Felizbay מתאימה לצרכים שלכם.'
      icon: tabler:shield-check
      cta: 'קראו את השאלות הנפוצות'
      cta_href: /faq/

