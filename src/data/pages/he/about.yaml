production_section:
  tagline: מצוינות בייצור
  title: הבטחת אומנות מעולה
  description: קו הייצור של Felizbay מוקדש לבריכות שחייה מתנפחות איכותיות ועמידות בלחץ גבוה.
  cards:
    - title: צוות טכנאים מנוסה
      items:
        - ידע מקצועי בחומרי תפר טיפה וחומרי PVC
        - אומנות מדויקת בחיתוך, ריתוך והרכבה
        - הכשרה מתמשכת לשליטה בטכנולוגיות הייצור העדכניות ביותר
    - title: ציוד ייצור מתקדם
      items:
        - ציוד חיתוך מדויק ללוחות בד מדויקים
        - ריתוך חום ברמת דיוק גבוהה לתפרים אטומים ועמידים
        - ציוד מקצועי לבדיקת לחץ ואטימות
    - title: מערכת ניהול בוגרת
      items:
        - תהליכי ייצור מתוקננים עם תקני איכות ברורים
        - פילוסופיית ייצור רזה הפחתת פסולת ושיפור היעילות
        - ניהול שרשרת אספקה ​​יעיל עם ספקים אמינים
    - title: בקרת איכות קפדנית
      items:
        - 'בדיקה רב-שלבית: חומר גלם, בתהליך, יוצא סופי'
        - בדיקת לחץ בחלק העליון של טווח העבודה המדורג 4-6 PSI
        - בדיקת אטימות ועמידות קפדנית לפני המשלוח
