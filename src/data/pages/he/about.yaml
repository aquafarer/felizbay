hero:
  tagline: עלינו
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: בריכת שחיה מתנפחת Felizbay
  title: |
    הופכים את השחייה לפשוטה, <br />
    בסגנון <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay הוא מותג פרימיום לבריכה מתנפחת Drop Stitch שתוכנן ומופעל על ידי Aquafarer LLC (ארה"ב). אנו מאמינים שלכל משפחה מגיעה בריכה אמיתית בחצר האחורית - התקנה על הקרקע ללא בנייה קבועה של בריכה. הבריכות שלנו מתנפחות תוך דקות, שורדות קיץ מלא של כיף משפחתי, ואורזות בקטנה בסוף העונה. דרישות היתר, גידור והתקנה משתנות בהתאם למיקום.
