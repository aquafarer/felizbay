content_compliance:
  tagline: Pangangalaga at Kaligtasan
  title: Madaling pagmamay-ari,<br />Madaling Magmahal
  subtitle: Mula sa paghahatid hanggang sa unang paglangoy hanggang sa end-of-season storage, nananatiling simple ang pagmamay-ari ng Felizbay pool.
  items:
    - title: Setup sa Minuto
      description: 'I-unbox at i-inflate ang kasamang pump sa loob ng 5-15 minuto, pagkatapos ay punuin ng hose sa hardin — nag-iiba ang oras ng pagpuno sa laki ng pool at supply ng tubig.'
      icon: tabler:rocket
    - title: Simpleng Pangangalaga sa Tubig
      description: Ang mga karaniwang 32/38 mm na filter-pump port, regular na pH check, at isang fitted na takip sa mga bilog na modelo ay nagpapanatili ng malinis na tubig.
      icon: tabler:droplet
    - title: Linisin, Patuyuin at Tindahan
      description: Patuyuin, tuyo, i-roll up, at i-pack ang pool sa storage bag nito para sa taglamig. Walang permanenteng pag-install upang mapanatili.
      icon: tabler:package
    - title: Kaligtasan Una
      description: Ang mga bata ay dapat na aktibong pinangangasiwaan ng isang may sapat na gulang sa lahat ng oras. Sundin ang manwal, mga lokal na panuntunan, at gabay sa ligtas na paggamit.
      icon: tabler:shield-check
steps:
  title: Mula Box hanggang Backyard
  items:
    - title: 'Hakbang 1: <span class="font-medium">Piliin ang Iyong Pool</span>'
      description: Ihambing ang mga hugis at sukat upang tumugma sa iyong espasyo, sambahayan, at kung paano mo pinaplanong gamitin ang tubig.
      icon: tabler:pool
    - title: 'Hakbang 2: <span class="font-medium">I-set Up Ito</span>'
      description: Ilagay sa matatag, patag na lupa, lagyan ng hangin ang kasamang electric pump, at punuin ng hose sa hardin.
      icon: tabler:rocket
    - title: 'Hakbang 3: <span class="font-medium">Lumangoy sa Buong Tag-init</span>'
      description: Panatilihing sariwa ang tubig sa simpleng pag-aalaga — i-skim, takpan, at suriin ang pH tulad ng anumang maliit na pool.
      icon: tabler:ripple
    - title: 'Hakbang 4: <span class="font-medium">Itago Ito</span>'
      description: Kapag natapos na ang season, alisan ng tubig, tuyo, i-roll up, at itago ang pool sa bag nito hanggang sa susunod na tag-araw.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
