features:
  id: features
  tagline: Teknolohiya ng Drop Stitch
  title: Bakit isang Felizbay Pool<br />Ay Iba
  subtitle: Ang high-pressure drop stitch construction ay ginagawang matibay, matibay, at walang hirap sa pag-imbak ang aming mga pool.
  columns: 2
  items:
    - title: Matibay na Drop Stitch Wall
      description: 'Ang libu-libong panloob na mga thread ay nakakandado sa mga layer ng dingding nang magkakasama, kaya ang pool ay lumaki nang matibay sa rate na 4-5 PSI at pinapanatili ang hugis nito kapag napuno.'
      icon: tabler:hexagon
    - title: Mabilis, Tool-Free Setup
      description: Palakihin ang kasamang electric pump sa loob ng ilang minuto, pagkatapos ay punuin ng hose sa hardin. Walang mga tool, walang konstruksiyon, walang propesyonal na pag-install.
      icon: tabler:rocket
    - title: Naka-pack na Maliit
      description: 'Alisan ng tubig, i-deflate, i-roll up, at itago ang pool sa bag nito sa taglamig - isang full-size na pool na maliit na nakaimpake para sa panloob na imbakan.'
      icon: tabler:package
    - title: Matibay at UV-Resistant
      description: 'Double-layer na PVC drop stitch na tela, na idinisenyo upang labanan ang mga butas at UV exposure sa buong panahon ng paggamit ng pamilya.'
      icon: tabler:shield
    - title: Kumpletong Package
      description: Ang bawat pool ay nagpapadala ng electric air pump, repair kit, at storage bag. Available ang mga fitted cover para sa mga bilog na modelo.
      icon: tabler:box
    - title: Disenyo na Nakababatid sa Kaligtasan
      description: 'Ang disenyo ng residential pool na tumutukoy sa EN 16582-1 at ASTM F2666 — ang impormasyon sa kaligtasan na partikular sa modelo ay ibinibigay sa dokumentasyon ng produkto. Ang patuloy na pangangasiwa ng may sapat na gulang ay palaging kinakailangan.'
      icon: tabler:shield-check
