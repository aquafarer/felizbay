hero:
  tagline: Tungkol sa amin
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay inflatable swimming pool
  title: |
    Ginagawang simple ang paglangoy, <br />
    estilo ng <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Ang Felizbay ay isang premium na drop stitch inflatable pool brand na dinisenyo at pinamamahalaan ng Aquafarer LLC (USA). Naniniwala kami na ang bawat pamilya ay karapat-dapat sa isang tunay na pool sa likod-bahay — pang-ibabaw-ng-lupa na pag-setup nang walang permanenteng konstruksyon ng pool. Ang aming mga pool ay namumuo nang matibay sa loob ng ilang minuto, nakakaligtas sa buong tag-araw ng kasiyahan ng pamilya, at nag-iimpake ng kaunti sa pagtatapos ng season. Nag-iiba ang mga kinakailangan sa permit, hadlang, at pag-install depende sa lokasyon.
