production_section:
  tagline: Kahusayan sa Produksyon
  title: Tinitiyak ang Katangi-tanging Pagkayari
  description: Ang linya ng produksyon ng Felizbay ay nakatuon sa mataas na kalidad, matibay, mataas na presyon ng inflatable swimming pool.
  cards:
    - title: Sanay na Technician Team
      items:
        - Propesyonal na kaalaman sa drop stitch at PVC na materyales
        - Tumpak na pagkakayari sa pagputol, hinang, at pagpupulong
        - Patuloy na pagsasanay upang makabisado ang pinakabagong mga teknolohiya sa produksyon
    - title: Advanced na Kagamitan sa Produksyon
      items:
        - Mga kagamitan sa pagputol ng katumpakan para sa tumpak na mga panel ng tela
        - Mataas na katumpakan init hinang para sa airtight, matibay na tahi
        - Propesyonal na kagamitan sa pagsubok ng presyon at airtightness
    - title: Mature Management System
      items:
        - Standardized na proseso ng produksyon na may malinaw na pamantayan ng kalidad
        - Lean pilosopiya ng produksyon na binabawasan ang basura at pagpapabuti ng kahusayan
        - Mahusay na pamamahala ng kadena ng supply na may maaasahang mga supplier
    - title: Mahigpit na Kontrol sa Kalidad
      items:
        - 'Multi - stage inspeksyon: raw materyal, in - proseso, pangwakas na papalabas'
        - Pagsubok ng presyon sa tuktok ng na-rate na 4-6 PSI na hanay ng pagtatrabaho
        - Mahigpit na airtightness at durability testing bago ipadala
