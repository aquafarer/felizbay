hero:
  tagline: معلومات عنا
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: حوض سباحة قابل للنفخ في Felizbay
  title: |
    جعل السباحة بسيطة، <br />
    على طريقة <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay هي علامة تجارية فاخرة لحمام السباحة القابل للنفخ Drop Stitch تم تصميمها وإدارتها بواسطة Aquafarer LLC (الولايات المتحدة الأمريكية). نحن نؤمن بأن كل عائلة تستحق حمام سباحة حقيقي في الفناء الخلفي - تركيب فوق الأرض دون بناء دائم للمسبح. يتم نفخ حمامات السباحة الخاصة بنا بشكل قوي في دقائق، وتظل على قيد الحياة في الصيف الكامل من المرح العائلي، ويتم تعبئتها بكميات صغيرة في نهاية الموسم. تختلف متطلبات التصاريح والحواجز والتركيب حسب الموقع.
