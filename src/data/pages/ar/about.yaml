production_section:
  tagline: التميز في الإنتاج
  title: ضمان براعة رائعة
  description: إن خط إنتاج Felizbay مخصص لحمامات السباحة القابلة للنفخ عالية الجودة والمتينة وعالية الضغط.
  cards:
    - title: فريق فني من ذوي الخبرة
      items:
        - المعرفة المهنية بالغرزة المتساقطة والمواد البلاستيكية
        - براعة دقيقة في القطع واللحام والتجميع
        - التدريب المستمر لإتقان أحدث تقنيات الإنتاج
    - title: معدات الإنتاج المتقدمة
      items:
        - معدات القطع الدقيقة لألواح القماش الدقيقة
        - لحام حراري عالي الدقة من أجل طبقات محكمة ومتينة
        - معدات اختبار الضغط وضيق الهواء المهنية
    - title: نظام إدارة ناضج
      items:
        - عمليات إنتاج موحدة بمعايير جودة واضحة
        - فلسفة الإنتاج الخالي من الهدر تقلل من الهدر وتحسين الكفاءة
        - إدارة سلسلة التوريد بكفاءة مع موردين موثوقين
    - title: رقابة صارمة على الجودة
      items:
        - 'التفتيش متعدد المراحل: المواد الخام، قيد المعالجة، الصادر النهائي'
        - اختبار الضغط في الجزء العلوي من نطاق العمل المقدر 4-6 رطل لكل بوصة مربعة
        - اختبار صارم لضيق الهواء والمتانة قبل الشحن
