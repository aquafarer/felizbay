  subtitle: قارن الأشكال والأحجام والميزات للعثور على حمام السباحة المناسب للفناء الخلفي أو المساحة الخارجية.
content_compliance:
  tagline: الرعاية والسلامة
  title: سهل التملك،<br />من السهل أن تحب
  subtitle: من التسليم إلى السباحة الأولى إلى التخزين في نهاية الموسم، يظل امتلاك حمام سباحة Felizbay أمرًا بسيطًا.
  items:
    - title: الإعداد في دقائق
      description: 'قم بفك العلبة ونفخها باستخدام المضخة المرفقة خلال 5-15 دقيقة، ثم املأها بخرطوم الحديقة - يختلف وقت الملء باختلاف حجم حوض السباحة وإمدادات المياه.'
      icon: tabler:rocket
    - title: العناية بالمياه البسيطة
      description: تعمل منافذ مضخة الفلتر القياسية مقاس 32/38 مم، وفحوصات منتظمة لدرجة الحموضة، والغطاء المجهز في الموديلات المستديرة على الحفاظ على نظافة المياه.
      icon: tabler:droplet
    - title: تنظيف وصرف وتخزين
      description: قم بتصريف حوض السباحة وتجفيفه ولفه وتعبئته في حقيبة التخزين الخاصة به لفصل الشتاء. لا يوجد تركيب دائم للصيانة.
      icon: tabler:package
    - title: السلامة أولا
      description: يجب أن يكون الأطفال تحت إشراف شخص بالغ في جميع الأوقات. اتبع الدليل والقواعد المحلية وإرشادات الاستخدام الآمن.
      icon: tabler:shield-check
steps:
  title: من الصندوق إلى الفناء الخلفي
  items:
    - title: 'الخطوة 1: <span class="font-medium">اختر حمام السباحة الخاص بك</span>'
      description: قارن الأشكال والأحجام بما يتناسب مع مساحتك وأسرتك وكيف تخطط لاستخدام المياه.
      icon: tabler:pool
    - title: 'الخطوة 2: <span class="font-medium">قم بإعداده</span>'
      description: ضعه على أرض ثابتة ومستوية، ثم انفخه بالمضخة الكهربائية المرفقة، واملأه بخرطوم الحديقة.
      icon: tabler:rocket
    - title: 'الخطوة 3: <span class="font-medium">السباحة طوال الصيف</span>'
      description: حافظ على المياه نقية بعناية بسيطة - قم بمسحها وتغطيتها والتحقق من درجة الحموضة مثل أي حمام سباحة صغير.
      icon: tabler:ripple
    - title: 'الخطوة 4: <span class="font-medium">قم بتخزينه بعيدًا</span>'
      description: عندما ينتهي الموسم، قم بتصفية حوض السباحة وتجفيفه ولفه وتخزينه في حقيبته حتى الصيف المقبل.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: حمام سباحة Drop Stitch قابل للنفخ دائري من Felizbay
