features:
  id: features
  tagline: تقنية Drop Stitch
  title: لماذا بركة Felizbay<br />مختلف
  subtitle: هيكل Drop Stitch عالي الضغط يجعل حمامات السباحة الخاصة بنا صلبة ومتينة وسهلة التخزين.
  columns: 2
  items:
    - title: جدران Drop Stitch جامدة
      description: 'تعمل الآلاف من الخيوط الداخلية على تثبيت طبقات الجدار معًا، بحيث يتم نفخ حوض السباحة بقوة عند معدل 4-5 PSI ويحافظ على شكله عند ملئه.'
      icon: tabler:hexagon
    - title: إعداد سريع وخالي من الأدوات
      description: انفخها بالمضخة الكهربائية المرفقة في دقائق، ثم املأها بخرطوم الحديقة. لا توجد أدوات، ولا بناء، ولا تركيب احترافي.
      icon: tabler:rocket
    - title: حزم بعيدا الصغيرة
      description: 'قم بتصريف حوض السباحة وتفريغه ولفه وتخزينه في حقيبته خلال فصل الشتاء - وهو حمام سباحة كامل الحجم يمكن وضعه في مكان صغير للتخزين الداخلي.'
      icon: tabler:package
    - title: متين ومقاوم للأشعة فوق البنفسجية
      description: 'نسيج PVC drop stitch مزدوج الطبقة، مصمم لمقاومة الثقوب والتعرض لـ UV خلال موسم كامل من الاستخدام العائلي.'
      icon: tabler:shield
    - title: حزمة كاملة
      description: يأتي كل حمام سباحة مزودًا بمضخة هواء كهربائية ومجموعة إصلاح وحقيبة تخزين. الأغطية المجهزة متاحة للنماذج المستديرة.
      icon: tabler:box
    - title: تصميم مراعٍ للسلامة
      description: 'مرجع تصميم حمام السباحة السكني EN 16582-1 وASTM F2666 - يتم توفير معلومات السلامة الخاصة بالطراز في وثائق المنتج. مطلوب دائمًا إشراف الكبار المستمر.'
      icon: tabler:shield-check
