features:
  id: features
  tagline: تقنية Drop Stitch
  title: لماذا بركة Felizbay<br />مختلف
  subtitle: هيكل Drop Stitch عالي الضغط يجعل حمامات السباحة الخاصة بنا صلبة ومتينة وسهلة التخزين.
  columns: 2
  items:
    - title: جدران Drop Stitch جامدة
      description: تعمل الآلاف من الخيوط الداخلية على تثبيت طبقات الجدار معًا، لذلك يتم نفخ حوض السباحة بقوة تصل إلى 4-5 رطل لكل بوصة مربعة ويحافظ على شكله عند ملئه.
      icon: tabler:hexagon
    - title: إعداد سريع وخالي من الأدوات
      description: انفخها بالمضخة الكهربائية المرفقة في دقائق، ثم املأها بخرطوم الحديقة. لا توجد أدوات، ولا بناء، ولا تركيب احترافي.
      icon: tabler:rocket
    - title: حزم بعيدا الصغيرة
      description: قم بتصريف حوض السباحة وتفريغه ولفه وتخزينه في كيس خلال فصل الشتاء. حمام سباحة كامل الحجم يناسب الخزانة.
      icon: tabler:package
    - title: متين ومقاوم للأشعة فوق البنفسجية
      description: نسيج PVC ذو طبقة مزدوجة Drop Stitch يقاوم الثقوب والتعرض للأشعة فوق البنفسجية وموسم كامل من الاستخدام العائلي.
      icon: tabler:shield
    - title: حزمة كاملة
      description: يأتي كل حمام سباحة مزودًا بمضخة هواء كهربائية ومجموعة إصلاح وحقيبة تخزين. الأغطية المجهزة متاحة للنماذج المستديرة.
      icon: tabler:box
    - title: تصميم مراعٍ للسلامة
      description: تصميم حمامات السباحة السكنية يتوافق مع EN 16582-1 وASTM F2666، مع صمامات تخفيف الضغط وجدران صلبة ثابتة. مطلوب دائمًا إشراف الكبار المستمر.
      icon: tabler:shield-check
content_customer_types:
  tagline: أفكار تجمع
  title: المسبح المناسب ل<br />المساحة الخاصة بك
  subtitle: إعدادات حقيقية وأحجام حقيقية وإرشادات صادقة لاختيار حمام السباحة المناسب.
  items:
    - title: حمامات الفناء الخلفي للعائلات
      description: تخطيط المساحة، والأحجام الحقيقية القابلة للاستخدام، وسهولة الصيانة لفصل الصيف العائلي في الفناء الخلفي.
      icon: tabler:home
      cta: احصل على أفكار
      cta_href: /pool-ideas/backyard-pools-for-families
    - title: حمامات سباحة للساحات الخلفية الصغيرة
      description: نماذج مستديرة ومربعة مدمجة تناسب المساحات الخارجية الضيقة دون التخلي عن السباحة.
      icon: tabler:layout-grid
      cta: احصل على أفكار
      cta_href: /pool-ideas/pools-for-small-backyards
    - title: حمامات سباحة كبيرة للتجمعات
      description: حمامات سباحة كبيرة مستطيلة الشكل مع مساحة حقيقية للسباحة لجميع أفراد الطاقم في أيام الصيف.
      icon: tabler:users
      cta: احصل على أفكار
      cta_href: /pool-ideas/large-pools-for-family-gatherings
    - title: الغطس والاسترخاء في الهواء الطلق
      description: أحواض سبا بمقاعد مدمجة وقيعان معزولة للاسترخاء اليومي في المنزل.
      icon: tabler:ripple
      cta: احصل على أفكار
      cta_href: /pool-ideas/outdoor-soaking-pools
    - title: حمامات للإيجار لقضاء العطلات
      description: وسيلة راحة موسمية للضيوف يتم إعدادها بسرعة وتخزينها بعيدًا في غير موسمها.
      icon: tabler:beach
      cta: احصل على أفكار
      cta_href: /pool-ideas/pools-for-vacation-rentals
    - title: تخييم والضيافة
      description: إقامات مميزة في الهواء الطلق - مواقع تخييم وعقارات بوتيكية وأماكن لإقامة الفعاليات.
      icon: tabler:tent
      cta: احصل على أفكار
      cta_href: /pool-ideas/pools-for-glamping-and-hospitality
content_categories:
  tagline: تسوق حمامات السباحة
  title: استكشف حمامات السباحة لدينا
  subtitle: قارن الأشكال والأحجام والميزات للعثور على حمام السباحة المناسب للفناء الخلفي أو المساحة الخارجية.
content_workshop:
  isReversed: true
  tagline: للشركات
  title: حمامات سباحة للأعمال،<br />أيضاً
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Felizbay لشركاء الأعمال</h3>
  items:
    - title: إيجارات العطلات والضيافة
      description: وسائل الراحة الموسمية للضيوف للإيجارات أثناء العطلات، والمواقع الفاخرة، وعقارات البوتيك - سريعة النشر، وسهلة الصيانة، وسهلة التخزين.
    - title: شركاء البيع بالتجزئة والعلامات التجارية
      description: برامج البيع بالجملة وحمامات Drop Stitch الجاهزة للبيع بالتجزئة لمراكز الحدائق ومحلات حمامات السباحة والمتاجر عبر الإنترنت.
    - title: تسمية مخصصة وخاصة
      description: أحجام وألوان وأغلفة مخصصة وطباعة الشعار وتغليف التجزئة للعلامات التجارية - تم تصميمها بواسطة شركائنا في التصنيع.
content_compliance:
  tagline: الرعاية والسلامة
  title: سهل التملك،<br />من السهل أن تحب
  subtitle: من التسليم إلى السباحة الأولى إلى التخزين في نهاية الموسم، يظل امتلاك حمام سباحة Felizbay أمرًا بسيطًا.
  items:
    - title: الإعداد في دقائق
      description: قم بإخراج العلبة، ثم نفخها باستخدام المضخة المرفقة، ثم املأها - يستغرق الإعداد الكامل عادةً من 15 إلى 30 دقيقة على أرض ثابتة ومستوية.
      icon: tabler:rocket
    - title: العناية بالمياه البسيطة
      description: تعمل منافذ مضخة الفلتر القياسية مقاس 32/38 مم، وفحوصات منتظمة لدرجة الحموضة، والغطاء المجهز في الموديلات المستديرة على الحفاظ على نظافة المياه.
      icon: tabler:droplet
    - title: تنظيف وصرف وتخزين
      description: قم بتصريف حوض السباحة وتجفيفه ولفه وتعبئته في حقيبة التخزين الخاصة به لفصل الشتاء. لا يوجد تركيب دائم للصيانة.
      icon: tabler:package
    - title: السلامة أولا
      description: يجب أن يكون الأطفال تحت إشراف شخص بالغ في جميع الأوقات. اتبع الدليل والقواعد المحلية وإرشادات الاستخدام الآمن.
      icon: tabler:shield-check
steps:
  title: من الصندوق إلى الفناء الخلفي
  items:
    - title: 'الخطوة 1: <span class="font-medium">اختر حمام السباحة الخاص بك</span>'
      description: قارن الأشكال والأحجام بما يتناسب مع مساحتك وأسرتك وكيف تخطط لاستخدام المياه.
      icon: tabler:pool
    - title: 'الخطوة 2: <span class="font-medium">قم بإعداده</span>'
      description: ضعه على أرض ثابتة ومستوية، ثم انفخه بالمضخة الكهربائية المرفقة، واملأه بخرطوم الحديقة.
      icon: tabler:rocket
    - title: 'الخطوة 3: <span class="font-medium">السباحة طوال الصيف</span>'
      description: حافظ على المياه نقية بعناية بسيطة - قم بمسحها وتغطيتها والتحقق من درجة الحموضة مثل أي حمام سباحة صغير.
      icon: tabler:ripple
    - title: 'الخطوة 4: <span class="font-medium">قم بتخزينه بعيدًا</span>'
      description: عندما ينتهي الموسم، قم بتصفية حوض السباحة وتجفيفه ولفه وتخزينه في حقيبته حتى الصيف المقبل.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.png
    alt: حمام سباحة Drop Stitch قابل للنفخ دائري من Felizbay
blog_latest:
  title: أدلة ورؤى حمام السباحة
  information: |
    أدلة الإعداد، ونصائح العناية، ونصائح الشراء لحمامات السباحة القابلة للنفخ
    من فريق Felizbay.
faqs:
  title: الأسئلة الشائعة حول حمام السباحة القابل للنفخ
  subtitle: أسئلة شائعة حول حمامات السباحة القابلة للنفخ Felizbay.
  columns: 2
  items:
    - title: كم من الوقت يستغرق الإعداد؟
      description: يستغرق النفخ حوالي 10 دقائق باستخدام مضخة الهواء الكهربائية المتضمنة؛ يستغرق الإعداد الكامل بما في ذلك التنسيب والتعبئة عادةً 15-30 دقيقة.
      icon: tabler:clock
      category: all
    - title: ما مدى صلابة تجمع Drop Stitch؟
      description: جامدة جدا. تنتفخ جدران Drop Stitch بقوة عند 4-5 PSI - على غرار لوح التجديف القابل للنفخ - بحيث يحافظ حوض السباحة على شكله عند ملؤه بالماء.
      icon: tabler:hexagon
      category: all
    - title: هل يمكن للأطفال استخدام المسبح؟
      description: نعم، مع إشراف الكبار النشط في جميع الأوقات. لا ينبغي أبدًا ترك الأطفال دون مراقبة في حمام السباحة أو بالقرب منه - اتبع قواعد السلامة اليدوية والمحلية.
      icon: tabler:users
      category: all
    - title: كيف أقوم بتخزين المسبح في الشتاء؟
      description: قم بتصريف الماء، وتفريغ حوض السباحة من الهواء، واتركه حتى يجف تمامًا، ثم قم بلفه وتخزينه في حقيبة التخزين المرفقة في مكان خالٍ من الصقيع.
      icon: tabler:package
      category: all
    - title: ما الذي يتم تضمينه مع المسبح؟
      description: يشتمل كل مسبح في Felizbay على مضخة هواء كهربائية ومجموعة أدوات إصلاح وحقيبة تخزين. تحتوي النماذج المستديرة على غطاء اختياري مُجهز.
      icon: tabler:box
      category: all
    - title: ما هي الأحجام المتوفرة؟
      description: 48 وحدة SKU قياسية في أربع مجموعات — حمامات سباحة مستديرة يصل عرضها إلى 10 أمتار، وأحواض سباحة مستطيلة يصل حجمها إلى 6 × 5 أمتار، وأحواض سبا بمقاعد مدمجة. تتوفر أحجام مخصصة لشركاء الأعمال.
      icon: tabler:ruler-2
      category: all
    - title: ما هي الأسطح التي يمكن أن يقف عليها حمام السباحة؟
      description: أي سطح مستوٍ وخالي من الأشياء الحادة - العشب أو الفناء أو سطح السفينة. يوصى باستخدام لوح أرضي على الأسطح الخشنة. تأكد من أن السطح يمكن أن يتحمل وزن حوض السباحة المملوء.
      icon: tabler:layout-grid
      category: all
    - title: كيف أحافظ على نظافة المياه؟
      description: استخدم مضخة الفلتر في مكان تركيبها، وأزل الحطام، وتحقق من الرقم الهيدروجيني، وقم بتغطية حوض السباحة في حالة عدم الاستخدام. تعتمد مدة بقاء الماء على حجم حمام السباحة والاستخدام والترشيح - اختبره بانتظام بدلاً من الاعتماد على جدول زمني محدد.
      icon: tabler:droplet
      category: all
