faqs:
  title: Časté otázky o nafukovacom bazéne
  subtitle: Časté otázky o nafukovacích bazénoch Felizbay.
  columns: 2
  items:
    - title: Ako dlho trvá nastavenie?
      description: 'Nafúknutie trvá 5-15 minút pomocou priloženej elektrickej vzduchovej pumpy v závislosti od modelu. Čas napúšťania sa líši v závislosti od kapacity bazéna a vášho zásobovania vodou.'
      icon: tabler:clock
      category: all
    - title: Aký pevný je bazén typu Drop Stitch?
      description: Veľmi tuhý. Steny Drop Stitch sa nafukujú tvrdo na 4-5 PSI, takže bazén si po naplnení vodou zachováva svoj tvar.
      icon: tabler:hexagon
      category: all
    - title: Môžu bazén využívať deti?
      description: Áno, vždy s aktívnym dohľadom dospelej osoby. Deti nikdy nesmú zostať bez dozoru v bazéne alebo v jeho blízkosti – dodržujte návod a miestne bezpečnostné pravidlá.
      icon: tabler:users
      category: all
    - title: Ako skladovať bazén v zime?
      description: Vypustite vodu, vypustite bazén, nechajte ho úplne vyschnúť, potom ho zrolujte a uložte v priloženom úložnom vrecku na miesto, kde nemrzne.
      icon: tabler:package
      category: all
    - title: Čo je súčasťou bazéna?
      description: Každý bazén Felizbay obsahuje elektrické vzduchové čerpadlo, súpravu na opravu a úložný vak. Okrúhle modely majú voliteľný namontovaný kryt.
      icon: tabler:box
      category: all
    - title: Aké veľkosti sú k dispozícii?
      description: 48 štandardných SKU v štyroch kolekciách – okrúhle bazény do 10 m, obdĺžnikové bazény do 6 × 5 m a SPA vane so zabudovanými sedadlami. Pre obchodných partnerov sú k dispozícii vlastné veľkosti.
      icon: tabler:ruler-2
      category: all
    - title: Na akých povrchoch môže bazén stáť?
      description: 'Akýkoľvek plochý, rovný povrch bez ostrých predmetov – trávnik, terasa alebo terasa. Na drsné povrchy sa odporúča brúska. Naplnený bazén je ťažký: inštalujte iba na povrch, ktorý unesie celú váhu, a najprv si nechajte konštrukčne posúdiť vyvýšené terasy, balkóny a strechy.'
      icon: tabler:layout-grid
      category: all
    - title: Ako udržím vodu čistú?
      description: Ak je namontované, použite filtračné čerpadlo, odstráňte nečistoty, skontrolujte pH a zakryte bazén, keď sa nepoužíva. Ako dlho voda vydrží závisí od veľkosti bazéna, používania a filtrácie – testujte radšej pravidelne, než sa spoliehajte na pevný plán.
      icon: tabler:droplet
      category: all
