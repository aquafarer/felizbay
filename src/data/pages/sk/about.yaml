  items:
    - title: Obdĺžnikové bazény
      description: Obdĺžnikové bazény typu Drop Stitch v rodinnej veľkosti, ktoré maximalizujú plochu na plávanie pre váš priestor.
      icon: tabler:rectangle
    - title: Okrúhle modré bazény
      description: Klasický záhradný bazén – žiarivá modrá, pevné steny Drop Stitch, rýchle nastavenie.
      icon: tabler:circle
    - title: Okrúhle sivé bazény
      description: Naša prémiová rada s moderným sivým povrchom a voliteľným krytom.
