hero:
  tagline: O nás
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Nafukovací bazén Felizbay
  title: |
    Zjednodušenie plávania, <br />
    stylem <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay je prémiová značka nafukovacích bazénov Drop Stitch navrhnutá a prevádzkovaná spoločnosťou Aquafarer LLC (USA). Veríme, že každá rodina si zaslúži skutočný bazén na dvore – nadzemná inštalácia bez trvalej výstavby bazéna. Naše bazény sa nafúknu za pár minút, prežijú celé letá rodinnej zábavy a na konci sezóny sa zbalia ako malé. Požiadavky na povolenia, bariéry a inštaláciu sa líšia podľa lokality.
