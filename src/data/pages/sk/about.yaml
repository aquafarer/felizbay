production_section:
  tagline: Výrobná dokonalosť
  title: Zabezpečenie vynikajúceho remeselného spracovania
  description: Výrobná linka Felizbay je venovaná vysokokvalitným, odolným, vysokotlakovým nafukovacím bazénom.
  cards:
    - title: Tím skúsených technikov
      items:
        - Profesionálna znalosť drop stitch a PVC materiálov
        - Precízne remeselné spracovanie pri rezaní, zváraní a montáži
        - Neustále školenie na zvládnutie najnovších výrobných technológií
    - title: Pokročilé výrobné zariadenia
      items:
        - Presné rezacie zariadenie pre presné látkové panely
        - Vysoko presné tepelné zváranie pre vzduchotesné a odolné švy
        - Profesionálne zariadenia na testovanie tlaku a vzduchotesnosti
    - title: Vyspelý systém riadenia
      items:
        - Štandardizované výrobné procesy s jasnými štandardmi kvality
        - Filozofia štíhlej výroby znižuje odpad a zvyšuje efektivitu
        - Efektívne riadenie dodávateľského reťazca so spoľahlivými dodávateľmi
    - title: Prísna kontrola kvality
      items:
        - 'Viacstupňová kontrola: surovina, v procese, konečný výstup'
        - Testovanie tlaku v hornej časti menovitého pracovného rozsahu 4-6 PSI
        - Prísne testovanie vzduchotesnosti a trvanlivosti pred odoslaním
