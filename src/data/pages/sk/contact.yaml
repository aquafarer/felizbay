hero_text:
  tagline: Kontaktovať
  title: KONTAKTUJTE SA
contact_form:
  id: form
  title: Pošlite nám správu
  subtitle: V prípade cenových ponúk, technických otázok alebo otázok o partnerstve nám napíšte. Odpovedáme do jedného pracovného dňa.
  email_to: info@felizbay.com
  submit_button: Odoslať dopyt → Získať cenovú ponuku
  success_message: Ďakujem! Vaša správa pristála v našej doručenej pošte. Odpovieme do jedného pracovného dňa.
  error_message: Pri odosielaní vašej správy sa vyskytla chyba. Skúste to znova alebo nám napíšte priamo.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: prosím vyriešte nasledovné"
  fields:
    - name: firstName
      label: Krstné meno
      row: 1
    - name: lastName
      label: Priezvisko
      row: 1
    - name: inquiryType
      label: Typ dopytu
      row: 2
      type: select
      options:
        - value: ""
          label: Čoho sa týka váš dopyt?
        - value: retail
          label: Online objednávka jedného bazéna (maloobchod)
        - value: wholesale
          label: Veľkoobchodná / hromadná objednávka (B2B)
        - value: oem
          label: Prispôsobenie OEM/ODM
        - value: support
          label: Popredajná podpora a záruka
    - name: companyName
      label: Názov spoločnosti
      row: 3
    - name: address
      label: Adresa
      row: 4
    - name: zip
      label: PSČ
      row: 5
    - name: country
      label: Krajina
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 6
      type: email
    - name: tel
      label: TEL
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Odhadovaný objem objednávky
      row: 7
      type: select
      options:
        - value: ""
          label: Vyberte odhadovaný objem...
        - value: 1-unit
          label: 1 ks — jeden bazén (online maloobchodná objednávka)
        - value: sample
          label: Len vzorky / prototypy
        - value: 5-10
          label: 5–10 jednotiek (štandardné MOQ)
        - value: 100-500
          label: 100-500 jednotiek
        - value: 500-plus
          label: 500+ jednotiek (množstevná cena)
    - name: customization
      label: Je potrebné prispôsobenie?
      row: 8
      type: select
      options:
        - value: ""
          label: Vyberte typ prispôsobenia...
        - value: none
          label: Štandardný produkt (bez prispôsobenia)
        - value: logo
          label: Iba vlastné logo / branding
        - value: full
          label: Kompletný OEM (veľkosť, farba, grafika, balenie)
        - value: consultation
          label: Nie ste si istí – potrebujete konzultáciu
    - name: productInterest
      label: Fond záujmov
      row: 9
      type: select
      options:
        - value: ""
          label: Vyberte typ bazéna...
        - value: all
          label: Všetky bazény / Kompletný katalóg
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: Prenosná vírivka — Okrúhla
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: Vírivka / Swim Spa — Štvorcová
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Predmet
      row: 10
    - name: message
      label: Správa
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: Iné spôsoby, ako sa k nám dostať
  columns: 3
  items:
    - title: Predajné dopyty
      description: Spoločné ponuky, veľkoobchodné ceny a hromadné objednávky.
      icon: tabler:shopping-bag
    - title: Technická podpora
      description: Pomoc s nastavením, opravy, náhradné diely a otázky týkajúce sa starostlivosti.
      icon: tabler:tool
    - title: OEM / ODM
      description: Vlastné veľkosti, farby, kryty, značky a balenie.
      icon: tabler:palette
    - title: Email
      description: info@felizbay.com
      icon: tabler:mail
    - title: Webová stránka
      description: felizbay.com
      icon: tabler:world
    - title: Čas odozvy
      description: Odpovedáme do jedného pracovného dňa.
      icon: tabler:clock
map:
  title: Kontaktujte nás
  subtitle: Kontaktujte Felizbay
  address: felizbay.com
  zoom: 15
