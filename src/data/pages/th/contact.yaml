hero_text:
  tagline: ติดต่อ
  title: ได้รับการติดต่อ
contact_form:
  id: form
  title: ส่งข้อความถึงเรา
  subtitle: สำหรับการเสนอราคา คำถามทางเทคนิค หรือสอบถามเกี่ยวกับความร่วมมือ โปรดโทรหาเรา เราตอบกลับภายในหนึ่งวันทำการ
  email_to: info@felizbay.com
  submit_button: ส่งคำถาม → รับใบเสนอราคา
  success_message: ขอบคุณ! ข้อความของคุณเข้าสู่กล่องจดหมายของเราแล้ว เราจะตอบกลับภายในหนึ่งวันทำการ
  error_message: เกิดข้อผิดพลาดในการส่งข้อความของคุณ โปรดลองอีกครั้งหรือส่งอีเมลถึงเราโดยตรง
  default_country_code: "+1"
  captcha:
    label: "ป้องกันสแปม: โปรดแก้ไขปัญหาต่อไปนี้"
  fields:
    - name: firstName
      label: ชื่อ
      row: 1
    - name: lastName
      label: นามสกุล
      row: 1
    - name: inquiryType
      label: ประเภทการสอบถาม
      row: 2
      type: select
      options:
        - value: ""
          label: การสอบถามของคุณเกี่ยวกับอะไร?
        - value: retail
          label: สั่งซื้อออนไลน์สระน้ำเดี่ยว (ขายปลีก)
        - value: wholesale
          label: สั่งซื้อขายส่ง / จำนวนมาก (B2B)
        - value: oem
          label: การปรับแต่ง OEM/ODM
        - value: support
          label: การสนับสนุนหลังการขายและการรับประกัน
    - name: companyName
      label: ชื่อบริษัท
      row: 3
    - name: address
      label: ที่อยู่
      row: 4
    - name: zip
      label: รหัสไปรษณีย์
      row: 5
    - name: country
      label: ประเทศ
      row: 5
      type: select
      optionsKey: countries
    - name: email
      label: อีเมล
      row: 6
      type: email
    - name: tel
      label: โทร
      row: 6
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: ปริมาณการสั่งซื้อโดยประมาณ
      row: 7
      type: select
      options:
        - value: ""
          label: เลือกปริมาณโดยประมาณของคุณ...
        - value: 1-unit
          label: 1 ชิ้น — สระน้ำเดี่ยว (คำสั่งซื้อปลีกออนไลน์)
        - value: sample
          label: ตัวอย่าง/ต้นแบบเท่านั้น
        - value: 5-10
          label: 5–10 หน่วย (ขั้นต่ำมาตรฐาน)
        - value: 100-500
          label: 100–500 หน่วย
        - value: 500-plus
          label: 500+ หน่วย (ราคาตามปริมาณ)
    - name: customization
      label: จำเป็นต้องปรับแต่งไหม?
      row: 8
      type: select
      options:
        - value: ""
          label: เลือกประเภทการปรับแต่ง...
        - value: none
          label: สินค้ามาตรฐาน (ไม่มีการปรับแต่ง)
        - value: logo
          label: โลโก้ที่กำหนดเอง / การสร้างแบรนด์เท่านั้น
        - value: full
          label: OEM เต็มรูปแบบ (ขนาด สี กราฟิก บรรจุภัณฑ์)
        - value: consultation
          label: ไม่แน่ใจ — ต้องการคำปรึกษา
    - name: productInterest
      label: แหล่งรวมความสนใจ
      row: 9
      type: select
      options:
        - value: ""
          label: เลือกประเภทสระน้ำ...
        - value: all
          label: พูลทั้งหมด / แค็ตตาล็อกฉบับเต็ม
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: hot-tub-round
          label: อ่างน้ำอุ่นพกพา — ทรงกลม
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: hot-tub-square-rect
          label: อ่างน้ำอุ่น / Swim Spa — ทรงสี่เหลี่ยม
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: เรื่อง
      row: 10
    - name: message
      label: ข้อความ
      row: 11
      type: textarea
      rows: 6
features2_other_ways:
  title: ช่องทางอื่นในการติดต่อเรา
  columns: 3
  items:
    - title: สอบถามข้อมูลการขาย
      description: ราคาพูล ราคาขายส่ง และคำสั่งซื้อจำนวนมาก
      icon: tabler:shopping-bag
    - title: การสนับสนุนด้านเทคนิค
      description: ความช่วยเหลือในการตั้งค่า การซ่อมแซม อะไหล่ และคำถามในการดูแลรักษา
      icon: tabler:tool
    - title: OEM/ODM
      description: ขนาด สี ปก การสร้างแบรนด์ และบรรจุภัณฑ์ที่กำหนดเอง
      icon: tabler:palette
    - title: อีเมล
      description: info@felizbay.com
      icon: tabler:mail
    - title: เว็บไซต์
      description: felizbay.com
      icon: tabler:world
    - title: เวลาตอบสนอง
      description: เราตอบกลับภายในหนึ่งวันทำการ
      icon: tabler:clock
map:
  title: ได้รับการติดต่อ
  subtitle: ติดต่อFelizbay
  address: felizbay.com
  zoom: 15
