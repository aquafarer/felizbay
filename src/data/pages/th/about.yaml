hero:
  tagline: เกี่ยวกับเรา
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: สระว่ายน้ำเป่าลม Felizbay
  title: |
    ว่ายน้ำให้เป็นเรื่องง่าย <br />
    สไตล์ <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay คือแบรนด์สระน้ำเป่าลม Drop Stitch ระดับพรีเมียมที่ออกแบบและดำเนินการโดย Aquafarer LLC (สหรัฐอเมริกา) เราเชื่อว่าทุกครอบครัวสมควรมีสระว่ายน้ำจริงๆ ในสวนหลังบ้าน เป็นการติดตั้งเหนือพื้นดินโดยไม่ต้องก่อสร้างสระถาวร สระน้ำของเราพองตัวได้ภายในไม่กี่นาที สนุกสนานกับครอบครัวในช่วงฤดูร้อน และแพ็คให้เล็กลงเมื่อสิ้นสุดฤดูกาล ข้อกำหนดเรื่องใบอนุญาต รั้วกั้น และการติดตั้งแตกต่างกันไปในแต่ละพื้นที่
