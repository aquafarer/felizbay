production_section:
  tagline: ความเป็นเลิศด้านการผลิต
  title: รับรองฝีมือประณีต
  description: สายการผลิตของ Felizbay ทุ่มเทให้กับสระว่ายน้ำแบบเป่าลมคุณภาพสูง ทนทาน และมีแรงดันสูงโดยเฉพาะ
  cards:
    - title: ทีมช่างผู้มีประสบการณ์
      items:
        - มีความรู้แบบมืออาชีพเกี่ยวกับการเย็บตะเข็บและวัสดุ PVC
        - ฝีมือปราณีตในการตัด เชื่อม และประกอบ
        - การฝึกอบรมอย่างต่อเนื่องเพื่อฝึกฝนเทคโนโลยีการผลิตล่าสุด
    - title: อุปกรณ์การผลิตขั้นสูง
      items:
        - อุปกรณ์ตัดที่แม่นยำสำหรับแผงผ้าที่แม่นยำ
        - การเชื่อมด้วยความร้อนที่มีความแม่นยำสูงเพื่อตะเข็บสุญญากาศและทนทาน
        - อุปกรณ์ทดสอบแรงดันและสุญญากาศระดับมืออาชีพ
    - title: ระบบการจัดการผู้ใหญ่
      items:
        - กระบวนการผลิตที่ได้มาตรฐานด้วยมาตรฐานคุณภาพที่ชัดเจน
        - ปรัชญาการผลิตแบบลีนช่วยลดของเสียและปรับปรุงประสิทธิภาพ
        - การจัดการห่วงโซ่อุปทานที่มีประสิทธิภาพกับซัพพลายเออร์ที่เชื่อถือได้
    - title: การควบคุมคุณภาพอย่างเข้มงวด
      items:
        - 'การตรวจสอบหลายขั้นตอน: วัตถุดิบ อยู่ระหว่างดำเนินการ และส่งออกขั้นสุดท้าย'
        - การทดสอบแรงดันที่ด้านบนของช่วงการทำงาน 4-6 PSI
        - การทดสอบความแน่นหนาและความทนทานอย่างเข้มงวดก่อนจัดส่ง
