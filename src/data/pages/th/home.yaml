features:
  id: features
  tagline: เทคโนโลยีDrop Stitch
  title: ทำไมต้องมีสระFelizbay<br />มีความแตกต่าง
  subtitle: โครงสร้าง Drop Stitch แรงดันสูงทำให้สระของเรามีความแข็งแกร่ง ทนทาน และจัดเก็บได้อย่างง่ายดาย
  columns: 2
  items:
    - title: ผนัง Drop Stitch แข็ง
      description: เกลียวภายในหลายพันเส้นล็อคชั้นผนังไว้ด้วยกัน ดังนั้นสระน้ำจึงพองตัวได้แรงมากที่ 4-5 PSI และคงรูปร่างไว้เมื่อเติมน้ำ
      icon: tabler:hexagon
    - title: ติดตั้งรวดเร็วโดยไม่ต้องใช้เครื่องมือ
      description: สูบลมด้วยที่สูบไฟฟ้าที่ให้มาภายในไม่กี่นาที จากนั้นเติมสายยางสวน ไม่มีเครื่องมือ ไม่มีการก่อสร้าง ไม่มีการติดตั้งอย่างมืออาชีพ
      icon: tabler:rocket
    - title: แพ็คออกไปขนาดเล็ก
      description: ระบาย ปล่อยลม ม้วนขึ้น และเก็บสระไว้ในถุงตลอดฤดูหนาว สระว่ายน้ำขนาดเต็มขนาดพอดีกับตู้เสื้อผ้า
      icon: tabler:package
    - title: ทนทานและทนต่อรังสียูวี
      description: ผ้า PVC Drop Stitch สองชั้นทนทานต่อการเจาะทะลุ แสงยูวี และการใช้งานทั้งครอบครัวตลอดฤดูกาล
      icon: tabler:shield
    - title: แพ็คเกจที่สมบูรณ์
      description: สระทุกสระมาพร้อมกับปั๊มลมไฟฟ้า ชุดซ่อม และถุงเก็บของ ฝาครอบพอดีสำหรับรุ่นทรงกลม
      icon: tabler:box
    - title: การออกแบบที่คำนึงถึงความปลอดภัย
      description: การออกแบบสระว่ายน้ำที่อยู่อาศัยอ้างอิง EN 16582-1 และ ASTM F2666 พร้อมวาล์วระบายแรงดันและผนังที่แข็งแรงมั่นคง จำเป็นต้องมีการดูแลจากผู้ใหญ่อย่างต่อเนื่อง
      icon: tabler:shield-check
content_customer_types:
  tagline: ไอเดียสระว่ายน้ำ
  title: สระน้ำที่เหมาะสมสำหรับ<br />พื้นที่ของคุณ
  subtitle: การตั้งค่าจริง ขนาดจริง และคำแนะนำที่ซื่อสัตย์ในการเลือกสระว่ายน้ำที่เหมาะสม
  items:
    - title: สระว่ายน้ำหลังบ้านสำหรับครอบครัว
      description: การวางแผนพื้นที่ ขนาดใช้งานได้จริง และการบำรุงรักษาง่ายสำหรับฤดูร้อนของครอบครัวในสวนหลังบ้าน
      icon: tabler:home
      cta: รับไอเดีย
      cta_href: /pool-ideas/backyard-pools-for-families
    - title: สระว่ายน้ำสำหรับสวนหลังบ้านขนาดเล็ก
      description: รุ่นทรงกลมและสี่เหลี่ยมขนาดกะทัดรัดที่เหมาะกับพื้นที่กลางแจ้งที่คับแคบโดยไม่ต้องละทิ้งการว่ายน้ำ
      icon: tabler:layout-grid
      cta: รับไอเดีย
      cta_href: /pool-ideas/pools-for-small-backyards
    - title: สระน้ำขนาดใหญ่สำหรับการชุมนุม
      description: สระว่ายน้ำทรงสี่เหลี่ยมขนาดใหญ่พร้อมพื้นที่ว่ายน้ำที่แท้จริงสำหรับลูกเรือทั้งหมดในวันฤดูร้อน
      icon: tabler:users
      cta: รับไอเดีย
      cta_href: /pool-ideas/large-pools-for-family-gatherings
    - title: การแช่น้ำกลางแจ้งและการพักผ่อน
      description: อ่างสปาพร้อมที่นั่งในตัวและพื้นฉนวนกันความร้อนสำหรับการพักผ่อนที่บ้านทุกวัน
      icon: tabler:ripple
      cta: รับไอเดีย
      cta_href: /pool-ideas/outdoor-soaking-pools
    - title: สระว่ายน้ำสำหรับการเช่าวันหยุด
      description: สิ่งอำนวยความสะดวกสำหรับแขกตามฤดูกาลที่จัดเตรียมไว้อย่างรวดเร็วและจัดเก็บไว้ในช่วงนอกฤดูกาล
      icon: tabler:beach
      cta: รับไอเดีย
      cta_href: /pool-ideas/pools-for-vacation-rentals
    - title: แกลมปิ้งและการต้อนรับ
      description: การเข้าพักกลางแจ้งที่โดดเด่น ไม่ว่าจะเป็นสถานที่ตั้งแคมป์ ที่พักบูติก และสถานที่จัดกิจกรรม
      icon: tabler:tent
      cta: รับไอเดีย
      cta_href: /pool-ideas/pools-for-glamping-and-hospitality
content_categories:
  tagline: ร้านค้าสระว่ายน้ำ
  title: สำรวจสระน้ำของเรา
  subtitle: เปรียบเทียบรูปทรง ขนาด และคุณลักษณะต่างๆ เพื่อค้นหาสระว่ายน้ำที่เหมาะสมสำหรับสวนหลังบ้านหรือพื้นที่กลางแจ้งของคุณ
content_workshop:
  isReversed: true
  tagline: สำหรับธุรกิจ
  title: สระว่ายน้ำสำหรับธุรกิจ<br />ด้วย
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Felizbay สำหรับพันธมิตรทางธุรกิจ</h3>
  items:
    - title: ที่พักให้เช่าและการต้อนรับ
      description: สิ่งอำนวยความสะดวกสำหรับผู้เข้าพักตามฤดูกาลสำหรับที่พักให้เช่า สถานที่ตั้งแคมป์ และที่พักสไตล์บูติก — ปรับใช้ได้รวดเร็ว บำรุงรักษาง่าย และจัดเก็บง่าย
    - title: พันธมิตรค้าปลีกและแบรนด์
      description: โปรแกรมขายส่งและสระ Drop Stitch พร้อมขายปลีกสำหรับศูนย์สวน ร้านค้าสระน้ำ และร้านค้าออนไลน์
    - title: ป้ายกำกับที่กำหนดเองและส่วนตัว
      description: ขนาด สี ปก การพิมพ์โลโก้ และบรรจุภัณฑ์ขายปลีกที่กำหนดเองสำหรับแบรนด์ต่างๆ — สร้างโดยพันธมิตรการผลิตของเรา
content_compliance:
  tagline: การดูแลและความปลอดภัย
  title: เป็นเจ้าของได้ง่ายๆ<br />รักง่าย
  subtitle: ตั้งแต่การจัดส่งไปจนถึงการว่ายน้ำครั้งแรกไปจนถึงการจัดเก็บเมื่อสิ้นสุดฤดูกาล การเป็นเจ้าของสระว่ายน้ำ Felizbay ยังคงเป็นเรื่องง่าย
  items:
    - title: ตั้งค่าในไม่กี่นาที
      description: แกะกล่อง เติมลมด้วยปั๊มที่ให้มา และเติมลม โดยทั่วไปการติดตั้งแบบเต็มจะใช้เวลา 15-30 นาทีบนพื้นแข็งและเรียบ
      icon: tabler:rocket
    - title: การดูแลน้ำแบบง่ายๆ
      description: พอร์ตปั๊มกรองมาตรฐาน 32/38 มม. การตรวจสอบค่า pH เป็นประจำ และฝาปิดที่ติดตั้งไว้สำหรับรุ่นทรงกลมช่วยให้น้ำสะอาด
      icon: tabler:droplet
    - title: ทำความสะอาด ระบายน้ำ และจัดเก็บ
      description: สะเด็ดน้ำ ตากให้แห้ง ม้วนขึ้น และบรรจุสระลงในถุงเก็บของสำหรับฤดูหนาว ไม่มีการติดตั้งถาวรในการบำรุงรักษา
      icon: tabler:package
    - title: ปลอดภัยไว้ก่อน
      description: เด็กจะต้องได้รับการดูแลจากผู้ใหญ่ตลอดเวลา ปฏิบัติตามคู่มือ กฎท้องถิ่น และคำแนะนำในการใช้งานอย่างปลอดภัย
      icon: tabler:shield-check
steps:
  title: จากกล่องสู่สวนหลังบ้าน
  items:
    - title: 'ขั้นตอนที่ 1: <span class="font-medium">เลือกสระว่ายน้ำของคุณ</span>'
      description: เปรียบเทียบรูปทรงและขนาดเพื่อให้ตรงกับพื้นที่ ครัวเรือน และวิธีที่คุณวางแผนจะใช้น้ำ
      icon: tabler:pool
    - title: 'ขั้นตอนที่ 2: <span class="font-medium">ตั้งค่า</span>'
      description: วางบนพื้นเรียบและมั่นคง สูบลมด้วยปั๊มไฟฟ้าที่ให้มา และเติมสายยางสวน
      icon: tabler:rocket
    - title: 'ขั้นตอนที่ 3: <span class="font-medium">ว่ายน้ำตลอดฤดูร้อน</span>'
      description: รักษาความสดของน้ำด้วยการดูแลง่ายๆ — ลอกออก ปิดฝา และตรวจสอบ pH เหมือนสระน้ำขนาดเล็ก
      icon: tabler:ripple
    - title: 'ขั้นตอนที่ 4: <span class="font-medium">เก็บมันออกไป</span>'
      description: เมื่อฤดูกาลสิ้นสุดลง ให้สะเด็ดน้ำ ตากให้แห้ง ม้วนตัว และเก็บสระไว้ในกระเป๋าจนถึงฤดูร้อนหน้า
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.png
    alt: สระว่ายน้ำเป่าลม Felizbay Round Drop Stitch
blog_latest:
  title: คู่มือสระว่ายน้ำและข้อมูลเชิงลึก
  information: |
    คู่มือการติดตั้ง เคล็ดลับการดูแล และคำแนะนำในการซื้อสระว่ายน้ำเป่าลม
    จากทีมFelizbay
faqs:
  title: คำถามที่พบบ่อยเกี่ยวกับสระน้ำเป่าลม
  subtitle: คำถามทั่วไปเกี่ยวกับสระว่ายน้ำทำให้พอง Felizbay
  columns: 2
  items:
    - title: การตั้งค่าใช้เวลานานเท่าใด?
      description: การพองลมใช้เวลาประมาณ 10 นาทีด้วยปั๊มลมไฟฟ้าที่ให้มา โดยทั่วไปการตั้งค่าเต็มรูปแบบรวมทั้งการจัดวางและการเติมจะใช้เวลา 15-30 นาที
      icon: tabler:clock
      category: all
    - title: สระ Drop Stitch มีความแข็งแกร่งแค่ไหน?
      description: แข็งมาก. ผนังของ Drop Stitch พองอย่างแรงที่ 4-5 PSI ซึ่งคล้ายกับแพดเดิ้ลบอร์ดแบบเป่าลม ดังนั้นสระจึงคงรูปทรงไว้เมื่อเติมน้ำ
      icon: tabler:hexagon
      category: all
    - title: เด็กสามารถใช้สระว่ายน้ำได้หรือไม่?
      description: ใช่ โดยมีผู้ใหญ่คอยดูแลตลอดเวลา จะต้องไม่ทิ้งเด็กไว้ในหรือใกล้สระน้ำโดยไม่มีใครดูแล — ปฏิบัติตามคู่มือและกฎความปลอดภัยในท้องถิ่น
      icon: tabler:users
      category: all
    - title: ฉันจะเก็บสระว่ายน้ำในฤดูหนาวได้อย่างไร?
      description: ระบายน้ำ ปล่อยลมออกจากสระ ปล่อยให้แห้งสนิท จากนั้นม้วนขึ้นและเก็บไว้ในถุงเก็บที่ให้มาในที่ที่ไม่มีน้ำค้างแข็ง
      icon: tabler:package
      category: all
    - title: มีอะไรรวมอยู่ในสระว่ายน้ำ?
      description: สระ Felizbay ทุกสระมีปั๊มลมไฟฟ้า ชุดซ่อม และถุงเก็บของ รุ่นทรงกลมมีฝาครอบแบบติดตั้งที่เป็นอุปกรณ์เสริม
      icon: tabler:box
      category: all
    - title: มีขนาดอะไรบ้าง?
      description: SKU มาตรฐาน 48 รายการในสี่คอลเลกชัน ได้แก่ สระทรงกลมเส้นผ่านศูนย์กลางสูงสุด 10 ม. สระทรงสี่เหลี่ยมขนาดสูงสุด 6 × 5 ม. และอ่าง SPA พร้อมที่นั่งในตัว ขนาดที่กำหนดเองมีไว้สำหรับพันธมิตรทางธุรกิจ
      icon: tabler:ruler-2
      category: all
    - title: สระน้ำสามารถยืนบนพื้นผิวใดได้บ้าง?
      description: พื้นผิวราบเรียบที่ไม่มีของมีคม เช่น สนามหญ้า ลานบ้าน หรือดาดฟ้า แนะนำให้ใช้แผ่นปูพื้นบนพื้นผิวขรุขระ ตรวจสอบว่าพื้นผิวสามารถรับน้ำหนักของสระน้ำที่เต็มแล้วได้
      icon: tabler:layout-grid
      category: all
    - title: ฉันจะทำให้น้ำสะอาดได้อย่างไร?
      description: ใช้ปั๊มกรองที่ติดตั้งไว้ ขจัดคราบสกปรก ตรวจสอบ pH และปิดสระเมื่อไม่ได้ใช้งาน ระยะเวลาที่น้ำอยู่ได้ขึ้นอยู่กับขนาดสระว่ายน้ำ การใช้งาน และการกรอง — ทดสอบเป็นประจำแทนที่จะอาศัยกำหนดเวลาที่แน่นอน
      icon: tabler:droplet
      category: all
cta:
  title: |
    ค้นหาสระว่ายน้ำที่เหมาะสม<br class="block sm:hidden" /><span class="sm:whitespace-nowrap">สำหรับสนามหลังบ้านของคุณ</span>
  subtitle: เปรียบเทียบรุ่นและขนาด หรือขอความช่วยเหลือในการเลือก — ทีมงานของเราตอบคำถามภายในหนึ่งวันทำการ
  actions:
    - variant: primary
      text: ร้านค้าสระว่ายน้ำ
      href: /products
      icon: tabler:pool
    - text: ค้นหาสระน้ำของคุณ
      href: /find-your-pool
      icon: tabler:compass

