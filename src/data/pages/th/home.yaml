hero:
  tagline: สระน้ำเป่าลมแบบ Drop Stitch ระดับพรีเมี่ยม
  title: สร้างความเป็นคุณให้มากขึ้น<br />พื้นที่กลางแจ้ง
  subtitle: |
    สระว่ายน้ำระดับพรีเมียมพร้อมผนัง drop-stitch ที่แข็งแรง ซึ่งจะพองตัวได้ภายในไม่กี่นาทีและแพ็คไว้สำหรับฤดูหนาว ออกแบบมาเพื่อการพักผ่อนในสวนหลังบ้านและความสนุกสนานในครอบครัว<br />
    สำรวจขนาดสระว่ายน้ำ เปรียบเทียบคุณลักษณะ และค้นหาขนาดที่เหมาะกับพื้นที่ของคุณ<br />
    ออกแบบและดำเนินการโดย Aquafarer LLC สหรัฐอเมริกา
  actions:
    - variant: primary
      text: ร้านค้าสระว่ายน้ำ
      href: /products
      icon: tabler:pool
    - text: ค้นหาสระน้ำของคุณ
      href: /find-your-pool
      icon: tabler:compass
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: สระว่ายน้ำเป่าลมทรงสี่เหลี่ยม Felizbay Drop Stitch ในสวนหลังบ้าน
features:
  id: features
  tagline: เทคโนโลยีDrop Stitch
  title: ทำไมต้องมีสระFelizbay<br />มีความแตกต่าง
  subtitle: โครงสร้าง Drop Stitch แรงดันสูงทำให้สระของเรามีความแข็งแกร่ง ทนทาน และจัดเก็บได้อย่างง่ายดาย
  columns: 2
  items:
    - title: ผนัง Drop Stitch แข็ง
      description: 'เกลียวภายในหลายพันเส้นล็อคชั้นผนังไว้ด้วยกัน สระน้ำจึงพองตัวได้อย่างมั่นคงที่พิกัด 4-5 PSI และคงรูปร่างไว้เมื่อเติมน้ำ'
      icon: tabler:hexagon
    - title: ติดตั้งรวดเร็วโดยไม่ต้องใช้เครื่องมือ
      description: สูบลมด้วยที่สูบไฟฟ้าที่ให้มาภายในไม่กี่นาที จากนั้นเติมสายยางสวน ไม่มีเครื่องมือ ไม่มีการก่อสร้าง ไม่มีการติดตั้งอย่างมืออาชีพ
      icon: tabler:rocket
    - title: แพ็คออกไปขนาดเล็ก
      description: 'ระบาย ปล่อยลม ม้วนตัว และเก็บสระว่ายน้ำไว้ในกระเป๋าตลอดฤดูหนาว ซึ่งเป็นสระน้ำขนาดใหญ่ที่บรรจุขนาดเล็กสำหรับการจัดเก็บในร่ม'
      icon: tabler:package
    - title: ทนทานและทนต่อรังสียูวี
      description: 'ผ้า PVC drop stitch สองชั้น ออกแบบมาเพื่อต้านทานการเจาะทะลุและการสัมผัสกับ UV ตลอดการใช้งานทั้งครอบครัว'
      icon: tabler:shield
    - title: แพ็คเกจที่สมบูรณ์
      description: สระทุกสระมาพร้อมกับปั๊มลมไฟฟ้า ชุดซ่อม และถุงเก็บของ ฝาครอบพอดีสำหรับรุ่นทรงกลม
      icon: tabler:box
    - title: การออกแบบที่คำนึงถึงความปลอดภัย
      description: 'การออกแบบสระว่ายน้ำสำหรับที่อยู่อาศัยอ้างอิง EN 16582-1 และ ASTM F2666 — ข้อมูลด้านความปลอดภัยเฉพาะรุ่นมีอยู่ในเอกสารประกอบของผลิตภัณฑ์ จำเป็นต้องมีการดูแลจากผู้ใหญ่อย่างต่อเนื่อง'
      icon: tabler:shield-check
