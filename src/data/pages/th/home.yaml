hero:
  tagline: สระน้ำเป่าลมแบบ Drop Stitch ระดับพรีเมี่ยม
  title: สร้างความเป็นคุณให้มากขึ้น<br />พื้นที่กลางแจ้ง
  subtitle: |
    พบกับสระน้ำเป่าลมระดับพรีเมียมที่ออกแบบมาเพื่อการพักผ่อนในสวนหลังบ้าน ความสนุกสนานในครอบครัว และการใช้ชีวิตกลางแจ้ง<br />
    สำรวจขนาดสระว่ายน้ำ เปรียบเทียบคุณลักษณะ และค้นหาขนาดที่เหมาะกับพื้นที่ของคุณ<br />
    ออกแบบและดำเนินการโดย Aquafarer LLC สหรัฐอเมริกา
  actions:
    - variant: primary
      text: ร้านค้าสระว่ายน้ำ
      href: /products
      icon: tabler:pool
    - text: ค้นหาสระน้ำของคุณ
      href: /find-your-pool
      icon: tabler:compass
  image:
    src: /images/pools/rectangular-pool-2.png
    alt: สระว่ายน้ำเป่าลมทรงสี่เหลี่ยม Felizbay Drop Stitch ในสวนหลังบ้าน
