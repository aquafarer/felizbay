  title: สำรวจสระน้ำของเรา
  subtitle: เปรียบเทียบรูปทรง ขนาด และคุณลักษณะต่างๆ เพื่อค้นหาสระว่ายน้ำที่เหมาะสมสำหรับสวนหลังบ้านหรือพื้นที่กลางแจ้งของคุณ
content_compliance:
  tagline: การดูแลและความปลอดภัย
  title: เป็นเจ้าของได้ง่ายๆ<br />รักง่าย
  subtitle: ตั้งแต่การจัดส่งไปจนถึงการว่ายน้ำครั้งแรกไปจนถึงการจัดเก็บเมื่อสิ้นสุดฤดูกาล การเป็นเจ้าของสระว่ายน้ำ Felizbay ยังคงเป็นเรื่องง่าย
  items:
    - title: ตั้งค่าในไม่กี่นาที
      description: 'แกะกล่องและเติมลมด้วยปั๊มที่ให้มาภายใน 5-15 นาที จากนั้นเติมสายยางในสวน เวลาเติมจะแตกต่างกันไปตามขนาดสระว่ายน้ำและการจ่ายน้ำ'
      icon: tabler:rocket
    - title: การดูแลน้ำแบบง่ายๆ
      description: พอร์ตปั๊มกรองมาตรฐาน 32/38 มม. การตรวจสอบค่า pH เป็นประจำ และฝาปิดที่ติดตั้งไว้สำหรับรุ่นทรงกลมช่วยให้น้ำสะอาด
      icon: tabler:droplet
    - title: ทำความสะอาด ระบายน้ำ และจัดเก็บ
      description: สะเด็ดน้ำ ตากให้แห้ง ม้วนขึ้น และบรรจุสระลงในถุงเก็บของสำหรับฤดูหนาว ไม่มีการติดตั้งถาวรในการบำรุงรักษา
      icon: tabler:package
    - title: ปลอดภัยไว้ก่อน
      description: เด็กจะต้องได้รับการดูแลจากผู้ใหญ่ตลอดเวลา ปฏิบัติตามคู่มือ กฎท้องถิ่น และคำแนะนำในการใช้งานอย่างปลอดภัย
      icon: tabler:shield-check
steps:
  title: จากกล่องสู่สวนหลังบ้าน
  items:
    - title: 'ขั้นตอนที่ 1: <span class="font-medium">เลือกสระว่ายน้ำของคุณ</span>'
      description: เปรียบเทียบรูปทรงและขนาดเพื่อให้ตรงกับพื้นที่ ครัวเรือน และวิธีที่คุณวางแผนจะใช้น้ำ
      icon: tabler:pool
    - title: 'ขั้นตอนที่ 2: <span class="font-medium">ตั้งค่า</span>'
      description: วางบนพื้นเรียบและมั่นคง สูบลมด้วยปั๊มไฟฟ้าที่ให้มา และเติมสายยางสวน
      icon: tabler:rocket
    - title: 'ขั้นตอนที่ 3: <span class="font-medium">ว่ายน้ำตลอดฤดูร้อน</span>'
      description: รักษาความสดของน้ำด้วยการดูแลง่ายๆ — ลอกออก ปิดฝา และตรวจสอบ pH เหมือนสระน้ำขนาดเล็ก
      icon: tabler:ripple
    - title: 'ขั้นตอนที่ 4: <span class="font-medium">เก็บมันออกไป</span>'
      description: เมื่อฤดูกาลสิ้นสุดลง ให้สะเด็ดน้ำ ตากให้แห้ง ม้วนตัว และเก็บสระไว้ในกระเป๋าจนถึงฤดูร้อนหน้า
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: สระว่ายน้ำเป่าลม Felizbay Round Drop Stitch
blog_latest:
  title: คู่มือสระว่ายน้ำและข้อมูลเชิงลึก
  information: |
    คู่มือการติดตั้ง เคล็ดลับการดูแล และคำแนะนำในการซื้อสระว่ายน้ำเป่าลม
    จากทีมFelizbay
faqs:
  title: คำถามที่พบบ่อยเกี่ยวกับสระน้ำเป่าลม
  subtitle: คำถามทั่วไปเกี่ยวกับสระว่ายน้ำทำให้พอง Felizbay
  columns: 2
  items:
    - title: การตั้งค่าใช้เวลานานเท่าใด?
      description: 'การสูบลมจะใช้เวลา 5-15 นาทีโดยใช้ปั๊มลมไฟฟ้าที่ให้มาด้วย ขึ้นอยู่กับรุ่น เวลาในการเติมจะแตกต่างกันไปตามความจุของสระน้ำและการจ่ายน้ำของคุณ'
      icon: tabler:clock
      category: all
    - title: สระ Drop Stitch มีความแข็งแกร่งแค่ไหน?
      description: แข็งมาก. ผนังของ Drop Stitch พองอย่างแรงที่ 4-5 PSI ซึ่งคล้ายกับแพดเดิ้ลบอร์ดแบบเป่าลม ดังนั้นสระจึงคงรูปทรงไว้เมื่อเติมน้ำ
      icon: tabler:hexagon
      category: all
    - title: เด็กสามารถใช้สระว่ายน้ำได้หรือไม่?
      description: ใช่ โดยมีผู้ใหญ่คอยดูแลตลอดเวลา จะต้องไม่ทิ้งเด็กไว้ในหรือใกล้สระน้ำโดยไม่มีใครดูแล — ปฏิบัติตามคู่มือและกฎความปลอดภัยในท้องถิ่น
      icon: tabler:users
      category: all
    - title: ฉันจะเก็บสระว่ายน้ำในฤดูหนาวได้อย่างไร?
      description: ระบายน้ำ ปล่อยลมออกจากสระ ปล่อยให้แห้งสนิท จากนั้นม้วนขึ้นและเก็บไว้ในถุงเก็บที่ให้มาในที่ที่ไม่มีน้ำค้างแข็ง
      icon: tabler:package
      category: all
    - title: มีอะไรรวมอยู่ในสระว่ายน้ำ?
      description: สระ Felizbay ทุกสระมีปั๊มลมไฟฟ้า ชุดซ่อม และถุงเก็บของ รุ่นทรงกลมมีฝาครอบแบบติดตั้งที่เป็นอุปกรณ์เสริม
      icon: tabler:box
      category: all
    - title: มีขนาดอะไรบ้าง?
      description: SKU มาตรฐาน 48 รายการในสี่คอลเลกชัน ได้แก่ สระทรงกลมเส้นผ่านศูนย์กลางสูงสุด 10 ม. สระทรงสี่เหลี่ยมขนาดสูงสุด 6 × 5 ม. และอ่าง SPA พร้อมที่นั่งในตัว ขนาดที่กำหนดเองมีไว้สำหรับพันธมิตรทางธุรกิจ
      icon: tabler:ruler-2
      category: all
    - title: สระน้ำสามารถยืนบนพื้นผิวใดได้บ้าง?
      description: 'พื้นผิวราบเรียบที่ไม่มีของมีคม เช่น สนามหญ้า ลานบ้าน หรือดาดฟ้า แนะนำให้ใช้แผ่นปูพื้นบนพื้นผิวขรุขระ สระว่ายน้ำที่เต็มแล้วมีน้ำหนักมาก: ติดตั้งบนพื้นผิวที่รองรับน้ำหนักเต็มที่เท่านั้น และมีดาดฟ้า ระเบียง และหลังคายกสูงที่ได้รับการประเมินเชิงโครงสร้างก่อน'
      icon: tabler:layout-grid
      category: all
    - title: ฉันจะทำให้น้ำสะอาดได้อย่างไร?
      description: ใช้ปั๊มกรองที่ติดตั้งไว้ ขจัดคราบสกปรก ตรวจสอบ pH และปิดสระเมื่อไม่ได้ใช้งาน ระยะเวลาที่น้ำอยู่ได้ขึ้นอยู่กับขนาดสระว่ายน้ำ การใช้งาน และการกรอง — ทดสอบเป็นประจำแทนที่จะอาศัยกำหนดเวลาที่แน่นอน
      icon: tabler:droplet
      category: all
