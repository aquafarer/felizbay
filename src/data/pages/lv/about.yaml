hero:
  tagline: Par mums
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Felizbay piepūšamais peldbaseins
  title: |
    Peldēšana ir vienkārša, <br />
    pēc <span class="text-accent dark:text-white">Felizbay</span> parauga
  subtitle: Felizbay ir augstākās klases piepūšamo baseinu zīmols Drop Stitch, ko izstrādājis un pārvalda Aquafarer LLC (ASV). Mēs uzskatām, ka katra ģimene ir pelnījusi īstu baseinu pagalmā — virszemes uzstādīšana bez pastāvīgas baseina būvniecības. Mūsu baseini dažu minūšu laikā kļūst stingrāki, izdzīvo visas vasaras ģimenes izklaidēs un sezonas beigās iepako mazus. Atļauju, nožogojuma un uzstādīšanas prasības atšķiras atkarībā no atrašanās vietas.
