production_section:
  tagline: Ražošanas izcilība
  title: Izsmalcinātas meistarības nodrošināšana
  description: Felizbay ražošanas līnija ir paredzēta augstas kvalitātes, izturīgiem, augstspiediena piepūšamiem peldbaseiniem.
  cards:
    - title: Pieredzējušu tehniķu komanda
      items:
        - Profesionālās zināšanas par pilienu dūrienu un PVC materiāliem
        - Precīza meistarība griešanā, metināšanā un montāžā
        - Nepārtraukta apmācība, lai apgūtu jaunākās ražošanas tehnoloģijas
    - title: Uzlabotas ražošanas iekārtas
      items:
        - Precīza griešanas iekārta precīziem auduma paneļiem
        - Augstas precizitātes karstuma metināšana hermētiskām, izturīgām šuvēm
        - Profesionāla spiediena un hermētiskuma pārbaudes iekārta
    - title: Nobriedusi vadības sistēma
      items:
        - Standartizēti ražošanas procesi ar skaidriem kvalitātes standartiem
        - Lean ražošanas filozofija, kas samazina atkritumu daudzumu un uzlabo efektivitāti
        - Efektīva piegādes ķēdes vadība ar uzticamiem piegādātājiem
    - title: Stingra kvalitātes kontrole
      items:
        - 'Daudzpakāpju pārbaude: izejviela, procesā, galīgā izejošā'
        - Spiediena pārbaude nominālā 4-6 PSI darba diapazona augšdaļā
        - Stingra hermētiskuma un izturības pārbaude pirms nosūtīšanas
