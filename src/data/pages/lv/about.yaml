features3_what_we_build:
  title: Ko mēs veidojam
  subtitle: Mērķtiecīga produktu līnija, ko mēs zinām no iekšpuses — augstspiediena Drop Stitch piepūšamie peldbaseini.
  columns: 3
  isBeforeContent: true
  items:
    - title: Taisnstūra baseini
      description: Ģimenes izmēra taisnstūrveida Drop Stitch baseini, kas maksimāli palielina peldēšanas zonu jūsu telpai.
      icon: tabler:rectangle
    - title: Apaļi zili baseini
      description: Klasiskais piemājas baseins — koši zilas, stingras Drop Stitch sienas, ātra uzstādīšana.
      icon: tabler:circle
    - title: Apaļi pelēki baseini
      description: Mūsu augstākās kvalitātes līnija ar modernu pelēku apdari un pēc izvēles piestiprinātu vāku.
      icon: tabler:circle-dot
    - title: Karstās vannas SPA baseini
      description: 'Izolēti burbuļvannu modeļi ar iebūvētiem sēdekļiem un 5 mm izolētiem dibeniem — izmantošanai ar ārējiem sildītājiem (sildītājs nav iekļauts komplektā).'
      icon: tabler:ripple
