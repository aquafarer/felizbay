  columns: 3
  isAfterContent: true
  items:
    - title: Pilnīgas paketes
      description: Katrs peldbaseina komplekts tiek piegādāts ar elektrisko gaisa sūkni, remonta komplektu un uzglabāšanas somu.
      icon: tabler:package
    - title: Pielāgoti izmēri
      description: OEM izmēri, krāsas un vāki zīmoliem, izplatītājiem un viesmīlības projektiem.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Privātu etiķešu ražošana ar logotipa drukāšanu un mazumtirdzniecībai gatavu iepakojumu.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Felizbay taisnstūra Drop Stitch piepūšamais peldbaseins
