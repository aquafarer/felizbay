hero:
  tagline: استخرهای بادی Drop Stitch درجه یک
  title: از خودتان بیشتر بسازید<br />فضای باز.
  subtitle: |
    استخرهای ممتاز با دیوارهای سفت و سخت drop-stitch که در عرض چند دقیقه باد می‌شوند و برای زمستان بسته می‌شوند - برای آرامش در حیاط خلوت و تفریح ​​خانوادگی طراحی شده‌اند.<br />
    اندازه‌های استخر را کاوش کنید، ویژگی‌ها را مقایسه کنید و مناسب فضای خود را بیابید.<br />
    طراحی و اجرا توسط Aquafarer LLC، ایالات متحده آمریکا.
  actions:
    - variant: primary
      text: استخرهای فروشگاهی
      href: /products
      icon: tabler:pool
    - text: استخر خود را پیدا کنید
      href: /find-your-pool
      icon: tabler:compass
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: استخر بادی Drop Stitch مستطیلی Felizbay در حیاط خلوت
features:
  id: features
  tagline: تکنولوژی Drop Stitch
  title: چرا یک استخر Felizbay<br />متفاوت است
  subtitle: ساخت و ساز Drop Stitch با فشار بالا استخرهای ما را سفت، بادوام و نگهداری آسان می کند.
  columns: 2
  items:
    - title: دیوارهای سفت Drop Stitch
      description: 'هزاران نخ داخلی لایه‌های دیوار را به هم قفل می‌کنند، بنابراین استخر با درجه PSI 4-5 سفت و محکم باد می‌کند و هنگام پر شدن شکل خود را حفظ می‌کند.'
      icon: tabler:hexagon
    - title: راه اندازی سریع و بدون ابزار
      description: با پمپ برقی موجود در عرض چند دقیقه باد کنید، سپس با شلنگ باغچه پر کنید. بدون ابزار، بدون ساخت و ساز، بدون نصب حرفه ای.
      icon: tabler:rocket
    - title: بسته های دور کوچک
      description: 'استخر را در زمستان تخلیه کنید، باد را خالی کنید، بغلتانید و در کیسه اش ذخیره کنید - استخری با اندازه کامل که برای ذخیره سازی در داخل خانه بسته بندی می شود.'
      icon: tabler:package
    - title: بادوام و مقاوم در برابر اشعه ماوراء بنفش
      description: 'پارچه دولایه PVC drop stitch، مهندسی شده برای مقاومت در برابر سوراخ شدن و قرار گرفتن در معرض UV در طول یک فصل کامل استفاده خانوادگی.'
      icon: tabler:shield
    - title: پکیج کامل
      description: هر استخر با یک پمپ باد الکتریکی، کیت تعمیر و کیسه ذخیره سازی حمل می شود. روکش های نصب شده برای مدل های گرد موجود است.
      icon: tabler:box
    - title: طراحی ایمنی-آگاهانه
      description: 'ارجاع به طراحی استخر مسکونی EN 16582-1 و ASTM F2666 — اطلاعات ایمنی مدل خاص در مستندات محصول ارائه شده است. نظارت مداوم بزرگسالان همیشه مورد نیاز است.'
      icon: tabler:shield-check
content_customer_types:
  tagline: ایده های استخر
  title: استخر مناسب برای<br />فضای شما
  subtitle: تنظیمات واقعی، اندازه های واقعی و راهنمایی صادقانه برای انتخاب استخر مناسب.
content_categories:
  tagline: استخرهای فروشگاهی
  title: استخرهای ما را کاوش کنید
  subtitle: شکل‌ها، اندازه‌ها و ویژگی‌ها را با هم مقایسه کنید تا استخر مناسب برای حیاط خلوت یا فضای بیرونی خود پیدا کنید.
content_compliance:
  tagline: مراقبت و ایمنی
  title: داشتن آسان،<br />دوست داشتن آسان
  subtitle: از تحویل تا اولین شنا تا ذخیره سازی در پایان فصل، داشتن استخر Felizbay ساده می ماند.
  items:
    - title: راه اندازی در چند دقیقه
      description: 'ظرف 5 تا 15 دقیقه جعبه را خارج کرده و با پمپ همراه باد کنید، سپس با یک شلنگ باغچه پر کنید - زمان پر کردن بسته به اندازه استخر و میزان آب متفاوت است.'
      icon: tabler:rocket
    - title: مراقبت از آب ساده
      description: پورت‌های پمپ فیلتر استاندارد 32/38 میلی‌متری، بررسی‌های منظم pH و پوشش نصب شده در مدل‌های گرد، آب را تمیز نگه می‌دارد.
      icon: tabler:droplet
    - title: تمیز، تخلیه و ذخیره کنید
      description: استخر را تخلیه کنید، خشک کنید، بغلتانید و برای زمستان در کیسه نگهداری آن قرار دهید. بدون نصب دائمی برای نگهداری
      icon: tabler:package
    - title: اول ایمنی
      description: کودکان باید همیشه توسط یک بزرگسال تحت نظارت فعال باشند. دستورالعمل ها، قوانین محلی و راهنمایی های استفاده ایمن را دنبال کنید.
      icon: tabler:shield-check
steps:
  title: از جعبه تا حیاط خلوت
  items:
    - title: 'مرحله 1: <span class="font-medium">استخر خود را انتخاب کنید</span>'
      description: شکل ها و اندازه ها را برای مطابقت با فضای خانه، خانه و نحوه استفاده از آب مقایسه کنید.
      icon: tabler:pool
    - title: 'مرحله 2: <span class="font-medium">آن را تنظیم کنید</span>'
      description: روی زمین صاف و محکم قرار دهید، با پمپ الکتریکی موجود باد کنید و با شلنگ باغچه پر کنید.
      icon: tabler:rocket
    - title: 'مرحله 3: <span class="font-medium">تمام تابستان شنا کنید</span>'
      description: با مراقبت های ساده آب را تازه نگه دارید - مانند هر استخر کوچکی، آن را بپوشانید و pH را بررسی کنید.
      icon: tabler:ripple
    - title: 'مرحله 4: <span class="font-medium">ذخیره آن دور</span>'
      description: پس از پایان فصل، استخر را آبکشی کنید، خشک کنید، گرد کنید و تا تابستان آینده در کیسه آن نگهداری کنید.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: استخر بادی Drop Stitch دور Felizbay
blog_latest:
  title: راهنمای استخر و بینش
  information: |
    راهنماهای راه اندازی، نکات مراقبتی، و مشاوره خرید برای استخرهای شنای بادی
    از تیم Felizbay.
faqs:
  title: سوالات متداول استخر بادی
  subtitle: سوالات متداول در مورد استخرهای بادی Felizbay.
  columns: 2
  items:
    - title: راه اندازی چقدر طول می کشد؟
      description: 'باد کردن با پمپ باد الکتریکی موجود بسته به مدل 5-15 دقیقه طول می کشد. زمان پر کردن با ظرفیت استخر و میزان آب شما متفاوت است.'
      icon: tabler:clock
      category: all
    - title: استخر Drop Stitch چقدر سفت است؟
      description: خیلی سفت و سخت دیوارهای Drop Stitch به شدت با 4-5 PSI باد می‌شوند - شبیه به یک تخته بادی - بنابراین استخر وقتی با آب پر می‌شود شکل خود را حفظ می‌کند.
      icon: tabler:hexagon
      category: all
    - title: آیا کودکان می توانند از استخر استفاده کنند؟
      description: بله، با نظارت فعال بزرگسالان همیشه. هرگز نباید کودکان را در داخل یا نزدیک استخر بدون مراقبت رها کرد - دستورالعمل‌های راهنما و قوانین ایمنی محلی را رعایت کنید.
      icon: tabler:users
      category: all
    - title: چگونه استخر را در زمستان نگهداری کنم؟
      description: آب را تخلیه کنید، استخر را خالی کنید، بگذارید کاملا خشک شود، سپس آن را بغلتانید و در کیسه ذخیره‌سازی موجود در مکانی بدون یخ نگه دارید.
      icon: tabler:package
      category: all
    - title: چه چیزی همراه استخر است؟
      description: هر استخر Felizbay شامل یک پمپ باد الکتریکی، یک کیت تعمیر و یک کیسه ذخیره سازی است. مدل‌های گرد دارای پوشش اختیاری هستند.
      icon: tabler:box
      category: all
    - title: چه اندازه هایی موجود است؟
      description: 48 SKU استاندارد در چهار مجموعه - استخرهای گرد تا عرض 10 متر، استخرهای مستطیلی تا 6 × 5 متر، و وان های اسپا با صندلی های توکار. اندازه های سفارشی برای شرکای تجاری در دسترس است.
      icon: tabler:ruler-2
      category: all
    - title: استخر روی چه سطوحی می تواند بایستد؟
      description: 'هر سطح صاف و هموار و عاری از اشیاء تیز - چمن، پاسیو یا عرشه. ورق زمینی روی سطوح ناهموار توصیه می شود. یک استخر پر سنگین است: فقط روی سطحی نصب کنید که وزن کامل را تحمل کند و ابتدا عرشه های مرتفع، بالکن ها و پشت بام ها از نظر ساختاری ارزیابی شوند.'
      icon: tabler:layout-grid
      category: all
    - title: چگونه آب را تمیز نگه دارم؟
      description: در جاهایی که نصب شده است از پمپ فیلتر استفاده کنید، زباله ها را پاک کنید، PH را بررسی کنید و در صورت عدم استفاده استخر را بپوشانید. مدت زمان ماندگاری آب به اندازه استخر، استفاده و فیلتراسیون بستگی دارد - به جای تکیه بر یک برنامه ثابت، به طور منظم آزمایش کنید.
      icon: tabler:droplet
      category: all
