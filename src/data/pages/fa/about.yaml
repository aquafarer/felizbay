production_section:
  tagline: تعالی تولید
  title: حصول اطمینان از کاردستی عالی
  description: خط تولید Felizbay به استخرهای بادی با کیفیت بالا، بادوام و فشار بالا اختصاص دارد.
  cards:
    - title: تیم تکنسین با تجربه
      items:
        - دانش حرفه ای از دوخت قطره ای و مواد پی وی سی
        - کاردستی دقیق در برش، جوشکاری و مونتاژ
        - آموزش مداوم برای تسلط بر آخرین فن آوری های تولید
    - title: تجهیزات پیشرفته تولید
      items:
        - تجهیزات برش دقیق برای پانل های پارچه ای دقیق
        - جوشکاری حرارتی با دقت بالا برای درزهای هوادار و بادوام
        - تجهیزات حرفه ای تست فشار و هوا
    - title: سیستم مدیریت بالغ
      items:
        - فرآیندهای تولید استاندارد با استانداردهای کیفیت واضح
        - فلسفه تولید ناب کاهش ضایعات و بهبود کارایی
        - مدیریت زنجیره تامین کارآمد با تامین کنندگان قابل اعتماد
    - title: کنترل کیفیت دقیق
      items:
        - 'بازرسی چند مرحله ای: مواد اولیه، در حال فرآیند، خروجی نهایی'
        - تست فشار در بالای محدوده کاری 4-6 PSI
        - تست دقیق هوابندی و دوام قبل از حمل و نقل
