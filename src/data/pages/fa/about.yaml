features3_what_we_build:
  title: چیزی که ما می سازیم
  subtitle: خط تولید متمرکزی که از درون می شناسیم - استخرهای بادی Drop Stitch با فشار بالا.
  columns: 3
  isBeforeContent: true
  items:
    - title: استخرهای مستطیلی
      description: استخرهای Drop Stitch مستطیل شکل خانوادگی که فضای شنا را برای فضای شما به حداکثر می رساند.
      icon: tabler:rectangle
    - title: استخرهای گرد آبی
      description: استخر کلاسیک حیاط خلوت - آبی پر جنب و جوش، دیوارهای Drop Stitch سفت و سخت، راه اندازی سریع.
      icon: tabler:circle
    - title: استخرهای گرد خاکستری
      description: خط ممتاز ما با روکش خاکستری مدرن و روکش نصب شده اختیاری.
      icon: tabler:circle-dot
    - title: استخرهای آب گرم SPA
      description: 'مدل‌های جکوزی عایق‌شده با صندلی‌های توکار و کف عایق‌شده 5 mm - برای استفاده با بخاری‌های خارجی (بخاری شامل بخاری نمی‌شود).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: بسته های کامل
      description: هر مجموعه استخر شنا با پمپ باد برقی، کیت تعمیر و کیسه ذخیره سازی حمل می شود.
      icon: tabler:package
    - title: اندازه های سفارشی
      description: اندازه‌ها، رنگ‌ها و پوشش‌های OEM برای برندها، توزیع‌کنندگان و پروژه‌های مهمان‌نوازی.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: تولید لیبل خصوصی با چاپ آرم و بسته بندی آماده خرده فروشی.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: استخر بادی مستطیلی Felizbay Drop Stitch
steps2_values:
  title: ارزش های ما
  subtitle: سه اصل که هر استخری را که می سازیم شکل می دهد.
  items:
    - title: طوری بسازید که خانواده شما از آن استفاده کنند
      description: با هر درز، دیوار و دریچه طوری رفتار می شود که گویی خانواده های خودمان در آن شنا خواهند کرد.
      icon: tabler:heart
    - title: مهندس قبل از فروش
      description: ساخت و ساز Drop Stitch فشار بالا، در حد بالای فشار نامی آن، قبل از هر کشتی استخر آزمایش شده است.
      icon: tabler:settings
    - title: حمایتی که طول فصل را بیشتر می کند
      description: سوالات، قطعات یدکی یا گارانتی - هر زمان که بخواهید با ما در info@felizbay.com تماس بگیرید.
      icon: tabler:headset
