hero:
  tagline: درباره ما
  image:
    src: /images/pools/round-grey-pool-1.png
    alt: استخر بادی Felizbay
  title: |
    ساده کردن شنا، <br />
    به سبک <span class="text-accent dark:text-white">Felizbay</span> 
  subtitle: Felizbay یک برند استخر بادی درجه یک Drop Stitch است که توسط Aquafarer LLC (ایالات متحده آمریکا) طراحی و اداره می شود. ما معتقدیم که هر خانواده سزاوار یک استخر واقعی در حیاط خلوت است - بدون ساخت و ساز، مجوز، یا نصب دائمی. استخرهای ما در عرض چند دقیقه به صورت سفت و سخت باد می‌شوند، تابستان‌های کاملی از تفریحات خانوادگی را پشت سر می‌گذارند، و در پایان فصل بسته‌بندی کوچکی را در خود جای می‌دهند.
