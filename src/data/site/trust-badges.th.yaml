badges:
  - icon: "✔"
    title: ผ่านการทดสอบความปลอดภัยแล้ว
    desc: ออกแบบโดยอ้างอิงถึง EN 16582-1 และ ASTM F2666 ข้อมูลด้านความปลอดภัยเฉพาะรุ่นจะจัดส่งอยู่ในเอกสารประกอบของผลิตภัณฑ์
    variant: cert
  - icon: "⚙"
    title: 'ISO 9001: 2015'
    desc: ระบบการจัดการคุณภาพที่ได้รับการรับรองจาก SGS
    variant: cert
  - icon: "✦"
    title: ผ่านการทดสอบแรงดัน
    desc: สระน้ำทุกสระได้รับการทดสอบก่อนออกจากโรงงาน
    variant: standard
  - icon: "☆"
    title: รับประกัน 2 ปี
    desc: การรับประกันแบบจำกัดสำหรับตะเข็บ วาล์ว และผ้าต่อข้อบกพร่องในการผลิต
    variant: warranty
  - icon: "⚖"
    title: การปฏิบัติตามข้อกำหนดของวัสดุ
    desc: วัสดุพีวีซีที่มาจากสูตรที่สอดคล้องกับ REACH เอกสารการปฏิบัติตามข้อกำหนดตามคำขอ
    variant: material
