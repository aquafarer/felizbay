badges:
  - icon: "✔"
    title: Δοκιμασμένη ασφάλεια
    desc: Σχεδιασμένο με αναφορά στο EN 16582-1 και το ASTM F2666. πληροφορίες ασφαλείας για συγκεκριμένο μοντέλο αποστέλλονται στην τεκμηρίωση του προϊόντος.
    variant: cert
  - icon: "⚙"
    title: 'του προτύπου ISO 9001:2015'
    desc: Σύστημα διαχείρισης ποιότητας πιστοποιημένο από την SGS.
    variant: cert
  - icon: "✦"
    title: Δοκιμασμένο με πίεση
    desc: Κάθε πισίνα ελέγχεται με φούσκωμα πριν φύγει από το εργοστάσιο.
    variant: standard
  - icon: "☆"
    title: Εγγύηση 2 ετών
    desc: Περιορισμένη εγγύηση σε ραφές, βαλβίδες και ύφασμα έναντι κατασκευαστικών ελαττωμάτων.
    variant: warranty
  - icon: "⚖"
    title: Συμμόρφωση υλικού
    desc: Υλικά PVC που προέρχονται από σκευάσματα συμβατά με το REACH. τεκμηρίωση συμμόρφωσης διαθέσιμη κατόπιν αιτήματος.
    variant: material
