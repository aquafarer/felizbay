success_message:
  en: Thanks! Your message has landed in our inbox. We will reply within one business day.
  fr: Merci ! Votre message a bien été envoyé. Nous vous répondrons sous un jour ouvré.
  de: Vielen Dank! Ihre Nachricht ist eingegangen. Wir antworten innerhalb eines Werktags.
  es: ¡Gracias! Su mensaje ha sido enviado. Le responderemos en un día hábil.
  pt: Obrigado! Sua mensagem foi enviada. Responderemos em um dia útil.
  ar: 'شكرًا! وصلت رسالتك إلى بريدنا. سنرد خلال يوم عمل واحد.'
  az: 'Təşəkkürlər! Mesajınız gələnlər qutumuza daxil oldu. Bir iş günü ərzində cavab verəcəyik.'
  bg: 'Благодарим! Вашето съобщение е получено. Ще отговорим в рамките на един работен ден.'
  cs: 'Děkujeme! Vaše zpráva nám dorazila. Odpovíme do jednoho pracovního dne.'
  da: 'Tak! Din besked er landet i vores indbakke. Vi svarer inden for én hverdag.'
  el: 'Ευχαριστούμε! Το μήνυμά σας έφτασε στα εισερχόμενά μας. Θα απαντήσουμε εντός μίας εργάσιμης ημέρας.'
  et: 'Aitäh! Teie sõnum on jõudnud meie postkasti. Vastame ühe tööpäeva jooksul.'
  fa: 'متشکریم! پیام شما در صندوق ورودی ما قرار گرفت. ظرف یک روز کاری پاسخ می‌دهیم.'
  fi: 'Kiitos! Viestisi on saapunut postilaatikkoomme. Vastaamme yhden arkipäivän kuluessa.'
  he: 'תודה! ההודעה שלך נחתה בתיבת הדואר שלנו. נשיב בתוך יום עסקים אחד.'
  hr: 'Hvala! Vaša poruka je stigla u naš pretinac. Odgovorit ćemo u roku od jednog radnog dana.'
  hu: 'Köszönjük! Üzenete megérkezett a postafiókunkba. Egy munkanapon belül válaszolunk.'
  id: 'Terima kasih! Pesan Anda telah masuk ke kotak masuk kami. Kami akan membalas dalam satu hari kerja.'
  it: 'Grazie! Il tuo messaggio è arrivato nella nostra casella di posta. Risponderemo entro un giorno lavorativo.'
  kk: 'Рахмет! Хабарламаңыз почтаымызға түсті. Бір жұмыс күні ішінде жауап береміз.'
  lt: 'Dėkojame! Jūsų žinutė pasiekė mūsų pašto dėžutę. Atsakysime per vieną darbo dieną.'
  lv: 'Paldies! Jūsu ziņa ir nonākusi mūsu pastkastē. Atbildēsim vienas darba dienas laikā.'
  ms: 'Terima kasih! Mesej anda telah tiba dalam peti masuk kami. Kami akan membalas dalam satu hari bekerja.'
  nl: 'Bedankt! Je bericht is aangekomen in onze inbox. We reageren binnen één werkdag.'
  no: 'Takk! Meldingen din har kommet til innboksen vår. Vi svarer innen én virkedag.'
  pl: 'Dziękujemy! Twoja wiadomość trafiła do naszej skrzynki. Odpowiemy w ciągu jednego dnia roboczego.'
  ro: 'Vă mulțumim! Mesajul dvs. a ajuns în inboxul nostru. Vom răspunde în termen de o zi lucrătoare.'
  ru: 'Спасибо! Ваше сообщение получено. Мы ответим в течение одного рабочего дня.'
  sk: 'Ďakujeme! Vaša správa nám prišla. Odpovieme do jedného pracovného dňa.'
  sl: 'Hvala! Vaše sporočilo je prispelo v naš nabiralnik. Odgovorili bomo v enem delovnem dnevu.'
  sr: 'Хвала! Ваша порука је стигла у нашу пошту. Одговорићемо у року од једног радног дана.'
  sv: 'Tack! Ditt meddelande har kommit till vår inkorg. Vi svarar inom en arbetsdag.'
  th: 'ขอบคุณ! ข้อความของคุณมาถึงกล่องจดหมายของเราแล้ว เราจะตอบกลับภายในหนึ่งวันทำการ'
  tl: 'Salamat! Nakaabot na ang mensahe mo sa aming inbox. Sasagot kami sa loob ng isang araw ng trabaho.'
  tr: 'Teşekkürler! Mesajınız gelen kutumuza ulaştı. Bir iş günü içinde yanıt vereceğiz.'
  uk: 'Дякуємо! Ваше повідомлення надійшло до нашої скриньки. Відповімо протягом одного робочого дня.'
  uz: 'Rahmat! Xabaringiz pochtamizga tushdi. Bitta ish kuni ichida javob beramiz.'
  vi: 'Cảm ơn bạn! Tin nhắn của bạn đã đến hộp thư của chúng tôi. Chúng tôi sẽ trả lời trong vòng một ngày làm việc.'

error_message:
  en: Something went wrong sending your message. Please try again or email us directly.
  fr: Une erreur est survenue. Veuillez réessayer ou nous envoyer un e-mail directement.
  de: Beim Senden Ihrer Nachricht ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut.
  es: Ocurrió un error al enviar su mensaje. Intente de nuevo o escríbanos directamente.
  pt: Ocorreu um erro ao enviar sua mensagem. Tente novamente ou envie-nos um e-mail.
  ar: 'حدث خطأ أثناء إرسال رسالتك. يرجى المحاولة مرة أخرى أو مراسلتنا مباشرة عبر البريد الإلكتروني.'
  az: 'Mesajınızı göndərərkən xəta baş verdi. Yenidən cəhd edin və ya bizə birbaşa e-poçt göndərin.'
  bg: 'Възникна грешка при изпращането на съобщението. Моля, опитайте отново или ни пишете директно.'
  cs: 'Při odesílání zprávy došlo k chybě. Zkuste to prosím znovu nebo nám napište přímo.'
  da: 'Noget gik galt med at sende din besked. Prøv igen, eller skriv til os direkte.'
  el: 'Κάτι πήγε στραβά κατά την αποστολή του μηνύματός σας. Δοκιμάστε ξανά ή στείλτε μας email απευθείας.'
  et: 'Teie sõnumi saatmisel tekkis viga. Proovige uuesti või saatke meile otse e-kiri.'
  fa: 'هنگام ارسال پیام شما خطایی رخ داد. لطفاً دوباره تلاش کنید یا مستقیماً به ما ایمیل بزنید.'
  fi: 'Viestisi lähettämisessä tapahtui virhe. Yritä uudelleen tai lähetä meille sähköpostia suoraan.'
  he: 'משהו השתבש בשליחת ההודעה שלך. נסה שוב או שלח לנו מייל ישירות.'
  hr: 'Došlo je do pogreške pri slanju vaše poruke. Pokušajte ponovo ili nam pošaljite e-poruku izravno.'
  hu: 'Hiba történt az üzenet küldésekor. Kérjük, próbálja újra, vagy írjon nekünk közvetlenül e-mailben.'
  id: 'Terjadi kesalahan saat mengirim pesan Anda. Silakan coba lagi atau kirim email kepada kami secara langsung.'
  it: 'Si è verificato un errore durante l’invio del messaggio. Riprova oppure scrivici direttamente un’email.'
  kk: 'Хабарламаңызды жіберу кезінде қате пайда болды. Қайта байқап көріңіз немесе бізге тікелей жазыңыз.'
  lt: 'Išsiunčiant jūsų žinutę įvyko klaida. Bandykite dar kartą arba atsiųskite mums el. laišką tiesiogiai.'
  lv: 'Nosūtot jūsu ziņu, radās kļūda. Lūdzu, mēģiniet vēlreiz vai rakstiet mums tieši e-pastā.'
  ms: 'Sesuatu yang tidak kena berlaku semasa menghantar mesej anda. Sila cuba lagi atau emel kami terus.'
  nl: 'Er ging iets mis bij het versturen van je bericht. Probeer het opnieuw of mail ons direct.'
  no: 'Noe gikk galt ved sending av meldingen din. Prøv igjen, eller send oss en e-post direkte.'
  pl: 'Przy wysyłaniu wiadomości wystąpił błąd. Spróbuj ponownie lub napisz do nas bezpośrednio.'
  ro: 'A apărut o eroare la trimiterea mesajului. Încercați din nou sau scrieți-ne direct un e-mail.'
  ru: 'При отправке сообщения произошла ошибка. Попробуйте еще раз или напишите нам напрямую.'
  sk: 'Pri odosielaní správy sa vyskytla chyba. Skúste to znova alebo nám napíšte priamo.'
  sl: 'Pri pošiljanju vašega sporočila je prišlo do napake. Poskusite znova ali nam pišite neposredno.'
  sr: 'Дошло је до грешке при слању ваше поруке. Покушајте поново или нам пишите директно.'
  sv: 'Något gick fel när ditt meddelande skickades. Försök igen eller mejla oss direkt.'
  th: 'เกิดข้อผิดพลาดในการส่งข้อความของคุณ โปรดลองอีกครั้งหรือส่งอีเมลถึงเราโดยตรง'
  tl: 'May naganap na error sa pagpapadala ng iyong mensahe. Pakiusap subukang muli o i-email kami nang direkta.'
  tr: 'Mesajınız gönderilirken bir sorun oluştu. Lütfen tekrar deneyin veya bize doğrudan e-posta gönderin.'
  uk: 'Під час надсилання повідомлення сталася помилка. Спробуйте ще раз або напишіть нам безпосередньо.'
  uz: 'Xabaringizni yuborishda xatolik yuz berdi. Qayta urinib ko''ring yoki bizga to''g''ridan-to''g''ri elektron xat yuboring.'
  vi: 'Đã xảy ra lỗi khi gửi tin nhắn của bạn. Vui lòng thử lại hoặc gửi email trực tiếp cho chúng tôi.'

