    desc: Projetado com referência à EN 16582-1 e ASTM F2666; informações de segurança específicas do modelo são enviadas na documentação do produto.
    variant: cert
  - icon: "⚙"
    title: 'ISO 9001:2015'
    desc: Sistema de gestão da qualidade certificado pela SGS.
    variant: cert
