origin:
  tagline: أصلنا
  heading: "بنيت لفصل الصيف،<br />\n<span class=\"text-sky-600\">مصممة لتدوم طويلاً</span>"
  paragraphs:
    - 'بدأ Felizbay بإحباط بسيط: حمامات سباحة قابلة للنفخ تراجعت وتسربت واستمرت لموسم واحد. لقد اعتقدنا أن حوض السباحة يمكن أن يكون أفضل - قوي بما يكفي للسباحة فيه، وقوي بما يكفي للبقاء على قيد الحياة عامًا بعد عام، ولا يزال صغيرًا بما يكفي لتخزينه داخل المنزل في الشتاء.'
    - كان بناء الغرزة المسقطة هو الحل. تعمل الآلاف من الخيوط الداخلية على تثبيت الجدران بقوة تحت الضغط، مما يمنح حوض السباحة القماشي هيكلًا صلب الجوانب.
    - 'تم بناء كل حوض سباحة في Felizbay حول هذا الجوهر: مواد عالية الجودة، وبناء تم اختباره، وهندسة صادقة، بسعر يمكن أن تبرره الأسرة.'
    - تم تصميم وتشغيل Felizbay بواسطة <strong>Aquafarer LLC</strong>، الولايات المتحدة الأمريكية. يتم إنتاج حمامات السباحة الخاصة بنا من قبل شريك تصنيع طويل الأمد في تشينغداو، الصين، ويتم اختبار الضغط بنسبة 100% على كل وحدة قبل شحنها.
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: بركة غرزة قطرة Felizbay

philosophy:
  tagline: فلسفتنا
  heading: بسيطة ودائمة وصادقة
  description: 'يعد المسبح وعدًا: املأه في أول يوم حار من الصيف وسيعمل. كل ما نصممه يخدم هذا الوعد.'
  cards:
    - emoji: "🌊"
      title: جامدة وليست مترهلة
      description: تنتفخ جدران الغرز المتساقطة بشكل جامد وتحافظ على شكلها عند ضغط الماء الكامل. لا توجد جدران مائلة، ولا خط مياه مترهل، ولا يوجد عمق مفقود.
    - emoji: "🔧"
      title: صُمم ليدوم طويلاً، وليس ليحل محله
      description: حمام السباحة الأكثر استدامة هو الذي لا يمكنك التخلص منه. إن صمامات PVC المقاومة للأشعة فوق البنفسجية والمقاومة للثقب وصمامات الجودة تعني مواسم الاستخدام، وليس صيفًا واحدًا.
    - emoji: "🏆"
      title: الصيف أصبح بسيطًا
      description: سريع النفخ، عشر دقائق للطي. لا توجد أدوات ولا إطارات ولا طاقم تركيب. يجب أن تكون السباحة الجزء السهل.

design:
  tagline: فلسفة التصميم
  heading: "مصممة من<br />\n<span class=\"text-sky-600\">الماء إلى الخارج</span>"
  paragraphs:
    - 'يبدأ كل تجمع في Felizbay بسؤال واحد: <em>ماذا يفعل الماء به؟</em> ضغط الماء الكامل، والتعرض للأشعة فوق البنفسجية، وكيمياء الكلور، والحطام الأرضي - نصممها كلها، ثم نبني فوقها.'
    - تم تصنيف غرف الغرز المتدلية الخاصة بنا أعلى بكثير من ضغط العمل، لذا فإن فترة ما بعد الظهيرة الحارة لا تزيد من الضغط على التماس. إن مادة PVC الخاصة بنا مغلفة بمثبتات للأشعة فوق البنفسجية، لأن ضوء الشمس - وليس الثقوب - هو ما يقتل معظم حمامات السباحة القابلة للنفخ.
    - نحن لا نصمم لنقطة السعر. نحن نصمم حتى نصل إلى نقطة الفشل، ثم نبني بعد ذلك بكثير.
  image: /images/pools/round-grey-pool-1.webp
  image_alt: تصميم مسبح Felizbay
  stats:
    - value: 100%
      label: "تم اختباره بالضغط<br />قبل التعبئة"
    - value: 4–6
      label: "تصنيف PSI<br />ضغط العمل"
    - value: 5–15
      label: "دقيقة<br />تضخم اقتصادي"
