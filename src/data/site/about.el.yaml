origin:
  tagline: Η καταγωγή μας
  heading: "Χτισμένο για το καλοκαίρι,<br />\n<span class=\"text-sky-600\">κατασκευασμένο για να διαρκέσει</span>"
  paragraphs:
    - 'Το Felizbay ξεκίνησε με μια απλή απογοήτευση: φουσκωτές πισίνες που χαλούσαν, διέρρευσαν και κράτησαν μια μόνο σεζόν. Πιστεύαμε ότι μια πισίνα θα μπορούσε να είναι καλύτερη - αρκετά άκαμπτη για να κολυμπήσει γύρους, αρκετά σκληρή για να επιβιώσει χρόνο με το χρόνο και ακόμα αρκετά μικρή για να αποθηκεύεται σε εσωτερικούς χώρους το χειμώνα.'
    - Η κατασκευή με βελονιά σταγόνας ήταν η απάντηση. Χιλιάδες εσωτερικές κλωστές κλειδώνουν τους τοίχους άκαμπτους υπό πίεση, δίνοντας σε μια πισίνα υφασμάτων τη δομή μιας σκληρής όψης.
    - 'Κάθε πισίνα Felizbay είναι χτισμένη γύρω από αυτόν τον πυρήνα: ποιοτικά υλικά, δοκιμασμένη κατασκευή και ειλικρινής μηχανική, σε τιμή που μπορεί να δικαιολογήσει μια οικογένεια.'
    - Το Felizbay σχεδιάζεται και λειτουργεί από <strong>Aquafarer LLC</strong>, ΗΠΑ. Οι πισίνες μας παράγονται από έναν μακροπρόθεσμο συνεργάτη κατασκευής στο Qingdao της Κίνας και κάθε μονάδα ελέγχεται 100% υπό πίεση πριν αποσταλεί.
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: Felizbay πισίνα με βελονιές

philosophy:
  tagline: Η Φιλοσοφία μας
  heading: Απλό, ανθεκτικό, ειλικρινές
  description: 'Μια πισίνα είναι μια υπόσχεση: γεμίστε την την πρώτη ζεστή μέρα του καλοκαιριού και λειτουργεί. Όλα όσα σχεδιάζουμε υπηρετούν αυτήν την υπόσχεση.'
  cards:
    - emoji: "🌊"
      title: Άκαμπτο, Όχι Σάγκυ
      description: Ρίξτε τους τοίχους με βελονιά φουσκώνουν άκαμπτα και διατηρούν το σχήμα τους σε πλήρη πίεση νερού. Χωρίς κεκλιμένους τοίχους, χωρίς πτώση της γραμμής νερού, χωρίς χαμένο βάθος.
    - emoji: "🔧"
      title: Κατασκευάστηκε για να διαρκέσει, όχι για να αντικατασταθεί
      description: Η πιο βιώσιμη πισίνα είναι αυτή που δεν πετάτε. Ανθεκτικό στην υπεριώδη ακτινοβολία, ανθεκτικό στη διάτρηση PVC και ποιοτικές βαλβίδες σημαίνουν εποχές χρήσης, όχι ένα καλοκαίρι.
    - emoji: "🏆"
      title: Summer Made Simple
      description: Φουσκώνει γρήγορα, αναδιπλώνεται δέκα λεπτά. Χωρίς εργαλεία, χωρίς πλαίσια, χωρίς συνεργείο εγκατάστασης. Το κολύμπι πρέπει να είναι το εύκολο κομμάτι.

design:
  tagline: Σχεδιαστική Φιλοσοφία
  heading: "Σχεδιασμένο από το<br />\n<span class=\"text-sky-600\">νερό προς τα έξω</span>"
  paragraphs:
    - 'Κάθε πισίνα Felizbay ξεκινά με μια ερώτηση: <em>τι του κάνει το νερό;</em> Πλήρης πίεση νερού, έκθεση σε υπεριώδη ακτινοβολία, χημεία χλωρίου, υπολείμματα εδάφους — σχεδιάζουμε για όλα αυτά και μετά χτίζουμε πάνω από αυτά.'
    - Οι θάλαμοι βελονιάς μας έχουν βαθμολογηθεί πολύ πάνω από την πίεση εργασίας, επομένως ένα ζεστό απόγευμα δεν καταπονεί υπερβολικά τη ραφή. Το PVC μας είναι πλαστικοποιημένο με σταθεροποιητές υπεριώδους ακτινοβολίας, επειδή το φως του ήλιου - όχι τρυπήματα - είναι αυτό που σκοτώνει τις περισσότερες φουσκωτές πισίνες.
    - Δεν σχεδιάζουμε σε σημείο τιμής. Σχεδιάζουμε μέχρι ένα σημείο αποτυχίας — μετά το ξεπερνάμε καλά.
  image: /images/pools/round-grey-pool-1.webp
  image_alt: Σχεδιασμός πισίνας Felizbay
  stats:
    - value: 100%
      label: "δοκιμασμένο σε πίεση<br />πριν τη συσκευασία"
    - value: 4–6
      label: "Αξιολόγηση PSI<br />πίεση εργασίας"
    - value: 5–15
      label: "λεπτό<br />πληθωρισμός"
