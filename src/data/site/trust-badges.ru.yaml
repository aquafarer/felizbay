badges:
  - icon: "✔"
    title: Безопасность проверена
    desc: Разработано в соответствии с EN 16582-1 и ASTM F2666; Информация о безопасности для конкретной модели содержится в документации к продукту.
    variant: cert
  - icon: "⚙"
    title: 'ISO 9001:2015'
    desc: Система менеджмента качества сертифицирована SGS.
    variant: cert
  - icon: "✦"
    title: Испытано давлением
    desc: Перед тем, как покинуть завод, каждый бассейн проходит проверку на инфляцию.
    variant: standard
  - icon: "☆"
    title: 2-летняя гарантия
    desc: Ограниченная гарантия на швы, клапаны и ткань от производственных дефектов.
    variant: warranty
  - icon: "⚖"
    title: Соответствие материалов
    desc: Материалы ПВХ, изготовленные по рецептурам, соответствующим требованиям REACH; Документация о соответствии предоставляется по запросу.
    variant: material
