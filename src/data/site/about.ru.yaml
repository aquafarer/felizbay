origin:
  tagline: Наше происхождение
  heading: "Создан для лета,<br />\n<span class=\"text-sky-600\">спроектирован так, чтобы прослужить долго</span>"
  paragraphs:
    - 'Felizbay начал с простого разочарования: надувные бассейны, которые проседали, протекали и прослужили один сезон. Мы считали, что бассейн может быть лучше — достаточно жестким, чтобы в нем можно было плавать, достаточно прочным, чтобы выдерживать его год за годом, и при этом достаточно маленьким, чтобы его можно было хранить в помещении зимой.'
    - Ответом стала конструкция капельного стежка. Тысячи внутренних нитей фиксируют стенки жесткой под давлением, придавая тканевому бассейну структуру жесткого бассейна.
    - 'Каждый бассейн Felizbay построен на основе этого принципа: качественные материалы, проверенная конструкция и честная инженерия по цене, которую может оправдать семья.'
    - Felizbay спроектирован и эксплуатируется <strong>Aquafarer LLC</strong>, США. Наши бассейны производятся давним производственным партнером в Циндао, Китай, и каждая единица перед отправкой подвергается 100% испытаниям под давлением.
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: Бассейн для вышивки Felizbay

philosophy:
  tagline: Наша философия
  heading: Простой, надежный, честный
  description: 'Бассейн — это обещание: наполните его в первый жаркий день лета, и он заработает. Все, что мы разрабатываем, служит этому обещанию.'
  cards:
    - emoji: "🌊"
      title: Твердый, не обвисший
      description: Стены капельного стежка надуваются и сохраняют свою форму при полном давлении воды. Ни наклоняющихся стен, ни провисания ватерлинии, ни потери глубины.
    - emoji: "🔧"
      title: Создан для долговечности, а не для замены
      description: Самый экологичный бассейн — тот, который вы не выбрасываете. Устойчивый к УФ-излучению, устойчивый к проколам ПВХ и качественные клапаны означают сезонное использование, а не одно лето.
    - emoji: "🏆"
      title: Лето — это просто
      description: Быстро надувается, десять минут складывается. Ни инструментов, ни рам, ни монтажной бригады. Плавание должно быть легкой частью.

design:
  tagline: Философия дизайна
  heading: "Разработанный из<br />\n<span class=\"text-sky-600\">вода наружу</span>"
  paragraphs:
    - 'Каждый пул Felizbay начинается с одного вопроса: <em>что с ним делает вода?</em> Полное давление воды, воздействие ультрафиолета, химия хлора, грунтовый мусор — мы проектируем все это, а затем строим над этим.'
    - Наши камеры для опускного стежка рассчитаны на давление, значительно превышающее рабочее, поэтому жаркий полдень не создает чрезмерную нагрузку на шов. Наш ПВХ ламинирован УФ-стабилизаторами, потому что солнечный свет, а не проколы, убивают большинство надувных бассейнов.
    - Мы не проектируем по цене. Мы проектируем до точки отказа, а затем преодолеваем ее.
  image: /images/pools/round-grey-pool-1.webp
  image_alt: Дизайн бассейна Felizbay
  stats:
    - value: 100%
      label: "испытанный под давлением<br />перед упаковкой"
    - value: 4–6
      label: "PSI рейтинг<br />рабочее давление"
    - value: 5–15
      label: "минута<br />инфляция"
