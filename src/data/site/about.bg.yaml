origin:
  tagline: Нашият произход
  heading: "Създаден за лятото,<br />\n<span class=\"text-sky-600\">проектирани да издържат</span>"
  paragraphs:
    - 'Felizbay започна с просто разочарование: надуваеми басейни, които увиснаха, протекоха и издържаха един сезон. Вярвахме, че един басейн може да бъде по-добър — достатъчно твърд, за да плувате в него, достатъчно здрав, за да оцелеете година след година, и все пак достатъчно малък, за да го съхранявате на закрито през зимата.'
    - Конструкцията с падащ шев беше отговорът. Хиляди вътрешни нишки заключват стените твърди под натиск, придавайки на басейна от плат структурата на твърда.
    - 'Всеки басейн Felizbay е изграден около това ядро: качествени материали, изпитана конструкция и честен инженеринг, на цена, която едно семейство може да оправдае.'
    - Felizbay е проектиран и управляван от <strong>Aquafarer LLC</strong>, САЩ. Нашите басейни се произвеждат от дългосрочен производствен партньор в Циндао, Китай, и всяка единица е 100% тествана под налягане, преди да бъде изпратена.
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: Басейн с падащ шев Felizbay

philosophy:
  tagline: Нашата философия
  heading: Прост, издръжлив, честен
  description: 'Басейнът е обещание: напълнете го в първия горещ ден на лятото и той работи. Всичко, което проектираме, изпълнява това обещание.'
  cards:
    - emoji: "🌊"
      title: Твърд, не увиснал
      description: Стените с падащ шев се надуват твърди и поддържат формата си при пълно водно налягане. Без наклонени стени, без увиснала водна линия, без загуба на дълбочина.
    - emoji: "🔧"
      title: Създаден да издържи, а не да замени
      description: Най-устойчивият басейн е този, който не изхвърляте. Устойчивото на ултравиолетови лъчи, устойчиво на пробиване PVC и качествените клапани означават сезони на употреба, а не едно лято.
    - emoji: "🏆"
      title: Лесно лято
      description: Бързо за надуване, десет минути за сгъване. Без инструменти, без рамки, без монтажен екип. Плуването трябва да е лесната част.

design:
  tagline: Философия на дизайна
  heading: "Проектиран от<br />\n<span class=\"text-sky-600\">вода навън</span>"
  paragraphs:
    - 'Всеки басейн Felizbay започва с един въпрос: <em>какво му прави водата?</em> Пълно водно налягане, излагане на ултравиолетови лъчи, хлорна химия, земни отломки – ние проектираме за всичко това, след което изграждаме над него.'
    - Нашите камери за дропшит са оценени доста над работното налягане, така че горещ следобед не натоварва прекалено шева. Нашият PVC е ламиниран с UV стабилизатори, защото слънчевата светлина, а не пробиви, е това, което убива повечето надуваеми басейни.
    - Ние не проектираме според цената. Ние проектираме до точка на повреда — след това изграждаме доста след нея.
  image: /images/pools/round-grey-pool-1.webp
  image_alt: Дизайн на басейн Felizbay
  stats:
    - value: 100%
      label: "тестван под налягане<br />преди опаковане"
    - value: 4–6
      label: "Номинален PSI<br />работно налягане"
    - value: 5–15
      label: "минута<br />инфлация"
