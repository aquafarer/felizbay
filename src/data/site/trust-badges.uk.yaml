badges:
  - icon: "✔"
    title: Перевірено на безпеку
    desc: Розроблено відповідно до EN 16582-1 та ASTM F2666; інформація про безпеку для конкретної моделі надсилається в документації продукту.
    variant: cert
  - icon: "⚙"
    title: 'ISO 9001:2015'
    desc: Система менеджменту якості сертифікована SGS.
    variant: cert
  - icon: "✦"
    title: Випробувано під тиском
    desc: Кожен басейн перевіряється на накачування перед тим, як залишити завод.
    variant: standard
  - icon: "☆"
    title: 2 роки гарантії
    desc: Обмежена гарантія на шви, клапани та тканину проти виробничих дефектів.
    variant: warranty
  - icon: "⚖"
    title: Відповідність матеріалу
    desc: ПВХ-матеріали, отримані з рецептурами, сумісними з REACH; документація про відповідність доступна за запитом.
    variant: material
