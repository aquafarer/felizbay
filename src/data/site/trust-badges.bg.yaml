badges:
  - icon: "✔"
    title: Тествана за безопасност
    desc: Проектиран съгласно EN 16582-1 и ASTM F2666; специфична за модела информация за безопасност се доставя в документацията на продукта.
    variant: cert
  - icon: "⚙"
    title: 'ISO 9001:2015'
    desc: Система за управление на качеството, сертифицирана от SGS.
    variant: cert
  - icon: "✦"
    title: Тестван под налягане
    desc: Всеки басейн е тестван за надуване, преди да напусне фабриката.
    variant: standard
  - icon: "☆"
    title: 2-годишна гаранция
    desc: Ограничена гаранция за шевове, клапи и плат срещу производствени дефекти.
    variant: warranty
  - icon: "⚖"
    title: Съответствие на материалите
    desc: PVC материали, произведени със съвместими с REACH формули; документация за съответствие, достъпна при поискване.
    variant: material
