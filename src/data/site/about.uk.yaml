origin:
  tagline: Наше походження
  heading: "Створений для літа,<br />\n<span class=\"text-sky-600\">розроблений для тривалого використання</span>"
  paragraphs:
    - 'Felizbay почав із простого розчарування: надувні басейни, які просідали, протікали та прослужили один сезон. Ми вірили, що басейн може бути кращим — достатньо жорстким, щоб плавати в ньому, достатньо міцним, щоб виживати рік за роком, і все ще достатньо малим, щоб зберігати його в приміщенні взимку.'
    - Відповіддю стала конструкція стібків. Тисячі внутрішніх ниток міцно фіксують стінки під тиском, надаючи структурі тканинного басейну жорстку структуру.
    - 'Кожен басейн Felizbay побудовано навколо цієї основи: якісні матеріали, перевірена конструкція та чесне проектування за ціною, яку може виправдати сім’я.'
    - Компанія Felizbay розроблена та експлуатується <strong>Aquafarer LLC</strong>, США. Наші басейни виробляються довгостроковим виробничим партнером у Циндао, Китай, і кожна одиниця проходить 100% випробування тиском перед відправкою.
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: Басейн для крапельного стібка Felizbay

philosophy:
  tagline: Наша філософія
  heading: Простий, міцний, чесний
  description: 'Басейн — це обіцянка: наповни його в перший жаркий день літа, і він працює. Усе, що ми розробляємо, відповідає цій обіцянці.'
  cards:
    - emoji: "🌊"
      title: Жорсткий, не обвислий
      description: Стінки з крапельним стібком надуваються і зберігають форму під повним тиском води. Ні нахилених стінок, ні провисання водопроводу, ні втрати глибини.
    - emoji: "🔧"
      title: Створено, щоб служити довго, а не замінити
      description: Найбільш стійкий басейн – це той, який ви не викидаєте. Стійкий до УФ-випромінювання та проколів ПВХ і якісні клапани – це сезони використання, а не одне літо.
    - emoji: "🏆"
      title: Літо просто
      description: Швидке надування, десять хвилин, щоб скласти. Ні інструментів, ні рам, ні монтажної бригади. Плавання має бути найлегшим.

design:
  tagline: Філософія дизайну
  heading: "Розроблено з<br />\n<span class=\"text-sky-600\">води назовні</span>"
  paragraphs:
    - 'Кожен пул Felizbay починається з одного запитання: <em>що з ним робить вода?</em> Повний тиск води, ультрафіолетове опромінення, хімія хлору, ґрунтове сміття — ми проектуємо для всього цього, а потім будуємо над цим.'
    - Наші камери крапельного шва розраховані на значно вищий робочий тиск, тому спекотний день не викликає надмірного навантаження на шов. Наш ПВХ ламінований УФ-стабілізаторами, тому що сонячне світло, а не проколи, вбиває більшість надувних басейнів.
    - Ми не проектуємо за цінами. Ми проектуємо до точки відмови, а потім будуємо її.
  image: /images/pools/round-grey-pool-1.webp
  image_alt: Дизайн басейну Felizbay
  stats:
    - value: 100%
      label: "випробуваний тиском<br />перед пакуванням"
    - value: 4–6
      label: "Номінальний PSI<br />робочий тиск"
    - value: 5–15
      label: "хвилина<br />інфляція"
