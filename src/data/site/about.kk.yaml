origin:
  tagline: Біздің шығу тегі
  heading: "Жаз үшін салынған,<br />\n<span class=\"text-sky-600\">созылуы үшін жасалған</span>"
  paragraphs:
    - 'Felizbay қарапайым реніштен бастады: салбырап, су ағып, бір маусымға созылатын үрлемелі бассейндер. Біз бассейннің жақсырақ болуы мүмкін деп ойладық - жүзуге жеткілікті қатты, жылдан жылға аман қалу үшін жеткілікті қатты және қыста үйде сақтауға жеткілікті кішкентай.'
    - Жауап тігіс салу болды. Мыңдаған ішкі жіптер қабырғаларды қысыммен қатты бекітіп, матаға қатты жақты құрылымды береді.
    - 'Әрбір Felizbay бассейні осы өзекке негізделген: сапалы материалдар, сынақтан өткен құрылыс және адал инженерия, отбасы ақтайтын бағамен.'
    - Felizbay жобалаған және басқарған <strong>Aquafarer LLC</strong>, АҚШ. Біздің бассейндерімізді Циндаодағы (Қытай) ұзақ мерзімді өндірістік серіктес шығарады және әрбір қондырғы жөнелтпес бұрын 100% қысыммен сыналады.
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: Felizbay тігу бассейні

philosophy:
  tagline: Біздің Философия
  heading: Қарапайым, берік, адал
  description: 'Бассейн - бұл уәде: оны жаздың бірінші ыстық күнінде толтырыңыз және ол жұмыс істейді. Біз жобалағанның бәрі осы уәдеге сәйкес келеді.'
  cards:
    - emoji: "🌊"
      title: Қатты, салбыраған емес
      description: Тігіс қабырғалары қатты күйіп, судың толық қысымында пішінін ұстайды. Ешқандай еңкею қабырғалары, салбыраған су желісі, жоғалған тереңдігі жоқ.
    - emoji: "🔧"
      title: Ауыстыру үшін емес, соңғы рет жасалған
      description: Ең тұрақты бассейн - сіз лақтырмайтын бассейн. Ультракүлгін сәулелерге төзімді, тесуге төзімді ПВХ және сапалы клапандар бір жаз емес, пайдалану маусымын білдіреді.
    - emoji: "🏆"
      title: Жаз қарапайым
      description: Жылдам үрлеу, бүктеуге он минут. Құралдар, жақтаулар, орнату бригадасы жоқ. Жүзу оңай бөлігі болуы керек.

design:
  tagline: Дизайн философиясы
  heading: "бастап әзірленген<br />\n<span class=\"text-sky-600\">сыртқа су</span>"
  paragraphs:
    - 'Әрбір Felizbay бассейні бір сұрақтан басталады: <em>су оған не істейді?</em> Толық су қысымы, ультракүлгін сәулесінің әсері, хлор химиясы, жердегі қоқыс - біз оның бәрін жобалаймыз, содан кейін оның үстіне саламыз.'
    - Біздің түсіретін тігіс камералары жұмыс қысымынан әлдеқайда жоғары бағаланады, сондықтан ыстық түсте тігісті шамадан тыс жүктемейді. Біздің ПВХ ультракүлгін тұрақтандырғыштармен ламинатталған, өйткені күн сәулесі - пункция емес - үрлемелі бассейндердің көпшілігін өлтіреді.
    - Біз баға нүктесіне дизайн жасамаймыз. Біз сәтсіздікке дейін жобалаймыз, содан кейін оны жақсы өткіземіз.
  image: /images/pools/round-grey-pool-1.webp
  image_alt: Felizbay бассейнінің дизайны
