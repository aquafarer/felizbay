origin:
  tagline: ต้นกำเนิดของเรา
  heading: "สร้างขึ้นสำหรับฤดูร้อน<br />\n<span class=\"text-sky-600\">ออกแบบมาให้มีอายุการใช้งานยาวนาน</span>"
  paragraphs:
    - Felizbay เริ่มต้นด้วยความหงุดหงิดง่ายๆ นั่นคือ สระน้ำเป่าลมที่ยุบ รั่ว และอยู่ได้เพียงฤดูกาลเดียว เราเชื่อว่าสระว่ายน้ำน่าจะดีกว่านี้ — แข็งพอที่จะว่ายน้ำเป็นรอบ แข็งแรงพอที่จะอยู่ได้ปีแล้วปีเล่า และยังเล็กพอที่จะเก็บในบ้านในฤดูหนาว
    - โครงสร้างการปักแบบหยดคือคำตอบ เกลียวภายในหลายพันเส้นล็อคผนังให้แข็งแกร่งภายใต้แรงกด ทำให้พูลผ้ามีโครงสร้างแบบด้านแข็ง
    - สระว่ายน้ำของ Felizbay ทุกสระถูกสร้างขึ้นโดยมีแกนหลักดังกล่าว ได้แก่ วัสดุที่มีคุณภาพ โครงสร้างที่ผ่านการทดสอบ และวิศวกรรมที่ซื่อสัตย์ ในราคาที่ครอบครัวสามารถพิสูจน์ได้
    - Felizbay ได้รับการออกแบบและดำเนินการโดย <strong>Aquafarer LLC</strong>, สหรัฐอเมริกา สระน้ำของเราผลิตโดยพันธมิตรการผลิตระยะยาวในเมืองชิงเต่า ประเทศจีน และทุกยูนิตผ่านการทดสอบแรงดัน 100% ก่อนจัดส่ง
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: สระน้ำปักลาย Felizbay

philosophy:
  tagline: ปรัชญาของเรา
  heading: เรียบง่าย ทนทาน ซื่อสัตย์
  description: 'สระว่ายน้ำคือคำมั่นสัญญา: เติมน้ำในวันที่อากาศร้อนวันแรกของฤดูร้อนและมันจะได้ผล ทุกสิ่งที่เราออกแบบเป็นไปตามคำมั่นสัญญานั้น'
  cards:
    - emoji: "🌊"
      title: แข็งกระด้าง ไม่หย่อนคล้อย
      description: ผนังแบบดรอปตะเข็บจะพองตัวและคงรูปร่างไว้ด้วยแรงดันน้ำสูงสุด ผนังไม่เอน น้ำไม่หย่อนคล้อย ไม่สูญเสียความลึก
    - emoji: "🔧"
      title: สร้างมาเพื่อการใช้งานที่ยาวนาน ไม่ใช่เพื่อทดแทน
      description: สระน้ำที่ยั่งยืนที่สุดคือสระที่คุณไม่ทิ้ง PVC และวาล์วคุณภาพที่ทนต่อรังสียูวี ทนต่อการเจาะทะลุ หมายถึงฤดูกาลแห่งการใช้งาน ไม่ใช่ฤดูร้อนเดียว
    - emoji: "🏆"
      title: ฤดูร้อนทำง่าย
      description: พองลมได้รวดเร็ว ใช้เวลาสิบนาทีในการพับเก็บ ไม่มีเครื่องมือ ไม่มีเฟรม ไม่มีทีมงานติดตั้ง การว่ายน้ำควรเป็นส่วนที่ง่าย

design:
  tagline: ปรัชญาการออกแบบ
  heading: "ออกแบบมาจาก<br />\n<span class=\"text-sky-600\">น้ำออกไปข้างนอก</span>"
  paragraphs:
    - 'ทุกพูลของ Felizbay เริ่มต้นด้วยคำถามเดียว: <em>น้ำทำอะไรกับมัน?</em> แรงดันน้ำเต็มที่ การสัมผัสรังสียูวี เคมีคลอรีน เศษพื้นดิน — เราออกแบบมาสำหรับทุกสิ่ง แล้วสร้างไว้เหนือสิ่งอื่นใด'
    - ห้องเย็บแบบหล่นของเราได้รับการจัดอันดับให้อยู่เหนือแรงกดดันในการทำงาน ดังนั้นช่วงบ่ายที่อากาศร้อนจึงไม่ทำให้ตะเข็บเกิดความเครียดมากเกินไป พีวีซีของเราเคลือบด้วยสารกันยูวี เนื่องจากแสงแดด (ไม่ใช่การเจาะทะลุ) เป็นสิ่งที่ฆ่าสระน้ำเป่าลมส่วนใหญ่ได้
    - เราไม่ได้ออกแบบให้ถึงจุดราคา เราออกแบบจนถึงจุดที่ล้มเหลว — แล้วสร้างมันขึ้นมาให้ดี
  image: /images/pools/round-grey-pool-1.webp
  image_alt: การออกแบบสระว่ายน้ำ Felizbay
  stats:
    - value: 100%
      label: "ผ่านการทดสอบแรงดัน<br />ก่อนบรรจุ"
    - value: 4–6
      label: "ได้รับการจัดอันดับ PSI<br />ความกดดันในการทำงาน"
    - value: 5–15
      label: "นาที<br />อัตราเงินเฟ้อ"
