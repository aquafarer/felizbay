origin:
  tagline: منشاء ما
  heading: "ساخته شده برای تابستان،<br />\n<span class=\"text-sky-600\">مهندسی شده تا دوام بیاورد</span>"
  paragraphs:
    - 'Felizbay با یک ناراحتی ساده شروع کرد: استخرهای بادی که آویزان شدند، نشتی داشتند و یک فصل دوام داشتند. ما معتقد بودیم که یک استخر می تواند بهتر باشد - به اندازه کافی سفت و سخت برای شنا کردن، به اندازه کافی سخت برای زنده ماندن سال به سال، و هنوز به اندازه کافی کوچک برای نگهداری در داخل خانه در زمستان.'
    - ساخت دوخت قطره ای پاسخ بود. هزاران نخ داخلی دیوارها را تحت فشار سفت و سخت قفل می‌کنند و به استخر پارچه‌ای ساختاری شبیه به یک طرف سخت می‌دهند.
    - 'هر استخر Felizbay حول آن هسته ساخته شده است: مواد با کیفیت، ساخت و ساز آزمایش شده، و مهندسی صادقانه، با قیمتی که یک خانواده می تواند توجیه کند.'
    - Felizbay توسط <strong>Aquafarer LLC</strong>، ایالات متحده آمریکا استخرهای ما توسط یک شریک تولیدی طولانی مدت در چینگدائو، چین تولید می شوند و هر واحد قبل از ارسال 100٪ تحت فشار تست شده است.
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: استخر دوخت قطره ای Felizbay

philosophy:
  tagline: فلسفه ما
  heading: ساده، بادوام، صادقانه
  description: 'استخر یک وعده است: در اولین روز گرم تابستان آن را پر کنید و کار می کند. هر چیزی که ما طراحی می کنیم به این وعده عمل می کند.'
  cards:
    - emoji: "🌊"
      title: سفت و سخت، نه ساگی
      description: دیوارهای دوخت را به صورت سفت و محکم باد می کنند و با فشار کامل آب شکل خود را حفظ می کنند. بدون دیوارهای کج، بدون خط آب افتاده، بدون عمق از دست رفته.
    - emoji: "🔧"
      title: ساخته شده برای ماندگاری، نه برای جایگزینی
      description: پایدارترین استخر آن است که دور نریزید. PVC مقاوم در برابر اشعه ماوراء بنفش، مقاوم در برابر سوراخ شدن و شیرهای باکیفیت به معنای فصل استفاده است، نه یک تابستان.
    - emoji: "🏆"
      title: تابستان ساخته شده ساده
      description: سریع باد کردن، ده دقیقه تا شدن. بدون ابزار، بدون قاب، بدون خدمه نصب. شنا باید بخش آسان باشد.

design:
  tagline: فلسفه طراحی
  heading: "طراحی شده از<br />\n<span class=\"text-sky-600\">آب به بیرون</span>"
  paragraphs:
    - 'هر استخر Felizbay با یک سوال شروع می شود: <em>آب با آن چه می کند؟</em> فشار کامل آب، قرار گرفتن در معرض اشعه ماوراء بنفش، شیمی کلر، زباله های زمین - ما برای همه آنها طراحی می کنیم، سپس بالای آن می سازیم.'
    - محفظه‌های دوخت ما بسیار بالاتر از فشار کاری ارزیابی می‌شوند، بنابراین یک بعد از ظهر گرم فشار زیادی به درز وارد نمی‌کند. PVC ما با تثبیت کننده های UV لمینیت شده است، زیرا نور خورشید - نه سوراخ - چیزی است که بیشتر استخرهای بادی را از بین می برد.
    - ما به یک نقطه قیمت طراحی نمی کنیم. ما تا نقطه شکست طراحی می کنیم - سپس به خوبی از آن عبور می کنیم.
  image: /images/pools/round-grey-pool-1.webp
  image_alt: طراحی استخر Felizbay
  stats:
    - value: 100%
      label: "تحت فشار تست شده<br />قبل از بسته بندی"
    - value: 4–6
      label: "دارای رتبه PSI<br />فشار کاری"
    - value: 5–15
      label: "دقیقه<br />تورم"
