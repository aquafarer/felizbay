origin:
  tagline: Наше порекло
  heading: "Изграђен за лето,<br />\n<span class=\"text-sky-600\">пројектован да траје</span>"
  paragraphs:
    - 'Felizbay је почео са једноставном фрустрацијом: базени на надувавање који су се спустили, цурили и трајали једну сезону. Веровали смо да би базен могао бити бољи - довољно чврст да плива у круговима, довољно чврст да преживи из године у годину и још увек довољно мали да се зими чува у затвореном простору.'
    - Изградња шавова је била одговор. Хиљаде унутрашњих нити закључавају зидове чврсте под притиском, дајући базену од тканине структуру тврдог.
    - 'Сваки Felizbay базен изграђен је око тог језгра: квалитетни материјали, тестирана конструкција и поштен инжењеринг, по цени коју породица може да оправда.'
    - Felizbay је дизајнирао и њиме управља <strong>Aquafarer LLC</strong>, САД. Наше базене производи дугогодишњи производни партнер у Кингдау, Кина, и свака јединица је 100% тестирана под притиском пре него што се пошаље.
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: Felizbay дроп ститцх базен

philosophy:
  tagline: Наша филозофија
  heading: Једноставан, издржљив, поштен
  description: 'Базен је обећање: напуните га првог врућег дана лета и ради. Све што дизајнирамо служи том обећању.'
  cards:
    - emoji: "🌊"
      title: Чврсто, не сагги
      description: Зидови шавова се чврсто надувају и држе свој облик под пуним притиском воде. Нема нагнутих зидова, нема опуштене водене линије, нема изгубљене дубине.
    - emoji: "🔧"
      title: Направљен да траје, а не да замени
      description: Најодрживији базен је онај који не бацате. ПВЦ отпоран на УВ зрачење, отпоран на бушење и квалитетни вентили значе сезоне употребе, а не једно лето.
    - emoji: "🏆"
      title: Суммер Маде Симпле
      description: Брзо се надувава, десет минута за склапање. Без алата, без оквира, без екипе за монтажу. Пливање би требало да буде лакши део.

design:
  tagline: Филозофија дизајна
  heading: "Дизајниран од<br />\n<span class=\"text-sky-600\">вода напоље</span>"
  paragraphs:
    - 'Svaki Felizbay bazen počinje jednim pitanjem: <em>шта му вода чини?</em> Потпуни притисак воде, излагање УВ зрачењу, хемија хлора, остаци земље — дизајнирамо за све то, а затим градимо изнад.'
    - Наше коморе за шавове су оцењене знатно изнад радног притиска, тако да топло поподне не оптерећује шав. Наш ПВЦ је ламиниран са УВ стабилизаторима, јер је сунчева светлост - а не пробијање - оно што убија већину базена на надувавање.
    - Не дизајнирамо по цени. Дизајнирамо до тачке неуспеха - а затим градимо далеко иза тога.
  image: /images/pools/round-grey-pool-1.webp
  image_alt: Дизајн базена Felizbay
  stats:
    - value: 100%
      label: "тестиран на притисак<br />пре паковања"
    - value: 4–6
      label: "ПСИ ратед<br />радни притисак"
    - value: 5–15
      label: "минут<br />инфлација"
