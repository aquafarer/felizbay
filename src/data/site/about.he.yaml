origin:
  tagline: המוצא שלנו
  heading: "נבנה לקיץ,<br />\n<span class=\"text-sky-600\">מהונדס להחזיק מעמד</span>"
  paragraphs:
    - 'Felizbay התחיל בתסכול פשוט: בריכות מתנפחות שצנחו, דלפו ונמשכו עונה אחת. האמנו שבריכה יכולה להיות טובה יותר - קשיחה מספיק לשחות בה סיבובים, קשיחה מספיק כדי לשרוד שנה אחר שנה, ועדיין קטנה מספיק כדי לאחסן בתוך הבית בחורף.'
    - בניית תפר טיפה הייתה התשובה. אלפי חוטים פנימיים נועלים את הקירות קשיחים בלחץ, ומעניקים לבריכת בד מבנה של צד קשיח.
    - 'כל בריכת Felizbay בנויה סביב הליבה הזו: חומרים איכותיים, בנייה בדוקה והנדסה כנה, במחיר שמשפחה יכולה להצדיק.'
    - Felizbay מתוכננת ומופעלת על ידי <strong>Aquafarer LLC</strong>, ארה"ב. הבריכות שלנו מיוצרות על ידי שותף ייצור ארוך טווח בצ'ינגדאו, סין, וכל יחידה עוברת בדיקת לחץ ב-100% לפני משלוחה.
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: Felizbay בריכת תפרים טיפה

philosophy:
  tagline: הפילוסופיה שלנו
  heading: פשוט, עמיד, ישר
  description: 'בריכה היא הבטחה: מלאו אותה ביום החם הראשון של הקיץ וזה עובד. כל מה שאנו מעצבים משרת את ההבטחה הזו.'
  cards:
    - emoji: "🌊"
      title: נוקשה, לא רפוי
      description: קירות תפר טיפה מתנפחים קשיחים ומחזיקים את צורתם בלחץ מים מלא. ללא קירות נטויים, ללא קו מים נפול, ללא עומק אבוד.
    - emoji: "🔧"
      title: נבנה להחזיק מעמד, לא להחליף
      description: הבריכה הכי ברת קיימא היא זו שלא זורקים. PVC עמיד בפני UV, עמיד לנקב ושסתומים איכותיים פירושם עונות של שימוש, לא קיץ אחד.
    - emoji: "🏆"
      title: קיץ מעשה פשוט
      description: מהיר לניפוח, עשר דקות לקיפול. ללא כלים, ללא מסגרות, ללא צוות התקנה. שחייה צריכה להיות החלק הקל.

design:
  tagline: פילוסופיית עיצוב
  heading: "עוצב מ-<br />\n<span class=\"text-sky-600\">מים כלפי חוץ</span>"
  paragraphs:
    - 'כל בריכת Felizbay מתחילה בשאלה אחת: <em>מה המים עושים לו</em> לחץ מים מלא, חשיפה ל-UV, כימיה של כלור, פסולת טחונה - אנחנו מתכננים לכל זה, ואז בונים מעליו.'
    - תאי תפירת הטיפה שלנו מדורגים הרבה מעל לחץ העבודה, כך שאחר הצהריים חם לא מלחיץ יותר מדי תפר. ה-PVC שלנו מצופה במייצבי UV, מכיוון שאור השמש - לא פנצ'רים - הוא מה שהורג את רוב הבריכות המתנפחות.
    - אנחנו לא מעצבים לפי נקודת מחיר. אנחנו מתכננים עד לנקודת כשל - ואז בונים הרבה מעבר לזה.
  image: /images/pools/round-grey-pool-1.webp
  image_alt: עיצוב בריכת Felizbay
  stats:
    - value: 100%
      label: "נבדק בלחץ<br />לפני האריזה"
    - value: 4–6
      label: "מדורג PSI<br />לחץ עבודה"
    - value: 5–15
      label: "דַקָה<br />אִינפלַצִיָה"
