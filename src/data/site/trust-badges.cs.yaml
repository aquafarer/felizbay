    desc: Navrženo s odkazem na EN 16582-1 a ASTM F2666; Bezpečnostní informace specifické pro daný model jsou dodávány v dokumentaci k produktu.
    variant: cert
  - icon: "⚙"
    title: 'ISO 9001: 2015'
    desc: Systém managementu kvality certifikovaný společností SGS.
