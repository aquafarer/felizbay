  - icon: "☆"
    title: 2-letá záruka
    desc: Omezená záruka na švy, ventily a tkaninu proti výrobním vadám.
    variant: warranty
  - icon: "⚖"
    title: Materiálová shoda
    desc: PVC materiály pocházející s formulacemi v souladu s REACH; dokumentace o shodě je k dispozici na vyžádání.
